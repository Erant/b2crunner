[project]
name = "b2c-runner"
version = "0.1.0"
description = "Standalone (non-ComfyUI) execution engine for the Body2COLMAP pipeline"
readme = "pipeline/README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

dependencies = [
    "body2colmap @ git+https://github.com/Erant/body2colmap.git",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "PyYAML>=6.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
# PLY I/O for load_splat/save_splat. gsplat used to be here too; it is gone
# because render_splat now shells out to the brush-splat-render binary
# instead (see requirements.txt and docs/docker-build-notes.md's "gsplat:
# dropped"), which removed this project's last need for a CUDA toolchain at
# runtime. body2colmap followed on 2026-08-30 (its 24fe424), so nothing in
# the dependency tree pulls gsplat in any more. Still an extra rather than
# a hard dependency because the non-splat half of the pipeline works
# without it.
splat = [
    "plyfile>=0.8.0",
]

# What `python -m pipeline.cli ui` serves: the web UI (pipeline/webui.py)
# and the HTTP API (pipeline/api.py), on one port. Optional so a headless
# CLI install stays small; the Docker image installs it into venv_main.
#
# fastapi and uvicorn arrive with gradio anyway — the server the API mounts
# the UI into is a FastAPI app either way — but they are named here because
# pipeline/api.py imports them directly, and a dependency you rely on
# through someone else's requirements is one that can vanish in a minor
# release of theirs.
ui = [
    "gradio>=5.0,<7.0",
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27,<1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline", "pipeline.dispatch", "pipeline.steps"]
