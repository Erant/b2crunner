# Single-image setup, targeting RunPod (a pod IS one container — no nested
# Docker daemon to split brush into its own image against, see
# docker/Dockerfile's file-level comment). Useful for building/testing the
# image locally before pushing it as a RunPod pod template; RunPod itself
# doesn't consume this compose file directly.
#
# Usage:
#   export HF_TOKEN=hf_...
#   docker compose -f docker/docker-compose.yml build
#   docker compose -f docker/docker-compose.yml run --rm pipeline \
#       run pipeline/workflows/fast_helical_native.yaml --dataset /data/some_dataset -v

services:
  pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: b2c/pipeline:latest
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HF_HOME=/data/hf_cache
      - HF_HUB_DISABLE_XET=1
    volumes:
      - b2c_data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  b2c_data:
