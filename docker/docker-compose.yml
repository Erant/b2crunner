# Local build/test of the single image, before pushing it as a RunPod pod
# template. RunPod does not consume this file — it exists so the image can
# be built and exercised on a box with a local GPU.
#
# READ docs/docker-build-notes.md FIRST. Do not start with a full build:
# that document has a capability probe and a detectron2 probe that isolate
# the two most likely failures in about 25 minutes, versus discovering
# them at the end of a very large build.
#
# Usage:
#   export HF_TOKEN=hf_...
#   docker compose -f docker/docker-compose.yml build
#
#   # the web UI on http://localhost:7860 (the default mode, same as a pod)
#   docker compose -f docker/docker-compose.yml up
#
#   # or one-shot CLI runs, unchanged from before the entrypoint existed
#   docker compose -f docker/docker-compose.yml run --rm pipeline \
#       doctor
#
#   # a shell, without needing --entrypoint
#   docker compose -f docker/docker-compose.yml run --rm pipeline bash

services:
  pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      # The torch / CUDA arch build args moved to docker/Dockerfile.base with
      # the venvs they build; this file builds only the application on top
      # of the pinned base (docker/Dockerfile's BASE_IMAGE).
    image: b2c/pipeline:latest
    ports:
      # The web UI. On RunPod this is the template's "HTTP Ports" entry
      # instead; here it is a plain publish, on the host's loopback unless
      # B2C_BINDTO says otherwise (B2C_BINDTO=0.0.0.0 ./run.sh for the LAN).
      - "${B2C_BINDTO:-127.0.0.1}:7860:7860"
    environment:
      # Gated models (briaai/RMBG-2.0, facebook/sam-3d-body-dinov3) need a
      # token from an account that has accepted each licence. Injected at
      # run time, never baked into an image layer.
      - HF_TOKEN=${HF_TOKEN}
      # Also set in the image, but repeated here because it is read at
      # container-creation time and this is the layer that creates the
      # container. Gates brush (Vulkan) and render (EGL) alike.
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics,display
      # Off by default HERE, on by default on a pod — the one deliberate
      # difference between this file and a RunPod template. `docker compose
      # up` on a workstation is normally "let me look at the UI", and
      # quietly pulling ~65 GB of checkpoints onto a laptop as a side effect
      # of that is a poor trade. On a pod, where the whole point is to have
      # the models ready before a run needs them, it stays on.
      #
      # Set B2C_PREFETCH=1 in your shell to exercise the real pod behaviour:
      #   B2C_PREFETCH=1 docker compose -f docker/docker-compose.yml up
      - B2C_PREFETCH=${B2C_PREFETCH:-0}
      # The Wan 2.2 denoise's matmul precision, 8 (fp8 x fp8) or 16 (bf16
      # activations): run.sh --wan-matmul, read by every run's workers.
      - B2C_WAN_MATMUL=${B2C_WAN_MATMUL:-8}
      # Every interface INSIDE the container, always: the publish above is
      # what decides who on the host side can reach it, and a server on the
      # container's own loopback is reachable by nobody.
      - B2C_BINDTO=0.0.0.0
      # ...so the UI learns its reach from here: the host side of the publish,
      # for its no-login warning (pipeline/webui.py exposure()).
      - B2C_PUBLISHED_ON=${B2C_BINDTO:-127.0.0.1}
    volumes:
      # Everything the pipeline writes — outputs, logs, the HF cache, the
      # dispatchers' IPC pickles — goes here. The container's own writable
      # layer is small enough that a single 81-frame batch can fill it.
      - b2c_data:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  b2c_data:
