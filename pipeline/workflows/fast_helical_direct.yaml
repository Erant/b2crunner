# The DIRECT path — an experiment (2026-09-13). fast_helical_native.yaml
# builds a circular orbit of drawings, denoises it, trains an INTERMEDIATE
# splat on that, re-renders the splat along a helix, denoises the re-render
# a second time, and only then trains the deliverable. This file asks
# whether the middle of that is still earning its place now that the
# training is what it is: it draws the HELIX in the first place — the same
# 81-frame, two-loop, +-30 degree path `rerender_splat` builds, anchored on
# the photograph exactly as the circle was — denoises it ONCE with pass 1's
# settings, and trains the deliverable on that. No intermediate splat, no
# re-render, no second denoise.
#
# WHAT IT KEEPS, unchanged from fast_helical_native: the whole bootstrap
# (split, body, head fit, the face splat, outline + DWPose skeleton + face
# composite, the anchor warp and injection, the gated re-outline branch),
# the debug dump of the control video, the pixel ops, the upscale, the
# camera refinement, the per-view body rig, the per-splat labels, and the
# deliverable training's settings (alignment loop, hollow loss). Every step
# here is a step the native file runs; the wiring is the difference, and
# each step's comment says what moved and why. The full argument for every
# param lives on the native file's copy of the same step — this file
# deliberately does not repeat it.
#
# WHAT IT DROPS, and what goes with it:
#
#   * `train_splat` (the intermediate), `load_trained_splat`,
#     `rerender_splat`, `resplat_foreground_masks`, `mask_splat_fringes`,
#     `reinject_anchor`, `denoise_pass2`, `export_colmap_intermediate`,
#     `normal_maps` (only the intermediate training supervised on them).
#   * `refit_body` / `splat_surface` / `build_body_rig` on the refit body:
#     there is no splat to refit to before the one training. The rig is
#     built from the INITIAL body instead, the way the native file's
#     intermediate training does it (`body_rig_intermediate`, measured as
#     good as the refit for a rig). The hollow loss therefore runs against
#     SAM-3D-Body's own mesh at the 5 cm margin docs/body-refit.md calls
#     the safe one for it, not the refit's 3 cm. scene.ply carries no
#     b2c.mhr.* header (no `body_params`).
#   * `face_refine` (detect_face_views, fit_head_per_view, paste_eyes,
#     build_face_rig): steps/face_views.py requires `world_from_raw`, which
#     only refit_body_to_splat publishes. Wiring it would mean teaching
#     those steps the initial-body fallback build_body_rig already has
#     (recover the similarity from mesh_raw against mesh_world) — a small
#     change, but not this experiment's.
#   * the face cap — `face_splat_refined`, `render_face_support_views`,
#     `face_support_views`, `face_priority`, `merge_support_views`: they
#     exist to supervise the INTERMEDIATE training, and the deliverable
#     training takes no supporting views (the native file's
#     train_final_splat says why). With one training here, and it the
#     deliverable, the cap has no training to go into. The face splat
#     reaches the run once, composited onto the drawings the denoise
#     conditions on — the same route it has always had into pass 1.
#   * `pick_rear_view`: it filled the reference slot for pass 2, and there
#     is no pass 2. A single photo therefore runs the one denoise with no
#     reference at all, as pass 1 always has; a sheet's back panel reaches
#     it as before.
#   * `export_masks_preupscale`: the pre-upscale matte was recomputed in
#     the native file because dataset.masks held the VACE flags at that
#     point; here it already holds `foreground_masks`' matte of these very
#     frames, so the pre-upscale export reads that.
#
# WHAT THE ONE DENOISE SEES that pass 1 never did: a helix. The drawing
# pass was tuned on a flat orbit (docs/vace-denoise-findings-2026-09-07.md,
# every run of it circular) and the +-30 degrees of elevation the helix
# travels were only ever handed to pass 2, over a splat render at strength
# 0.8. Whether uni_pc / shift 5 / [1,1,.5,.5,.5,.5] holds a subject
# together from above and below with nothing but a drawing under it is the
# question this run answers; the sampler and schedule are pass 1's on
# purpose, so the comparison is against the recorded runs.
#
# STATUS: never run. Built from steps that have each run in the native
# file; the helix under a mesh render has not been denoised on a pod.

name: fast_helical_direct
description: >-
  EXPERIMENTAL. From a front/back reference sheet or a single frontal photo:
  reconstruct a body, draw its anchored views along the HELIX directly,
  denoise once, upscale, refine the cameras, and train the deliverable
  splat on that — no intermediate splat, no re-render, no second denoise.
  Every tool of the native bootstrap (outline, skeleton, face splat) is
  kept.

settings:
  # The native file's settings, minus the three that only exist because
  # of the intermediate splat (`refit_body`, `body_rig_intermediate`,
  # `face_refine`); `body_rig` replaces the second. Help text is the native
  # file's where the setting means the same thing.

  - name: resolution
    label: Resolution
    type: list
    default: [720, 1280]
    choices: [[720, 1280], [600, 1040], [480, 832]]
    help: >-
      Frame size, width x height: the render size and wan22_vace_denoise's
      width/height. Only sizes the denoise model was trained for are
      offered.

  - name: framing
    label: Framing
    default: full
    choices: [full, torso, bust, head]
    help: >-
      How much of the body fills the frame, on the one render that frames
      anything here (render_initial_views). `full` is the whole body and
      what every prior run used; torso / bust / head crop progressively
      tighter, where the mesh reconstruction's skeleton makes them
      available (`render` falls back to `full` for any it cannot compute).

  - name: input_layout
    label: Input
    default: auto
    choices: [auto, sheet, single]
    help: >-
      What the uploaded image is. `sheet`: the two-panel front/back sheet,
      cut down the middle — the front half is the subject, the back half is
      the reference the denoise conditions on. `single`: one frontal photo
      of the subject — there is no back view, so the denoise runs on the
      injected photograph alone (there is no second pass here for
      pick_rear_view to feed, so it is not run). `auto` (the default)
      counts the figures with a person detector: two, one each side of the
      centre, is a sheet; one is a photo; anything else stops the run and
      asks for this to be set.

  - name: seed
    label: Seed
    type: int
    default: 0
    help: >-
      One seed for every stochastic stage: the denoise (and the gated
      re-outline denoise) and the SeedVR2 upscale. Change it to draw a
      different sample of the same pipeline.

  - name: run_upscale
    label: Upscale dataset
    type: bool
    default: true
    group: outputs
    help: >-
      Run the SeedVR2 upscale (720x1280 -> 1080x1920) before the export,
      which also rescales the dataset's camera intrinsics to match, in the
      same step (steps/seedvr2.py). The camera refinement and the training
      follow it, at the upscaled size.

  - name: face_splat
    label: Face splat
    type: bool
    default: true
    advanced: true
    help: >-
      Whether the face branch runs: a Gaussian splat of the subject's actual
      face, composited onto the skeleton drawings wherever the camera can
      see it (+-60 deg), with the denoise told those pixels are real. That
      is the face's one route into this run — there is no intermediate
      training for the native file's face cap to supervise, so it is not
      built. Off leaves the drawings with no face at all. Costs a third 1B
      Sapiens2 head (~6.5 GB, segmentation) plus the pointmap head the
      splat needs.

  - name: refine_cameras
    label: Refine camera poses (COLMAP)
    type: bool
    default: true
    help: >-
      Bundle-adjust the generated helix against the frames themselves
      before the training, with the gauge restored afterwards so the splat
      keeps its scale. Once, not twice: there is one generated path here
      and one training on it. It runs after the upscale, on the frames as
      the training sees them, and is the native file's second refinement
      (refine_cameras_final) in every respect but its name. Worth +0.63
      PSNR / +0.0045 SSIM on held-out
      views on the native file's circular batch (docs/camera-pose-
      refinement.md); a helix has more to triangulate off, and has not
      been measured. Off gives the poses exactly as the renderer wrote them.

  - name: body_rig
    label: Per-view body rig
    type: bool
    default: true
    help: >-
      Deform the splat per training view with the INITIAL body's skeleton
      (pipeline/body_rig.py) — SAM-3D-Body's fit after fit_head_to_face —
      the way the native file's `body_rig_intermediate` does for its first
      training. The generated frames swing the arms by centimetres between
      segments of the orbit, and a single canonical body cannot explain
      them all; the rig lets each view rotate its joints. Measured on the
      native file's intermediate training: hand sharpness +27%, body +7%,
      head +9%, at no extra time. There is no refit body here (nothing to
      refit to before the one training), so this is the only rig on offer.

  - name: specular_suppress
    label: Highlight suppression
    type: float
    default: 0.0
    minimum: 0.0
    maximum: 1.0
    help: >-
      Pull the highlights down on the denoise's output before anything
      reads it, 0 (off) to 1: the per-pixel minimum channel above the
      batch's `mean + eta * std`, subtracted from all three channels
      equally, so colour and diffuse shading stay. In the native file this
      keeps the intermediate splat from learning pass 1's frame-to-frame
      inconsistent highlights as sparkle; here the one training learns them
      directly, which is the same argument once. The photograph's frame is
      left as it is. Off is the run as it was.

  - name: splat_labels
    label: Body-part label per splat
    type: bool
    default: true
    help: >-
      Segment every final frame with Sapiens2 (Goliath body parts) and vote
      the classes onto the splats as they are exported: scene.ply gains
      `seg_label` and `seg_conf` per Gaussian, and the COLMAP bundle a
      labels/ sidecar. ~20 s of GPU for 81 frames.

  - name: re_outline
    label: Re-outline (experimental)
    type: bool
    default: false
    advanced: true
    help: >-
      Draw the silhouette the denoise conditions on from a matte of the
      subject instead of from the body mesh: an extra Wan 2.2 denoise of the
      same control video at 480x832, matted with rmbg, and the helix
      re-rendered with that matte as the outline — skeleton, face splat and
      everything after unchanged. The native file's branch, on the helix.
      See docs/re-outline.md.

outputs:
  # The native file's three deliverable switches. `export_debug` packages
  # less here — there is no intermediate splat and no intermediate COLMAP
  # dataset to carry — but the pre-upscale dataset is still its own export
  # step and is skipped with it.

  - name: export_colmap
    label: COLMAP dataset
    dir: colmap
    default: true
    help: >-
      cameras.txt, images.txt and points3D.txt, plus images/, built from the
      frames as they finally are — the training's input exactly.

  - name: export_ply
    label: Trained .ply (flow-aligned)
    dir: ply
    default: true
    help: >-
      The one brush training here, exported as scene.ply: 30,000 iterations
      and the four alignment iterations, over the denoised, upscaled helix.

  - name: export_debug
    label: Debug bundle
    dir: debug
    default: true
    help: >-
      The `debug/` directory: refine_cameras' given-vs-refined camera models
      and stats, the face splat's stats and visualisations and its .ply,
      `denoise_input/` — the control video the denoise is handed —
      the body rig's stats, the alignment loop's per-iteration figures, and
      `colmap_preupscale/`, a COLMAP dataset from the frames BEFORE the
      upscale (written only when the upscale is on; its own export step,
      skipped with this switch). Small without the intermediate splat.

globals:
  # The native file's one bare global, with its own directory.
  output_root: output/fast_helical_direct

steps:
  # ================================================================ bootstrap
  # fast_helical_native.yaml's bootstrap, step for step and param for
  # param, with ONE change: render_initial_views draws the helix. The
  # comments on each step in the native file are the reference for every
  # value below; what is repeated here is what a reader needs to follow the
  # wiring.

  - id: split_sheet
    step: split_reference_sheet
    dispatch: in_process
    inputs:
      sheet: dataset.reference_image
    params:
      layout: ${globals.input_layout}
      front_side: left
    outputs:
      front: scene.front_image
      # The back panel, or None for a single photo — the reference the
      # denoise below conditions on, or nothing.
      back: dataset.reference_image
      layout: scene.input_layout

  - id: reconstruct_body
    step: sam3d_body
    dispatch: subprocess
    env: sam3dbody
    inputs:
      image: scene.front_image
    outputs:
      vertices: scene.vertices
      faces: scene.faces
      joints: scene.joints
      keypoints_3d: scene.keypoints_3d
      global_rots: scene.global_rots
      cam_t: scene.cam_t
      focal_length: scene.focal_length
      image_size: scene.image_size
      bbox: scene.bbox
      pose_params: scene.pose_params

  - id: detect_face
    step: detect_face_landmarks
    dispatch: in_process
    inputs:
      image: scene.front_image
      mesh_output: scene
    outputs:
      face_landmarks: scene.face_landmarks

  - id: map_face_to_mesh
    step: map_face_to_mesh
    dispatch: in_process
    inputs:
      mesh_output: scene
      image: scene.front_image
    outputs:
      face_correspondence: scene.face_correspondence

  - id: fit_head_to_face
    step: fit_head_to_face
    dispatch: subprocess
    env: sam3dbody
    inputs:
      mesh_output: scene
      face_landmarks: scene.face_landmarks
      face_correspondence: scene.face_correspondence
      image: scene.front_image
    outputs:
      vertices: scene.vertices
      keypoints_3d: scene.keypoints_3d
      joints: scene.joints
      global_rots: scene.global_rots
      pose_params: scene.pose_params
      head_fit_stats: scene.head_fit_stats
      rig_binding: scene.rig_binding

  # ---------------------------------------------------- the face splat
  # Six gated steps: the Face_Neck box, its crop, the face matte (Sapiens2
  # intersected with the landmark hull), the crop's normals, and the splat
  # unprojected through SAM-3D-Body's camera with its depth from the mesh.
  - id: locate_face
    step: sapiens2_seg
    dispatch: in_process
    when: ${globals.face_splat}
    inputs:
      image: scene.front_image
    params:
      parts: face
    outputs:
      box: scene.face_box

  - id: crop_face
    step: crop_to_box
    dispatch: in_process
    when: ${globals.face_splat}
    inputs:
      image: scene.front_image
      box: scene.face_box
    outputs:
      image: scene.face_image
      crop_info: scene.face_crop_info

  - id: face_seg
    step: sapiens2_seg
    dispatch: in_process
    when: ${globals.face_splat}
    inputs:
      image: scene.face_image
    params:
      parts: face
    outputs:
      mask: scene.face_seg_matte

  - id: face_mask
    step: face_landmark_mask
    dispatch: in_process
    when: ${globals.face_splat}
    inputs:
      face_landmarks: scene.face_landmarks
      mask: scene.face_seg_matte
      crop_info: scene.face_crop_info
    outputs:
      mask: scene.face_matte

  - id: face_normals
    step: sapiens2_lite
    dispatch: in_process
    when: ${globals.face_splat}
    inputs:
      image: scene.face_image
    outputs:
      normal_map: scene.face_normals

  - id: face_splat
    step: face_pointmap_splat
    dispatch: in_process
    when: ${globals.face_splat}
    inputs:
      image: scene.face_image
      mask: scene.face_matte
      normal_map: scene.face_normals
      crop_info: scene.face_crop_info
      mesh_output: scene
    params:
      filepath: ${globals.output_root}/face/face.ply
      debug_dir: ${globals.output_root}/debug/face_splat
    outputs:
      splat_path: scene.face_splat_path
      splat_stats: scene.face_splat_stats

  # ------------------------------------------------------- the drawings
  # THE CHANGE. `pattern: helical` with rerender_splat's own helix — 81
  # frames, two loops, +-30 degrees of elevation, 30/90 degrees of lead-in
  # and lead-out (the Body2COLMAP_HelicalPath node's values, which every
  # recorded pass 2 was denoised along). `override_cam_from_mesh` bends it
  # onto the photograph's camera exactly as it bends the circle: the
  # anchored solve (body2colmap's compute_helical_anchor_params) puts one
  # frame on the original camera at the world origin and publishes its
  # index, which is what warp_reference_to_anchor and the injection below
  # need. Everything else on this step is the native file's
  # render_initial_views, value for value: the outline+skeleton+splat
  # drawing on flat #7F7F7F, the per-pixel inactive mask over the face
  # composite, no room, the 60-degree composite cull, the 0.5 grey the
  # anchor warp borders with.
  - id: render_initial_views
    step: render
    dispatch: in_process
    inputs:
      mesh_output: scene
      splat_path: scene.face_splat_path?
    params:
      pattern: helical
      n_frames: 81
      n_loops: 2
      amplitude_deg: 30.0
      lead_in_deg: 30.0
      lead_out_deg: 90.0
      resolution: ${globals.resolution}
      framing: ${globals.framing}
      override_cam_from_mesh: true
      render_mode: outline+skeleton+splat
      splat_inactive_mask: true
      background: ""
      splat_max_angle_deg: 60.0
      bg_color: [0.5, 0.5, 0.5]
    outputs:
      images: dataset.images
      masks: dataset.masks
      inactive_masks: scene.inactive_masks
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      mesh: scene.mesh_world
      resolution: dataset.resolution
      focal_length_mm: dataset.extras.focal_length_mm
      orbit_target: dataset.extras.orbit_target
      forward_azimuth_deg: dataset.extras.forward_azimuth_deg
      # The helix's anchor: its frame index is NOT 0 here (a circle's is),
      # and every reader below takes it from the extras rather than
      # assuming it.
      anchor_position: dataset.extras.anchor_position
      anchor_frame_index: dataset.extras.anchor_frame_index
      original_focal_length: dataset.extras.original_focal_length
      framing_bounds: dataset.extras.framing_bounds
      initial_rotation: dataset.extras.initial_rotation
      image_warp: scene.image_warp

  - id: warp_reference_to_anchor
    step: generate_firstlast
    dispatch: in_process
    inputs:
      image: scene.front_image
      camera: scene.image_warp.camera
      original_focal_length: scene.image_warp.original_focal_length
      render_size: scene.image_warp.render_size
      bg_color: scene.image_warp.bg_color
    outputs:
      warped_image: dataset.anchor_image

  # The warped photograph over the anchor frame, VACE mask 0.0 there and
  # over the face composite (scene.inactive_masks), 1.0 over every drawing.
  # The ONLY anchor injection in this file: nothing re-renders the batch
  # after this, so nothing has to put the photograph back.
  - id: reinject_anchor_initial
    step: inject_anchor
    dispatch: in_process
    inputs:
      images: dataset.images
      cameras: dataset.cameras
      anchor_position: dataset.extras.anchor_position
      anchor_image: dataset.anchor_image
      masks: scene.inactive_masks?
    outputs:
      images: dataset.images
      masks: dataset.masks

  # ------------------------------------------------- re-outline (experimental)
  # The native file's six gated steps, on the helix: the same control video
  # through a 480x832 denoise at the settings below (the one denoise's
  # exactly), matted, the mattes brought back to the render size, the helix
  # rendered AGAIN with them as the outline, the anchor put back.
  - id: reoutline_downscale
    step: resize_batch
    dispatch: in_process
    when: ${globals.re_outline}
    inputs:
      images: dataset.images
      masks: dataset.masks
    params:
      width: 480
      height: 832
    outputs:
      images: scene.reoutline.images
      masks: scene.reoutline.masks

  - id: reoutline_denoise
    step: wan22_vace_denoise
    dispatch: subprocess
    env: wan22
    # The same resident worker as `denoise` below (the runner keys workers
    # on dispatch/env/keep_loaded), so the experts load once for both.
    keep_loaded: true
    when: ${globals.re_outline}
    inputs:
      control_video: scene.reoutline.images
      control_masks: scene.reoutline.masks
      reference_image: dataset.reference_image
      subject_desc: dataset.prompt
    params:
      width: 480
      height: 832
      steps_high: 2
      steps_low: 4
      cfg: 1.0
      seed: ${globals.seed}
      sampler_high: uni_pc
      sampler_shift: 5
      strength: [1, 1, 0.5, 0.5, 0.5, 0.5]
      prompt: "人工光、柔光、低对比度、环绕运镜。时间静止，人物完全静止。身体\
        如雕塑般僵硬，胸口没有起伏，头部保持固定角度，面部肌肉完全不动，维持单\
        一的中性表情。双眼一眨不眨，眼睑保持张开且稳定，目光空洞而固定，锁定远\
        处墙面上的一个点，对镜头毫无察觉、毫无反应。人物站在一间空房间里：灰色\
        墙面上有均匀的网格线，深色地板，浅色天花板，墙面相交处有清晰的墙角。房\
        间本身固定不动，镜头以匀速、固定焦距围绕主体平滑移动，墙角依次从画面中\
        掠过。灯光属于房间本身，位置固定：主光始终来自人物自身的左前方，右侧是\
        柔和的补光。人物身上的明暗、阴影与高光始终停留在同一片皮肤和衣物上，每\
        一帧完全相同——左侧始终是受光面，右侧始终是柔和的暗面；镜头绕到人物右侧\
        时，看到的正是那一侧的暗面。房间里的阴影同样固定：墙面上的明暗、以及人\
        物投在地面上的影子，始终落在房间中的同一位置，不随镜头移动。 Time is \
        frozen and only the camera moves. The gaze stays anchored to that \
        point on the wall as the camera passes, so the eyes slide across the \
        frame, always aimed past the lens at the wall behind it. Eyelids stay \
        open and steady, the expression holds without a single \
        micro-movement, and the head keeps its exact angle throughout. The \
        frozen subject is $SUBJECT_DESC$, standing in an empty room: grey \
        walls ruled with an even grid, a dark floor and a lighter ceiling, \
        meeting at clear corners. The room is fixed in place and the camera \
        travels through it, so the walls and their corners sweep past the \
        frame while the room itself never turns. Soft, low-contrast studio \
        light: the key sits high on the subject's own left, a soft fill on \
        their right, both fixed to the room and holding still while the \
        camera arcs around. Every highlight and shadow stays welded to the \
        same patch of skin and cloth from the first frame to the last, so \
        their left remains the lit side and their right remains the \
        soft-shadowed side for the whole circle; as the camera arcs round to \
        their right it sees that shadowed side. The room's shadows are just \
        as fixed: the shading on the walls and the shadow the subject casts \
        on the floor stay in the same place in the room in every frame, and \
        do not swing round with the camera. Matte skin, matte cloth, \
        photorealistic, sharp focus, identical face, clothing and lighting in \
        every frame."
      negative_prompt: "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静\
        止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的\
        手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体\
        ，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走, \
        chewing, tattoos, 眼球运动，眨眼，眼动追踪，微表情，面部抽动，头部移\
        动, 小头, 小脸"
    outputs:
      images: scene.reoutline.denoised

  - id: reoutline_matte
    step: rmbg
    dispatch: in_process
    when: ${globals.re_outline}
    inputs:
      images: scene.reoutline.denoised
    params:
      debug_dir: ${globals.output_root}/debug/reoutline
    outputs:
      masks: scene.reoutline.mattes

  - id: reoutline_upscale_mattes
    step: resize_batch
    dispatch: in_process
    when: ${globals.re_outline}
    inputs:
      masks: scene.reoutline.mattes
    params:
      width: ${globals.resolution.0}
      height: ${globals.resolution.1}
    outputs:
      masks: scene.outline_masks

  # render_initial_views again — the same helix, the same params — plus the
  # mattes. The path params must match the first render's or matte i lands
  # on the wrong camera.
  - id: render_reoutlined_views
    step: render
    dispatch: in_process
    when: ${globals.re_outline}
    inputs:
      mesh_output: scene
      splat_path: scene.face_splat_path?
      outline_masks: scene.outline_masks
    params:
      pattern: helical
      n_frames: 81
      n_loops: 2
      amplitude_deg: 30.0
      lead_in_deg: 30.0
      lead_out_deg: 90.0
      resolution: ${globals.resolution}
      framing: ${globals.framing}
      override_cam_from_mesh: true
      render_mode: outline+skeleton+splat
      splat_inactive_mask: true
      background: ""
      splat_max_angle_deg: 60.0
      bg_color: [0.5, 0.5, 0.5]
    outputs:
      images: dataset.images
      masks: dataset.masks
      inactive_masks: scene.inactive_masks

  - id: reinject_anchor_reoutlined
    step: inject_anchor
    dispatch: in_process
    when: ${globals.re_outline}
    inputs:
      images: dataset.images
      cameras: dataset.cameras
      anchor_position: dataset.extras.anchor_position
      anchor_image: dataset.anchor_image
      masks: scene.inactive_masks?
    outputs:
      images: dataset.images
      masks: dataset.masks

  # The control video the denoise is handed, into the debug bundle: the
  # drawings with their VACE mask in alpha, the reference, the anchor photo
  # and the cameras. The one record of the helix as drawn.
  - id: dump_denoise_input
    step: save_dataset
    dispatch: in_process
    inputs:
      dataset: dataset
    params:
      directory: ${globals.output_root}/debug/denoise_input
    outputs:
      directory_path: scene.denoise_input_dir

  # ================================================================ the tail
  # One denoise, then straight to the deliverable.

  # ------------------------------------------------------------- denoise
  # fast_helical_native's denoise_pass1, value for value: run E4 of the
  # 2026-09-08 skeleton-leak sweep (uni_pc on the high-noise expert, shift
  # 5, full scale on the two structure steps and half on the four detail
  # steps), which is the setting measured to keep the DWPose ink out of the
  # frames, and the prompts tests/test_workflows.py pins. What is new is
  # under it: 81 frames of a helix rather than a circle, so the model is
  # asked for the subject from +-30 degrees of elevation off a drawing,
  # which pass 1 never was. If the elevated frames come back inconsistent
  # with the equatorial ones — a different person from above — this is the
  # block to tune, and `strength` is the dial: pass 2 held the helix
  # together at a flat 0.8 over a splat render, and the drawing has less to
  # say than a render does.
  #
  # `keep_loaded` for the re-outline denoise's sake (one worker for both);
  # with that branch off it costs nothing but the host RAM the weights wait
  # in for the rest of the run.
  - id: denoise
    step: wan22_vace_denoise
    dispatch: subprocess
    env: wan22
    keep_loaded: true
    inputs:
      control_video: dataset.images
      control_masks: dataset.masks
      # The sheet's back panel, or None for a single photo (the step runs
      # with no reference then). No pick_rear_view fills it afterwards —
      # there is no later pass to condition.
      reference_image: dataset.reference_image
      subject_desc: dataset.prompt
    params:
      width: ${globals.resolution.0}
      height: ${globals.resolution.1}
      steps_high: 2
      steps_low: 4
      cfg: 1.0
      seed: ${globals.seed}
      sampler_high: uni_pc
      sampler_shift: 5
      strength: [1, 1, 0.5, 0.5, 0.5, 0.5]
      prompt: "人工光、柔光、低对比度、环绕运镜。时间静止，人物完全静止。身体\
        如雕塑般僵硬，胸口没有起伏，头部保持固定角度，面部肌肉完全不动，维持单\
        一的中性表情。双眼一眨不眨，眼睑保持张开且稳定，目光空洞而固定，锁定远\
        处墙面上的一个点，对镜头毫无察觉、毫无反应。人物站在一间空房间里：灰色\
        墙面上有均匀的网格线，深色地板，浅色天花板，墙面相交处有清晰的墙角。房\
        间本身固定不动，镜头以匀速、固定焦距围绕主体平滑移动，墙角依次从画面中\
        掠过。灯光属于房间本身，位置固定：主光始终来自人物自身的左前方，右侧是\
        柔和的补光。人物身上的明暗、阴影与高光始终停留在同一片皮肤和衣物上，每\
        一帧完全相同——左侧始终是受光面，右侧始终是柔和的暗面；镜头绕到人物右侧\
        时，看到的正是那一侧的暗面。房间里的阴影同样固定：墙面上的明暗、以及人\
        物投在地面上的影子，始终落在房间中的同一位置，不随镜头移动。 Time is \
        frozen and only the camera moves. The gaze stays anchored to that \
        point on the wall as the camera passes, so the eyes slide across the \
        frame, always aimed past the lens at the wall behind it. Eyelids stay \
        open and steady, the expression holds without a single \
        micro-movement, and the head keeps its exact angle throughout. The \
        frozen subject is $SUBJECT_DESC$, standing in an empty room: grey \
        walls ruled with an even grid, a dark floor and a lighter ceiling, \
        meeting at clear corners. The room is fixed in place and the camera \
        travels through it, so the walls and their corners sweep past the \
        frame while the room itself never turns. Soft, low-contrast studio \
        light: the key sits high on the subject's own left, a soft fill on \
        their right, both fixed to the room and holding still while the \
        camera arcs around. Every highlight and shadow stays welded to the \
        same patch of skin and cloth from the first frame to the last, so \
        their left remains the lit side and their right remains the \
        soft-shadowed side for the whole circle; as the camera arcs round to \
        their right it sees that shadowed side. The room's shadows are just \
        as fixed: the shading on the walls and the shadow the subject casts \
        on the floor stay in the same place in the room in every frame, and \
        do not swing round with the camera. Matte skin, matte cloth, \
        photorealistic, sharp focus, identical face, clothing and lighting in \
        every frame."
      negative_prompt: "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静\
        止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的\
        手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体\
        ，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走, \
        chewing, tattoos, 眼球运动，眨眼，眼动追踪，微表情，面部抽动，头部移\
        动, 小头, 小脸"
    outputs:
      images: dataset.images

  # The matte of the denoised frames. It replaces the VACE flags in
  # dataset.masks, which nothing reads again: from here on dataset.masks
  # means the subject.
  - id: foreground_masks
    step: rmbg
    dispatch: in_process
    inputs:
      images: dataset.images
    outputs:
      masks: dataset.masks

  # Pixel-space treatment of the denoised frames before anything reads
  # them; every op off at its default and the setting is the switch. Skips
  # the photograph's frame, which is why it takes the anchor index.
  - id: adjust_denoised
    step: pixel_ops
    dispatch: in_process
    inputs:
      images: dataset.images
      masks: dataset.masks
      anchor_frame_index: dataset.extras.anchor_frame_index?
    params:
      specular_suppress: ${globals.specular_suppress}
    outputs:
      images: dataset.images

  # ------------------------------------------------------------ pre-upscale
  # Debug: the frames as they are BEFORE the upscale, with the matte just
  # computed for them — the native file recomputed one here because its
  # dataset.masks held VACE flags at this point; this one's holds
  # foreground_masks' matte of exactly these frames. Given poses: the
  # refinement below runs on the upscaled frames, and this export exists
  # to measure what SeedVR2 does against colmap/, not to be refined.
  - id: export_colmap_preupscale
    step: colmap_export
    dispatch: in_process
    when:
      - ${globals.export_debug}
      - ${globals.run_upscale}
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
    params:
      output_dir: ${globals.output_root}/colmap_preupscale
      layout: brush

  # ---------------------------------------------------------------- upscale
  # 720x1280 -> 1080x1920, and the cameras' intrinsics rescaled with the
  # frames in the same step (steps/seedvr2.py). Everything below — the
  # matte, the refinement, the training — sees the upscaled dataset.
  - id: upscale
    step: seedvr2
    dispatch: subprocess
    env: seedvr2
    when: ${globals.run_upscale}
    inputs:
      images: dataset.images
      cameras: dataset.cameras
    params:
      resolution: 1080
      batch_size: 1
      vae_encode_tiled: true
      vae_decode_tiled: true
      seed: ${globals.seed}
    outputs:
      images: dataset.images
      cameras: dataset.cameras
      resolution: dataset.resolution

  # The matte of the frames as they finally are. Gated with the upscale:
  # with it off the frames are the ones foreground_masks already matted,
  # and dataset.masks still holds that matte.
  - id: export_masks
    step: rmbg
    dispatch: in_process
    when: ${globals.run_upscale}
    inputs:
      images: dataset.images
    outputs:
      masks: dataset.masks

  # ------------------------------------------------- refining the cameras
  # ONCE, here, where the native file has two: one generated path, one
  # training. After the upscale so it solves on the frames the training
  # sees, and ahead of everything that reads a pose — the rig, the export
  # and the training. Against the frames and their matte only.
  #
  # The anchor's index comes from the extras (the helix's, not 0), and the
  # refined anchor position is republished over the record so the extras
  # describe a pose the camera list actually holds — the same wiring as the
  # native file's FIRST refinement. Its second one deliberately did not
  # republish, because a re-render and a position-matched injection
  # followed it; nothing follows this one that reads the record at all.
  - id: refine_cameras
    step: refine_cameras
    dispatch: in_process
    when: ${globals.refine_cameras}
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      images: dataset.images
      masks: dataset.masks
      anchor_frame_index: dataset.extras.anchor_frame_index?
    params:
      debug_dir: ${globals.output_root}/debug/refine_cameras
    outputs:
      cameras: dataset.cameras
      stats: scene.camera_refinement
      anchor_position: dataset.extras.anchor_position

  # The per-view deformation rig, from the INITIAL body — the native file's
  # build_body_rig_initial. `mesh_raw` against `mesh_world` gives the step
  # the raw-to-world similarity a refit would have published.
  - id: build_body_rig
    step: build_body_rig
    when: ${globals.body_rig}
    inputs:
      mesh_world: scene.mesh_world
      mesh_raw: scene.vertices
      joints: scene.joints
      rig_binding: scene.rig_binding
    params:
      debug_dir: ${globals.output_root}/debug/body_rig
    outputs:
      body_rig: scene.body_rig
      body_rig_stats: scene.body_rig_stats

  # The class map of every frame as the training sees it, for the
  # per-splat label vote.
  - id: segment_views
    step: sapiens2_seg
    dispatch: in_process
    when: ${globals.splat_labels}
    inputs:
      images: dataset.images
    params:
      dtype: bfloat16
    outputs:
      labels: scene.seg_labels

  # ---------------------------------------------------------------- export
  # Deliverable 1: the COLMAP dataset — the training's input exactly, in
  # the layout brush reads.
  - id: export_colmap
    step: colmap_export
    dispatch: in_process
    when: ${globals.export_colmap}
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      labels: scene.seg_labels?
    params:
      output_dir: ${globals.output_root}/colmap
      layout: brush

  # Deliverable 2: the trained splat — the native file's train_final_splat
  # (its id kept, so a sidecar's `step_params: train_final_splat:` means
  # the same training in both files), on the same inputs: NO supporting
  # views and no weights, as there (the face cap is not built in this
  # file, see the header); no normal maps and no supervision on them
  # (measured as a straight loss on this training); no `body_params` (no
  # refit body).
  - id: train_final_splat
    step: brush
    dispatch: in_process
    when: ${globals.export_ply}
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      # The INITIAL body, for the hollow loss (see hollow_margin).
      mesh: scene.mesh_world?
      body_rig: scene.body_rig?
      labels: scene.seg_labels?
    params:
      total_steps: 30000
      hollow_weight: 0.5
      # 5 cm, not the native file's 3: that margin was measured behind the
      # REFIT body, and there is none here. Against SAM-3D-Body's own mesh
      # — which sits centimetres off where the frames put the subject —
      # 5 cm is the setting docs/body-refit.md calls safe.
      hollow_margin: 0.05
      normal_loss_strength: 0.0
      align_iters: 4
      align_debug_dir: ${globals.output_root}/debug/alignment
      export_dir: ${globals.output_root}/ply
      export_name: scene.ply
      polish_steps: 0
    outputs:
      splat_path: dataset.splat_path
