# `fast_helical_full.yaml` minus the SeedVR2 upscale — five stages, not six.
#
#   denoise.json          initial -> circular          (strength 1.0)
#   resplat_helical.json  circular -> splatted
#   mask_splat.json       splatted -> masked_splatted  (filter 6, dilation 2)
#   denoise.json          masked_splatted -> helical   (strength 0.8)
#   colmap.json           helical -> colmap
#
# WHY THIS EXISTS: to answer "is it the upscaler?". The final output of the
# full pipeline is not quite right, and the upscale is both the least
# examined step in it and the one that changes the frames the most —
# SeedVR2 is a one-step diffusion model, so it is free to invent detail,
# and it resamples every frame to a resolution nothing else in the
# pipeline was tuned at. Running this and the full version over the same
# input dataset isolates that one variable; everything else here is
# byte-for-byte the same file.
#
# Two differences from fast_helical_full.yaml, and only two:
#
#   * no `upscale` step (seedvr2), and no `upscale_resolution` param;
#   * no `rescale_cameras` step (fit_cameras_to_images) — it exists solely
#     to repair the intrinsics the upscale invalidates, and with no upscale
#     the cameras already match the frames.
#
# Keep the two files in step when editing either.
#
# Stage 5 produces the run's deliverables, under output_root:
#
#   colmap/   cameras.txt + images.txt + points3D.txt, images/, normals/
#   ply/      scene.ply — a second brush training, normal-supervised
#
# Either can be switched off with the export_colmap / export_ply params;
# the web UI's Outputs checkboxes are exactly those two.
#
# STATUS: shares every step with fast_helical_full.yaml. The file is checked
# by tests/test_workflows.py (it loads, resolves against the registry, and
# its templates expand), which is not the same as having run.
#
# Expects a dataset rendered with override_cam_from_mesh (its extras carry
# orbit_target / anchor_position / focal_length_mm / original_focal_length),
# i.e. what `render` produces and what cyber_6f/initial is.
name: fast_helical
description: >-
  fast_helical_full without the SeedVR2 upscale: denoise, train+re-render a
  splat, mask, denoise again, then export a COLMAP dataset and/or a
  normal-supervised trained .ply.

params:
  resolution: [720, 1280]
  diffusion_steps: 6
  cfg: 1.0
  seed: 0

  # Stage 2 helical re-render. Values from resplat_helical.json's
  # Body2COLMAP_HelicalPath node — note lead_in/lead_out are 30/90, not the
  # 45/45 the solver defaults to.
  resplat_frames: 81
  resplat_loops: 2
  resplat_amplitude_deg: 30.0
  resplat_lead_in_deg: 30.0
  resplat_lead_out_deg: 90.0

  # Stage 3, from `fast helical.yaml`'s own step config.
  mask_filter_size: 6
  mask_dilation: 2

  # Brush defaults, matching nodes/brush_node.py and resplat_helical.json.
  brush_path: brush
  brush_total_steps: 30000
  brush_sh_degree: 3
  brush_max_resolution: 1920
  brush_max_splats: 10000000
  brush_refine_every: 200
  brush_normal_loss_strength: 0.05
  brush_normal_loss_step_start: 5000
  # How often the normal loss is actually evaluated, in training steps.
  # 1 is brush's own default (every step); raising it skips the extra
  # normal render on the steps in between, and brush scales the sampled
  # loss by the same factor so the expected gradient does not change.
  brush_normal_loss_every: 1

  # Which deliverables stage 6 produces. Both default on; the web UI drives
  # them from its Outputs checkboxes, and `--param export_ply=false` does
  # the same from the CLI. Turning one off skips its steps entirely (see
  # `when:` in pipeline/workflow.py) — which for export_ply means not
  # starting a second 30,000-iteration brush training you were going to
  # throw away.
  export_colmap: true
  export_ply: true

  # Every path this workflow writes to disk hangs off this one param, and
  # `pipeline.cli run` repoints it at the run's own directory under
  # B2C_OUTPUT_DIR (i.e. the mounted volume) unless you pass
  # `--param output_root=...`. The literal below is only what you get from
  # a bare `WorkflowRunner` with no CLI: relative to the working directory,
  # which on a pod is the container's writable layer — small, and gone when
  # the pod is recycled.
  output_root: output/fast_helical

  # Exact strings from the live ComfyUI graph (workflows/api/denoise.json,
  # nodes 6/7/188) — $SUBJECT_DESC$ gets filled in from dataset.prompt.
  #
  # Double-quoted with escaped line breaks rather than YAML's `>-`, and that
  # matters: a folded scalar turns every line break into a space, which
  # inside the Chinese runs silently inserts spaces that are not in the
  # graph's string. `\` at end of line drops the break and the next line's
  # indent instead, so what loads is the prompt character for character.
  # tests/test_workflows.py pins both against the strings below.
  denoise_prompt: "时间静止，人物完全静止。身体如雕塑般僵硬，胸口没有起伏，头部保持固定\
    角度，面部肌肉完全不动，维持单一的中性表情。双眼一眨不眨，眼睑保持张\
    开且稳定，目光空洞而固定，锁定远处墙面上的一个点，对镜头毫无察觉、毫\
    无反应。镜头以匀速、固定焦距围绕主体平滑移动。 Time is frozen and only \
    the camera moves. The gaze stays anchored to that point on the wall \
    as the camera passes, so the eyes slide across the frame, always aimed \
    past the lens at the wall behind it. Eyelids stay open and steady, the \
    expression holds without a single micro-movement, and the head keeps \
    its exact angle throughout. The frozen subject is $SUBJECT_DESC$, lit \
    by even soft studio light against a plain seamless backdrop, photorealistic, \
    sharp focus, identical face and clothing in every frame."
  denoise_negative_prompt: "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静\
    止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的\
    手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体\
    ，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走, \
    chewing, tattoos, 眼球运动，眨眼，眼动追踪，微表情，面部抽动，头部移\
    动, 小头, 小脸"

steps:
  # ---------------------------------------------------------------- stage 1
  # denoise.json: initial -> circular, strength 1.0.
  # dataset.masks here is the per-frame reference/denoise flag baked into
  # the loaded frames' alpha — NOT a foreground mask. See
  # steps/wan22_vace_denoise.py's docstring.
  #
  # No checkpoint params here on purpose: the step defaults to the
  # pre-quantized fp8 experts (silveroxides/Wan_2.2-fp8_scaled_hybrid) and
  # has no bf16 path left to fall back to. Override fp8_checkpoint_high /
  # fp8_checkpoint_low only to point at local files.
  - id: denoise_pass1
    step: wan22_vace_denoise
    dispatch: subprocess
    env: wan22
    # Hold the pipeline resident between the two passes: one worker process
    # serves both, so the ~47 GB of weights come off the network volume
    # once per run instead of twice. The worker calls the step's
    # release_vram() after every job, so brush (which trains on the GPU
    # between these two steps) still finds an empty card — the weights wait
    # in host RAM, not VRAM. Both passes must declare this; it is what
    # makes them share one worker.
    keep_loaded: true
    inputs:
      control_video: dataset.images
      control_masks: dataset.masks
      reference_image: dataset.reference_image
      subject_desc: dataset.prompt
    params:
      width: ${params.resolution.0}
      height: ${params.resolution.1}
      steps: ${params.diffusion_steps}
      cfg: ${params.cfg}
      seed: ${params.seed}
      strength: 1.0
      prompt: ${params.denoise_prompt}
      negative_prompt: ${params.denoise_negative_prompt}
    outputs:
      images: dataset.images

  # ---------------------------------------------------------------- stage 2
  # resplat_helical.json: train a splat on the denoised views, then
  # re-render it along a new, longer helical orbit.

  # Foreground alpha for brush's --alpha-mode transparent. Distinct from
  # the denoise control mask above, which this overwrites: past this point
  # the reference/denoise flag is no longer needed.
  - id: foreground_masks
    step: rmbg
    dispatch: in_process
    inputs:
      images: dataset.images
    outputs:
      masks: dataset.masks

  - id: normal_maps
    step: sapiens2_lite
    dispatch: in_process
    inputs:
      images: dataset.images
    outputs:
      normal_maps: scene.normal_maps

  - id: train_splat
    step: brush
    dispatch: in_process
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      normal_maps: scene.normal_maps
    params:
      brush_path: ${params.brush_path}
      total_steps: ${params.brush_total_steps}
      sh_degree: ${params.brush_sh_degree}
      max_resolution: ${params.brush_max_resolution}
      max_splats: ${params.brush_max_splats}
      refine_every: ${params.brush_refine_every}
      # Without this brush exports into tempfile.gettempdir() (see
      # steps/brush.py) — the trained .ply then only survives because
      # Dataset.to_disk copies it at the very end.
      output_dir: ${params.output_root}
      alpha_mode: transparent
      normal_loss_strength: ${params.brush_normal_loss_strength}
      normal_loss_step_start: ${params.brush_normal_loss_step_start}
      normal_loss_every: ${params.brush_normal_loss_every}
    outputs:
      splat_path: dataset.splat_path

  - id: load_trained_splat
    step: load_splat
    dispatch: in_process
    inputs:
      splat_path: dataset.splat_path
    outputs:
      splat_scene: scene.splat

  # The ComfyUI node leaves override_cam_from_mesh off here: this is a
  # fresh, longer orbit framed from the splat's own bounds (fill_ratio 0.8,
  # focal length inherited from the dataset), not an anchored one. The
  # anchor is re-applied by inject_anchor below, matching on position.
  - id: rerender_splat
    step: render_splat
    dispatch: in_process
    inputs:
      splat_scene: scene.splat
      dataset: dataset
    params:
      width: ${params.resolution.0}
      height: ${params.resolution.1}
      pattern: helical
      n_frames: ${params.resplat_frames}
      n_loops: ${params.resplat_loops}
      amplitude_deg: ${params.resplat_amplitude_deg}
      lead_in_deg: ${params.resplat_lead_in_deg}
      lead_out_deg: ${params.resplat_lead_out_deg}
      framing: full
      fill_ratio: 0.8
      focal_length_mm: 0
      override_pointcloud: false
      device: cuda
    outputs:
      images: dataset.images
      masks: dataset.masks
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d

  # ---------------------------------------------------------------- stage 3
  # mask_splat.json: drop the splat's low-confidence fringes.
  - id: mask_splat_fringes
    step: mask_splat
    dispatch: in_process
    inputs:
      dataset: dataset
    params:
      filter_size: ${params.mask_filter_size}
      dilation: ${params.mask_dilation}
    outputs:
      dataset: dataset

  # Put the warped reference photo back onto whichever new frames landed on
  # the original camera. Matches by position, so it survives the reorbit.
  #
  # AFTER mask_splat, not before it — the ordering is load-bearing and was
  # wrong. Before mask_splat this step sits where dataset.masks is carrying
  # rerender_splat's per-pixel splat alpha, and it would overwrite exactly
  # the input mask_splat exists to threshold. Here it only ever sees VACE
  # masks: mask_splat has already consumed the alpha and emitted all-1.0.
  #
  # This reproduces cyber2_6f/masked_splatted frame for frame: 80 frames
  # masked and filtered at alpha 255, and frame_00038_ the anchor.png
  # verbatim — not composited over black, not bilateral-filtered — at
  # alpha 0.
  - id: reinject_anchor
    step: inject_anchor
    dispatch: in_process
    inputs:
      images: dataset.images
      cameras: dataset.cameras
      anchor_position: dataset.extras.anchor_position
      anchor_image: dataset.anchor_image
      # mask_splat's all-1.0 batch, passed through with 0.0 written at the
      # anchor frame. Manufacturing it here instead would give the same
      # values today; wiring it keeps the step from silently destroying a
      # mask that matters if anything is ever inserted above it.
      masks: dataset.masks
    params:
      tolerance_pct: 0.1
    outputs:
      images: dataset.images
      masks: dataset.masks

  # ---------------------------------------------------------------- stage 4
  # denoise.json again, strength 0.8 — clean up the re-render.
  - id: denoise_pass2
    step: wan22_vace_denoise
    dispatch: subprocess
    env: wan22
    # Hold the pipeline resident between the two passes: one worker process
    # serves both, so the ~47 GB of weights come off the network volume
    # once per run instead of twice. The worker calls the step's
    # release_vram() after every job, so brush (which trains on the GPU
    # between these two steps) still finds an empty card — the weights wait
    # in host RAM, not VRAM. Both passes must declare this; it is what
    # makes them share one worker.
    keep_loaded: true
    inputs:
      control_video: dataset.images
      control_masks: dataset.masks
      reference_image: dataset.reference_image
      subject_desc: dataset.prompt
    params:
      width: ${params.resolution.0}
      height: ${params.resolution.1}
      steps: ${params.diffusion_steps}
      cfg: ${params.cfg}
      seed: ${params.seed}
      strength: 0.8
      prompt: ${params.denoise_prompt}
      negative_prompt: ${params.denoise_negative_prompt}
    outputs:
      images: dataset.images

  # ---------------------------------------------------------------- stage 5
  # colmap.json: background-remove, re-estimate normals against the frames
  # as they finally are, then emit whichever deliverables were selected.
  - id: export_masks
    step: rmbg
    dispatch: in_process
    inputs:
      images: dataset.images
    outputs:
      masks: dataset.masks

  # NOT the stage-2 normal maps (scene.normal_maps): those describe the
  # pre-re-render frames, which rerender_splat replaced wholesale with a
  # different, longer orbit — a different count and different poses. Both
  # deliverables below want normals for *these* frames, so they are
  # estimated again here.
  - id: export_normals
    step: sapiens2_lite
    dispatch: in_process
    inputs:
      images: dataset.images
    outputs:
      normal_maps: scene.export_normal_maps

  # Deliverable 1: a COLMAP dataset. `layout: brush` puts the frames in
  # images/ and the normals in normals/ beside the three .txt files —
  # what brush itself reads, and what somebody handed this directory
  # expects, rather than the flat frames-beside-the-txt layout the ComfyUI
  # colmap.json stage wrote.
  - id: export_colmap
    step: colmap_export
    dispatch: in_process
    when: ${params.export_colmap}
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      normal_maps: scene.export_normal_maps
    params:
      output_dir: ${params.output_root}/colmap
      layout: brush

  # Deliverable 2: a trained splat, normal-supervised. This is a second
  # full brush training — the stage-2 one exists to drive the helical
  # re-render and predates the second denoise pass, so it
  # is not the splat anyone wants to keep. `export_dir` puts this one at a
  # predictable path instead of brush/training_<ms>/.
  - id: train_final_splat
    step: brush
    dispatch: in_process
    when: ${params.export_ply}
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      normal_maps: scene.export_normal_maps
    params:
      brush_path: ${params.brush_path}
      total_steps: ${params.brush_total_steps}
      sh_degree: ${params.brush_sh_degree}
      max_resolution: ${params.brush_max_resolution}
      max_splats: ${params.brush_max_splats}
      refine_every: ${params.brush_refine_every}
      export_dir: ${params.output_root}/ply
      export_name: scene.ply
      alpha_mode: transparent
      normal_loss_strength: ${params.brush_normal_loss_strength}
      normal_loss_step_start: ${params.brush_normal_loss_step_start}
      normal_loss_every: ${params.brush_normal_loss_every}
    outputs:
      # Overwrites the stage-2 intermediate, so Dataset.to_disk's splat.ply
      # and the CLI's closing "splat:" line both name the final one.
      splat_path: dataset.splat_path
