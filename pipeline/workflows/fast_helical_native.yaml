# Target shape for the native port of workflows/pipeline/fast helical.yaml.
# rmbg, wan22_vace_denoise, sapiens2_lite, and sam3d_body (pipeline/steps/)
# are all verified on real hardware (L40S pod) — wan22_vace_denoise against
# cyber_6f's initial/ dataset at full 81-frame batch size (see that
# module's docstring for why frame count matters), rmbg and sapiens2_lite
# against its output frames (both single-image and batched paths), and
# sam3d_body against cyber_6f's anchor.png. brush and render_splat are now
# verified on real GPU hardware too (a local RTX 4070 Ti — see
# docs/docker-build-notes.md); render's rasterization itself is still
# UNTESTED (its own module docstring), separate from the EGL capability
# check that ran fine.
#
# render / generate_firstlast / inject_anchor are wired in below (2026-08-
# 23) — previously this workflow computed sam3d_body's mesh reconstruction
# into scene.* and then discarded it, jumping straight to `denoise` reading
# dataset.images/cameras that nothing had ever populated. That's also what
# every prior verification run sidestepped: everything tested so far used
# cyber_6f/initial, a pre-existing recorded multi-view dataset, not a
# dataset this workflow built itself from one photo.
#
# What "wired in" does NOT yet mean: a way to invoke this from a bare
# image. pipeline/dataset.py's Dataset dataclass requires images/cameras/
# points_3d/resolution up front (no defaults), and pipeline/cli.py only
# loads a complete on-disk dataset via --dataset — there's no bootstrap
# path that constructs a Dataset from just a reference photo yet. Until
# that exists, running this workflow from scratch means seeding a Context
# by hand (or extending cli.py) with a Dataset stub carrying only
# reference_image, empty images/cameras/points_3d, before calling
# WorkflowRunner.run directly — this file's step graph is now correct and
# complete, but the CLI entrypoint for "just one photo" is a separate,
# still-open piece of work.
#
# pattern/n_frames for render_initial_views below are inferred, not
# recovered from any source graph: even upstream ComfyUI-Body2COLMAP never
# scripted this stage as an API JSON (checked workflows/api/ and
# workflows/pipeline/fast helical.yaml directly — the pipeline runner
# there also starts from a pre-existing "initial" directory; producing it
# was apparently always a manual/interactive ComfyUI step). circular/81
# frames matches cyber_6f/initial/metadata.json's own recorded shape
# (81 cameras, anchor_frame_index=0, which is what render.py's circular
# path always produces in override_cam_from_mesh mode) closely enough to
# use as the default, but treat it as a best-effort match, not a verified
# recipe — there is no ground truth to diff against here the way brush's
# branch pin had `--help` to check against.
name: fast_helical_native
description: Single-loop helical orbit, no upscale pass.
params:
  resolution: [512, 512]
  diffusion_steps: 6
  cfg: 1.0
  seed: 0
  # Defaults match nodes/brush_node.py's ComfyUI node defaults.
  brush_total_steps: 30000
  brush_sh_degree: 3
  brush_max_resolution: 1920
  brush_max_splats: 10000000
  brush_refine_every: 200
  brush_normal_loss_strength: 0.05
  brush_normal_loss_step_start: 5000
  # Every path this workflow writes to disk hangs off this one param, and
  # `pipeline.cli run` repoints it at the run's own directory under
  # B2C_OUTPUT_DIR (i.e. the mounted volume) unless you pass
  # `--param output_root=...`. The literal below is only what you get from
  # a bare `WorkflowRunner` with no CLI: relative to the working directory,
  # which on a pod is the container's writable layer — small, and gone when
  # the pod is recycled.
  output_root: output/fast_helical_native
  # Exact strings from the live ComfyUI graph (workflows/api/denoise.json,
  # nodes 6/7/188) — $SUBJECT_DESC$ gets filled in from dataset.prompt.
  denoise_prompt: >-
    The subject is $SUBJECT_DESC$. An unmoving wax statue of the subject
    undergoes a 360 degree rotation. The subject is unmoving and unblinking,
    their expression frozen as the camera continues to rotate around them.
    Their eyes fixed in place. The camera rotates at a constant speed,
    smoothly completing an orbit around the subject. The subject remains
    consistent throughout the rotation. 人物正面朝向，表情中性，目光固定，眼睛保持静止，
    无眨眼，面部完全静止，如雕像般静止，画面无时间变化
  denoise_negative_prompt: >-
    色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，
    低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，
    毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走,
    chewing, tattoos, 眼球运动，眨眼，眼动追踪，微表情，面部抽动，头部移动, 小头, 小脸

steps:
  # rmbg's foreground/background mask is for the Gaussian-splat stage
  # (brush's --alpha-mode, not yet a step in this workflow) — NOT for
  # wan22_vace_denoise's control_masks below, which needs a different thing
  # entirely: a per-frame reference-vs-needs-denoising flag (see that
  # module's docstring, verified against cyber_6f's initial/ alpha
  # channel). That flag already comes baked into dataset.masks from
  # Dataset.from_disk() (the alpha channel of the loaded frames) — so rmbg
  # writes to its own scene.* path here rather than overwriting it.
  - id: remove_background
    step: rmbg
    dispatch: in_process
    inputs:
      image: dataset.reference_image
    outputs:
      mask: scene.foreground_mask

  - id: reconstruct_body
    step: sam3d_body
    dispatch: subprocess
    env: sam3dbody
    inputs:
      image: dataset.reference_image
    outputs:
      vertices: scene.vertices
      faces: scene.faces
      joints: scene.joints
      keypoints_3d: scene.keypoints_3d
      global_rots: scene.global_rots
      cam_t: scene.cam_t
      focal_length: scene.focal_length
      bbox: scene.bbox

  # render's mesh_output wants a dict with vertices/cam_t/faces/
  # keypoints_3d/focal_length (see render.py's module docstring on why
  # keypoints_3d specifically, not joints) — reconstruct_body's outputs
  # above already assembled exactly that dict at the "scene" namespace
  # (plus a few extra keys render.py ignores), so it's passed straight
  # through with no reshaping.
  #
  # override_cam_from_mesh: true is what makes this the *initial* render —
  # it anchors one frame exactly at the original SAM-3D-Body camera and
  # publishes the orbit_target/anchor_position/original_focal_length/
  # image_warp extras that reinject_anchor_initial and the eventual
  # render_splat re-render both key off (see splat.py's
  # override_cam_from_mesh path). Without it this would be a normal
  # auto-oriented render with no anchor to warp the reference photo onto.
  - id: render_initial_views
    step: render
    dispatch: in_process
    inputs:
      mesh_output: scene
    params:
      pattern: circular
      n_frames: 81
      width: ${params.resolution.0}
      height: ${params.resolution.1}
      render_mode: depth+skeleton
      framing: full
      override_cam_from_mesh: true
      fill_ratio: 0.8
    outputs:
      images: dataset.images
      masks: dataset.masks
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      resolution: dataset.resolution
      focal_length_mm: dataset.extras.focal_length_mm
      orbit_target: dataset.extras.orbit_target
      forward_azimuth_deg: dataset.extras.forward_azimuth_deg
      anchor_position: dataset.extras.anchor_position
      anchor_frame_index: dataset.extras.anchor_frame_index
      original_focal_length: dataset.extras.original_focal_length
      framing_bounds: dataset.extras.framing_bounds
      initial_rotation: dataset.extras.initial_rotation
      image_warp: scene.image_warp

  # Put the real reference photo, warped to the anchor camera's framing,
  # onto the render at that frame — this is what makes cyber_6f/initial's
  # anchor frame byte-identical to anchor.png rather than a mesh render of
  # it (see pipeline/README.md's inject_anchor verification note).
  # scene.image_warp's keys (camera/original_focal_length/render_size/
  # bg_color) are render_initial_views' own image_warp output, unpacked —
  # see anchor_stub.py's GenerateFirstLastStep for why those specific
  # fields.
  - id: warp_reference_to_anchor
    step: generate_firstlast
    dispatch: in_process
    inputs:
      image: dataset.reference_image
      camera: scene.image_warp.camera
      original_focal_length: scene.image_warp.original_focal_length
      render_size: scene.image_warp.render_size
      bg_color: scene.image_warp.bg_color
    outputs:
      warped_image: dataset.anchor_image

  - id: reinject_anchor_initial
    step: inject_anchor
    dispatch: in_process
    inputs:
      images: dataset.images
      cameras: dataset.cameras
      anchor_position: dataset.extras.anchor_position
      anchor_image: dataset.anchor_image
    params:
      tolerance_pct: 0.1
    outputs:
      images: dataset.images
      masks: dataset.masks

  - id: denoise
    step: wan22_vace_denoise
    dispatch: subprocess
    env: wan22
    inputs:
      control_video: dataset.images
      control_masks: dataset.masks
      reference_image: dataset.reference_image
      subject_desc: dataset.prompt
    params:
      width: ${params.resolution.0}
      height: ${params.resolution.1}
      steps: ${params.diffusion_steps}
      cfg: ${params.cfg}
      seed: ${params.seed}
      strength: 1.0
      prompt: ${params.denoise_prompt}
      negative_prompt: ${params.denoise_negative_prompt}
    outputs:
      images: dataset.images

  # Per-frame masks for the *denoised* batch — distinct from
  # remove_background above (which masks the raw reference photo for a
  # generate_firstlast pass that isn't wired in yet). Overwrites
  # dataset.masks; the per-frame reference/denoise flag that field held for
  # the denoise step above is no longer needed past this point.
  - id: mask_denoised_frames
    step: rmbg
    dispatch: in_process
    inputs:
      images: dataset.images
    outputs:
      masks: dataset.masks

  - id: normal_maps
    step: sapiens2_lite
    dispatch: in_process
    inputs:
      images: dataset.images
    outputs:
      normal_maps: scene.normal_maps

  # in_process, not docker: targeting RunPod, where a pod IS a single
  # container with no nested Docker daemon to run a separate brush image
  # in (confirmed on a real pod: no /var/run/docker.sock, no `docker`
  # binary) — so brush has to live in the same image as everything else,
  # per docker/Dockerfile. Its OS-level Vulkan/graphics requirement is
  # unresolved as of this writing: confirmed a default RunPod pod's
  # NVIDIA_DRIVER_CAPABILITIES only exposes compute,utility (vulkaninfo
  # fails with ERROR_INCOMPATIBLE_DRIVER even though the driver's .so files
  # are present), and setting the capability in docker/Dockerfile's own
  # image is necessary but not yet confirmed sufficient for a RunPod pod
  # specifically — see that file's comment and docs/docker.md.
  - id: train_splat
    step: brush
    dispatch: in_process
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      normal_maps: scene.normal_maps
    params:
      brush_path: brush
      total_steps: ${params.brush_total_steps}
      sh_degree: ${params.brush_sh_degree}
      max_resolution: ${params.brush_max_resolution}
      max_splats: ${params.brush_max_splats}
      refine_every: ${params.brush_refine_every}
      # Without this brush exports into tempfile.gettempdir() (see
      # steps/brush.py) — the trained .ply then only survives because
      # Dataset.to_disk copies it at the very end.
      output_dir: ${params.output_root}
      alpha_mode: transparent
      normal_loss_strength: ${params.brush_normal_loss_strength}
      normal_loss_step_start: ${params.brush_normal_loss_step_start}
    outputs:
      splat_path: dataset.splat_path

  - id: checkpoint
    step: save_dataset
    dispatch: in_process
    inputs:
      dataset: dataset
    params:
      directory: ${params.output_root}/checkpoint
