# The from-a-sheet path: build the initial multi-view dataset from one
# front/back reference sheet, then run fast_helical_full's pipeline over it.
#
# BOOTSTRAP (this file only) — split_sheet -> reconstruct_body ->
# detect_face -> render_initial_views -> warp_reference_to_anchor ->
# reinject_anchor_initial.
# This is the part fast_helical_full is handed ready-made: a dataset rendered
# with override_cam_from_mesh whose extras carry orbit_target /
# anchor_position / focal_length_mm / original_focal_length, with a warped
# reference photo injected at the anchor frame (VACE mask 0.0) among renders
# (VACE mask 1.0). cyber_6f/initial IS that dataset; here the workflow builds
# it from one image.
#
# FROM denoise_pass1 ON — identical to fast_helical_full.yaml, step for step,
# id for id. The three fast_helical files are maintained as copies (there is
# no include mechanism); keep this tail in sync with fast_helical_full.yaml.
# tests/test_workflows.py checks it has not drifted.
#
# STATUS: never executed end-to-end, and the least proven of the three.
# render's rasterization and generate_firstlast's warp have never run on real
# hardware (their module docstrings); everything from denoise_pass1 on
# carries fast_helical_full's own status. Treat this as the thing to debug on
# a GPU pod, not a working recipe.
#
# Stage 6 produces the run's deliverables under output_root, exactly as
# fast_helical_full does:
#
#   colmap/   cameras.txt + images.txt + points3D.txt, images/, normals/
#   ply/      scene.ply — a second brush training, normal-supervised
#
# Either can be switched off with the export_colmap / export_ply globals; the
# web UI's Outputs checkboxes are exactly those two.
#
# The input is not a photo of the subject: it is the two-panel sheet a
# diffusion model generates, subject facing front on the left and seen from
# behind on the right. split_sheet cuts it down the middle — the front half
# feeds the mesh and the anchor warp, the back half becomes
# dataset.reference_image, the one view wan22_vace_denoise conditions on.
# cyber_6f's recorded reference.png is the whole sheet — the older
# convention, from before anchor injection; not the target here.
#
# **Reading this file.** `globals:` holds only what more than one step has to
# agree on — `resolution`, plus the two Outputs switches and `output_root`.
# Everything else lives under the step that consumes it, as an override on
# the default that step's own class declares (pipeline/step.py's
# `Step.PARAMS`). `python -m pipeline.cli params fast_helical_native --all`
# prints the effective value of every param, defaults included.
name: fast_helical_native
description: >-
  From a front/back reference sheet: split it, reconstruct a body, render its
  own anchored views, then run fast_helical_full's six-stage pipeline over
  that dataset — denoise, train+re-render a splat, mask, denoise again,
  upscale, export a COLMAP dataset and/or a normal-supervised .ply.

globals:
  # The only value more than one step must agree on: [720, 1280] is the
  # render size, wan22_vace_denoise's width/height, and render_splat's. The
  # `render` step takes it whole as `resolution: ${globals.resolution}` and
  # has no width/height override of its own, so that stage cannot drift;
  # denoise and render_splat still split it via `.0`/`.1`. (2026-08-25: this
  # file inherited [512, 512] from an earlier draft.) diffusion_steps / cfg
  # / seed / the brush count / the denoise prompts used to sit here too;
  # they are parameters of the steps that read them and now live under those
  # steps, matching fast_helical_full.yaml.
  resolution: [720, 1280]

  # Which deliverables stage 6 produces. Both default on; the web UI drives
  # them from its Outputs checkboxes, and `--param export_ply=false` does
  # the same from the CLI. Turning one off skips its steps entirely (see
  # `when:` in pipeline/workflow.py) — which for export_ply means not
  # starting a second 30,000-iteration brush training you were going to
  # throw away. Workflow-level toggles, not step params, so they stay here.
  export_colmap: true
  export_ply: true

  # Every path this workflow writes to disk hangs off this one global, and
  # `pipeline.cli run` repoints it at the run's own directory under
  # B2C_OUTPUT_DIR (i.e. the mounted volume) unless you pass
  # `--param output_root=...`. The literal below is only what you get from
  # a bare `WorkflowRunner` with no CLI: relative to the working directory,
  # which on a pod is the container's writable layer — small, and gone when
  # the pod is recycled. Templated into a dozen step params, so it stays a
  # global too.
  output_root: output/fast_helical_native

steps:
  # ================================================================ bootstrap
  # Build the dataset fast_helical_full expects as its input. Everything from
  # `denoise_pass1` on is a verbatim copy of fast_helical_full.yaml.

  # The input is the two-panel front/back sheet, not a photo of the subject.
  # Nothing downstream wants both panels, and the two halves go to opposite
  # places (steps/reference_sheet.py):
  #
  #   front -> scene.front_image        sam3d_body / generate_firstlast
  #   back  -> dataset.reference_image  wan22_vace_denoise's reference_image
  #
  # Writing the back half over dataset.reference_image is deliberate: with the
  # anchor injected, the front already reaches the diffusion pass as a real
  # photograph at the anchor frame, so the reference slot is spent on the one
  # view nothing else in the batch can supply. (cyber_6f's recorded
  # reference.png is the whole sheet — the older convention, from before
  # anchor injection. Don't take it as the target.)
  - id: split_sheet
    step: split_reference_sheet
    dispatch: in_process
    inputs:
      sheet: dataset.reference_image
    params:
      front_side: left
    outputs:
      front: scene.front_image
      back: dataset.reference_image

  - id: reconstruct_body
    step: sam3d_body
    dispatch: subprocess
    env: sam3dbody
    inputs:
      image: scene.front_image
    outputs:
      vertices: scene.vertices
      faces: scene.faces
      joints: scene.joints
      keypoints_3d: scene.keypoints_3d
      global_rots: scene.global_rots
      cam_t: scene.cam_t
      focal_length: scene.focal_length
      bbox: scene.bbox

  # MediaPipe face landmarks off the front half of the sheet, for the face
  # overlay render.py draws on the skeleton (steps/face_landmarks.py). The
  # SAM-3D-Body rig render.py consumes has no facial detail past a few head
  # joints, so without this the initial render — and the diffusion pass it
  # conditions — gets a bare body skeleton with no eyes/nose/mouth. CPU,
  # ~10 MB of model files fetched to the volume on first use. Raises if it
  # finds no face, which for a front/back sheet should not happen; the
  # two-stage detect-crop-retry in that step is there because the face is a
  # small part of a full-body frame.
  - id: detect_face
    step: detect_face_landmarks
    dispatch: in_process
    inputs:
      image: scene.front_image
    outputs:
      face_landmarks: scene.face_landmarks

  # render's mesh_output wants a dict with vertices/cam_t/faces/
  # keypoints_3d/focal_length (see render.py's module docstring on why
  # keypoints_3d specifically, not joints) — reconstruct_body's outputs
  # above already assembled exactly that dict at the "scene" namespace
  # (plus a few extra keys render.py ignores), so it's passed straight
  # through with no reshaping.
  #
  # override_cam_from_mesh: true is what makes this the *initial* render —
  # it anchors one frame exactly at the original SAM-3D-Body camera and
  # publishes the orbit_target/anchor_position/original_focal_length/
  # image_warp extras that reinject_anchor_initial and rerender_splat
  # both key off (see splat.py's override_cam_from_mesh path). Without it
  # this would be a normal auto-oriented render with no anchor to warp the
  # reference photo onto.
  - id: render_initial_views
    step: render
    dispatch: in_process
    inputs:
      mesh_output: scene
      # detect_face's output, drawn on the skeleton overlay (face_mode
      # defaults to "full"). Without this input render.py sets face_mode to
      # None and the overlay is skipped entirely — a body skeleton with no
      # face, which is what "just the skeleton and outline" looks like.
      face_landmarks: scene.face_landmarks
    params:
      pattern: circular
      n_frames: 81
      resolution: ${globals.resolution}
      override_cam_from_mesh: true
      # Flat silhouette base + the usual skeleton overlay. The base layer's
      # background is always #7F7F7F (render.py forces it, `bg_color` below
      # does not reach it), and `outline_strength` sets how dark the fill
      # is — left at its default, which lands the fill on #6F6F6F, just
      # off the ground.
      render_mode: outline+skeleton
      # Mid grey, not the step's default white. This does NOT change the
      # rendered background — neither `outline+skeleton`'s flat #7F7F7F base
      # nor `render_depth` takes bg_color — it changes the ONE other thing
      # render.py spends this param on: it publishes it as
      # `image_warp["bg_color"]` (render.py's `if image_warp is not None`
      # block), which is where warp_reference_to_anchor below gets the
      # border colour it fills around the warped reference photo.
      #
      # 0.5 rather than a literal 127/255, because the recorded run shows
      # both roundings and 0.5 is what produces them: the renderer does
      # `int(bg*255)` = 127 and generate_firstlast does `round(bg*255)` =
      # 128. cyber2_6f/initial has mesh frames at 127 and an anchor.png at
      # 128 — the same 0.5 down two code paths, which is the evidence that
      # 0.5 is the value the reference pipeline used. It also matches the
      # #7F7F7F the outline base grounds on, so the anchor border and the
      # render backgrounds agree.
      #
      # White is the value that cannot be right: the anchor frame reaches
      # denoise_pass2 sitting among grey renders, and a white border is the
      # largest possible disagreement with them.
      bg_color: [0.5, 0.5, 0.5]
    outputs:
      images: dataset.images
      masks: dataset.masks
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      resolution: dataset.resolution
      focal_length_mm: dataset.extras.focal_length_mm
      orbit_target: dataset.extras.orbit_target
      forward_azimuth_deg: dataset.extras.forward_azimuth_deg
      anchor_position: dataset.extras.anchor_position
      anchor_frame_index: dataset.extras.anchor_frame_index
      original_focal_length: dataset.extras.original_focal_length
      framing_bounds: dataset.extras.framing_bounds
      initial_rotation: dataset.extras.initial_rotation
      image_warp: scene.image_warp

  # Put the real reference photo, warped to the anchor camera's framing,
  # onto the render at that frame — this is what makes cyber_6f/initial's
  # anchor frame byte-identical to anchor.png rather than a mesh render of
  # it (see pipeline/README.md's inject_anchor verification note).
  # scene.image_warp's keys (camera/original_focal_length/render_size/
  # bg_color) are render_initial_views' own image_warp output, unpacked —
  # see anchor_stub.py's GenerateFirstLastStep for why those specific
  # fields.
  - id: warp_reference_to_anchor
    step: generate_firstlast
    dispatch: in_process
    inputs:
      image: scene.front_image
      camera: scene.image_warp.camera
      original_focal_length: scene.image_warp.original_focal_length
      render_size: scene.image_warp.render_size
      bg_color: scene.image_warp.bg_color
    outputs:
      warped_image: dataset.anchor_image

  # The initial anchor injection — the pre-denoise one. This is what
  # cyber_6f/initial already has baked in when fast_helical_full is handed
  # it: the warped photo overwrites every frame sitting at the anchor
  # camera, and the VACE mask there becomes 0.0 ("a real photograph, keep
  # it") against 1.0 for every synthetic render. `reinject_anchor` in
  # stage 3 does it again after the helical re-render + mask_splat.
  - id: reinject_anchor_initial
    step: inject_anchor
    dispatch: in_process
    inputs:
      images: dataset.images
      cameras: dataset.cameras
      anchor_position: dataset.extras.anchor_position
      anchor_image: dataset.anchor_image
    # No `masks` input: the batch this writes is manufactured by the step,
    # and it is wan22_vace_denoise's per-frame VACE mask — 1.0 "synthetic,
    # denoise it" for the renders, 0.0 "a real photo, keep it" at the
    # injected anchor. See steps/anchor_stub.py.
    outputs:
      images: dataset.images
      masks: dataset.masks

  # ================================================================
  # From here down: a verbatim copy of fast_helical_full.yaml's steps. Keep
  # the two in sync — tests/test_workflows.py checks they have not drifted.
  # ================================================================

  # ---------------------------------------------------------------- stage 1
  # denoise.json: initial -> circular, strength 1.0.
  # dataset.masks here is the per-frame reference/denoise flag baked into
  # the loaded frames' alpha — NOT a foreground mask. See
  # steps/wan22_vace_denoise.py's docstring.
  #
  # No checkpoint params here on purpose: the step defaults to the
  # pre-quantized fp8 experts (silveroxides/Wan_2.2-fp8_scaled_hybrid) and
  # has no bf16 path left to fall back to. Override fp8_checkpoint_high /
  # fp8_checkpoint_low (both `advanced`) only to point at local files.
  - id: denoise_pass1
    step: wan22_vace_denoise
    dispatch: subprocess
    env: wan22
    # Hold the pipeline resident between the two passes: one worker process
    # serves both, so the ~47 GB of weights come off the network volume
    # once per run instead of twice. The worker calls the step's
    # release_vram() after every job, so brush (which trains on the GPU
    # between these two steps) still finds an empty card — the weights wait
    # in host RAM, not VRAM. Both passes must declare this; it is what
    # makes them share one worker.
    keep_loaded: true
    inputs:
      control_video: dataset.images
      control_masks: dataset.masks
      reference_image: dataset.reference_image
      subject_desc: dataset.prompt
    params:
      width: ${globals.resolution.0}
      height: ${globals.resolution.1}
      # From the ComfyUI graph (workflows/api/denoise.json): 6 steps, cfg
      # 1.0, seed 0. These happen to equal the step's own declared defaults;
      # spelled out anyway so the two passes read identically and every knob
      # a run tunes is visible in the step's params block.
      steps: 6
      cfg: 1.0
      seed: 0
      # The one value the two passes disagree on: pass 1 denoises the
      # circular render from scratch, pass 2 (strength 0.8) cleans up the
      # helical re-render.
      strength: 1.0
      # Exact strings from the live ComfyUI graph (denoise.json nodes
      # 6/7/188); $SUBJECT_DESC$ is filled in from dataset.prompt. Double-
      # quoted with `\`-escaped line breaks, NOT YAML's folded `>-`: a
      # folded scalar turns every line break into a space, which inside the
      # Chinese runs silently corrupts the string. tests/test_workflows.py
      # pins both, character for character, against every wan22_vace_denoise
      # step in every workflow. denoise_pass2 carries the same two strings —
      # a step param cannot reference another step's, so they are repeated.
      prompt: "时间静止，人物完全静止。身体如雕塑般僵硬，胸口没有起伏，头部保持固定\
        角度，面部肌肉完全不动，维持单一的中性表情。双眼一眨不眨，眼睑保持张\
        开且稳定，目光空洞而固定，锁定远处墙面上的一个点，对镜头毫无察觉、毫\
        无反应。镜头以匀速、固定焦距围绕主体平滑移动。 Time is frozen and only \
        the camera moves. The gaze stays anchored to that point on the wall \
        as the camera passes, so the eyes slide across the frame, always aimed \
        past the lens at the wall behind it. Eyelids stay open and steady, the \
        expression holds without a single micro-movement, and the head keeps \
        its exact angle throughout. The frozen subject is $SUBJECT_DESC$, lit \
        by even soft studio light against a plain seamless backdrop, photorealistic, \
        sharp focus, identical face and clothing in every frame."
      negative_prompt: "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静\
        止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的\
        手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体\
        ，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走, \
        chewing, tattoos, 眼球运动，眨眼，眼动追踪，微表情，面部抽动，头部移\
        动, 小头, 小脸"
    outputs:
      images: dataset.images

  # ---------------------------------------------------------------- stage 2
  # resplat_helical.json: train a splat on the denoised views, then
  # re-render it along a new, longer helical orbit.

  # Foreground alpha for brush's --alpha-mode transparent. Distinct from
  # the denoise control mask above, which this overwrites: past this point
  # the reference/denoise flag is no longer needed.
  - id: foreground_masks
    step: rmbg
    dispatch: in_process
    inputs:
      images: dataset.images
    outputs:
      masks: dataset.masks

  - id: normal_maps
    step: sapiens2_lite
    dispatch: in_process
    inputs:
      images: dataset.images
    outputs:
      normal_maps: scene.normal_maps

  - id: train_splat
    step: brush
    dispatch: in_process
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      normal_maps: scene.normal_maps
    params:
      # The expensive knob: brush trains twice in this pipeline (here and
      # train_final_splat) at roughly an hour of GPU each. 30000 equals
      # steps/brush.py's own default; spelled out because it is the one
      # brush setting worth seeing at a glance, and the two trainings could
      # be given different counts here. Everything else brush takes —
      # sh_degree, max_splats, refine_every, the normal-loss group — sits at
      # that step's declared defaults.
      total_steps: 30000
      # Without this brush exports into tempfile.gettempdir() (see
      # steps/brush.py) — the trained .ply then only survives because
      # Dataset.to_disk copies it at the very end. `output_dir` rather than
      # `export_dir` because this is an intermediate: it lands under
      # <output_root>/brush/training_<ms>/, which cannot collide with the
      # second training below.
      output_dir: ${globals.output_root}
    outputs:
      splat_path: dataset.splat_path

  - id: load_trained_splat
    step: load_splat
    dispatch: in_process
    inputs:
      splat_path: dataset.splat_path
    outputs:
      splat_scene: scene.splat

  # The ComfyUI node leaves override_cam_from_mesh off here: this is a
  # fresh, longer orbit framed from the splat's own bounds (fill_ratio 0.8,
  # focal length inherited from the dataset), not an anchored one. The
  # anchor is re-applied by inject_anchor below, matching on position. Both
  # of those are steps/splat.py's declared defaults, so this block only has
  # to say what the helical path itself is.
  - id: rerender_splat
    step: render_splat
    dispatch: in_process
    inputs:
      splat_scene: scene.splat
      dataset: dataset
    params:
      width: ${globals.resolution.0}
      height: ${globals.resolution.1}
      pattern: helical
      n_frames: 81
      n_loops: 2
      amplitude_deg: 30.0
      # 30/90, not the 45/45 the solver defaults to — the values
      # resplat_helical.json's Body2COLMAP_HelicalPath node carries.
      lead_in_deg: 30.0
      lead_out_deg: 90.0
    outputs:
      images: dataset.images
      masks: dataset.masks
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d

  # ---------------------------------------------------------------- stage 3
  # mask_splat.json: drop the splat's low-confidence fringes. 6/2 is from
  # `fast helical.yaml`'s own step config, and is also steps/mask_splat.py's
  # default — spelled out here because it is the number that distinguishes
  # this pipeline from the `helical` (12/4) and `tiered` (4/0) ones.
  - id: mask_splat_fringes
    step: mask_splat
    dispatch: in_process
    inputs:
      dataset: dataset
    params:
      filter_size: 6
      dilation: 2
    outputs:
      dataset: dataset

  # Put the warped reference photo back onto whichever new frames landed on
  # the original camera. Matches by position, so it survives the reorbit.
  #
  # AFTER mask_splat, not before it — the ordering is load-bearing and was
  # wrong. Before mask_splat this step sits where dataset.masks is carrying
  # rerender_splat's per-pixel splat alpha, and it would overwrite exactly
  # the input mask_splat exists to threshold. Here it only ever sees VACE
  # masks: mask_splat has already consumed the alpha and emitted all-1.0.
  #
  # This reproduces cyber2_6f/masked_splatted frame for frame: 80 frames
  # masked and filtered at alpha 255, and frame_00038_ the anchor.png
  # verbatim — not composited over black, not bilateral-filtered — at
  # alpha 0.
  - id: reinject_anchor
    step: inject_anchor
    dispatch: in_process
    inputs:
      images: dataset.images
      cameras: dataset.cameras
      anchor_position: dataset.extras.anchor_position
      anchor_image: dataset.anchor_image
      # mask_splat's all-1.0 batch, passed through with 0.0 written at the
      # anchor frame. Manufacturing it here instead would give the same
      # values today; wiring it keeps the step from silently destroying a
      # mask that matters if anything is ever inserted above it.
      masks: dataset.masks
    outputs:
      images: dataset.images
      masks: dataset.masks

  # ---------------------------------------------------------------- stage 4
  # denoise.json again, strength 0.8 — clean up the re-render.
  - id: denoise_pass2
    step: wan22_vace_denoise
    dispatch: subprocess
    env: wan22
    # See denoise_pass1: both passes must declare keep_loaded for the two of
    # them to share one resident worker.
    keep_loaded: true
    inputs:
      control_video: dataset.images
      control_masks: dataset.masks
      reference_image: dataset.reference_image
      subject_desc: dataset.prompt
    params:
      width: ${globals.resolution.0}
      height: ${globals.resolution.1}
      # Same as denoise_pass1 — see the note there. Only `strength` differs.
      steps: 6
      cfg: 1.0
      seed: 0
      strength: 0.8
      prompt: "时间静止，人物完全静止。身体如雕塑般僵硬，胸口没有起伏，头部保持固定\
        角度，面部肌肉完全不动，维持单一的中性表情。双眼一眨不眨，眼睑保持张\
        开且稳定，目光空洞而固定，锁定远处墙面上的一个点，对镜头毫无察觉、毫\
        无反应。镜头以匀速、固定焦距围绕主体平滑移动。 Time is frozen and only \
        the camera moves. The gaze stays anchored to that point on the wall \
        as the camera passes, so the eyes slide across the frame, always aimed \
        past the lens at the wall behind it. Eyelids stay open and steady, the \
        expression holds without a single micro-movement, and the head keeps \
        its exact angle throughout. The frozen subject is $SUBJECT_DESC$, lit \
        by even soft studio light against a plain seamless backdrop, photorealistic, \
        sharp focus, identical face and clothing in every frame."
      negative_prompt: "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静\
        止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的\
        手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体\
        ，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走, \
        chewing, tattoos, 眼球运动，眨眼，眼动追踪，微表情，面部抽动，头部移\
        动, 小头, 小脸"
    outputs:
      images: dataset.images

  # ---------------------------------------------------------------- stage 5
  # upscale.json
  - id: upscale
    step: seedvr2
    dispatch: subprocess
    env: seedvr2
    inputs:
      images: dataset.images
    params:
      # SeedVR2's `resolution` is the target output *shortest edge*, not a
      # multiplier — asking for less than the input's shortest edge
      # downscales. See steps/seedvr2.py.
      #
      # 1080, not the 1440 this was: the frames feed a Gaussian splat, and a
      # splat does not resolve detail the way a video does — past roughly
      # the native render size the extra pixels mostly buy training time and
      # VRAM. 720x1280 in, 1080x1920 out, which is also what the recorded
      # ComfyUI-era upscale produced (cyber_6f/upscaled).
      resolution: 1080
      # steps/seedvr2.py defaults this to 5; 1 is this workflow's own
      # choice — raise it once a real VRAM budget for the upscale is known.
      batch_size: 1
      vae_encode_tiled: true
      vae_decode_tiled: true
    outputs:
      images: dataset.images

  # seedvr2 resamples the frames and cannot return cameras — it runs in its
  # own venv, and that IPC boundary carries plain arrays, not Camera
  # objects. So without this step the dataset now holds 1080x1920 images
  # described by 720x1280 intrinsics, and both stage-6 consumers believe
  # the wrong focal length: cameras.txt would claim a 720x1280 PINHOLE
  # camera, and brush would fit a splat at half the focal length the images
  # were rendered with. The recorded ComfyUI-era export has exactly this
  # mismatch (cyber_6f/colmap: 720x1280 intrinsics, 1080x1920 frames), so
  # this is an inherited bug, not a new one — and a prime suspect for
  # output that looks *almost* right.
  #
  # Delete this step (or run fast_helical.yaml, which has no upscale at
  # all) to reproduce the old behaviour for comparison. It is a no-op on
  # a dataset whose frames already match its cameras.
  - id: rescale_cameras
    step: fit_cameras_to_images
    dispatch: in_process
    inputs:
      dataset: dataset
    outputs:
      dataset: dataset

  # ---------------------------------------------------------------- stage 6
  # colmap.json: background-remove, re-estimate normals against the frames
  # as they finally are, then emit whichever deliverables were selected.
  - id: export_masks
    step: rmbg
    dispatch: in_process
    inputs:
      images: dataset.images
    outputs:
      masks: dataset.masks

  # NOT the stage-2 normal maps (scene.normal_maps): those describe the
  # pre-re-render frames, which rerender_splat replaced wholesale with a
  # different, longer orbit — a different count, different poses, and after
  # the upscale a different resolution. Both deliverables below want
  # normals for *these* frames, so they are estimated again here.
  - id: export_normals
    step: sapiens2_lite
    dispatch: in_process
    inputs:
      images: dataset.images
    params:
      # Smaller than the step's default of 8: at the upscaled resolution
      # these are 1080x1920 float32 maps, and the returned list alone is
      # ~2 GB of host RAM.
      batch_size: 4
    outputs:
      normal_maps: scene.export_normal_maps

  # Deliverable 1: a COLMAP dataset. `layout: brush` puts the frames in
  # images/ and the normals in normals/ beside the three .txt files —
  # what brush itself reads, and what somebody handed this directory
  # expects, rather than the flat frames-beside-the-txt layout the ComfyUI
  # colmap.json stage wrote.
  - id: export_colmap
    step: colmap_export
    dispatch: in_process
    when: ${globals.export_colmap}
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      normal_maps: scene.export_normal_maps
    params:
      output_dir: ${globals.output_root}/colmap
      layout: brush

  # Deliverable 2: a trained splat, normal-supervised. This is a second
  # full brush training — the stage-2 one exists to drive the helical
  # re-render and predates the second denoise pass and the upscale, so it
  # is not the splat anyone wants to keep. `export_dir` puts this one at a
  # predictable path instead of brush/training_<ms>/, which is the whole
  # reason the final splat can be `ply/scene.ply`.
  - id: train_final_splat
    step: brush
    dispatch: in_process
    when: ${globals.export_ply}
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      normal_maps: scene.export_normal_maps
    params:
      # See train_splat's note. Same count; a run tuning the deliverable
      # splat alone changes it here.
      total_steps: 30000
      export_dir: ${globals.output_root}/ply
      export_name: scene.ply
    outputs:
      # Overwrites the stage-2 intermediate, so Dataset.to_disk's splat.ply
      # and the CLI's closing "splat:" line both name the final one.
      splat_path: dataset.splat_path
