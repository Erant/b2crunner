# The from-a-sheet path: build the initial multi-view dataset from one
# front/back reference sheet, then run fast_helical_full's pipeline over it.
#
# BOOTSTRAP (this file only) — split_sheet -> reconstruct_body ->
# detect_face -> front_matte -> front_normals -> shell_splat -> refine_pose
# -> render_initial_views -> render_shell_views -> inject_shell_band.
# This is the part fast_helical_full is handed ready-made: a dataset whose
# extras carry orbit_target / focal_length_mm / framing_bounds, whose frames
# near the source view are photoreal (VACE mask 0.0, "keep it") among
# skeleton renders (VACE mask 1.0). cyber_6f/initial is the older shape of
# that same thing — a warped photograph injected at one anchored frame —
# and this file no longer builds it that way; see below.
#
# WHAT CHANGED (2026-08-29): this bootstrap used to be five steps — split,
# reconstruct, detect_face, fix_head_angle, render a *circular* orbit of
# outline+skeleton drawings — and it is now routed through a photo-to-splat
# shell. Three differences, and they change what the first diffusion pass is
# asked to do:
#
#   1. `pointmap_splat` turns the sheet's front half into a Gaussian shell
#      standing in the mesh's own world (one forward pass, no training),
#      `render_splat` re-renders that shell along the SAME 81 cameras as the
#      mesh render, and `inject_shell_views` swaps its renders in wherever
#      the camera is within 15 degrees of where the photo was taken from.
#      Those frames stop
#      being flat two-tone drawings of a naked body model and become
#      photoreal novel views of the actual subject. Outside that band the
#      shell knows nothing — it is a 2.5-D shell of the side the photo saw —
#      and the mesh render stays.
#   2. The path is a shallow 380-degree HELIX (10 deg of lead-in + 360 + 10
#      of lead-out, elevation ramping -10 -> +10) rather than a closed
#      circle. 81 views of one great circle have essentially no parallax,
#      which is the worst possible input to the splat trainer two stages
#      later; the helix gives brush something to triangulate.
#   3. `refine_pose_to_splat` re-poses the body fit so its mesh agrees with
#      the shell in novel views — which is what stops the rendered skeleton
#      sliding off the subject a few degrees either side of the source view,
#      the hands worst, since a monocular fit cannot see how far away they
#      are.
#
# **The anchor injection is gone with it** (2026-08-29, at the user's call),
# because `inject_shell_views` is the same operation done better.
# `generate_firstlast` + `inject_anchor` put content from the reference
# photograph onto the ONE frame sitting exactly at the source camera, by
# warping the photo onto it, and marked that frame "keep it". The shell does
# it for the whole band the shell can speak for, by rendering — and at the
# source camera the two agree to a best-fit shift of (1, 0) px, because the
# shell reprojects onto the photo it was built from. So `render` no longer
# bends the path to land a camera exactly there (`override_cam_from_mesh:
# false`), nothing warps the photo, and the frames the band marks 0.0 are
# the batch's real-photograph frames. The stage-3 `inject_anchor` in the
# shared tail stays where it is and quietly no-ops for want of an anchor
# image — the price of keeping that tail a verbatim copy.
#
# **`fix_head_angle` is gone from this file as part of that**, not by
# oversight: it and `refine_pose_to_splat` cannot both run (see
# INCOMPATIBLE_STEPS in pipeline/workflow.py — the head fix rewrites the
# mesh without updating the MHR pose parameters, and refine regenerates the
# mesh *from* those parameters, so the nod would be silently discarded).
# The step still exists and is still registered; putting the old bootstrap
# back means deleting `refine_pose` here and pasting `fix_head_angle` in
# between `detect_face` and the shell steps. Note what that costs: measured,
# re-posing does NOT straighten the craned head by itself — the shell
# inherited the same craned head from the same photograph.
#
# The two numbers to read out of a run before believing the shell:
# `splat_stats.focal_ratio_sam3d_over_pointmap` (near 1 means the two
# monocular estimates of this lens agree) and
# `splat_stats.normal_agreement_deg.after_median` (~6 deg at ratio 1, 12.5
# at 1.6). A ratio near 1.6 means the shell is stretched in depth and the
# substituted frames will look over-rotated. See steps/pointmap_splat.py.
#
# FROM denoise_pass1 ON — identical to fast_helical_full.yaml, step for step,
# id for id. The two files are maintained as copies (there is no include
# mechanism); keep this tail in sync with fast_helical_full.yaml.
# tests/test_workflows.py checks it has not drifted.
#
# STATUS: never executed end-to-end, and the least proven of the two.
# render's rasterization and generate_firstlast's warp have never run on real
# hardware (their module docstrings); the shell half has run once, locally,
# outside the workflow machinery (output/smoke_shell_helical/ — 81-frame
# helix, shell, splat re-render, band substitution, ~25 s on a 4070 Ti; the
# anchor gate passed at a best-fit shift of (1, 0) px and novel views held to
# about +-19 deg), and no diffusion pass has ever been conditioned on a batch
# it produced. Everything from denoise_pass1 on carries fast_helical_full's
# own status. Treat this as the thing to debug on a GPU pod, not a working
# recipe.
#
# Stage 6 produces the run's deliverables under output_root, exactly as
# fast_helical_full does:
#
#   colmap/              cameras.txt + images.txt + points3D.txt, images/, normals/
#   ply/                 scene.ply — a second brush training, normal-supervised
#   colmap_preupscale/   debug: a COLMAP dataset from the pre-upscale frames
#
# plus one intermediate this file writes on the way through:
#
#   shell/shell.ply      the photo-derived Gaussian shell, ~0.5 M splats
#
# export_colmap / export_ply switch the first two off; export_colmap_preupscale
# (with run_upscale on) opts into the third. The web UI's Outputs box drives
# all of them plus the "Upscale dataset" toggle. Same as fast_helical_full.yaml.
#
# The input is not a photo of the subject: it is the two-panel sheet a
# diffusion model generates, subject facing front on the left and seen from
# behind on the right. split_sheet cuts it down the middle — the front half
# feeds the mesh and the shell, the back half becomes
# dataset.reference_image, the one view wan22_vace_denoise conditions on.
# cyber_6f's recorded reference.png is the whole sheet — the older
# convention, from before anchor injection; not the target here.
#
# **Reading this file.** `globals:` holds only what more than one step has to
# agree on — `resolution` and `framing`, plus the deliverable switches
# (export_colmap / export_ply / export_colmap_preupscale), the `run_upscale`
# toggle, and `output_root`.
# Everything else lives under the step that consumes it, as an override on
# the default that step's own class declares (pipeline/step.py's
# `Step.PARAMS`). `python -m pipeline.cli params fast_helical_native --all`
# prints the effective value of every param, defaults included.
name: fast_helical_native
description: >-
  From a front/back reference sheet: split it, reconstruct a body, build a
  Gaussian shell from the front half, re-pose the body to agree with it,
  render a shallow 380-degree helix with the frames near the source view
  taken from that shell, then run fast_helical_full's six-stage pipeline over the
  result — denoise, train+re-render a splat, mask, denoise again, upscale,
  export a COLMAP dataset and/or a normal-supervised .ply.

globals:
  # The one value more than one step must agree on: [720, 1280] is the
  # render size, the shell re-render's size, wan22_vace_denoise's
  # width/height and the stage-2 splat re-render's. The `render` step takes
  # it whole as `resolution: ${globals.resolution}` and has no width/height
  # override of its own, so that stage cannot drift; denoise and the two
  # render_splat calls still split it via `.0`/`.1`. A batch whose frames
  # are not all one size cannot reach the diffusion pass at all.
  resolution: [720, 1280]

  # How much of the body fills the frame, threaded through both renderers
  # that have to agree on it — the mesh `render` (render_initial_views) and
  # the stage-2 splat re-render (rerender_splat), which rebuilds its helical
  # orbit and has to rebuild it around the same preset. `render_shell_views`
  # needs no `framing` of its own: it reuses the mesh render's cameras
  # verbatim, so it inherits the framing rather than recomputing it. Split
  # between step params this would drift; as one global it cannot. `full`
  # is the whole body (the shipped default and what every prior run used);
  # torso / bust / head crop progressively tighter, and only the mesh
  # reconstruction's skeleton makes the tighter presets available —
  # `render` falls back to `full` for any it cannot compute, and
  # rerender_splat follows.
  framing: full

  # Which deliverables stage 6 produces; both default on. Same switches,
  # same `when:` gating and same web-UI meaning as the other two files.
  export_colmap: true
  export_ply: true

  # Whether the SeedVR2 upscale (stage 5) runs, with `rescale_cameras`
  # behind it to repair the intrinsics it invalidates. Same toggle and
  # default as the other two files — keep them in sync.
  run_upscale: true

  # Debug: also export the COLMAP dataset that the FIRST brush training is
  # handed — the denoised frames plus the mattes and normals computed for
  # it, before that splat is re-rendered along the helical orbit and
  # denoised a second time. Off by default. Lands in
  # <output_root>/colmap_intermediate/. The web UI drives it from the
  # Outputs box; `--param export_colmap_intermediate=true` does the same
  # from the CLI.
  export_colmap_intermediate: false

  # Debug: also export a COLMAP dataset built from the pre-upscale frames
  # (stage 4b). Only meaningful with run_upscale: true. Off by default.
  export_colmap_preupscale: false

  # Every path this workflow writes hangs off this one global, and
  # `pipeline.cli run` repoints it at the run's own directory under
  # B2C_OUTPUT_DIR unless you pass `--param output_root=...`.
  output_root: output/fast_helical_native

steps:
  # ================================================================ bootstrap
  # Build the dataset fast_helical_full expects as its input — but through
  # the shell. Everything from `denoise_pass1` on is a verbatim copy of
  # fast_helical_full.yaml.

  # The front half feeds sam3d_body and the shell; the back half becomes
  # the VACE reference image, the one view nothing else in the batch can
  # supply. Writing the back half over dataset.reference_image is
  # deliberate: the front already reaches the diffusion pass as photographic
  # content, on the band of frames the shell renders.
  - id: split_sheet
    step: split_reference_sheet
    dispatch: in_process
    inputs:
      sheet: dataset.reference_image
    params:
      front_side: left
    outputs:
      front: scene.front_image
      back: dataset.reference_image

  # One extra output against fast_helical_native's copy of this step:
  # `pose_params`. refine_pose_to_splat replays the MHR body model's
  # forward with those as the free variables, and publishing them here is
  # what saves it from re-running a 2.8 GB inference pass of its own.
  - id: reconstruct_body
    step: sam3d_body
    dispatch: subprocess
    env: sam3dbody
    inputs:
      image: scene.front_image
    outputs:
      vertices: scene.vertices
      faces: scene.faces
      joints: scene.joints
      keypoints_3d: scene.keypoints_3d
      global_rots: scene.global_rots
      cam_t: scene.cam_t
      focal_length: scene.focal_length
      bbox: scene.bbox
      pose_params: scene.pose_params

  # MediaPipe face landmarks off the front half, for the face overlay
  # render.py draws on the skeleton. CPU, ~10 MB. Same as in
  # fast_helical_native — the shell does not replace this: the frames
  # outside the shell's band are still skeleton drawings and still need a
  # face on them.
  - id: detect_face
    step: detect_face_landmarks
    dispatch: in_process
    inputs:
      image: scene.front_image
    outputs:
      face_landmarks: scene.face_landmarks

  # ---------------------------------------------------------- the shell
  # Three feeds, all of them the SAME photograph — the sheet's front half,
  # which is also what sam3d_body was fitted to. A shell built from any
  # other image would not land on the mesh's rays.

  # RMBG-2.0's soft matte, which is the shell's silhouette alpha. Not the
  # Sapiens2 segmentation head: on whole-body inputs RMBG is the better
  # matte, it is already in this pipeline, and its softness is exactly what
  # the alpha wants. Distinct from stage 2's `foreground_masks`, which
  # mattes the whole denoised batch for brush.
  - id: front_matte
    step: rmbg
    dispatch: in_process
    inputs:
      image: scene.front_image
    outputs:
      mask: scene.front_matte

  # Surface normals for the same photo. These carry the relief: the depth
  # the shell is built on is *integrated* from them, with the pointmap only
  # pinning the low frequencies. Left at the step's own checkpoint default
  # (the 1b normal head), which is what every measurement behind this file
  # was taken with.
  - id: front_normals
    step: sapiens2_lite
    dispatch: in_process
    inputs:
      image: scene.front_image
    outputs:
      normal_map: scene.front_normals

  # The shell itself: Sapiens2's pointmap head over the photo, depth
  # re-solved from the normals above in SAM-3D-Body's own camera, one
  # oriented Gaussian per foreground pixel, scaled onto the mesh's front
  # surface. ~0.5 M splats, a few seconds on a 4070 Ti.
  #
  # `mesh_output: scene` is the same pass-through render_initial_views
  # does: reconstruct_body's outputs already assembled the dict this step
  # wants (vertices / cam_t / focal_length) at the `scene` namespace.
  #
  # Every param left at its declared default deliberately — including
  # `depth_prior: pointmap`. The `mesh` alternative removes the
  # shell-vs-skeleton depth disagreement by construction (it makes the
  # shell copy the mesh, so of course the mesh then agrees) at the cost of
  # a worse independent normal-agreement metric and visibly deformed
  # fingers. Re-posing the body, below, is the non-circular answer to the
  # same problem.
  - id: shell_splat
    step: pointmap_splat
    dispatch: in_process
    inputs:
      image: scene.front_image
      mask: scene.front_matte
      normal_map: scene.front_normals
      mesh_output: scene
    params:
      filepath: ${globals.output_root}/shell/shell.ply
    outputs:
      splat_path: scene.shell_splat_path
      splat_stats: scene.shell_splat_stats

  # Re-pose the body so its mesh agrees with the shell in novel views:
  # Adam over body_pose_params / global_rot / cam_t through the MHR model's
  # own differentiable forward, shape and scale FROZEN so bone lengths are
  # preserved by construction, with a 2D reprojection penalty holding the
  # source view's own projection (1.79 px median drift, measured).
  #
  # It writes back over scene.vertices / keypoints_3d / cam_t, so every
  # camera and every render below is built on the re-posed fit — which is
  # the point: the orbit is framed from this mesh at this distance.
  #
  # Note what it is and is not. It fits the mesh to the shell, so a wrong
  # shell is inherited; one photograph cannot say which of the two is
  # right. What the diffusion pass needs is a mesh render and a splat
  # render that AGREE, and the source view — the one place there is ground
  # truth — stays pinned. It is not a claim about the true pose.
  #
  # Runs in the sam3dbody venv, sharing reconstruct_body's env (and so its
  # checkpoint download) but not its dispatcher residency — neither step
  # asks to be kept loaded.
  - id: refine_pose
    step: refine_pose_to_splat
    dispatch: subprocess
    env: sam3dbody
    inputs:
      mesh_output: scene
      splat_path: scene.shell_splat_path
      image: scene.front_image
    outputs:
      vertices: scene.vertices
      keypoints_3d: scene.keypoints_3d
      cam_t: scene.cam_t
      refine_stats: scene.refine_stats

  # ------------------------------------------------------------ the orbit
  # A shallow helix, not the circle this file used to render: 10 deg of
  # lead-in + 360 + 10 of lead-out = 380 degrees of azimuth, with elevation
  # ramping -10 -> +10 across it. The elevation sweep is what a circular
  # path cannot give: 81 views of one great circle have essentially no
  # parallax, and brush has nothing to triangulate from them. +-10 deg is
  # deliberately shallow — the diffusion pass still has to produce a
  # coherent video along it.
  #
  # **override_cam_from_mesh is OFF, which is new.** Its job was to bend the
  # path so one frame landed exactly on the SAM-3D-Body camera, for the
  # anchor injection to overwrite with the warped photo. inject_shell_band
  # below does that job now and does not need an exact landing: it measures
  # a band around where the photo was taken from, and renders the shell into
  # every frame inside it. So the path is left as the plain helix it wants
  # to be, and this step no longer publishes anchor_position /
  # anchor_frame_index / original_focal_length / image_warp — nothing here
  # reads them any more.
  #
  # **The orbit starts at the front** — start_azimuth_deg 0, the step's own
  # default, left explicit here because it is a decision rather than an
  # omission. The sweep therefore opens on the subject's front, turns all
  # the way round, and closes on the front again.
  #
  # That puts the shell's band on the FIRST and LAST frames of the
  # sequence, which is where a video diffusion pass conditions hardest —
  # the photoreal frames land on the two the model holds onto, and the
  # synthetic drawings fill the middle. Measured against the smoke run's own
  # recorded path (81 frames, 15 deg band): 7 frames inside it, 2 at the
  # start and 5 at the end, closest 8.6 deg from the source view.
  #
  # The 8.6 is what unanchoring costs. The helix's elevation ramps -10 at
  # the first frame to +10 at the last and only crosses 0 in the middle, so
  # a path that starts at the front meets the front at +-10 deg of
  # elevation, never at the source view exactly. The old anchored path
  # (override_cam_from_mesh) bent itself to land a camera there — 7
  # contiguous frames, closest 0.0 deg — and that bend existed to give the
  # anchor injection a frame to overwrite. Turning it back on would restore
  # the exact landing without restoring the injection, since nothing here
  # reads the extras it publishes any more; the shallower the amplitude, the
  # less it matters at all.
  - id: render_initial_views
    step: render
    dispatch: in_process
    inputs:
      mesh_output: scene
      face_landmarks: scene.face_landmarks
    params:
      pattern: helical
      n_frames: 81
      resolution: ${globals.resolution}
      framing: ${globals.framing}
      override_cam_from_mesh: false
      # The front. See the note above — this is where the band, and so the
      # batch's photographic content, lands on the first and last frames.
      start_azimuth_deg: 0.0
      # 380 degrees of azimuth in one turn, elevation +-10.
      n_loops: 1
      amplitude_deg: 10.0
      lead_in_deg: 10.0
      lead_out_deg: 10.0
      render_mode: outline+skeleton
      # No bg_color: this mode grounds on a fixed #7F7F7F that the param
      # cannot change, and the one other thing render.py spent it on was
      # image_warp's border colour, which an unanchored render does not
      # publish. #7F7F7F is 0.5, which is what render_shell_views below
      # renders the shell on — so a substituted frame still sits among the
      # drawings with no background discontinuity.
    outputs:
      images: dataset.images
      masks: dataset.masks
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      resolution: dataset.resolution
      focal_length_mm: dataset.extras.focal_length_mm
      orbit_target: dataset.extras.orbit_target
      forward_azimuth_deg: dataset.extras.forward_azimuth_deg
      framing_bounds: dataset.extras.framing_bounds
      initial_rotation: dataset.extras.initial_rotation

  # The shell, along the orbit above. `pattern: ""` (the step's default) is
  # what makes this the same 81 cameras in the same order rather than a
  # fresh path — the property inject_shell_views depends on, and which it
  # re-checks from the cameras themselves.
  #
  # Nothing here is written into `dataset`: this is a parallel batch that
  # only exists to be sampled from. The cameras are published alongside it
  # purely so the next step can prove the two batches line up.
  #
  # It costs a second 81-frame batch of host RAM (~220 MB at 720x1280) held
  # for the rest of the run, since nothing removes a context path once it is
  # written. Cheap against the ~47 GB the denoise passes hold resident, and
  # the alternative — rendering only the frames in the band — would mean
  # building a camera subset the step cannot then match back by index.
  #
  # bg_color is the outline renders' own #7F7F7F, not render_splat's black
  # default. Black is right in stage 2, where mask_splat composites over
  # black immediately afterwards; here the frames land in a batch of grey
  # drawings and go straight to the diffusion pass, so a black frame would
  # be the largest possible disagreement with its neighbours.
  - id: render_shell_views
    step: render_splat
    dispatch: in_process
    inputs:
      splat_path: scene.shell_splat_path
      dataset: dataset
    params:
      pattern: ""
      width: ${globals.resolution.0}
      height: ${globals.resolution.1}
      bg_color: [0.5, 0.5, 0.5]
    outputs:
      images: scene.shell_views.images
      cameras: scene.shell_views.cameras

  # Spend the band, and — since this step supersedes the anchor injection
  # (see below) — decide what the diffusion pass is allowed to keep.
  #
  # Every frame whose camera is within 15 degrees of where the photograph
  # was taken from — measured as an angle on the orbit sphere, so azimuth
  # and elevation count alike — takes the shell's render instead of the mesh
  # drawing. That is about the range the shell was measured to hold up over;
  # novel views degrade past ~19 deg as the missing back half and the
  # grazing-incidence fringes come into view.
  #
  # `reference_radius_deg` equals `replace_radius_deg`, so the whole band is
  # ALSO marked VACE 0.0, "a real photograph, keep it". That is the step
  # taking over inject_anchor's job: with no anchor injection in this file,
  # nothing else marks any frame as real, and a first pass with no
  # photographic content anywhere would have only the back-panel reference
  # image to hold on to. The cost is that the shell's holes and soft fringes
  # are kept verbatim on those frames. Lower this radius (5, say) to split
  # the band — the innermost frames kept, the rest substituted but still
  # denoised — once somebody has looked at what the shell actually renders
  # a few degrees off the source view.
  #
  # No `anchor_position` input: the render is not anchored any more, so
  # nothing publishes one. The step uses the world origin, which is where
  # the SAM-3D-Body camera is by construction (body2colmap's
  # `sam3d_to_world` does not recentre), and echoes it back — published
  # here as `dataset.extras.anchor_position` because that is exactly what it
  # is, and because the stage-3 `inject_anchor` in the shared tail reads
  # that path. That step then finds no `dataset.anchor_image` (nothing in
  # this file writes one any more) and passes its batch through untouched,
  # which is the intended no-op: the anchor frame is the shell's render.
  - id: inject_shell_band
    step: inject_shell_views
    dispatch: in_process
    inputs:
      images: dataset.images
      shell_images: scene.shell_views.images
      shell_cameras: scene.shell_views.cameras
      cameras: dataset.cameras
      orbit_target: dataset.extras.orbit_target
    params:
      replace_radius_deg: 15.0
      reference_radius_deg: 15.0
    outputs:
      images: dataset.images
      masks: dataset.masks
      anchor_position: dataset.extras.anchor_position
      view_roles: scene.shell_view_roles

  # ================================================================
  # From here down: a verbatim copy of fast_helical_full.yaml's steps, and
  # therefore of fast_helical_native.yaml's tail. Keep all three in sync —
  # tests/test_workflows.py checks they have not drifted.
  # ================================================================

  # ---------------------------------------------------------------- stage 1
  # denoise.json: initial -> circular, strength 1.0.
  # dataset.masks here is the per-frame reference/denoise flag baked into
  # the loaded frames' alpha — NOT a foreground mask. See
  # steps/wan22_vace_denoise.py's docstring.
  #
  # No checkpoint params here on purpose: the step defaults to the
  # pre-quantized fp8 experts (silveroxides/Wan_2.2-fp8_scaled_hybrid) and
  # has no bf16 path left to fall back to. Override fp8_checkpoint_high /
  # fp8_checkpoint_low (both `advanced`) only to point at local files.
  - id: denoise_pass1
    step: wan22_vace_denoise
    dispatch: subprocess
    env: wan22
    # Hold the pipeline resident between the two passes: one worker process
    # serves both, so the ~47 GB of weights come off the network volume
    # once per run instead of twice. The worker calls the step's
    # release_vram() after every job, so brush (which trains on the GPU
    # between these two steps) still finds an empty card — the weights wait
    # in host RAM, not VRAM. Both passes must declare this; it is what
    # makes them share one worker.
    keep_loaded: true
    inputs:
      control_video: dataset.images
      control_masks: dataset.masks
      reference_image: dataset.reference_image
      subject_desc: dataset.prompt
    params:
      width: ${globals.resolution.0}
      height: ${globals.resolution.1}
      # From the ComfyUI graph (workflows/api/denoise.json): 6 steps, cfg
      # 1.0, seed 0. These happen to equal the step's own declared defaults;
      # spelled out anyway so the two passes read identically and every knob
      # a run tunes is visible in the step's params block.
      steps: 6
      cfg: 1.0
      seed: 0
      # The one value the two passes disagree on: pass 1 denoises the
      # circular render from scratch, pass 2 (strength 0.8) cleans up the
      # helical re-render.
      strength: 1.0
      # Exact strings from the live ComfyUI graph (denoise.json nodes
      # 6/7/188); $SUBJECT_DESC$ is filled in from dataset.prompt. Double-
      # quoted with `\`-escaped line breaks, NOT YAML's folded `>-`: a
      # folded scalar turns every line break into a space, which inside the
      # Chinese runs silently corrupts the string. tests/test_workflows.py
      # pins both, character for character, against every wan22_vace_denoise
      # step in every workflow. denoise_pass2 carries the same two strings —
      # a step param cannot reference another step's, so they are repeated.
      prompt: "时间静止，人物完全静止。身体如雕塑般僵硬，胸口没有起伏，头部保持固定\
        角度，面部肌肉完全不动，维持单一的中性表情。双眼一眨不眨，眼睑保持张\
        开且稳定，目光空洞而固定，锁定远处墙面上的一个点，对镜头毫无察觉、毫\
        无反应。镜头以匀速、固定焦距围绕主体平滑移动。 Time is frozen and only \
        the camera moves. The gaze stays anchored to that point on the wall \
        as the camera passes, so the eyes slide across the frame, always aimed \
        past the lens at the wall behind it. Eyelids stay open and steady, the \
        expression holds without a single micro-movement, and the head keeps \
        its exact angle throughout. The frozen subject is $SUBJECT_DESC$, lit \
        by even soft studio light against a plain seamless backdrop, photorealistic, \
        sharp focus, identical face and clothing in every frame."
      negative_prompt: "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静\
        止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的\
        手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体\
        ，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走, \
        chewing, tattoos, 眼球运动，眨眼，眼动追踪，微表情，面部抽动，头部移\
        动, 小头, 小脸"
    outputs:
      images: dataset.images

  # ---------------------------------------------------------------- stage 2
  # resplat_helical.json: train a splat on the denoised views, then
  # re-render it along a new, longer helical orbit.

  # Foreground alpha for brush's --alpha-mode transparent. Distinct from
  # the denoise control mask above, which this overwrites: past this point
  # the reference/denoise flag is no longer needed.
  - id: foreground_masks
    step: rmbg
    dispatch: in_process
    inputs:
      images: dataset.images
    outputs:
      masks: dataset.masks

  - id: normal_maps
    step: sapiens2_lite
    dispatch: in_process
    inputs:
      images: dataset.images
    outputs:
      normal_maps: scene.normal_maps

  # Debug deliverable: the COLMAP dataset exactly as `train_splat` below is
  # handed it — the denoised frames, the RMBG mattes and the normal maps
  # that the FIRST brush training runs on. Gated by
  # export_colmap_intermediate, off by default.
  #
  # One step, not the three stage 4b needs: the masks and normals it wants
  # are already sitting in the context, computed by the two steps above for
  # brush itself. Recomputing them would export something subtly different
  # from what was trained on, which would defeat the point — this is here to
  # answer "what did the first splat actually see?", which is the question
  # behind a bad helical re-render, and it is the only stage whose brush
  # input is otherwise thrown away.
  - id: export_colmap_intermediate
    step: colmap_export
    dispatch: in_process
    when: ${globals.export_colmap_intermediate}
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      normal_maps: scene.normal_maps
    params:
      output_dir: ${globals.output_root}/colmap_intermediate
      layout: brush

  - id: train_splat
    step: brush
    dispatch: in_process
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      normal_maps: scene.normal_maps
    params:
      # The expensive knob: brush trains twice in this pipeline (here and
      # train_final_splat) at roughly an hour of GPU each. 30000 equals
      # steps/brush.py's own default; spelled out because it is the one
      # brush setting worth seeing at a glance, and the two trainings could
      # be given different counts here. Everything else brush takes —
      # sh_degree, max_splats, refine_every, the normal-loss group — sits at
      # that step's declared defaults.
      total_steps: 30000
      # Without this brush exports into tempfile.gettempdir() (see
      # steps/brush.py) — the trained .ply then only survives because
      # Dataset.to_disk copies it at the very end. `output_dir` rather than
      # `export_dir` because this is an intermediate: it lands under
      # <output_root>/brush/training_<ms>/, which cannot collide with the
      # second training below.
      output_dir: ${globals.output_root}
    outputs:
      splat_path: dataset.splat_path

  - id: load_trained_splat
    step: load_splat
    dispatch: in_process
    inputs:
      splat_path: dataset.splat_path
    outputs:
      splat_scene: scene.splat

  # The ComfyUI node leaves override_cam_from_mesh off here: this is a
  # fresh, longer orbit framed from the splat's own bounds (fill_ratio 0.8,
  # focal length inherited from the dataset), not an anchored one. The
  # anchor is re-applied by inject_anchor below, matching on position. Both
  # of those are steps/splat.py's declared defaults, so this block only has
  # to say what the helical path itself is.
  #
  # `framing: ${globals.framing}` is the ONE param that intentionally
  # differs from fast_helical_full.yaml's otherwise-identical rerender_splat
  # (test_workflows.py's mirror check carves it out). The other two files
  # have no mesh render, so nothing there to keep a `framing` global in step
  # with — but here render_initial_views framed the mesh at that preset, and
  # the splat re-render has to match it.
  - id: rerender_splat
    step: render_splat
    dispatch: in_process
    inputs:
      splat_scene: scene.splat
      dataset: dataset
    params:
      width: ${globals.resolution.0}
      height: ${globals.resolution.1}
      framing: ${globals.framing}
      pattern: helical
      n_frames: 81
      n_loops: 2
      amplitude_deg: 30.0
      # 30/90, not the 45/45 the solver defaults to — the values
      # resplat_helical.json's Body2COLMAP_HelicalPath node carries.
      lead_in_deg: 30.0
      lead_out_deg: 90.0
    outputs:
      images: dataset.images
      masks: dataset.masks
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d

  # ---------------------------------------------------------------- stage 3
  # mask_splat.json: drop the splat's low-confidence fringes. 6/2 is from
  # `fast helical.yaml`'s own step config, and is also steps/mask_splat.py's
  # default — spelled out here because it is the number that distinguishes
  # this pipeline from the `helical` (12/4) and `tiered` (4/0) ones.
  - id: mask_splat_fringes
    step: mask_splat
    dispatch: in_process
    inputs:
      dataset: dataset
    params:
      filter_size: 6
      dilation: 2
    outputs:
      dataset: dataset

  # Put the warped reference photo back onto whichever new frames landed on
  # the original camera. Matches by position, so it survives the reorbit.
  #
  # AFTER mask_splat, not before it — the ordering is load-bearing and was
  # wrong. Before mask_splat this step sits where dataset.masks is carrying
  # rerender_splat's per-pixel splat alpha, and it would overwrite exactly
  # the input mask_splat exists to threshold. Here it only ever sees VACE
  # masks: mask_splat has already consumed the alpha and emitted all-1.0.
  #
  # This reproduces cyber2_6f/masked_splatted frame for frame: 80 frames
  # masked and filtered at alpha 255, and frame_00038_ the anchor.png
  # verbatim — not composited over black, not bilateral-filtered — at
  # alpha 0.
  - id: reinject_anchor
    step: inject_anchor
    dispatch: in_process
    inputs:
      images: dataset.images
      cameras: dataset.cameras
      anchor_position: dataset.extras.anchor_position
      anchor_image: dataset.anchor_image
      # mask_splat's all-1.0 batch, passed through with 0.0 written at the
      # anchor frame. Manufacturing it here instead would give the same
      # values today; wiring it keeps the step from silently destroying a
      # mask that matters if anything is ever inserted above it.
      masks: dataset.masks
    outputs:
      images: dataset.images
      masks: dataset.masks

  # ---------------------------------------------------------------- stage 4
  # denoise.json again, strength 0.8 — clean up the re-render.
  - id: denoise_pass2
    step: wan22_vace_denoise
    dispatch: subprocess
    env: wan22
    # See denoise_pass1: both passes must declare keep_loaded for the two of
    # them to share one resident worker.
    keep_loaded: true
    inputs:
      control_video: dataset.images
      control_masks: dataset.masks
      reference_image: dataset.reference_image
      subject_desc: dataset.prompt
    params:
      width: ${globals.resolution.0}
      height: ${globals.resolution.1}
      # Same as denoise_pass1 — see the note there. Only `strength` differs.
      steps: 6
      cfg: 1.0
      seed: 0
      strength: 0.8
      prompt: "时间静止，人物完全静止。身体如雕塑般僵硬，胸口没有起伏，头部保持固定\
        角度，面部肌肉完全不动，维持单一的中性表情。双眼一眨不眨，眼睑保持张\
        开且稳定，目光空洞而固定，锁定远处墙面上的一个点，对镜头毫无察觉、毫\
        无反应。镜头以匀速、固定焦距围绕主体平滑移动。 Time is frozen and only \
        the camera moves. The gaze stays anchored to that point on the wall \
        as the camera passes, so the eyes slide across the frame, always aimed \
        past the lens at the wall behind it. Eyelids stay open and steady, the \
        expression holds without a single micro-movement, and the head keeps \
        its exact angle throughout. The frozen subject is $SUBJECT_DESC$, lit \
        by even soft studio light against a plain seamless backdrop, photorealistic, \
        sharp focus, identical face and clothing in every frame."
      negative_prompt: "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静\
        止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的\
        手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体\
        ，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走, \
        chewing, tattoos, 眼球运动，眨眼，眼动追踪，微表情，面部抽动，头部移\
        动, 小头, 小脸"
    outputs:
      images: dataset.images

  # --------------------------------------------------------------- stage 4b
  # Debug deliverable: a COLMAP dataset from the pre-upscale frames, for
  # comparing splat quality with and without SeedVR2. Gated by
  # export_colmap_preupscale, which the web UI only sets when run_upscale is
  # also on (with the upscale off, stage 6 already exports these same
  # frames). rmbg + normals are recomputed here rather than reused from
  # stage 6: those run after the upscale, on 1080x1920 frames.
  - id: export_masks_preupscale
    step: rmbg
    dispatch: in_process
    when: ${globals.export_colmap_preupscale}
    inputs:
      images: dataset.images
    outputs:
      masks: dataset.masks

  - id: export_normals_preupscale
    step: sapiens2_lite
    dispatch: in_process
    when: ${globals.export_colmap_preupscale}
    inputs:
      images: dataset.images
    params:
      batch_size: 4
    outputs:
      normal_maps: scene.preupscale_normal_maps

  - id: export_colmap_preupscale
    step: colmap_export
    dispatch: in_process
    when: ${globals.export_colmap_preupscale}
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      normal_maps: scene.preupscale_normal_maps
    params:
      output_dir: ${globals.output_root}/colmap_preupscale
      layout: brush

  # ---------------------------------------------------------------- stage 5
  # upscale.json — skipped entirely when run_upscale is false.
  - id: upscale
    step: seedvr2
    dispatch: subprocess
    env: seedvr2
    when: ${globals.run_upscale}
    inputs:
      images: dataset.images
    params:
      # SeedVR2's `resolution` is the target output *shortest edge*, not a
      # multiplier — asking for less than the input's shortest edge
      # downscales. See steps/seedvr2.py.
      #
      # 1080, not the 1440 this was: the frames feed a Gaussian splat, and a
      # splat does not resolve detail the way a video does — past roughly
      # the native render size the extra pixels mostly buy training time and
      # VRAM. 720x1280 in, 1080x1920 out, which is also what the recorded
      # ComfyUI-era upscale produced (cyber_6f/upscaled).
      resolution: 1080
      # steps/seedvr2.py defaults this to 5; 1 is this workflow's own
      # choice — raise it once a real VRAM budget for the upscale is known.
      batch_size: 1
      vae_encode_tiled: true
      vae_decode_tiled: true
    outputs:
      images: dataset.images

  # seedvr2 resamples the frames and cannot return cameras — it runs in its
  # own venv, and that IPC boundary carries plain arrays, not Camera
  # objects. So without this step the dataset now holds 1080x1920 images
  # described by 720x1280 intrinsics, and both stage-6 consumers believe
  # the wrong focal length: cameras.txt would claim a 720x1280 PINHOLE
  # camera, and brush would fit a splat at half the focal length the images
  # were rendered with. The recorded ComfyUI-era export has exactly this
  # mismatch (cyber_6f/colmap: 720x1280 intrinsics, 1080x1920 frames), so
  # this is an inherited bug, not a new one — and a prime suspect for
  # output that looks *almost* right.
  #
  # Skipped with `run_upscale: false` (it is a no-op on a dataset whose
  # frames already match its cameras) — same `when:` as `upscale`, so the
  # two are always on or off together.
  - id: rescale_cameras
    step: fit_cameras_to_images
    dispatch: in_process
    when: ${globals.run_upscale}
    inputs:
      dataset: dataset
    outputs:
      dataset: dataset

  # ---------------------------------------------------------------- stage 6
  # colmap.json: background-remove, re-estimate normals against the frames
  # as they finally are, then emit whichever deliverables were selected.
  - id: export_masks
    step: rmbg
    dispatch: in_process
    inputs:
      images: dataset.images
    outputs:
      masks: dataset.masks

  # NOT the stage-2 normal maps (scene.normal_maps): those describe the
  # pre-re-render frames, which rerender_splat replaced wholesale with a
  # different, longer orbit — a different count, different poses, and after
  # the upscale a different resolution. Both deliverables below want
  # normals for *these* frames, so they are estimated again here.
  - id: export_normals
    step: sapiens2_lite
    dispatch: in_process
    inputs:
      images: dataset.images
    params:
      # Smaller than the step's default of 8: at the upscaled resolution
      # these are 1080x1920 float32 maps, and the returned list alone is
      # ~2 GB of host RAM.
      batch_size: 4
    outputs:
      normal_maps: scene.export_normal_maps

  # Deliverable 1: a COLMAP dataset. `layout: brush` puts the frames in
  # images/ and the normals in normals/ beside the three .txt files —
  # what brush itself reads, and what somebody handed this directory
  # expects, rather than the flat frames-beside-the-txt layout the ComfyUI
  # colmap.json stage wrote.
  - id: export_colmap
    step: colmap_export
    dispatch: in_process
    when: ${globals.export_colmap}
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      normal_maps: scene.export_normal_maps
    params:
      output_dir: ${globals.output_root}/colmap
      layout: brush

  # Deliverable 2: a trained splat, normal-supervised. This is a second
  # full brush training — the stage-2 one exists to drive the helical
  # re-render and predates the second denoise pass and the upscale, so it
  # is not the splat anyone wants to keep. `export_dir` puts this one at a
  # predictable path instead of brush/training_<ms>/, which is the whole
  # reason the final splat can be `ply/scene.ply`.
  - id: train_final_splat
    step: brush
    dispatch: in_process
    when: ${globals.export_ply}
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      normal_maps: scene.export_normal_maps
    params:
      # See train_splat's note. Same count; a run tuning the deliverable
      # splat alone changes it here.
      total_steps: 30000
      export_dir: ${globals.output_root}/ply
      export_name: scene.ply
    outputs:
      # Overwrites the stage-2 intermediate, so Dataset.to_disk's splat.ply
      # and the CLI's closing "splat:" line both name the final one.
      splat_path: dataset.splat_path
