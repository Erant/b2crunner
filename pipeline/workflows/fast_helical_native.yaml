      # flared rim. The supporting views make the opposite trade — nothing
      # rewrites them — and get their own 30-degree cap render below.
      splat_max_angle_deg: 60.0
      # Mid grey, not the step's default white. This does NOT change the
      # rendered background — neither `outline+skeleton`'s flat #7F7F7F base
      # nor `render_depth` takes bg_color — it changes the ONE other thing
      # render.py spends this param on: it publishes it as
      # `image_warp["bg_color"]` (render.py's `if image_warp is not None`
      # block), which is where warp_reference_to_anchor below gets the
      # border colour it fills around the warped reference photo.
      #
      # 0.5 rather than a literal 127/255, because the recorded run shows
      # both roundings and 0.5 is what produces them: the renderer does
      # `int(bg*255)` = 127 and generate_firstlast does `round(bg*255)` =
      # 128. cyber2_6f/initial has mesh frames at 127 and an anchor.png at
      # 128 — the same 0.5 down two code paths, which is the evidence that
      # 0.5 is the value the reference pipeline used. It also matches the
      # #7F7F7F the outline base grounds on, so the anchor border and the
      # render backgrounds agree.
      #
      # White is the value that cannot be right: the anchor frame reaches
      # denoise_pass2 sitting among grey renders, and a white border is the
      # largest possible disagreement with them.
      bg_color: [0.5, 0.5, 0.5]
    outputs:
      images: dataset.images
      masks: dataset.masks
      inactive_masks: scene.inactive_masks

  # And the anchor once more, over the fresh render — reinject_anchor_initial
  # exactly, reading the warped photograph it already made.
  - id: reinject_anchor_reoutlined
    step: inject_anchor
    dispatch: in_process
    when: ${globals.re_outline}
    inputs:
      images: dataset.images
      cameras: dataset.cameras
      anchor_position: dataset.extras.anchor_position
      anchor_image: dataset.anchor_image
      masks: scene.inactive_masks?
    outputs:
      images: dataset.images
      masks: dataset.masks

  # The control video pass 1 is about to be handed, written to the debug
  # bundle: the 81 frames with their VACE mask in the alpha channel, the
  # reference sheet, the warped anchor photo, the prompt, and the cameras
  # in metadata.json. Nothing downstream reads it — `directory_path` is
  # published only so the run's log records where it went.
  #
  # Why it is worth the tens of MB — cyber_6f/initial, the same shape, is
  # 12 MB for 81 drawings, and the room backdrop makes these bigger.
  # Every export a run produces describes frames from AFTER a denoise;
  # the drawings that caused them existed only in memory, so a question
  # about the input — is the skeleton too much ink, is the face splat
  # where it belongs, does the anchor frame carry the photograph — had to
  # be answered by re-running the first fourteen steps locally from the
  # same upload (the recipe in docs/vace-denoise-findings-2026-09-07.md),
  # and could not be answered at all about a run whose upload is gone.
  #
  # It is written in `save_dataset`'s own format, which is `load_dataset`'s:
  # the directory is a drop-in for `cyber_6f/initial` in a probe workflow,
  # so a denoise A/B can be re-run against this exact input without the
  # rest of the pipeline.
  - id: dump_denoise_input
    step: save_dataset
    dispatch: in_process
    inputs:
      dataset: dataset
    params:
      directory: ${globals.output_root}/debug/denoise_pass1_input
    outputs:
      directory_path: scene.denoise_pass1_input_dir

  # ================================================================
  # From here down: the tail — the native port of the ComfyUI pipeline.
  # ================================================================

  # ---------------------------------------------------------------- stage 1
  # denoise.json: initial -> circular, strength 1.0.
  # dataset.masks here is the per-frame reference/denoise flag baked into
  # the loaded frames' alpha — NOT a foreground mask. See
  # steps/wan22_vace_denoise.py's docstring.
  #
  # No checkpoint params here on purpose: the step defaults to the
  # pre-quantized fp8 experts (silveroxides/Wan_2.2-fp8_scaled_hybrid) and
  # has no bf16 path left to fall back to. Override fp8_checkpoint_high /
  # fp8_checkpoint_low (both `advanced`) only to point at local files.
  - id: denoise_pass1
    step: wan22_vace_denoise
    dispatch: subprocess
    env: wan22
    # Hold the pipeline resident between the two passes: one worker process
    # serves both, so the ~47 GB of weights come off the network volume
    # once per run instead of twice. The worker calls the step's
    # release_vram() after every job, so brush (which trains on the GPU
    # between these two steps) still finds an empty card — the weights wait
    # in host RAM, not VRAM. Both passes must declare this; it is what
    # makes them share one worker.
    keep_loaded: true
    inputs:
      control_video: dataset.images
      control_masks: dataset.masks
      reference_image: dataset.reference_image
      subject_desc: dataset.prompt
    params:
      width: ${globals.resolution.0}
      height: ${globals.resolution.1}
      # From the ComfyUI graph (workflows/api/denoise.json): 6 steps, cfg
      # 1.0, seed 0. These happen to equal the step's own declared defaults;
      # spelled out anyway so the two passes read identically and every knob
      # a run tunes is visible in the step's params block.
      #
      # The 6 is written as the two experts' shares because that is what it
      # always meant: the graph's `steps: 6`, split at the checkpoint's
      # boundary, gave the high-noise expert 2 and the low-noise one 4, and
      # nothing said so. Their sum is the run's step count, and it is the
      # length `strength` below must have.
      steps_high: 2
      steps_low: 4
      cfg: 1.0
      seed: ${globals.seed}
      # The sampler and the scale schedule are run E4's, the settled result
      # of the 2026-09-08 skeleton-leak sweep (docs/vace-denoise-findings-
      # 2026-09-07.md, section 5; sidecar docs/vace-leak-sweep/E4-shift5-
      # unipc.yaml), applied here on 2026-09-09. The question the sweep
      # answered: the DWPose skeleton in the control drawing was surviving
      # the denoise as painted sticks — red neck/shoulder "yoke" over the
      # hair on back views, coloured limb lines over the trousers — and
      # pass 2 inherits it through the intermediate splat.
      #
      # `sampler_shift: 5` is the whole of the fix: it takes the leak from
      # 1.74 (the 2.5-shift baseline A) to -0.53, yoke included, on its own
      # (E2, euler) and with `uni_pc` on the high-noise expert alike (E4).
      # Shift is the axis the sampler stops mattering on — at shift 2.5 the
      # same `uni_pc` is the worst yoke ever measured (E3, 116 against A's
      # 14.5), because UniPC's multistep history carries what the two
      # high-noise steps committed straight through the hand-off, ink
      # included — so E4 over E1/E2 for being the setting that is not one
      # sampler flip away from that. `sampler_high` is written out although
      # it is the step's default for the same reason everything else here
      # is: the reference graph's sampler, kept on purpose.
      #
      # The schedule: one scale per denoise step, first to last. Steps 1-2
      # are the high-noise expert's (structure), 3-6 the low-noise one's
      # (detail), at the 2/4 split above. Full scale on the structure
      # steps, 0.5 on all four detail steps — a flat half rather than the
      # `[1, 1, 0.75, 0.5, 0.25, 0]` taper this shipped with until
      # 2026-09-09, which spent its whole fade on steps 5-6, the two that
      # measured WORSE than inert on leak per point of silhouette (section
      # 1a), and paid full scale on step 3. E4 keeps the most silhouette
      # of the three clean settings (IoU 0.8468, 0.6 pt under A) and costs
      # the most view flow (1.189 against A's 0.986, +20%) — which pass 2
      # at a flat scale recovers whole (section 6, F1 flow 1.007).
      #
      # Caveat on record: the taper it replaces was never measured at
      # shift 8 — every one of the 17 runs deviated from it — so its only
      # fault may have been the taper's placement. The missing corner is
      # one run with these two lines reverted.
      sampler_high: uni_pc
      sampler_shift: 5
      strength: [1, 1, 0.5, 0.5, 0.5, 0.5]
      # One knob sits beside it, left unset here so this pass keeps pushing
      # on every layer alike: `strength_layers` tapers each step's scale
      # across the eight VACE injection layers, shallow to deep.
      # steps/wan22_vace_denoise.py's docstring has the mechanism and run()
      # has the timestep arithmetic.
      # The negative is the live ComfyUI graph's string (denoise.json node
      # 7). The positive STARTED as node 188's and deliberately diverged on
      # 2026-08-31 — the graph is reference only now, nothing here runs it.
      # $SUBJECT_DESC$ is filled in from dataset.prompt.
      #
      # What diverged: the lighting. Node 188 said only "even soft studio
      # light", which fixes the light's quality and not its place, so the
      # model fell back on its prior for a person on a seamless backdrop
      # under a 360 deg fixed-elevation orbit — a product turntable, key
      # light welded to the lens. That is view-DEPENDENT shading: the
      # highlight slides across the face frame to frame, and a splat cannot
      # reconcile it (floaters, colour that swims under rotation). The
      # replacement puts the key at the SUBJECT's own left, which is
      # world-fixed because the subject is, and says the shading stays on
      # the same skin all the way round.
      #
      # Two things it deliberately does NOT do. It does not reach for the
      # Wan aesthetic-control lighting tags (侧光/逆光/顶光/边缘光): every
      # one of those is defined relative to the CAMERA, so on an orbit they
      # ask for exactly the turntable. Only the camera-invariant ones are
      # tagged (人工光、柔光、低对比度) plus 环绕运镜, the arc shot. And it
      # states the invariant affirmatively rather than negating it — the
      # words "turntable" and "rotate" appear nowhere, because a diffusion
      # positive prompt suppresses a named concept unreliably and sometimes
      # summons it, and cfg 1.0 means there is no negative channel to put
      # it in (the negative below is encoded and then ignored entirely).
      #
      # Double-quoted with `\`-escaped line breaks, NOT YAML's folded `>-`:
      # a folded scalar turns every line break into a space, which inside
      # the Chinese runs silently corrupts the string. A continuation line
      # must not START with a space either — YAML strips it as indentation
      # — so a break inside the English keeps its space at the line's end.
      # tests/test_workflows.py pins both, character for character, against
      # every wan22_vace_denoise step in every workflow. denoise_pass2
      # carries the same two strings — a step param cannot reference
      # another step's, so they are repeated.
      #
      # What diverged a second time (2026-09-01): the SCENE, to match the
      # `background` setting. The prompt used to say "on a plain seamless
      # backdrop", which contradicted control frames that now show a ruled
      # room — while 灯光属于房间本身 ("the light belongs to the room
      # itself") and 远处墙面上的一个点 ("a point on the distant wall")
      # already assumed the room the frames had not had. The backdrop is
      # what makes the lighting claim answerable: light fixed to a room only
      # means something if the frames show the room it is fixed to.
      #
      # It goes in the 场景 slot of Wan's own formula (主体 + 场景 + 运动 +
      # 美学控制 + 风格化, "对主体所处环境特征细节的描述，可通过形容词或短
      # 句列举"), which is the slot the backdrop phrase already occupied —
      # so the edit is a swap, not an addition: grey gridded walls, a dark
      # floor, a lighter ceiling, corners (steps/backdrop.py's `grid`
      # defaults, which is what the renderer actually draws). It carries
      # two claims past the description. The room is what moves past the
      # camera rather than turning with it — the same invariant the lighting
      # sentence states, now said about the thing the frames show. And the
      # room's own shading is fixed the way the subject's is: shadows land
      # in the same place in the ROOM every frame, which is what a splat can
      # reconcile and a shadow swinging with the lens cannot.
      #
      # It reaches for no new aesthetic-control tag: "room" is scene
      # vocabulary, and the lighting tags stay the three camera-invariant
      # ones for the reason above. UNVERIFIED on a pod — like the lighting
      # edit before it, this is a quality change a real run has to judge.
      #
      # AND IT IS STALE as of 2026-09-04, knowingly: render_initial_views'
      # room is OFF, so this pass's control frames are a drawing on flat
      # #7F7F7F while the 场景 slot still describes ruled walls, a dark
      # floor and a lighter ceiling. That is the 09-01 contradiction with
      # its sign flipped — the prompt now asks for a room the frames do not
      # show, and the model will paint one wherever nothing contradicts it,
      # including the lighting claims that lean on it. Left standing on
      # purpose: the grid came off to isolate ONE variable, and rewriting
      # the prompt in the same change would spend the comparison. If the
      # room stays off, this slot is the next thing to settle — and
      # tests/test_workflows.py pins the string character for character, so
      # it moves together with that pin.
      prompt: "人工光、柔光、低对比度、环绕运镜。时间静止，人物完全静止。身体\
        如雕塑般僵硬，胸口没有起伏，头部保持固定角度，面部肌肉完全不动，维持单\
        一的中性表情。双眼一眨不眨，眼睑保持张开且稳定，目光空洞而固定，锁定远\
        处墙面上的一个点，对镜头毫无察觉、毫无反应。人物站在一间空房间里：灰色\
        墙面上有均匀的网格线，深色地板，浅色天花板，墙面相交处有清晰的墙角。房\
        间本身固定不动，镜头以匀速、固定焦距围绕主体平滑移动，墙角依次从画面中\
        掠过。灯光属于房间本身，位置固定：主光始终来自人物自身的左前方，右侧是\
        柔和的补光。人物身上的明暗、阴影与高光始终停留在同一片皮肤和衣物上，每\
        一帧完全相同——左侧始终是受光面，右侧始终是柔和的暗面；镜头绕到人物右侧\
        时，看到的正是那一侧的暗面。房间里的阴影同样固定：墙面上的明暗、以及人\
        物投在地面上的影子，始终落在房间中的同一位置，不随镜头移动。 Time is \
        frozen and only the camera moves. The gaze stays anchored to that \
        point on the wall as the camera passes, so the eyes slide across the \
        frame, always aimed past the lens at the wall behind it. Eyelids stay \
        open and steady, the expression holds without a single \
        micro-movement, and the head keeps its exact angle throughout. The \
        frozen subject is $SUBJECT_DESC$, standing in an empty room: grey \
        walls ruled with an even grid, a dark floor and a lighter ceiling, \
        meeting at clear corners. The room is fixed in place and the camera \
        travels through it, so the walls and their corners sweep past the \
        frame while the room itself never turns. Soft, low-contrast studio \
        light: the key sits high on the subject's own left, a soft fill on \
        their right, both fixed to the room and holding still while the \
        camera arcs around. Every highlight and shadow stays welded to the \
        same patch of skin and cloth from the first frame to the last, so \
        their left remains the lit side and their right remains the \
        soft-shadowed side for the whole circle; as the camera arcs round to \
        their right it sees that shadowed side. The room's shadows are just \
        as fixed: the shading on the walls and the shadow the subject casts \
        on the floor stay in the same place in the room in every frame, and \
        do not swing round with the camera. Matte skin, matte cloth, \
        photorealistic, sharp focus, identical face, clothing and lighting in \
        every frame."
      negative_prompt: "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静\
        止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的\
        手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体\
        ，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走, \
        chewing, tattoos, 眼球运动，眨眼，眼动追踪，微表情，面部抽动，头部移\
        动, 小头, 小脸"
    outputs:
      images: dataset.images

  # ---------------------------------------------------------------- stage 2
  # resplat_helical.json: train a splat on the denoised views, then
  # re-render it along a new, longer helical orbit.

  # The alpha brush trains these frames against. It is baked into the
  # frames themselves rather than into a masks/ sidecar, which is what
  # makes them TRANSPARENT views — "nothing is there outside the subject",
  # so they carve the silhouette. (brush resolves that per view now; see
  # steps/brush.py. No --alpha-mode is passed, and this layout is what the
  # forced `transparent` used to spell out.) Distinct from the denoise
  # control mask above, which this overwrites: past this point the
  # reference/denoise flag is no longer needed.
  - id: foreground_masks
    step: rmbg
    dispatch: in_process
    inputs:
      images: dataset.images
    outputs:
      masks: dataset.masks

  # Pixel-space treatment of pass 1's output before anything downstream
  # reads it — the splat training, the normal maps, the camera solve and
  # the debug bundle all see the treated frames. Every operation is off at
  # its default and the frames pass through byte-identical; the workflow
  # settings are the switches. Sits AFTER foreground_masks because the
  # operations that measure the subject need its matte, and skips the
  # photograph's frame. Why pass 1's output rather than the re-render
  # denoise_pass2 sees: steps/pixel_ops.py.
  - id: adjust_denoised
    step: pixel_ops
    dispatch: in_process
    inputs:
      images: dataset.images
      masks: dataset.masks
      anchor_frame_index: dataset.extras.anchor_frame_index?
    params:
      specular_suppress: ${globals.specular_suppress}
    outputs:
      images: dataset.images

  - id: normal_maps
    step: sapiens2_lite
    dispatch: in_process
    inputs:
      images: dataset.images
    outputs:
      normal_maps: scene.normal_maps

  # ------------------------------------------- refining the cameras (stage 2)
  # Bundle-adjust the orbit BEFORE anything reads it. The poses this dataset
  # holds were generated, not measured — an exactly ideal circle, camera
  # height std exactly 0 — and the frames have since been through a
  # diffusion pass that had its own opinion about where the subject was.
  # Refining against the frames themselves is worth +0.63 PSNR / +0.0045
  # SSIM on held-out views (docs/camera-pose-refinement.md; three seeds per
  # condition, baseline seed spread +-0.003).
  #
  # WHERE IT SITS is the whole of the wiring, and there are three consumers
  # below that all have to see the corrected poses:
  #
  #   face_splat_refined   rebuilds the face splat through the anchor camera
  #                        this solve moved, and the cap is rendered from it.
  #                        A wrong pose there is not a wrong pixel, it is a
  #                        splat in the wrong place, and the supporting views
  #                        it publishes then argue with the training frames
  #                        rather than supporting them. This is why the step
  #                        is here rather than anywhere later.
  #   train_splat          the stage-2 fit itself.
  #   export_colmap_intermediate  the debug bundle's dataset, which has to
  #                        describe what was trained on.
  #
  # WHAT IT IS REFINED AGAINST is denoise_pass1's frames and RMBG's mattes —
  # the training views, and only those. The supporting views are never in
  # this solve: the face cap's views are RENDERS, produced from the very
  # poses being corrected, so they carry no independent
  # evidence about where a camera was and would only vote for the answer
  # already in hand. (They also do not exist yet at this point in the file,
  # which is the same fact from the other side.)
  #
  # Frozen intrinsics, foreground-only features, and a Sim(3) putting the
  # gauge back afterwards, all of which are the step's own defaults — see
  # its module docstring for the three traps that make each one
  # non-negotiable. The checks are assertions: a solve that fails one is
  # refused and the given poses are published unchanged, which is exactly
  # the pipeline's behaviour before this step existed.
  - id: refine_cameras
    step: refine_cameras
    dispatch: in_process
    when: ${globals.refine_cameras}
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      images: dataset.images
      # foreground_masks' RMBG mattes, above. Not the VACE control masks
      # this field carried before that step — those are per-frame all-1.0
      # flags, and masking a solve to "everything" is the unmasked variant
      # under a different name.
      masks: dataset.masks
      # Which frame is the photograph, so the step can republish where the
      # refinement put it. Falls back to frame 0, the circular anchor.
      anchor_frame_index: dataset.extras.anchor_frame_index?
    params:
      # given/ + refined/ COLMAP models and stats.json, into the result .zip.
      debug_dir: ${globals.output_root}/debug/refine_cameras
    outputs:
      cameras: dataset.cameras
      stats: scene.camera_refinement
      # The dataset's record of the photograph's camera, kept in step with
      # the cameras it just rewrote. render_initial_views wrote the GIVEN
      # anchor's position here; leaving it would have the extras describe
      # a pose the camera list no longer holds. Its readers — render_splat's
      # cap axis (which prefers the live camera anyway) and inject_anchor's
      # position match — now see the same anchor the cameras do.
      #
      # It does not stay this file's last word on the anchor: rerender_splat
      # republishes both keys for the helix it builds, because a position
      # match has to be against the path the frames were rendered along, and
      # this refinement's ~62 mm move would miss it by ~10x the tolerance.
      # refine_cameras_final, after that, publishes no anchor_position —
      # moving the helix's anchor off the pose its own frames were rendered
      # from is exactly the mistake above. (It does take the frame index,
      # so its log line and stats describe the photograph's frame.)
      anchor_position: dataset.extras.anchor_position

  # --------------------------- the face splat, rebuilt on the refined poses
  # The one thing above that was BUILT on the poses the step above just
  # moved. The face splat is unprojected from the reference photograph
  # through the ANCHOR camera — the origin, where render_initial_views'
  # override mode put that frame — with its depth taken from the mesh. The
  # refinement has since declared the photograph taken from somewhere
  # slightly else, so the same pixels now belong on slightly different
  # rays; the mesh has not moved, and neither has the face the denoised
  # frames agree on, which sits on the mesh. So the splat is built AGAIN
  # here, from the same crop, matte and normals, through the refined anchor
  # camera (`cameras: dataset.cameras` plus the anchor's index), with its
  # depth re-taken from the mesh through that camera. The bootstrap's copy
  # stays on disk beside it (`face_splat`'s filepath against this one's)
  # for the comparison; nothing reads it again — render_initial_views was
  # its only reader and is behind us.
  #
  # Why a rebuild and not a rigid carry, which is what stood here from
  # 2026-08-31 to 2026-09-02 (`rebase_face_support_views`, a `rebase_cameras`
  # step since deleted): measured on run e593a8, the carry put the cap's
  # face 50 mm behind the face in the frames and the shells — the same
  # pixel in the anchor view, a second face inside the head from the side,
  # a Janus in the helical render. The anchor's own pose delta was 23 mm
  # toward the subject, 58 mm up and 1.6 degrees of pitch: at the head the
  # vertical parts cancel and what is left is a slide along the anchor's
  # viewing ray, the one direction a single frame's reprojection cannot
  # constrain and so the one a bundle adjustment is freest to leave there.
  # A rigid carry moves the splat's DEPTH by that slide, but the depth was
  # never the camera's to move — it came from the mesh. Rebuilding through
  # the refined camera keeps the pixels on the refined rays and puts the
  # depth back on the mesh, which is where the 22 frames around the anchor
  # triangulate the face (1 cm ahead of the mesh front; the carried cap was
  # 5 cm behind it). See FacePointmapSplatStep's docstring.
  #
  # Gated with the FACE branch, like everything it feeds. With
  # `refine_cameras` off, dataset.cameras still holds the given poses and
  # the anchor is still the origin camera, so this is the bootstrap's splat
  # again — the same answer, arrived at by reading rather than by wiring.
  # In place on scene.face_splat_path / scene.face_splat_stats, so the two
  # cap steps below need no rewiring and there is one path carrying the
  # face splat rather than a refined one beside a stale one for a later
  # reader to pick the wrong half of.
  - id: face_splat_refined
    step: face_pointmap_splat
    dispatch: in_process
    when: ${globals.face_splat}
    inputs:
      image: scene.face_image
      mask: scene.face_matte
      normal_map: scene.face_normals
      crop_info: scene.face_crop_info
      mesh_output: scene
      cameras: dataset.cameras
      # The frame the photograph is — the one the refinement moved out from
      # under the bootstrap's splat. The step falls back to frame 0 without
      # it, which is where a circular path's anchor sits anyway.
      anchor_frame_index: dataset.extras.anchor_frame_index?
      # That same anchor camera BEFORE the refinement — the camera the
      # photograph was warped onto. The step hangs the photograph's rays on
      # the motion between this and dataset.cameras[anchor], not on the
      # refined camera itself: the path's anchor is look_at-turned onto the
      # orbit target (0.83 deg on cyber2), and a shell hung on that rotation
      # turns with it — 28 mm at the face, measured on run 5e2817.
      given_camera: scene.image_warp.camera
    params:
      filepath: ${globals.output_root}/face/face_refined.ply
      debug_dir: ${globals.output_root}/debug/face_splat_refined
    outputs:
      splat_path: scene.face_splat_path
      splat_stats: scene.face_splat_stats

  # The SECOND face render, and a different set of views for a different
  # consumer. render_initial_views (back in the bootstrap) rides the
  # dataset's own cameras because its frames have to be composited onto
  # those exact drawings, one for one.
  # These are for `brush` as supporting views (face_support_views below),
  # and views on the dataset's path are the ones worth least there: each
  # already has a denoised frame of its own carrying the photograph, so a
  # render of the same view supervises it with a resampled copy of what it
  # has. What supervision is FOR is the rest of the neighbourhood.
  #
  # It renders the REFINED splat, `face_splat_refined` above, and it sits
  # here rather than in the bootstrap (where it lived until 2026-09-02) for
  # that reason and one more: render_splat aims the cap along the anchor
  # camera's view of the splat, and it reads that camera LIVE from
  # dataset.cameras[anchor_frame_index] — which `refine_cameras` has by now
  # rewritten — rather than from the recorded `anchor_position` (which the
  # refinement republishes too, but the camera list is the truth). Both the
  # splat and the disc of views around it therefore describe the refined
  # anchor.
  #
  # So: a `cap` — a disc of 36 views spread evenly by area within 30
  # degrees of the photograph's own view of the splat, aimed at the SPLAT's
  # centre rather than the body's (`bounds_source: splat`, which also
  # dollies in so the head fills the frame at fill_ratio instead of sitting
  # in it as a smudge). 30 degrees is body2colmap's measurement of where a
  # Face_Neck shell still reads cleanly (c65a7f7); past it the 2.5-D shell
  # shows its own open rim, and nothing downstream rewrites a supporting
  # view the way two denoise passes rewrite a composited one.
  #
  # bg_color black for the same load-bearing reason as above: these are
  # un-premultiplied by select_support_views, and dividing by alpha only
  # recovers the straight colour if the render was premultiplied over
  # black.
  - id: render_face_support_views
    step: render_splat
    dispatch: in_process
    when: ${globals.face_splat}
    inputs:
      splat_path: scene.face_splat_path
      dataset: dataset
    params:
      pattern: cap
      n_frames: 36
      cap_radius_deg: 30.0
      bounds_source: splat
      fill_ratio: 0.8
      width: ${globals.resolution.0}
      height: ${globals.resolution.1}
      bg_color: [0.0, 0.0, 0.0]
      # NO backdrop, and this is the same sentence as the black above rather
      # than a second one: select_support_views divides the alpha back out of
      # these frames to recover a straight colour, which only works if what
      # lies behind the splat is a flat black. A room behind it would be
      # recovered as the face's own colour and then trained on.
      background: ""
    outputs:
      images: scene.face_support_render.images
      masks: scene.face_support_render.masks
      cameras: scene.face_support_render.cameras

  # The face splat's SECOND route into the training. render_initial_views
  # back in the bootstrap puts it on the drawings, where two diffusion
  # passes then have their way with it; this hands a render of it to
  # `brush` as supporting
  # views —
  # training evidence weighted by the splat's own coverage and ignored
  # everywhere else — so the deliverable is pulled back toward the face in
  # the photograph rather than the one the denoiser invented. See
  # steps/brush.py's support_* inputs for why that must be brush's MASKED
  # mode: outside a face matte lies the rest of the subject — neck, hair,
  # ears — not empty space, and a transparent view would ask the training to
  # carve it away. Tighter than it used to be, and so more so: since
  # 2026-08-30 that matte is the face alone, and the neck it no longer
  # covers is exactly the kind of real surface a transparent view would
  # delete.
  #
  # The face-only matte reaches here on its own, with nothing to wire: these
  # masks are render_splat's coverage of scene.face_splat_path, and that
  # splat has one Gaussian per masked pixel. Narrow the matte and the splat
  # narrows, so its renders and their alpha narrow with it.
  #
  # The OUTER edge of the useful band was drawn by the sampler that made
  # these views: a 30-degree cap, which is body2colmap's measurement of
  # where a Face_Neck shell still reads cleanly (c65a7f7). Drawing it there
  # rather than here is the point of rendering a second set — culling the
  # drawing batch afterwards keeps the views nearest the photograph, which
  # are the ones worth least, and spends renders to do it. Note this is a
  # TIGHTER angle than the 60 render_initial_views composites at, on
  # purpose: nothing rewrites a supporting view, while a composited frame
  # is an input to two denoise passes that can rewrite a flared rim.
  #
  # What is left for this step is the INNER edge: min_path_angle_deg, 5
  # degrees, measured to the nearest camera on the denoising path. A band
  # swept down the whole orbit, not a hole punched at the anchor.
  # render_initial_views lays that path out as `pattern: circular` — one
  # elevation, 360 degrees of azimuth, every frame of it denoised — so a
  # supporting view sitting on it competes with a denoised frame wherever
  # it sits; being 140 degrees round the orbit from the photograph does
  # not make a view out of distribution, being off the path does. (On a
  # circle this comes out as the elevation difference; on a helix it would
  # follow the sweep, which is why the measure is to the path and not to a
  # latitude.) Of the cap's 36 views
  # against 81 ring cameras, that drops the 7 nearest the ring.
  #
  # Only the STAGE-2 training reads these (`train_splat`). The final one
  # does not, and its inputs say so: by then the dataset is the helical
  # re-render, denoised again and upscaled, while these renders are still
  # the circular bootstrap's — stale path, stale resolution. The `?` on
  # `train_splat`'s reads is an optional read (see pipeline/workflow.py),
  # so with the face branch off (`face_splat: false`) nothing writes that
  # path and brush trains exactly as before.
  - id: face_support_views
    step: select_support_views
    dispatch: in_process
    when: ${globals.face_splat}
    inputs:
      images: scene.face_support_render.images
      masks: scene.face_support_render.masks
      cameras: scene.face_support_render.cameras
      # The denoising path: the cameras the training's own frames were
      # rendered and denoised along. `min_path_angle_deg` drops the cap
      # samples that land within 5 degrees of it — the innermost ring of
      # the disc, whose views the denoised batch already covers.
      # The REFINED path — the one these views will be trained beside.
      path_cameras: dataset.cameras
      # The pivot that distance is measured about, and the same one
      # render_initial_views culls about (it reads the splat's own bbox
      # centre off the .ply, which is exactly this): a head sits well above
      # a full-body orbit target, so measuring about the target would call
      # a camera closer to the path than it is to the head's view of it.
      splat_center: scene.face_splat_stats.world_center
    params:
      # 0, not the step's default 5: the default drops the cap views within
      # 5 degrees of the denoising path because "those views have a
      # denoised frame of their own already". Since face_priority below,
      # that frame is silenced over the face (weight 0.1 at full coverage),
      # so a cap view sitting on the path is no longer a resampled copy of
      # something the training has — it is the only face evidence at that
      # angle. The views nearest the photograph are also the cap's most
      # trustworthy renders (least parallax from the one source), which is
      # a second reason not to be the step that throws them away.
      min_path_angle_deg: 0.0
    outputs:
      # `face_support_views`, not `support_views`: `merge_support_views` in
      # the shared tail is the single writer of scene.support_views.*, and
      # this branch is what it takes.
      images: scene.face_support_views.images
      masks: scene.face_support_views.masks
      cameras: scene.face_support_views.cameras

  # ------------------------------------------------------ the face cap wins
  # Two sources describe the face in train_splat and, until 2026-09-02,
  # brush heard them at the same volume: the face cap above (masked
  # supporting views carrying the photograph) and the denoised frames
  # (transparent training views carrying the denoiser's face). Wherever
  # both cover the face the fit averages them, and the cap loses as often
  # as it wins.
  #
  # This renders the refined face splat's coverage from every TRAINING
  # camera and turns it into a per-pixel loss weight — 1 - strength (0.1)
  # where the splat covers the frame, 1 everywhere else — that brush reads
  # as a `weights/` sidecar and multiplies into that view's loss on top of
  # its alpha mode. The denoised frames keep carving the silhouette (their
  # alpha is untouched) and keep every pixel outside the face; over the
  # face they whisper and the cap speaks. brush's evidence pass honours the
  # same map, so rerender_splat's confidence gate does not then read the
  # silenced disagreement as evidence against the face.
  #
  # Only within the cap: the attenuation is full inside cap_radius_deg (30,
  # the same radius the cap is rendered within — past it the 2.5-D shell
  # has nothing to say that could replace what is silenced) and fades to
  # nothing over fade_deg beyond. The angle is measured about the splat's
  # centre from the anchor camera, read LIVE from dataset.cameras like the
  # cap's own axis, because refine_cameras moved it.
  #
  # Only the STAGE-2 training reads the weights: train_final_splat takes
  # no supporting views, so there is nothing there for its frames to yield
  # to. (Until 2026-09-06 the stage-1 shells got the same treatment in a
  # `face_priority_shells` twin, folded into their masks rather than a
  # sidecar; the shells are gone and so is it.)
  - id: face_priority
    step: face_priority_weights
    dispatch: in_process
    when: ${globals.face_splat}
    inputs:
      cameras: dataset.cameras
      # The REFINED splat, rebuilt through the refined anchor camera by
      # face_splat_refined: the same .ply the cap above was rendered from.
      splat_path: scene.face_splat_path
      anchor_cameras: dataset.cameras
      anchor_frame_index: dataset.extras.anchor_frame_index?
      anchor_position: dataset.extras.anchor_position?
      splat_center: scene.face_splat_stats.world_center
    params: {}
    outputs:
      weights: scene.face_priority.weights

  # brush takes ONE support_* triple, and this publishes it. There is one
  # producer left since the stage-1 shells went (2026-09-06), so the `b_*`
  # half is unwired; the step stays for what it does UNGATED, which is the
  # point: it is always the writer of scene.support_views.*, so that path
  # has exactly one writer rather than a gated branch that sometimes
  # doesn't. With the face branch off it publishes three empty lists and
  # brush trains exactly as it did before the cap existed.
  - id: merge_support_views
    step: merge_support_views
    dispatch: in_process
    inputs:
      a_images: scene.face_support_views.images?
      a_masks: scene.face_support_views.masks?
      a_cameras: scene.face_support_views.cameras?
    params: {}
    outputs:
      images: scene.support_views.images
      masks: scene.support_views.masks
      cameras: scene.support_views.cameras

  # Debug deliverable: the COLMAP dataset of the frames `train_splat` below
  # is fitted to — the denoised frames, the RMBG mattes and the normal maps
  # that the FIRST brush training runs on. It lands in `colmap_intermediate/`
  # and rides into the archive under `debug/`, so the debug bundle is its
  # switch — the one output switch that skips work rather than deciding
  # what gets packaged, because unlike the rest of `debug/` this dataset is
  # not a side effect of a step the run performs anyway.
  #
  # It IS everything that training is handed: the supporting views — the
  # face cap — go in too, through the same `support_*` inputs and the same
  # `_SupportViews` writer `train_splat` below uses, wired to the same
  # context paths. So the two steps export one model between them and this
  # one is a faithful record of it: `images.txt` carries a pose for every
  # supporting view, and the frames land in `images/` as RGB with their
  # mattes in `masks/`, which is the layout that means MASKED to brush.
  #
  # That matters because a supporting view is the one thing here whose
  # pose has no other witness. The training frames are checked against
  # each other by `refine_cameras`; a supporting view is a render made
  # from a pose nothing re-measures, and the face cap's splat is built out
  # of the one photograph, through the anchor camera the refinement moved
  # — `face_splat_refined` rebuilds it through the refined one, and this
  # export is where to check that the face landed on the head: triangulate
  # the face in the support_* views against the frames (2026-09-02's
  # diagnosis did exactly that, and found the carried cap 50 mm deep).
  #
  # One step, not the three stage 4b needs: the masks and normals it wants
  # are already sitting in the context, computed by the two steps above for
  # brush itself. Recomputing them would export something subtly different
  # from what was trained on, which would defeat the point — this is here to
  # answer "what did the first splat actually see?", which is the question
  # behind a bad helical re-render, and it is the only stage whose brush
  # input is otherwise thrown away.
  - id: export_colmap_intermediate
    step: colmap_export
    dispatch: in_process
    when: ${globals.export_debug}
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      normal_maps: scene.normal_maps
      # The same three paths train_splat reads, and optional (`?`) for the
      # same reason: merge_support_views runs ungated, so with both branches
      # off it publishes three empty lists and this exports what it always
      # did. No support_normal_maps — brush is given none either.
      support_images: scene.support_views.images?
      support_masks: scene.support_views.masks?
      support_cameras: scene.support_views.cameras?
      # The training views' loss weights (face_priority), as the weights/
      # sidecar brush reads — so this export trains at the same weighting
      # train_splat did. Optional for the same reason as the support_* reads.
      weights: scene.face_priority.weights?
    params:
      output_dir: ${globals.output_root}/colmap_intermediate
      layout: brush

  # The per-view deformation rig for the INTERMEDIATE training, from the
  # INITIAL body — SAM-3D-Body's fit after fit_head_to_face, which is the
  # same body mesh_world already carries for the hollow loss. The final
  # training's rig (build_body_rig below) uses the refit body instead,
  # because by then there is a splat to refit to; here there is not, and
  # measurement says the initial body is just as good for this
  # (b2ctrain docs/STATUS.md, "The rig at the INTERMEDIATE stage").
  #
  # No `world_from_raw` to wire either — the step recovers the raw-to-world
  # similarity from `mesh_raw` against `mesh_world`, which are the same mesh
  # in the two frames.
  - id: build_body_rig_initial
    step: build_body_rig
    when:
      - ${globals.body_rig_intermediate}
    inputs:
      mesh_world: scene.mesh_world
      mesh_raw: scene.vertices
      joints: scene.joints
      rig_binding: scene.rig_binding
    params:
      debug_dir: ${globals.output_root}/debug/body_rig_initial
    outputs:
      body_rig: scene.body_rig_initial
      body_rig_stats: scene.body_rig_initial_stats

  - id: train_splat
    step: brush
    dispatch: in_process
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      normal_maps: scene.normal_maps
      support_images: scene.support_views.images?
      support_masks: scene.support_views.masks?
      support_cameras: scene.support_views.cameras?
      # Per-pixel loss weights for the training views, from face_priority:
      # the denoised frames yield to the face cap over the face. Optional
      # (`?`) so the face branch being off leaves brush training on
      # byte-identical data to before. See steps/brush.py's `weights`.
      weights: scene.face_priority.weights?
      # The body mesh, for the hollow loss (see hollow_weight below).
      mesh: scene.mesh_world?
      # The per-view deformation rig (build_body_rig_initial above), on the
      # initial body. Optional (`?`) so the `body_rig_intermediate` setting
      # being off leaves this training exactly as it was. Only the training
      # frames go into the file steps/brush.py writes — `image_names` is the
      # real frames, the supporting views are appended to the COLMAP model
      # separately — so the face renders stay undeformed by construction.
      body_rig: scene.body_rig_initial?
    params:
      # The expensive knob: brush trains twice in this pipeline (here and
      # train_final_splat) at roughly an hour of GPU each. 30000 equals
      # steps/brush.py's own default; spelled out because it is the one
      # brush setting worth seeing at a glance, and the two trainings could
      # be given different counts here. Everything else brush takes —
      # sh_degree, max_splats, refine_every, the normal-loss group — sits at
      # that step's declared defaults.
      total_steps: 30000
      # NO POLISH, on either training (2026-09-07). This carried
      # `polish_steps: 9000` from 2026-09-05 to 2026-09-07, on brush, where
      # a growth-off warm start from the first export was the single
      # biggest quality lever measured on this training: band-limited face
      # sharpness 143 -> 161, hands 49 -> 55, shoes 31 -> 36, and the
      # RESTART was what did it rather than the extra iterations (39000 in
      # one cold run reached a third of the same gain).
      #
      # Re-measured on b2ctrain, it buys nothing — so it is off, and spelled
      # out here rather than left to the step's default of 0 because this
      # line is where the old finding was. The likely reason is that the
      # lever was never really "more iterations": it was the restart at full
      # mean learning rate, and this trainer's schedule does not leave the
      # same headroom on the table at 30000. It also gives ~2 minutes of a
      # 4070 Ti back per run.
      polish_steps: 0
      # And the mirror image of that: the alignment loop (steps/brush.py's
      # default of 4) was measured on the DELIVERABLE training, not on this
      # one, so this one keeps the training it was tuned as. The reasoning
      # is not that it would not work here — the same loop on a splat five
      # times denser followed the same curve — it is that this splat exists
      # to drive the helical re-render, ~5 minutes is a tenth of its
      # runtime again, and nothing has looked at what a sharper
      # intermediate does to the second denoise pass. Flip it to 4 to find
      # out (docs/final-splat-alignment-guide.md).
      align_iters: 0
      # The hollow loss (b2ctrain, 2026-09-09): splat weight arriving from
      # behind the SAM-3D-Body surface is penalised, which is what makes
      # the front of a shirt opaque instead of a half-transparent layer
      # with the back showing through as the view tilts. The re-render
      # frames come from this splat, so the leak would otherwise be baked
      # into the deliverable's training data. Measured on the deliverable
      # training (below): 0.5 takes the behind-the-body weight from 0.038
      # to 0.0025 for -0.1 dB and +5% time.
      hollow_weight: 0.5
      # Weight on the alpha L1 — how hard the silhouette is fitted to the
      # RMBG matte. 0.5 against brush's own 0.1: measured 17% fewer dark
      # wedges (dark splats in the concave gaps between arm and torso and
      # between fingers, which this flat orbit cannot see into and which
      # open up at the +-30 degree elevations the re-render travels to) at
      # no cost in band-limited sharpness and -0.003 IoU. It matters more
      # since 2026-09-05 than when it was measured: the re-render is made on
      # BLACK now, so a dark wedge is a dark smudge on the frames the second
      # denoise sees rather than something that blends into a grey cull.
      match_alpha_weight: 0.5
      # Also steps/brush.py's default, and spelled out for the same reason:
      # the next-but-one step depends on it. It writes each Gaussian's
      # multi-view evidence into the exported .ply (ev_* properties), which
      # is what rerender_splat's `confidence` reads to gate the render
      # without a second pass over the dataset. Turn it off and that render
      # warns and falls back to plain alpha — i.e. silently back to the
      # behaviour mask_splat used to patch up.
      export_evidence: true
      # Without one of these brush exports into tempfile.gettempdir() (see
      # steps/brush.py) — the trained .ply then only survives because
      # Dataset.to_disk copies it at the very end.
      #
      # `export_dir` under debug/ rather than `output_dir`, since
      # 2026-09-05: this splat is the one that DRIVES the helical
      # re-render, so when the re-render comes out wrong it is the first
      # thing to look at, and it used to land in
      # <output_root>/brush/training_<ms>/ — on the volume, not in the
      # result .zip, and therefore gone with the pod. It rides into the
      # archive's debug/ now, beside the camera dumps and the face splats
      # that are there for the same reason. The collision `output_dir`
      # avoided is still avoided: train_final_splat exports to ply/scene.ply,
      # a different directory and a different name. brush writes nothing
      # else into an export_dir — the COLMAP export it trains from is a
      # TemporaryDirectory — so this puts exactly one file there.
      #
      # It is the biggest thing in debug/ by a long way: a 30,000-iteration
      # training is hundreds of MB, where the rest of that directory is
      # camera dumps and a ~10k-Gaussian face cap.
      export_dir: ${globals.output_root}/debug
      export_name: intermediate_splat.ply
      # The trainer is not named here because there is only one: b2ctrain,
      # steps/brush.py's `brush_path` default since 2026-09-07 — a CUDA
      # trainer with brush's CLI, dataset layout and .ply contract, which
      # REPLACED the Rust brush in the image rather than joining it. On
      # this training's own argv and dataset shape (135 views at 720p,
      # masked supporting views, normals, weights) it measured 2m29s
      # against brush's 9m41s on a 4070 Ti, 871k splats to 837k, 37.0 dB to
      # 35.8 (mask-weighted, against the training frames); with the polish
      # below, 3m44s for the step — that one timed on the fp16-SH build the
      # trainer briefly defaulted to, so read it as a floor. Every flag
      # emitted here is accepted, and the export carries the same ev_*
      # block rerender_splat gates on.
    outputs:
      splat_path: dataset.splat_path

  - id: load_trained_splat
    step: load_splat
    dispatch: in_process
    inputs:
      splat_path: dataset.splat_path
    outputs:
      splat_scene: scene.splat

  # ANCHORED: the bootstrap hands this tail an anchored dataset (its render
  # ran under override_cam_from_mesh), so the helix bends onto the anchor.
  # Since 2026-09-08 the bent helix is then MOVED, rigidly, by the
  # refinement's delta on that anchor (`given_anchor_camera` below): "the
  # world origin" is where the photograph's camera was BEFORE
  # refine_cameras, and the splat was trained after it.
  #
  # This block used to read "the ComfyUI node leaves override_cam_from_mesh
  # off here", and to lean on `inject_anchor` below re-applying the anchor
  # by matching on position afterwards. Both halves were wrong, and together
  # they made the stage-3 re-injection a SILENT NO-OP:
  #
  #   * The base does anchor it. ComfyUI-Body2COLMAP `17f9f1a` ("Anchor
  #     splat and helical paths to the original camera") added the option to
  #     the splat renderer precisely so a helix could pass exactly through
  #     the SAM-3D-Body camera, and the recorded run proves it was used:
  #     cyber_6f/helical (and /splatted, /masked_splatted) carries
  #     anchor_frame_index 37 with that camera at [0, 0, 0] — a key only the
  #     anchored branch republishes. The checked-in resplat_helical.json
  #     omits the widget because it was hand-edited three minutes after that
  #     commit and never regenerated; it is the stale artefact, not the run.
  #
  #   * Matching on position cannot re-apply an anchor to a path that was
  #     never bent to touch it. Measured on the recorded dataset with this
  #     file's own params, the nearest unanchored helical camera is 0.1408
  #     from the anchor against a tolerance of 0.00593 — 24x — so
  #     inject_anchor matched zero frames and denoise_pass2 ran with no real
  #     photograph in its batch and no 0.0 in its VACE mask. Anchored, the
  #     same solve lands a camera at 0.0000 from it.
  #
  # `anchor_position` / `anchor_frame_index` are published from HERE (see
  # outputs), overwriting what refine_cameras left in the extras. That
  # matters as much as the flag: refine republishes the anchor at the pose
  # the bundle adjustment moved it to (~62 mm off the origin on run e593a8),
  # while this path — like steps/render.py's override mode — puts its anchor
  # camera at the world origin, which is where the photograph was taken from
  # and where warp_reference_to_anchor warped it for. Matching the refined
  # position against this path misses by ~10x the tolerance. The extras must
  # describe the path the frames were actually rendered along.
  #
  # Otherwise unchanged: a fresh, longer helix at the dataset's inherited
  # focal length. `fill_ratio` and `bounds_source` are steps/splat.py's
  # declared defaults and the anchored path consults neither — it takes its
  # target and radius from the source render's own orbit_target and framed
  # focal length, which is what keeps this render's anchor frame identical
  # to the mesh render's.
  #
  # `framing: ${globals.framing}` keeps this render in step with
  # render_initial_views, which frames the mesh at that same preset — the
  # splat re-render has to match it or the two disagree about how tight the
  # body fills the frame.
  # Body refit (docs/body-refit.md): the splat trained above is where the
  # subject actually is; the body model has not moved since the photograph.
  # `splat_surface` samples the splat's median surface through the trainer's
  # probe; `refit_body_to_splat` re-runs the MHR forward with root, pose,
  # scales and shape free against it and republishes the body — vertices,
  # skeleton, pose parameters, and the world-frame mesh the final training's
  # hollow loss takes. Runs before the second pass re-renders the splat so the
  # debug bundle carries the refit beside the intermediate splat it was fitted
  # to; nothing between here and train_final_splat reads the body.
  - id: splat_surface
    step: splat_surface
    dispatch: in_process
    when:
      - ${globals.refit_body}
      - ${globals.export_ply}
    inputs:
      splat_path: dataset.splat_path
      cameras: dataset.cameras
    params:
      debug_dir: ${globals.output_root}/debug/splat_surface
    outputs:
      surface: scene.splat_surface

  - id: refit_body
    step: refit_body_to_splat
    dispatch: subprocess
    env: sam3dbody
    when:
      - ${globals.refit_body}
      - ${globals.export_ply}
    inputs:
      mesh_output: scene
      mesh_world: scene.mesh_world
      surface: scene.splat_surface
    params:
      debug_dir: ${globals.output_root}/debug/body_refit
    outputs:
      vertices: scene.vertices
      keypoints_3d: scene.keypoints_3d
      joints: scene.joints
      global_rots: scene.global_rots
      pose_params: scene.pose_params
      mesh_world: scene.mesh_world
      world_from_raw: scene.world_from_raw
      rig_binding: scene.rig_binding
      body_refit_stats: scene.body_refit_stats
      body_params: scene.body_params

  # The per-view deformation rig for the final training (pipeline/body_rig.py):
  # the refit body's skinning and joint tree; every joint but the root chain
  # gets a per-view rotation the trainer learns, which is what removes the
  # double limb the generated frames' arm motion left in the splat.
  - id: build_body_rig
    step: build_body_rig
    when:
      - ${globals.refit_body}
      - ${globals.export_ply}
    inputs:
      mesh_world: scene.mesh_world
      joints: scene.joints
      world_from_raw: scene.world_from_raw
      rig_binding: scene.rig_binding
    params:
      debug_dir: ${globals.output_root}/debug/body_rig
    outputs:
      body_rig: scene.body_rig
      body_rig_stats: scene.body_rig_stats

  - id: rerender_splat
    step: render_splat
    dispatch: in_process
    inputs:
      splat_scene: scene.splat
      # The trained .ply itself, so the render reads it where it lies. Without
      # this the step stages `splat_scene` through SplatScene.to_ply, which
      # writes the standard 3DGS columns only: the ev_* block train_splat
      # exported is dropped on the floor, brush-splat-render warns
      # "--confidence without evidence", and the gate below silently
      # degenerates to plain alpha. Found 2026-09-07 on the first b2ctrain
      # run; the gap predates the trainer swap. Wiring the path also skips
      # serialising ~900k Gaussians to a temp dir before every render.
      splat_path: dataset.splat_path
      dataset: dataset
      # The anchor camera as render_initial_views built it: the photograph's
      # camera at the origin, look_at-turned. `refine_cameras` has since
      # moved the dataset's copy of it — 0.9-1.6 deg / 41-68 mm in every
      # run since 2026-09-04, 8-10 px at the subject — and train_splat
      # trained on the moved one, so the splat's subject sits where the
      # REFINED anchor sees it. Wired, this render carries that delta onto
      # the whole helix, rigidly: frame 37 lands on the refined anchor
      # camera, the photograph reinject_anchor puts there agrees with the
      # splat renders either side of it, and the path keeps its shape. The
      # published anchor_position below is the moved one, so the injection
      # still matches at d=0. See splat.py's _carry_anchor_refinement.
      given_anchor_camera: scene.image_warp.camera
    params:
      width: ${globals.resolution.0}
      height: ${globals.resolution.1}
      framing: ${globals.framing}
      pattern: helical
      n_frames: 81
      n_loops: 2
      amplitude_deg: 30.0
      # See the block above. Anchoring needs a dataset whose original camera
      # is at the world origin, which render_initial_views' override mode
      # guarantees (extras['original_focal_length'] is its marker).
      override_cam_from_mesh: true
      # Bands 0..2 of the splat's 3: the one render in the workflow that
      # leaves the highest band out. The step's default (3) renders every
      # band the splat carries, and every other render_splat keeps it.
      sh_degree: 2
      # 30/90, not the 45/45 the solver defaults to — the values
      # resplat_helical.json's Body2COLMAP_HelicalPath node carries.
      lead_in_deg: 30.0
      lead_out_deg: 90.0
      # Gate the render on the evidence train_splat wrote into the .ply,
      # which is what makes mask_splat's thresholding stage unnecessary
      # below. The alpha that comes back is the gate, not accumulated
      # opacity, and the RGB is composited over `cull_color`. `bg_color` is
      # ignored in this mode and is therefore not set here. See
      # docs/spatial-reinforcement.md.
      confidence: true
      # 0.5 GREY again (the step's default), as of 2026-09-07. It was black
      # from 2026-09-05: the argument was that a culled pixel is a hole in
      # the SUBJECT and should read as missing rather than as backdrop,
      # since the matte comes from `resplat_foreground_masks` and
      # `mask_splat_fringes` lays the result over grey anyway. What that
      # bought turned out to be the artifact: culled pixels showed up as
      # black speckles along the face cap's rim and as patches on the
      # specular top, and a black hole inside a face is a defect the second
      # denoise faithfully keeps. The culls themselves came from the
      # evidence's view count (b2ctrain bf0bab5: `ev_views` was a
      # thresholded count that gave fine splats zero support; now an
      # effective count), which removes nearly all of them — and what
      # little the gate still rejects is better filled with the colour the
      # frames end on than with a black mark. One colour for the reject and
      # the composite also means partial coverage fades toward the value
      # the pixel resolves to, so there is no dark halo at the silhouette
      # for rmbg's matte to cut.
      cull_color: [0.5, 0.5, 0.5]
      # Tuning for the confidence measure itself, passed verbatim to
      # brush-splat-render. Both were measured on a real run's .ply with the
      # fixed evidence (brush a9405881; docs/intermediate-splat-guide.md):
      #
      #   --conf-tau 0.3      the `agree` term's tolerance. The default 0.08
      #                       is too tight for a view-dependent material and
      #                       culled the subject's specular top outright
      #                       (67% of its pixels); 0.3 keeps it, 0.16 is a
      #                       middle if something over-survives.
      #   --conf-angle-margin 45
      #                       the `coverage` term's slack. The face cap's
      #                       views sit in a 30-degree disc, and this helix
      #                       travels to +-30 of elevation, so the default
      #                       margin culled the face at the extremes; 45
      #                       lets the whole helix through, 60 keeps a
      #                       little more face and a little more fringe.
      #
      # Together with the evidence fix they take the culled fraction of the
      # subject from 30% to 6.4% and the silhouette IoU from 0.70 to 0.92.
      # `gate_lo`/`gate_hi` are NOT the lever and stay at the step's
      # 0.45/0.65: 0.55/0.75 culls 43% of the subject to remove a quarter of
      # the dark-fringe pixels, and no lo/hi separates fringe from subject.
      conf_args: ["--conf-tau", "0.3", "--conf-angle-margin", "45"]
      # NO room here either, as of 2026-09-05 — the two denoise passes agree
      # again, and they agree on nothing. render_initial_views lost the grid
      # on 2026-09-04 to isolate one variable and this render kept it for a
      # day, which left pass 1 denoising a subject standing in emptiness and
      # pass 2 seeing that same subject composited onto a real ruled room.
      # One line is the cheaper ablation, and both passes off is the
      # baseline nothing on this pipeline has been compared against.
      #
      # THE PROMPT STAYS AS IT IS. Both denoise passes still describe the
      # gridded room in their 场景 slot, deliberately: the prompt is what the
      # model paints a background out of when the control frames show none,
      # and the lighting claims that make the shading world-fixed
      # ("灯光属于房间本身", a point on the distant wall) lean on a room
      # existing. It is a contradiction — frames with no room, a prompt with
      # one — and it is the same one pass 1 has carried since 2026-09-04,
      # now stated in both places rather than one. If the rooms the model
      # invents disagree between the passes, or the subject is relit between
      # them, this is the pair to settle, and steps/backdrop.py's docstring
      # is the argument for putting the grid back rather than the prompt's
      # room out.
      #
      # What this line was, and how to put it back: `background: grid` with
      # `background_base_color: [0.5, 0.5, 0.5]`. Mechanically the backdrop
      # is composited by steps/backdrop.py rather than by the rasteriser —
      # it un-composites `cull_color` back out and re-composites over the
      # environment — so it would now be un-compositing BLACK, which is
      # exact wherever the gate culled and would put the room inside the
      # subject's own holes. Restoring the room means restoring the grey
      # cull colour above and the grey composite below with it; the three
      # were one decision.
      #
      # The fade is not part of any of this: `render_splat` does not declare
      # the fade params at all, and never did. The shell it fades against is
      # an ellipsoid fitted to MESH VERTICES, and a .ply has none.
      background: ""
    outputs:
      images: dataset.images
      masks: dataset.masks
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      # Where THIS path put the anchor, replacing what refine_cameras left
      # in the extras — see the block above.
      anchor_position: dataset.extras.anchor_position
      anchor_frame_index: dataset.extras.anchor_frame_index

  # ---------------------------------------------------------------- stage 3
  # The matte the frames below are cut with. It REPLACES the splat render's
  # own alpha in dataset.masks, which is the one place in this file a step
  # overwrites that field on purpose (tests/test_workflows.py knows about
  # this one by name).
  #
  # Why not the render's alpha, which is right there and free: it is the
  # confidence gate, and the gate is a statement about the TRAINING — which
  # Gaussians the views constrained — not about where the subject is in
  # this frame. Its edge is the fringe of an under-observed Gaussian, and
  # holes in it are places the fit is unsure of, which is exactly what the
  # second denoise is being asked to repaint. Cutting the background with
  # it would cut those holes out of the frame instead, and feather the
  # silhouette wherever the splat is thin. rmbg answers the other question
  # — measured against these pixels, this frame, nothing else — and it is
  # the same matte brush was trained on at `foreground_masks`, one denoise
  # pass earlier.
  #
  # The gate is not wasted: it has already been applied, to the RGB, by the
  # render above. Culled pixels come through BLACK, and black on a grey
  # composite is a hole in the subject rather than a hole in the frame.
  - id: resplat_foreground_masks
    step: rmbg
    dispatch: in_process
    inputs:
      images: dataset.images
    outputs:
      masks: dataset.masks

  # This used to be the stage that dropped the splat's low-confidence
  # fringes: threshold the render's alpha at 239/255, dilate by 2,
  # composite over black, bilateral-filter (`mask_splat.json`'s subgraph,
  # at `fast helical.yaml`'s 6/2). rerender_splat's `confidence` above
  # decides that better — once, in 3-D, from what the training views
  # actually constrained rather than from accumulated alpha per pixel per
  # frame — so the cut is gone and what is left of the old subgraph is the
  # COMPOSITE: the subject laid over 0.5 grey with the matte the step above
  # produced, softness and all, no threshold and no bilateral filter to
  # smear an edge that is already right.
  #
  # 0.5 grey, the same colour the render above culls to (rerender_splat's
  # `cull_color`, grey again since 2026-09-07 — it was black for two days,
  # and the black culls inside the subject were the face-rim speckles): a
  # culled pixel and the background resolve to the one value the batch is
  # handed to the denoise on — the same 0.5 the warped anchor photo's
  # border is filled with, so the one real frame in the batch does not
  # arrive as the odd one out.
  #
  # The step's other half is unchanged and still needed: replacing the
  # per-pixel matte in dataset.masks with the per-frame all-1.0 VACE batch
  # that denoise_pass2 reads and reinject_anchor writes its 0.0 into.
  # Ordering is unchanged and still load-bearing (see below). To A/B against
  # the recorded ComfyUI run, set `mode: threshold` and turn rerender_splat's
  # `confidence` off — 6/2 is that step's own default.
  - id: mask_splat_fringes
    step: mask_splat
    dispatch: in_process
    inputs:
      dataset: dataset
    params:
      mode: composite
      bg_color: [0.5, 0.5, 0.5]
    outputs:
      dataset: dataset

  # Put the warped reference photo back onto whichever new frames landed on
  # the original camera. Matches by position, so it survives the reorbit —
  # but only because rerender_splat above ANCHORED its helix and published
  # where it put the anchor. A position match cannot re-apply an anchor to a
  # path that never passes through it; with the re-render unanchored (as
  # this file had it until 2026-09-04) the nearest camera is ~24x the
  # tolerance away, this step matches nothing, and denoise_pass2 runs with
  # no real photograph in its batch. It now says so in the log either way.
  #
  # AFTER mask_splat, not before it — the ordering is load-bearing and was
  # wrong. Before mask_splat this step sits where dataset.masks is carrying
  # rerender_splat's per-pixel splat alpha, and it would overwrite exactly
  # the input mask_splat exists to threshold. Here it only ever sees VACE
  # masks: mask_splat has already consumed the alpha and emitted all-1.0.
  #
  # This reproduces cyber2_6f/masked_splatted frame for frame: 80 frames
  # masked and filtered at alpha 255, and frame_00038_ the anchor.png
  # verbatim — not composited over black, not bilateral-filtered — at
  # alpha 0.
  - id: reinject_anchor
    step: inject_anchor
    dispatch: in_process
    inputs:
      images: dataset.images
      cameras: dataset.cameras
      anchor_position: dataset.extras.anchor_position
      anchor_image: dataset.anchor_image
      # mask_splat's all-1.0 batch, passed through with 0.0 written at the
      # anchor frame. Manufacturing it here instead would give the same
      # values today; wiring it keeps the step from silently destroying a
      # mask that matters if anything is ever inserted above it.
      masks: dataset.masks
    outputs:
      images: dataset.images
      masks: dataset.masks

  # ---------------------------------------------------------------- stage 4
  # denoise.json again, strength 0.8 — clean up the re-render.
  - id: denoise_pass2
    step: wan22_vace_denoise
    dispatch: subprocess
    env: wan22
    # See denoise_pass1: both passes must declare keep_loaded for the two of
    # them to share one resident worker.
    keep_loaded: true
    inputs:
      control_video: dataset.images
      control_masks: dataset.masks
      reference_image: dataset.reference_image
      subject_desc: dataset.prompt
    params:
      width: ${globals.resolution.0}
      height: ${globals.resolution.1}
      # Same as denoise_pass1 except the sampler and the scale, which are
      # this pass's own — see below.
      #
      # UNREVIEWED against the render above (2026-08-30, still true): these
      # frames are a subject cut out of 0.5 GREY — by rmbg's matte since
      # 2026-09-05, over a render made on black — and the negative prompt
      # still asks against 整体发灰 ("an overall grey cast"). Neither prompt
      # mentions a background at all, so nothing here is knowably wrong, but
      # this is the pair to look at first if denoise_pass2's output changed
      # character. Left alone deliberately: a prompt edit is a quality
      # decision for a real run to make, not a side effect of a render
      # change. The other half of the same question is the 场景 slot, which
      # describes a room neither pass's control frames now show — see
      # denoise_pass1.
      steps_high: 2
      steps_low: 4
      cfg: 1.0
      seed: ${globals.seed}
      # The pass-2 quality sweep's settings (docs/vace-denoise-findings-
      # 2026-09-07.md, section 6; six runs F1-F6 on E4's pass 1, 2026-09-08),
      # applied 2026-09-09. This pass's control is a splat render, not a
      # drawing, and the sweep found the sampler axis dead or harmful on
      # it: shift 8 (the step's default, and what shipped here) cost 3.2
      # points of the deliverable's head sharpness for +0.09 dB (F4);
      # `uni_pc` on the high-noise expert cost 2.8 points, 0.6 dB and 8%
      # flow, and painted the hardest hallucinated tile grid of the batch
      # (F5) — the sampler that hugs the control hardest hugs a splat
      # render that has no detail to hug; shift 5 bought nothing (F3), and
      # a 3/3 expert split bought nothing over 2/4 (F6). Euler on the
      # opening steps at shift 2.5 is the corner every one of those was
      # measured against, and the one nothing beat.
      #
      # The scale is a flat 0.8 on every step. Strength on this pass is a
      # dial that turns the same way on three instruments — 0.6 / 0.8 /
      # 1.0 gave PSNR 24.77 / 25.75 / 26.29 dB, flow 1.389 / 1.189 /
      # 1.007 and BA inflation 0.067 / 0.028 / 0.006 — paid in the frames'
      # own texture the other way (frame head s1 40.2 / 39.3 / 37.4). 1.0
      # is the fidelity end (F1: a re-render with a small blur, and the
      # deliverable the fit can hold); 0.6 is the wrong side of the curve
      # (it invents: a tile grid, ceiling lights, eyeshadow); 0.8 is the
      # compromise, chosen for the texture. No taper: the taper to 0 this
      # shipped with, `[0.8, 0.8, 0.6, 0.4, 0.2, 0]`, was pass 1's shape
      # scaled, and pass 1's reason for it (the skeleton ink) does not
      # exist on a splat render — a step at scale 0 here is a step the
      # model spends inventing.
      #
      # None of this sharpens the head: the final head sat at or below its
      # control's in all six runs, whatever this pass did — head detail is
      # decided upstream of this pass. The obvious lever, masking the face
      # cap out of this pass's VACE mask so it reproduces the trained
      # splat's face instead of repainting it, was wired on 2026-09-09 and
      # backed out the same day: it was detrimental to the splat
      # (docs/face-priority.md, "Tried and backed out").
      sampler_high: euler
      sampler_shift: 2.5
      strength: [0.8, 0.8, 0.8, 0.8, 0.8, 0.8]
      prompt: "人工光、柔光、低对比度、环绕运镜。时间静止，人物完全静止。身体\
        如雕塑般僵硬，胸口没有起伏，头部保持固定角度，面部肌肉完全不动，维持单\
        一的中性表情。双眼一眨不眨，眼睑保持张开且稳定，目光空洞而固定，锁定远\
        处墙面上的一个点，对镜头毫无察觉、毫无反应。人物站在一间空房间里：灰色\
        墙面上有均匀的网格线，深色地板，浅色天花板，墙面相交处有清晰的墙角。房\
        间本身固定不动，镜头以匀速、固定焦距围绕主体平滑移动，墙角依次从画面中\
        掠过。灯光属于房间本身，位置固定：主光始终来自人物自身的左前方，右侧是\
        柔和的补光。人物身上的明暗、阴影与高光始终停留在同一片皮肤和衣物上，每\
        一帧完全相同——左侧始终是受光面，右侧始终是柔和的暗面；镜头绕到人物右侧\
        时，看到的正是那一侧的暗面。房间里的阴影同样固定：墙面上的明暗、以及人\
        物投在地面上的影子，始终落在房间中的同一位置，不随镜头移动。 Time is \
        frozen and only the camera moves. The gaze stays anchored to that \
        point on the wall as the camera passes, so the eyes slide across the \
        frame, always aimed past the lens at the wall behind it. Eyelids stay \
        open and steady, the expression holds without a single \
        micro-movement, and the head keeps its exact angle throughout. The \
        frozen subject is $SUBJECT_DESC$, standing in an empty room: grey \
        walls ruled with an even grid, a dark floor and a lighter ceiling, \
        meeting at clear corners. The room is fixed in place and the camera \
        travels through it, so the walls and their corners sweep past the \
        frame while the room itself never turns. Soft, low-contrast studio \
        light: the key sits high on the subject's own left, a soft fill on \
        their right, both fixed to the room and holding still while the \
        camera arcs around. Every highlight and shadow stays welded to the \
        same patch of skin and cloth from the first frame to the last, so \
        their left remains the lit side and their right remains the \
        soft-shadowed side for the whole circle; as the camera arcs round to \
        their right it sees that shadowed side. The room's shadows are just \
        as fixed: the shading on the walls and the shadow the subject casts \
        on the floor stay in the same place in the room in every frame, and \
        do not swing round with the camera. Matte skin, matte cloth, \
        photorealistic, sharp focus, identical face, clothing and lighting in \
        every frame."
      negative_prompt: "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静\
        止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的\
        手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体\
        ，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走, \
        chewing, tattoos, 眼球运动，眨眼，眼动追踪，微表情，面部抽动，头部移\
        动, 小头, 小脸"
    outputs:
      images: dataset.images

  # --------------------------------------------------------------- stage 4b
  # Debug deliverable: a COLMAP dataset from the pre-upscale frames, for
  # comparing splat quality with and without SeedVR2. Part of the debug
  # bundle — it lands in `colmap_preupscale/` and is archived under
  # `debug/` — and AND-ed with run_upscale, because with the upscale off
  # stage 6 already exports these same frames and this would be colmap/
  # under a second name. rmbg is recomputed here rather than reused from
  # stage 6: that one runs after the upscale, on 1080x1920 frames.
  #
  # No normals. This export used to carry a `normals/` sidecar estimated by
  # sapiens2_lite, for a brush training to supervise on; normal supervision
  # is off for the deliverable splat since 2026-09-06 — measured as a
  # straight loss, -18% band-limited sharpness AND -1.8 dB fidelity, and
  # recomputing the maps from better images does not rescue it
  # (docs/final-splat-alignment-guide.md §1) — so the maps had no consumer
  # left, at ~2 GB of host RAM and a Sapiens2 pass each.
  - id: export_masks_preupscale
    step: rmbg
    dispatch: in_process
    when:
      - ${globals.export_debug}
      - ${globals.run_upscale}
    inputs:
      images: dataset.images
    outputs:
      masks: dataset.masks

  - id: export_colmap_preupscale
    step: colmap_export
    dispatch: in_process
    when:
      - ${globals.export_debug}
      - ${globals.run_upscale}
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
    params:
      output_dir: ${globals.output_root}/colmap_preupscale
      layout: brush

  # ---------------------------------------------------------------- stage 5
  # upscale.json — skipped entirely when run_upscale is false.
  #
  # seedvr2 resamples the frames and, in the same step, rescales the
  # dataset's camera intrinsics to match: it runs in its own venv, so the
  # IPC boundary in only carries plain arrays, not Camera objects, and
  # without the rescale the dataset would come out of this step holding
  # 1080x1920 images described by 720x1280 intrinsics — both stage-6
  # consumers would then believe the wrong focal length. cameras.txt would
  # claim a 720x1280 PINHOLE camera, and brush would fit a splat at half
  # the focal length the images were rendered with. The recorded ComfyUI-
  # era export has exactly this mismatch (cyber_6f/colmap: 720x1280
  # intrinsics, 1080x1920 frames), so this is an inherited bug, not a new
  # one — and a prime suspect for output that looks *almost* right. See
  # steps/seedvr2.py.
  - id: upscale
    step: seedvr2
    dispatch: subprocess
    env: seedvr2
    when: ${globals.run_upscale}
    inputs:
      images: dataset.images
      cameras: dataset.cameras
    params:
      # SeedVR2's `resolution` is the target output *shortest edge*, not a
      # multiplier — asking for less than the input's shortest edge
      # downscales. See steps/seedvr2.py.
      #
      # 1080, not the 1440 this was: the frames feed a Gaussian splat, and a
      # splat does not resolve detail the way a video does — past roughly
      # the native render size the extra pixels mostly buy training time and
      # VRAM. 720x1280 in, 1080x1920 out, which is also what the recorded
      # ComfyUI-era upscale produced (cyber_6f/upscaled).
      resolution: 1080
      # steps/seedvr2.py defaults this to 5; 1 is this workflow's own
      # choice — raise it once a real VRAM budget for the upscale is known.
      batch_size: 1
      vae_encode_tiled: true
      vae_decode_tiled: true
      # Was 42, its own number, while both denoise passes were 0. One
      # `seed` setting now feeds all three, so a run is one sample rather
      # than three unrelated ones.
      seed: ${globals.seed}
    outputs:
      images: dataset.images
      cameras: dataset.cameras
      resolution: dataset.resolution

  # ---------------------------------------------------------------- stage 6
  # colmap.json: background-remove the frames as they finally are, then emit
  # whichever deliverables were selected.
  - id: export_masks
    step: rmbg
    dispatch: in_process
    inputs:
      images: dataset.images
    outputs:
      masks: dataset.masks

  # There used to be a second sapiens2_lite here, estimating normals for
  # these frames — the stage-2 maps do not describe them, since
  # rerender_splat replaced the dataset wholesale with a longer orbit and
  # the upscale changed the resolution — so that the deliverable training
  # could supervise on them. It is gone with the supervision itself
  # (2026-09-06): the normal loss measured as a straight loss on this splat,
  # -18% band-limited sharpness AND -1.8 dB fidelity, and recomputing the
  # maps from the aligned images rescued nothing (22.0 against 21.8, inside
  # the noise) — the harm is the loss term, not the quality of the maps
  # feeding it. See docs/final-splat-alignment-guide.md §1. That took ~2 GB
  # of host RAM and a Sapiens2 pass over 81 upscaled frames with it, and
  # both deliverables below now go without a `normals/` sidecar.
  #
  # This says nothing about the STAGE-2 training, where normal supervision
  # still helps and scene.normal_maps is still computed and wired.

  # ------------------------------------------- refining the cameras (stage 6)
  # The same refinement again, and it is needed again for the same reason:
  # rerender_splat replaced the dataset wholesale with a NEW generated path
  # — a longer helical orbit, 81 fresh poses solved from a pattern rather
  # than measured — so the corrections made back in stage 2 do not describe
  # these cameras at all. The frames have also been through a second
  # diffusion pass and an upscale since, which is more of the disagreement
  # this exists to absorb, not less.
  #
  # Placed here, after export_masks and export_normals, so both stage-6
  # consumers below read the same corrected poses: the COLMAP dataset a run
  # hands back and the deliverable .ply trained from it. It reads
  # export_masks' mattes, which is why it cannot sit any earlier than this —
  # dataset.masks between mask_splat_fringes and here is the all-1.0 VACE
  # batch, and a solve masked to "everything" is the unmasked variant under
  # a different name.
  #
  # It does NOT cover export_colmap_preupscale (stage 4b), which is the one
  # export that necessarily sees the given poses. That export exists to
  # measure what SeedVR2 does to splat quality by comparison with colmap/,
  # and refining it would have to be its own solve against its own frames —
  # a second three-minute run for a debug artefact. Worth knowing when
  # comparing the two, which is why it is written down rather than left to
  # be discovered.
  #
  # Same defaults as the stage-2 instance. `train_final_splat` is gated on
  # export_ply and this is not: export_colmap wants the corrected poses too,
  # and the two switches are independent.
  - id: refine_cameras_final
    step: refine_cameras
    dispatch: in_process
    when: ${globals.refine_cameras}
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      images: dataset.images
      masks: dataset.masks
      # The helix's anchor (37), as rerender_splat published it — so the
      # "anchor frame is left N deg" line and stats.json's anchor_residual
      # are about the photograph, not frame 0. Until 2026-09-08 this was
      # unwired and both described a synthetic frame.
      anchor_frame_index: dataset.extras.anchor_frame_index?
    params:
      debug_dir: ${globals.output_root}/debug/refine_cameras_final
    outputs:
      cameras: dataset.cameras
      stats: scene.camera_refinement_final

  # ------------------------------------------- the face per view (stage 6)
  # steps/face_views.py, docs/face-refine.md. After the refinement, so the
  # per-view fit looks through the cameras the training will use; before
  # export_colmap, so the delivered dataset is the one the splat was trained
  # on (eyes and all). All four are one switch, `face_refine`, and need the
  # refit body: its head is what gets fitted, its rig is what the face
  # deltas ride on.
  #
  # 1. Landmarks per frame, from the projected head. Main env (MediaPipe,
  #    no detector — the pipeline's detector misses the 80 px face in 63 of
  #    81 helical frames). ~35 of 81 landmarked, every view facing the
  #    camera within ~85 degrees.
  - id: detect_face_views
    step: detect_face_views
    dispatch: in_process
    when:
      - ${globals.face_refine}
      - ${globals.refit_body}
      - ${globals.export_ply}
    inputs:
      images: dataset.images
      image_names: dataset.image_names
      cameras: dataset.cameras
      mesh_world: scene.mesh_world
      joints: scene.joints
      keypoints_3d: scene.keypoints_3d
      world_from_raw: scene.world_from_raw
      face_correspondence: scene.face_correspondence
    params:
      debug_dir: ${globals.output_root}/debug/face_views
    outputs:
      face_views: scene.face_views

  # 2. The head fitted to each of them, all views in one batched run on the
  #    MHR model (sam3dbody env, the same checkpoint fit_head_to_face and
  #    refit_body loaded). The anchor photograph joins the batch through a
  #    PnP camera so its lids are fitted too — the eye texture below is
  #    taken through them. 6.4 -> 2.1 px rms; ~20 s on a 4070 Ti.
  - id: fit_head_per_view
    step: fit_head_per_view
    dispatch: subprocess
    env: sam3dbody
    when:
      - ${globals.face_refine}
      - ${globals.refit_body}
      - ${globals.export_ply}
    inputs:
      mesh_output: scene
      world_from_raw: scene.world_from_raw
      face_correspondence: scene.face_correspondence
      face_views: scene.face_views
      face_landmarks: scene.face_landmarks
      image: scene.front_image
    params:
      debug_dir: ${globals.output_root}/debug/head_fit_views
    outputs:
      head_fit_views: scene.head_fit_views

  # 3. The anchor's eyes into every fitted frame. Main env (pyrender). The
  #    frames go back into dataset.images: export_colmap and the final
  #    training both see them; debug/eyes/panel.jpg shows before/after.
  - id: paste_eyes
    step: paste_eyes
    dispatch: in_process
    when:
      - ${globals.face_refine}
      - ${globals.refit_body}
      - ${globals.export_ply}
    inputs:
      images: dataset.images
      image_names: dataset.image_names
      cameras: dataset.cameras
      head_fit_views: scene.head_fit_views
      face_correspondence: scene.face_correspondence
      image: scene.front_image
      face_landmarks: scene.face_landmarks
    params:
      debug_dir: ${globals.output_root}/debug/eyes
    outputs:
      images: dataset.images
      eye_stats: scene.eye_stats

  # 4. The fit as the rig's per-view vertex displacements (rig v3,
  #    pipeline/body_rig.py), face core only, unfitted frames holding their
  #    fitted neighbour. Republishes scene.body_rig, which train_final_splat
  #    already reads.
  - id: build_face_rig
    step: build_face_rig
    dispatch: in_process
    when:
      - ${globals.face_refine}
      - ${globals.refit_body}
      - ${globals.export_ply}
    inputs:
      body_rig: scene.body_rig
      head_fit_views: scene.head_fit_views
      image_names: dataset.image_names
    params:
      debug_dir: ${globals.output_root}/debug/face_rig
    outputs:
      body_rig: scene.body_rig
      face_rig_stats: scene.face_rig_stats

  # Deliverable 1: a COLMAP dataset. `layout: brush` puts the frames in
  # images/ beside the three .txt files — what brush itself reads, and what
  # somebody handed this directory expects, rather than the flat
  # frames-beside-the-txt layout the ComfyUI colmap.json stage wrote. No
  # normals/ since 2026-09-06 (see above): the training that read them
  # stopped, and a sidecar nothing in this pipeline consumes is not worth a
  # Sapiens2 pass over 81 upscaled frames.
  - id: export_colmap
    step: colmap_export
    dispatch: in_process
    when: ${globals.export_colmap}
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
    params:
      output_dir: ${globals.output_root}/colmap
      layout: brush

  # Deliverable 2: the trained splat. This is a second full brush training
  # — the stage-2 one exists to drive the helical re-render and predates the
  # second denoise pass and the upscale, so it is not the splat anyone wants
  # to keep. `export_dir` puts this one at a predictable path instead of
  # brush/training_<ms>/, which is the whole reason the final splat can be
  # `ply/scene.ply`.
  #
  # It is the training the 2026-09-06 measurement session was run against
  # (docs/final-splat-alignment-guide.md), and the two things that session
  # found are set below: normal supervision off, and the alignment loop on.
  # Both are steps/brush.py defaults now, so what is spelled out here is the
  # part that would be a silent regression if it moved.
  - id: train_final_splat
    step: brush
    dispatch: in_process
    when: ${globals.export_ply}
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      # The body mesh, for the hollow loss (see hollow_weight below).
      mesh: scene.mesh_world?
      # The refitted MHR body (parameters, frame, posed skeleton), written
      # into scene.ply's header as b2c.mhr.* comments — the deliverable
      # carries its own skeleton for whoever binds and animates it.
      body_params: scene.body_params?
      # The per-view deformation rig (build_body_rig): --body-rig on the
      # trainer, per-view joint rotations, canonical export. With
      # face_refine on it also carries build_face_rig's per-view face
      # deltas (rig v3).
      body_rig: scene.body_rig?
      # No normal_maps, and no step computing them any more (see above).
      # brush only emits the normal-loss flags when this input is wired, so
      # the absence is already the whole of "supervision off" — the explicit
      # 0.0 below is there in case anyone wires it back.
      #
      # NO support_* here, deliberately. The face splat's renders were
      # taken along the CIRCULAR bootstrap orbit and belong to the training
      # that ran on it; by this point the dataset is the helical re-render,
      # denoised a second time and upscaled, and those renders are stale in
      # both senses — wrong path, and a resolution and a diffusion pass
      # behind the frames beside them. Wiring `scene.support_views.*` in
      # here would not fail, which is exactly why it is called out: the
      # path is still populated from stage 1.
    params:
      # See train_splat's note. Same count; a run tuning the deliverable
      # splat alone changes it here.
      total_steps: 30000
      # The hollow loss, measured on this training with a Poisson proxy of
      # the body mesh (b2ctrain out/hollow, 2026-09-09): weight arriving
      # from behind the body 0.038 -> 0.0025 (15x less), weight from >3 cm
      # behind the first surface 0.146 -> 0.100, PSNR 35.46 -> 35.36 dB,
      # +2.6% splats, +5% time. 2.0 goes further (0.0005, 0.092) for
      # -0.2 dB; 0.5 is the conservative choice until a real run has been
      # looked at. See train_splat.
      hollow_weight: 0.5
      # 3 cm behind the REFIT body (splat_surface / refit_body above), measured
      # 2026-09-09 as equal PSNR to 5 cm with four times less weight behind the
      # body; 2 cm measured best still, on the one example run. With refit_body
      # off this margin applies to SAM-3D-Body's own mesh, where 5 cm was the safe
      # setting (docs/body-refit.md).
      hollow_margin: 0.03
      # Normal supervision off, measured on THIS training (guide §1): it
      # costs 4.7 band-limited s1 (-18%) and 1.8 dB of fidelity at once,
      # which is the tell that it is a straight loss rather than a
      # sharpness-for-accuracy trade. Inert while no normal_maps input is
      # wired, and the guard if one ever is again.
      normal_loss_strength: 0.0
      # The alignment loop, four iterations (steps/brush.py's own default,
      # spelled out because it is the single biggest measured lever on the
      # deliverable and roughly 5 minutes of the run): 21.1 -> 23.8 face
      # s1, novel views gaining in the same ratio, fidelity rising with it.
      # Worth as much as brush's dense growth at a fifth of the .ply size,
      # which is why the growth knobs beside it are left at brush's own
      # defaults (guide §2 — they stack, at 4.6x the asset).
      #
      # align_flow_sigma/align_flow_cap take one value per iteration and are
      # left at their default of 6 px throughout, which is what the
      # trajectory above was measured with. The schedule to try if this is
      # ever tuned is a finer field once the render it aligns against has
      # converged: [6, 6, 3, 3] with a cap of [6, 6, 12, 12].
      align_iters: 4
      # An hour of GPU per run, and everything the loop touches is
      # transient — the warped frames go with brush's COLMAP temp directory
      # and every iteration exports over the same .ply. This keeps each
      # iteration's per-view flow figures and one warped frame beside the
      # render it was warped onto, in the debug/ bundle the result .zip
      # already carries, so a soft or torn splat has something behind it
      # besides log lines. A few hundred KB and two PNGs an iteration.
      align_debug_dir: ${globals.output_root}/debug/alignment
      export_dir: ${globals.output_root}/ply
      export_name: scene.ply
      # No polish here either — the step's default, spelled out because
      # this training used to carry the note that a polish had never been
      # measured on a deliverable splat. It has now (2026-09-07, on
      # b2ctrain, both stages): it does not improve quality, so neither
      # training runs one. See train_splat.
      polish_steps: 0
      # See train_splat for the trainer. The one part of it that is not a
      # drop-in is the alignment loop above: b2ctrain runs it INSIDE the
      # training (steps/brush.py's `align_backend: auto` asks the binary),
      # so this is one invocation — the renders, flow and warps on the GPU
      # against the frames it already holds, the four refits in the same
      # process. What that removes per iteration is a brush-splat-render
      # process, a Python DIS flow over 81 frames and a re-invocation that
      # reloads the dataset and the .ply: ~2m50s for the whole step against
      # 5m30s for the same loop driven from here (`align_backend:
      # pipeline`, which still works and is the A/B reference), and the
      # cold run alone is 1m40s against brush's 6m47s on this dataset's
      # shape (81 views, 1080p), 364k splats to 356k, at equal or better
      # PSNR. alignment.json and the sample frames under align_debug_dir
      # are written by the trainer in the same layout.
      #
      # NOT yet checked in-trainer: the band-limited face sharpness the
      # loop's settings were tuned on (docs/final-splat-alignment-guide.md).
      # PSNR of the finished splat against the pristine frames (32.24 dB
      # against the pipeline loop's 32.29), the trajectory shape (1.47 ->
      # 1.83 px, rising and decelerating) and the flow's batch mean (1.48
      # against DIS's 1.47) all match; sharpness is the metric this
      # pipeline judges by, and it has only been read off the pipeline
      # loop's result.
    outputs:
      # Overwrites the stage-2 intermediate, so Dataset.to_disk's splat.ply
      # and the CLI's closing "splat:" line both name the final one.
      splat_path: dataset.splat_path
