# The from-a-sheet path: build the initial multi-view dataset from one
# front/back reference sheet, then run the shared from-a-sheet tail over it
# (see FROM denoise_pass1 ON, below).
#
# BOOTSTRAP (this file only) — split_sheet -> reconstruct_body ->
# detect_face -> map_face_to_mesh -> fit_head_to_face -> [locate_face ->
# crop_face -> face_seg -> face_mask -> face_normals -> face_splat] ->
# render_initial_views -> warp_reference_to_anchor -> reinject_anchor_initial.
# The bracketed six are gated on the `face_splat` global, as are the
# tail's face_splat_refined -> render_face_support_views ->
# face_support_views that follow refine_cameras. render_initial_views is not: it
# draws the face splat itself now (`render_mode: outline+skeleton+splat`)
# and reads the .ply optionally, so the branch being off leaves it with
# nothing to composite rather than nothing to resolve.
#
# WHAT CHANGED (2026-09-10): **the face cap's supporting views carry their
# colour past their mask** — `select_support_views` grew `bleed_px` (12,
# the step's default; nothing is set here). A masked view's mask weights
# the SSIM *value* at a pixel, but the statistics behind it come from an
# 11-tap window blurred twice (b2ctrain's src/gpu/loss.cu, `HALO = 5`), so
# a zero-weight pixel still takes gradient toward its own ground truth from
# every weighted stat position within 2*HALO — and its ground truth was the
# black background the cap was rendered on. The result was the cap's
# outline drawn on the intermediate splat in a black line 3-7 px wide,
# tracing the per-Gaussian staircase of the matte's edge. Retraining run
# 17dff4's own debug/colmap_intermediate/ with nothing changed but those 36
# frames removes it (steps/anchor_stub.py has the profiles); PSNR against
# the denoised frames does not move, which it cannot — face_priority_weights
# silences them over the face, so this defect lives where the metrics do
# not look.
#
# WHAT CHANGED (2026-09-08, later): **the helical re-render follows the
# camera refinement.** `rerender_splat` takes `given_anchor_camera:
# scene.image_warp.camera` and moves its whole helix by the delta between
# that and the refined anchor camera it was handed, so the stage-3
# `reinject_anchor` puts the photograph where the trained splat thinks it
# was taken from. It sat on the GIVEN pose — 46-68 mm / 1.1-1.6 deg away,
# 8-10 px vertically at the subject in every run measured (467c17, fd852e,
# fa59e5) — and pass 2 inherited pass 1's seam. splat.py's
# _carry_anchor_refinement has the numbers.
#
# WHAT CHANGED (2026-09-08): **an experimental branch redraws the outline
# from a matte instead of the mesh** — `re_outline`, a setting, OFF by
# default. The silhouette pass 1 conditions on is the SAM-3D-Body mesh's,
# and the mesh is wrong wherever hair and clothing leave the body model
# (docs/vace-denoise-findings-2026-09-07.md: scalp 7 px low, feet 22 px
# high). With the setting on, six gated steps between
# `reinject_anchor_initial` and `dump_denoise_input` run the same control
# video through a third wan22_vace_denoise at 480x832 with pass 1's exact
# settings, matte its output with rmbg, bring the mattes back to the render
# size and render the orbit AGAIN with `outline_masks` — body2colmap
# 76a74bc's `render_outline(mask=...)` — under the same skeleton and face
# splat, then re-inject the anchor. `dump_denoise_input` and pass 1 read
# whichever render came last. docs/re-outline.md has the argument, and the
# reason the 480p batch is resized HERE rather than handed to diffusers at
# `width: 480` (it would run at 464x832 and letterbox the reference).
#
# WHAT CHANGED (2026-09-07, last): **both trainings run a different
# trainer, and one of them runs the alignment loop somewhere else.** The
# `brush` step now drives **b2ctrain** (Erant/b2ctrain: brush's CLI,
# dataset layout and .ply contract, in C++/CUDA, ~4x faster at equal or
# better quality), which REPLACED the Rust brush in the image — the
# `brush-splat-render` every splat render here goes through is the same
# binary behind a shim. Nothing in this file had to change for that: the
# step's `brush_path` default names it, and every flag, sidecar and ev_*
# property is what it always was. The one visible difference is in
# `train_final_splat`: b2ctrain carries the alignment loop in-process, so
# the four iterations are one invocation now instead of five, and the
# per-iteration render process and Python flow are gone. See the comments
# on the two trainings below, and docs/docker.md.
#
# WHAT CHANGED (2026-09-06): **the stage-1 supporting views are gone
# from this workflow.** `stage1_support_views`, `stage1_support_every_n` and
# `stage1_support_elevation_deg` are no longer declared, and with them the
# three steps they gated — `stage1_view_splats` (pointmap_elevation_views),
# `stage1_support_band` (select_support_views) and `face_priority_shells`
# — are out of the step list, as is `merge_support_views`' `b_*` triple,
# which no longer has a producer. They had been off by default since
# 2026-09-05 for the reasons in that entry below; this removes the switch
# rather than leaving a control that never wins. The steps THEMSELVES are
# untouched (steps/elevation_views.py, its tests, and the measurement in
# docs/stage1-support-views-implementation.md), so putting the block back
# is pasting three steps and three settings, not rebuilding anything.
# `merge_support_views` stays where it is: the face cap is gated, and this
# is still the one ungated writer of scene.support_views.*.
#
# WHAT CHANGED (2026-09-05, last): **the intermediate splat was measured,
# and five things moved with the answer** (docs/intermediate-splat-guide.md,
# measured against the 81 novel helical cameras the second denoise sees):
#
#   * the evidence gate stops culling the subject — brush a9405881 fixed two
#     bugs in the in-mask denominator, and `rerender_splat` now passes
#     `--conf-tau 0.3 --conf-angle-margin 45`. 30% of the subject culled
#     (69% of the face, 67% of the silver top) -> 6.4%, IoU 0.70 -> 0.92.
#     This is the big one; everything else here is worth less than it.
#   * `stage1_support_views` defaults OFF. The chalky streaks it was built
#     against did not reproduce with the face cap and the gate in place, and
#     the shells measured as a net loss: less sharp, 2.6x the splats, twice
#     the training time.
#   * `train_splat` gains `polish_steps: 9000` — a growth-off warm start
#     from its own export, which is worth more than any other knob tried
#     (face 143 -> 161) — and `match_alpha_weight: 0.5`. (The polish went
#     back off on 2026-09-07: re-measured on b2ctrain it buys nothing.)
#   * the re-render was made on BLACK again (`cull_color`; back to 0.5 grey
#     on 2026-09-07, see rerender_splat), the room is off
#     there too (`background: ""`), and the frames the second denoise sees
#     are cut with an RMBG matte (`resplat_foreground_masks`) and laid over
#     0.5 grey by `mask_splat_fringes` in its new `composite` mode. The gate
#     decides what is missing; rmbg decides what is subject.
#   * `select_support_views` cleans the cap's mask before brush sees it
#     (`min_alpha` 0.004 -> 0.15, a 5x5 closing) — hygiene, measured
#     neutral, against the floater it would become on another subject.
#
# What was measured and deliberately NOT done: an optical-flow alignment
# loop at stage 1 (the unwarped control beat it), inline alignment during
# growth, dense growth, SH degree 1, `--evidence-prune-inmask`, and turning
# normal supervision off (it helps here, whatever the final training says).
#
# WHAT CHANGED (2026-09-04, last): **the shell experiment is over.**
# fast_helical_shell.yaml is gone, and with it everything only it used:
# `refine_pose_to_splat` (steps/pose_refine.py), `inject_shell_views`, the
# whole-body `pointmap_splat` registration, the `anchor_helix` global
# (rerender_splat is simply `override_cam_from_mesh: true` and publishes
# plain `anchor_position` / `anchor_frame_index` outputs), the runner's
# optional-OUTPUT `name?:` form, the mirror test, and the `?` on
# face_splat_refined's `given_camera` — that input is required now, and the
# step refuses `cameras` without it. This is the one workflow file.
#
# WHAT CHANGED (2026-09-04, later still): **the refined face cap is hung on
# the photograph's camera, moved by the refinement's delta** — not on the
# refined anchor camera itself. `face_splat_refined` takes
# `given_camera: scene.image_warp.camera?` (the anchor as the path built it,
# look_at-turned 0.83 deg onto the orbit target on cyber2) and
# `face_pointmap_splat` composes refined o given^-1 onto SAM-3D-Body's
# camera. Run 5e2817 showed the cameras right after the common-mode fix and
# the cap still 17 px / 28 mm above the frames' face: the photograph's rays
# were being turned by the anchor's look_at tilt. See the step's docstring,
# "The dataset's anchor camera is NOT the photograph's camera".
#
# WHAT CHANGED (2026-09-04, later): **the result .zip carries a `debug/`
# directory.** `refine_cameras` and `refine_cameras_final` write the poses
# they were given and the poses they published as two COLMAP models plus
# stats.json; `face_splat` and `face_splat_refined` write their stats and
# depth/mask visualisations; the face .ply files ride along too
# (webui.DEBUG_SUBDIRS). All via the steps' `debug_dir` params pointed under
# `${globals.output_root}/debug/`, which `build_result_zip` packages beside
# the deliverables. The face-cap offset of run 5e2817 (2026-09-04) had to
# be triangulated back out of the exported renders because the pod, and
# with it face_refined.ply and the refined cameras, was gone.
#
# WHAT CHANGED (2026-09-04): **the helical anchor re-injection actually
# runs.** The shared tail's `rerender_splat` now anchors its helix
# (`override_cam_from_mesh: true`) and publishes
# `anchor_position` / `anchor_frame_index` for the path it built, so the
# stage-3 `reinject_anchor` has a frame to match. It had none: an
# unanchored helix passes no closer than 24x the match tolerance to the
# anchor, so the step silently returned the batch untouched and
# denoise_pass2 conditioned on 81 synthetic frames with no 0.0 anywhere in
# its VACE mask. The base does anchor it — ComfyUI-Body2COLMAP `17f9f1a`,
# and cyber_6f/helical records anchor_frame_index 37 at the origin to prove
# the recorded run used it. Publishing the anchor from the render is the
# other half: `refine_cameras` republishes it ~62 mm off the origin, which
# on its own misses by ~10x. `inject_anchor` also logs what it did or did
# not match (it said nothing at all before), the output form `name?:` was
# added for the two keys an unanchored render does not publish, and
# tests/test_workflows.py refuses an inject_anchor whose batch was
# re-rendered along an unanchored path.
#
# WHAT CHANGED (2026-09-02): the FACE CAP WINS (docs/face-priority.md).
# The shared tail
# gained `face_priority` (after face_support_views) and
# `face_priority_shells` (after stage1_support_band), both the new
# `face_priority_weights` step: the refined face splat's coverage is
# rendered from every training camera and every shell camera and turned
# into a per-pixel loss weight that fades those views out over the face
# (1 - strength = 0.1 at full coverage, within the cap's 30 degrees, fading
# to nothing 15 degrees beyond). The training views' weights reach brush as
# a `weights/` sidecar (train_splat and export_colmap_intermediate gained a
# `weights` input; brush itself learned the sidecar — Erant/brush
# docs/loss-weights.md — and honours it in the loss, the normal loss and
# the evidence pass); the shells' weights are folded into their masks, and
# merge_support_views reads `masks_deferring_to_face`. face_support_views'
# `min_path_angle_deg` went 5 -> 0: with the frames silenced over the face
# the on-path cap views are no longer redundant with them.
#
# WHAT CHANGED (2026-09-02, earlier): the face splat is REBUILT after the
# camera refinement, and its cap is rendered there. `refine_cameras` moves
# the anchor camera the face splat was unprojected through; from 2026-08-31
# the cap's cameras were carried across by that camera's own pose delta
# (`rebase_face_support_views`), and measured on run e593a8 that put the
# cap's face 50 mm INSIDE the head — the delta is mostly a slide along the
# anchor's own viewing ray, and a rigid carry moves the splat's depth with
# it while that depth came from the mesh, which never moved. Now
# `face_splat_refined` runs `face_pointmap_splat` a second time through the
# refined anchor camera (`cameras: dataset.cameras`), re-taking the depth
# from the mesh, and `render_face_support_views` + `face_support_views`
# moved out of the bootstrap to follow it; render_splat's cap aims along
# the live anchor camera rather than the recorded `anchor_position`. The
# rebase step, `refine_cameras`' `given_cameras` output and
# tests/test_rebase_cameras.py are gone.
#
# WHAT CHANGED (2026-08-31): the face cap was carried across the camera
# refinement by the anchor camera's pose delta (`rebase_cameras`) — the
# approach the paragraph above replaces.
#
# WHAT CHANGED (2026-08-31): the SHARED TAIL gained supporting
# views of its own, off the stage-1 denoised batch. Three new steps after
# normal_maps — `stage1_view_splats` (a Gaussian shell per Nth denoised
# frame, rendered from +/-10 degrees of elevation), `stage1_support_band`
# (the same select_support_views the face uses) and `merge_support_views`
# (which concatenates the face cap and the body views into the one triple
# brush reads, and runs ungated so scene.support_views.* has exactly one
# writer). The face branch's outputs moved to scene.face_support_views.*
# accordingly; its step id did not change.
#
# The reason is the circular orbit: all 81 training views share one great
# circle, so the fit has nothing to triangulate off the path and any novel
# elevation smears. The shells inject a monocular depth prior from off
# that path — no new appearance, since the source frames are the
# training's own. Three settings drive it (`stage1_support_views`,
# `stage1_support_every_n` = 10, `stage1_support_elevation_deg` = 10);
# validated against a captured dataset in
# docs/stage1-support-views-implementation.md, never yet run on a pod.
#
# WHAT CHANGED (2026-08-31): the face splat is composited by the mesh
# render itself instead of by a pair of extra steps. body2colmap dropped
# gsplat for the same brush-splat-render binary this project already
# shells out to (its 24fe424), which is what the detour below was waiting
# for: `render_face_views` + `composite_face` are gone, and
# `render_initial_views` takes a `splat_path` and a `+splat` render mode.
# The blend is `Renderer._composite_splat`'s now, and the 60-degree cull is
# passed explicitly so it does not silently inherit body2colmap's 45.
#
# WHAT CHANGED (2026-08-30, latest): two fixes, both measured on cyber2_6f.
#
#   * The face splat was built with its depth read along the wrong axis and
#     its relief scaled by the wrong ratio: a crop's pointmap is depth along
#     the CROP-centred camera, 12.6 deg off SAM-3D-Body's axis for a head at
#     the top of a portrait frame, and scaling it to the mesh's distance
#     multiplied the relief by f_sam/f_pointmap = 3.19 on top of the width.
#     The face came out 184 mm wide and 338 mm deep, nodded back 12.6 deg,
#     with a sheet of neck behind it. `pointmap_splat` now integrates in the
#     pointmap's own camera, rotates onto SAM-3D-Body's rays, and scales the
#     relief by the width ratio: 178 x 155 mm, looking where the photo does.
#     This was the "did not converge" that removed the whole line for an
#     afternoon (7086115, reverted).
#   * `fix_head_angle` is replaced by `map_face_to_mesh` + `fit_head_to_face`
#     — see the block below. The auto nod turned the mesh head 30 deg away
#     from the photograph; the fit turns it to the photograph.
#
# WHAT CHANGED (2026-08-29): the MediaPipe face is gone, and a Gaussian
# splat of the subject's actual face is composited onto the skeleton
# drawings in its place. `detect_face` is deleted and render_initial_views
# no longer takes a `face_landmarks` input. Landmark dots carry almost no
# identity and the canonical face model carries none; a splat of the real
# face carries both identity and gaze, which is what these frames are for.
#
# WHAT CHANGED (2026-08-30, earlier): the face splat is MASKED to the face,
# not to the face and the neck (`face_mask`, a MediaPipe hull intersected
# with Sapiens2's Face_Neck class — the neck can only be intersected out,
# not deselected), and `align_bin_px` dropped from 32 to 8. The CROP stays
# the Face_Neck box: cutting it to the face as well was measured to flatten
# the face, see the note on locate_face. `fix_head_angle` gained a `cam_t`
# ray-hold the same day; that step has since been retired (above).
#
# The circular orbit, override_cam_from_mesh, the anchor warp and the
# anchor injection remain exactly as they were, deliberately: this file
# exists to test the face in isolation, so a run that looks different from
# the last one differs because of the face and nothing else. A separate,
# larger change — the photo-to-splat SHELL bootstrap: a helical orbit, a
# body-wide Gaussian shell, a pose refit and a substituted band of frames —
# was tried alongside in fast_helical_shell.yaml and retired on 2026-09-04.
#
# The compositing is body2colmap's own `skeleton+splat` render mode, as
# `outline+skeleton+splat` on render_initial_views. It used to be a pair of
# b2crunner steps, because that mode rasterised through gsplat and this
# project deliberately has none (see pyproject.toml — dropping it removed
# the last runtime CUDA toolchain); the library now rasterises through
# brush-splat-render too, so the detour is gone. See
# docs/revert-when-body2colmap-drops-gsplat.md for what came out.
# This is what the bootstrap hands the shared tail, ready-made: a dataset
# rendered with override_cam_from_mesh whose extras carry orbit_target /
# anchor_position / focal_length_mm / original_focal_length, with a warped
# reference photo injected at the anchor frame (VACE mask 0.0) among renders
# (VACE mask 1.0). cyber_6f/initial IS that dataset; here the workflow builds
# it from one image.
#
# FROM denoise_pass1 ON — the tail: the native port of the ComfyUI pipeline
# over the dataset the bootstrap built.
#
# STATUS: never executed end-to-end. render's rasterization and
# generate_firstlast's warp have never run on real hardware (their module
# docstrings); everything from denoise_pass1 on shares that status. Treat
# this as the thing to debug on a GPU pod, not a working recipe.
#
# Stage 6 produces the run's deliverables under output_root:
#
#   colmap/              cameras.txt + images.txt + points3D.txt, images/
#   ply/                 scene.ply — a second brush training, flow-aligned
#
# plus what is written on the way through and archived under `debug/`:
#
#   face/face.ply        the photo-derived Gaussian head, composited onto
#                        every drawing within 60 degrees of the source view
#   colmap_intermediate/ debug: the dataset the FIRST brush training is fed
#   colmap_preupscale/   debug: a COLMAP dataset from the pre-upscale frames
#
# export_colmap / export_ply switch the deliverables off; export_debug is
# the switch for everything in the second list, and the pre-upscale export
# additionally wants run_upscale on. The web UI's Outputs box drives all of
# them plus the "Upscale dataset" toggle.
#
# The input is not a photo of the subject: it is the two-panel sheet a
# diffusion model generates, subject facing front on the left and seen from
# behind on the right. split_sheet cuts it down the middle — the front half
# feeds the mesh and the anchor warp, the back half becomes
# dataset.reference_image, the one view wan22_vace_denoise conditions on.
# cyber_6f's recorded reference.png is the whole sheet — the older
# convention, from before anchor injection; not the target here.
#
# **Reading this file.** Three declaration blocks sit above `steps:`, and
# they all feed one flat namespace that `${globals.x}` resolves against:
#
#   settings:  the knobs a person sees, declared with the type, default,
#              help and choices the web UI draws them from. Nothing about
#              this workflow is hardcoded in pipeline/webui.py any more.
#   outputs:   the deliverables, each naming the switch its export steps
#              read through `when:` and the `dir:` it lands in.
#   globals:   what has no control at all — here just `output_root`.
#
# Everything else lives under the step that consumes it, as an override on
# the default that step's own class declares (pipeline/step.py's
# `Step.PARAMS`), and reaches the UI only behind the "Per-step settings"
# fold. `python -m pipeline.cli params fast_helical_native --all` prints the
# effective value of every one of them, defaults included.
name: fast_helical_native
description: >-
  From a front/back reference sheet: split it, reconstruct a body, render its
  own anchored views, then run the shared six-stage tail over that dataset —
  denoise, train+re-render a splat, mask, denoise again, upscale, export a
  COLMAP dataset and/or a flow-aligned .ply.

settings:
  # The knobs the Run tab draws, in this order, straight from these
  # declarations — same `type`/`default`/`help`/`choices`/`advanced`
  # vocabulary a step param uses (pipeline/step.py's `Param`), so one widget
  # code path draws both. Each lands in the same namespace `${globals.x}`
  # reads, so a setting reaches the steps that need it exactly the way it
  # always has: as a `${globals.<name>}` written at each step that consumes
  # it. A setting nothing reads is refused at load (`WorkflowSpec.validate`).

  - name: resolution
    label: Resolution
    type: list
    default: [720, 1280]
    choices: [[720, 1280], [600, 1040], [480, 832]]
    help: >-
      Frame size, width x height, and the value more than one step must agree
      on: the render size, wan22_vace_denoise's width/height, and
      render_splat's. `render` takes it whole and has no width/height override
      of its own, so that stage cannot drift; denoise and render_splat split
      it via .0/.1. Only sizes the denoise model was trained for are offered.
      (2026-08-25: this file inherited [512, 512] from an earlier draft.)

  - name: framing
    label: Framing
    default: full
    choices: [full, torso, bust, head]
    help: >-
      How much of the body fills the frame. Threaded through both renderers
      that see it — the mesh render (render_initial_views) and the splat
      re-render (rerender_splat) — because they have to agree: `render` frames
      the mesh at this preset, the splat is trained on cameras aimed for it,
      and rerender_splat rebuilds its helical orbit around the same preset.
      `full` is the whole body and what every prior run used; torso / bust /
      head crop progressively tighter. Only the mesh reconstruction's skeleton
      makes the tighter presets available — `render` falls back to `full` for
      any it cannot compute, and rerender_splat follows.


  - name: seed
    label: Seed
    type: int
    default: 0
    help: >-
      One seed for every stochastic stage: both wan22_vace_denoise passes and
      the SeedVR2 upscale. Those were three independent step params (0, 0 and
      42) before this became a setting. Change it to draw a different sample
      of the same pipeline.

  - name: run_upscale
    label: Upscale dataset
    type: bool
    default: true
    group: outputs
    help: >-
      Run the SeedVR2 upscale (720x1280 -> 1080x1920) before the export, which
      also rescales the dataset's camera intrinsics to match, in the same step
      (steps/seedvr2.py). Off is the shorter pipeline that used to be a
      separate workflow. Drawn beside the deliverables because it is a
      property of what you get back rather than of how the run is built.

  - name: face_splat
    label: Face splat
    type: bool
    default: true
    advanced: true
    help: >-
      Whether the face branch runs: a Gaussian splat of the subject's actual
      face, composited onto the skeleton drawings wherever the camera can see
      it (+-60 deg). It REPLACES the MediaPipe landmark overlay this file used
      to draw — `detect_face` is gone, not disabled — so turning this off
      leaves the skeleton frames with no face at all rather than falling back
      to landmarks. That gap is deliberate: a YAML input cannot be
      conditionally wired, so a `when:`-skipped detect_face would make
      render_initial_views raise on an unresolvable context path. Putting the
      landmarks back means pasting the detect_face block and one
      `face_landmarks:` input line back in; the step, its params on `render`,
      and its tests are all still there. Costs a third 1B Sapiens2 head
      (~6.5 GB, segmentation) on top of the normal head, plus the pointmap
      head the splat itself needs.

  - name: refine_cameras
    label: Refine camera poses (COLMAP)
    type: bool
    default: true
    help: >-
      Bundle-adjust the generated orbit against the frames themselves before
      each brush training, with the gauge restored afterwards so the splat keeps
      its scale. Worth +0.63 PSNR / +0.0045 SSIM on held-out views, measured over
      three seeds per condition against a baseline whose own seed spread is
      +-0.003 (docs/camera-pose-refinement.md). It runs twice — once on the
      denoised bootstrap batch, once on the re-rendered helical one — because
      both paths are generated rather than measured, and each run costs a
      COLMAP feature/match/triangulate/BA pass over the training frames. At 81
      frames, measured: 27 s of features and matching on the pod image's CUDA
      build (2.8 s + 24.3 s) against 209 s on a CPU one, plus a bundle
      adjustment that is CPU-bound either way. Off gives the poses exactly as
      the renderer wrote them, which is
      what every run before 2026-08-31 used. Note what it never sees: the
      supporting views, which are renders made FROM these poses and so have no
      independent evidence to offer about them.

  - name: refit_body
    label: Refit the body model to the intermediate splat
    type: bool
    default: true
    help: >-
      After the first training, move SAM-3D-Body's mesh and skeleton onto the
      splat (pipeline/steps/body_refit.py, docs/body-refit.md): the splat
      follows the generated frames and by then sits centimetres off the body
      the run started from (3 cm up, 1.3 cm sideways and a 3 deg yaw on the
      2026-09-09 example run, arms visibly off). The final training's hollow
      loss then forbids weight behind a body that is where the splat is, which
      lets its margin come down from 5 cm to 3 cm at the same PSNR, with four
      times less weight behind the body; the refit skeleton is also what a
      later re-posing of the splat will hang from. Costs a probe render of the
      training views and ~90 s of fitting. Off, the final training keeps the
      original mesh at the 3 cm margin below, which is the riskier setting for
      a mesh that may be too big for the subject.

  - name: body_rig_intermediate
    label: Per-view body rig on the intermediate training
    type: bool
    default: true
    help: >-
      Deform the intermediate splat per training view with the INITIAL body's
      skeleton (pipeline/body_rig.py), the way `body_rig` already does for the
      final training. The generated frames swing the arms by centimetres
      between segments of the orbit, and a single canonical body cannot
      explain them all: the splat answers with a translucent double limb, and
      the helical re-render that pass 2 is built from inherits it. Measured on
      the 2026-09-09 example run (b2ctrain docs/STATUS.md, "The rig at the
      INTERMEDIATE stage"): hand sharpness +27%, body +7%, head +9%, at no
      extra time and 1% fewer splats. There is no splat to refit the body to
      at this point, and none is needed — the initial body rigs the
      intermediate splat as well as a refit one does. Only the real frames get
      a rotation; the face supporting views are renders of a fixed splat and
      render undeformed, which is what keeps the head gain (letting them
      deform loses all of it).

  - name: face_refine
    label: Per-view face fit and the anchor's eyes
    type: bool
    default: true
    help: >-
      Before the final training, fit the refit body's head to every frame
      that shows the face (neck/head pose plus the MHR expression
      blendshapes, through the frame's own camera) and hand the trainer the
      per-view face geometry the way the body rig hands it the arms; and
      replace the frames' eyes — the diffusion's invention per frame, three
      consecutive frames showing three eye states — with eyeballs textured
      from the anchor photograph, rendered into each frame through that
      frame's fitted lids (pipeline/steps/face_views.py, docs/face-refine.md).
      Measured on four subjects (b2ctrain docs/STATUS.md, "The face per
      view"): eye error against the eye model 51-82 -> 28-56, closed slits
      and blue smears become open eyes with an iris at every novel view;
      face sharpness within the metric's resolution of the baseline; the
      hair untouched (the deltas are restricted to the face core). Needs the
      body refit. Off, the final training sees the frames as the upscale
      left them and the face renders canonical.

  - name: specular_suppress
    label: Highlight suppression
    type: float
    default: 0.0
    minimum: 0.0
    maximum: 1.0
    help: >-
      Pull the highlights down on the first denoise's output before the
      intermediate splat is trained on it, 0 (off) to 1. The second denoise
      conditions on a re-render of that splat, so it re-lights frames that
      already carry one diffusion pass's shading and specular — blown-out
      highlights, plasticky skin, reflective clothing — and the splat's SH
      has fitted pass 1's frame-to-frame inconsistent highlights as sparkle.
      This removes the specular excess (the per-pixel minimum channel above
      the batch's `mean + eta * std`, subtracted from all three channels
      equally, so colour and diffuse shading stay) from the training frames,
      so the splat never learns it and its re-render is clean in every view.
      The photograph's frame is left as it is. Off is the run as it was; see
      pixel_ops' `specular_eta` / `specular_blur` for the shape of the cut.

  - name: re_outline
    label: Re-outline (experimental)
    type: bool
    default: false
    advanced: true
    help: >-
      Draw the silhouette pass 1 conditions on from a matte of the subject
      instead of from the body mesh. The mesh outline is wrong wherever hair
      and clothing extend past the body model; this runs the same control
      video through an extra Wan 2.2 denoise at 480x832 (pass 1's settings
      exactly), mattes the result with rmbg, and re-renders the orbit with
      that matte as the outline — skeleton, face splat and everything after
      unchanged. Costs a third 81-frame denoise (the resident experts are
      reused, so no second load). Off is the run as it was;
      `debug/reoutline/` in the result .zip holds the 480p frames and their
      mattes when it is on. See docs/re-outline.md.

outputs:
  # What stage 6 can produce, and the switch each one is. `name:` is the
  # workflow global the `when:` on its export steps reads, so the switch is
  # greppable from either end; `dir:` is where those steps land it under
  # output_root, which is how a finished run is packaged for download
  # without pipeline/webui.py holding a list of subdirectory names.
  #
  # The web UI's Outputs box is exactly this list. `--param export_ply=false`
  # does the same from the CLI. Turning one off skips its steps entirely —
  # which for export_ply means not starting a second 30,000-iteration brush
  # training you were going to throw away. export_debug is the half
  # exception: most of `debug/` is written by steps the run performs
  # anyway and it only decides what is packaged, but the two COLMAP
  # datasets in there are its own export steps and are skipped with it.

  - name: export_colmap
    label: COLMAP dataset
    dir: colmap
    default: true
    help: >-
      cameras.txt, images.txt and points3D.txt, plus images/, built from the
      frames as they finally are. No normals/ since 2026-09-06 — the training
      that read them stopped supervising on them.

  - name: export_ply
    label: Trained .ply (flow-aligned)
    dir: ply
    default: true
    help: >-
      A second brush training over that dataset, exported as scene.ply. A full
      30,000 iterations — roughly an hour of GPU — and then four alignment
      iterations, another ~5 minutes, which warp the frames onto the splat's
      own renders and refit so the fit stops blurring its own training data
      (docs/final-splat-alignment-guide.md).

  - name: export_debug
    label: Debug bundle
    dir: debug
    default: true
    help: >-
      The `debug/` directory: refine_cameras' given-vs-refined camera models
      and their stats, the face splat's stats and depth visualisations, the
      face .ply files, `denoise_pass1_input/` — the control video the first
      denoise is handed, frames with their VACE mask in alpha beside the
      reference, the anchor photo and the cameras — `intermediate_splat.ply`,
      the splat the helical re-render is built from, and two COLMAP datasets
      nothing else exports.
      `colmap_intermediate/` is what the FIRST brush training is handed: the
      denoised frames, the mattes and normal maps computed for them, and a
      pose in images.txt for every supporting view (the face cap), before
      that splat is re-rendered along the helical orbit and denoised a
      second time — everything that training saw, for when the re-render
      comes out wrong, including a supporting view that landed somewhere
      other than where its content belongs.
      `colmap_preupscale/` is the same export from the frames as they are
      BEFORE the upscale (stage 4b), to measure what SeedVR2 does to
      Gaussian-splatting quality; it is written only when the upscale is on,
      because with it off it would be the ordinary colmap/ under a second
      name.
      This is what a misplaced face or a drifted camera is diagnosed from
      after the pod is gone, and it is why the 2026-09-04 face-cap
      offset had to be triangulated back out of exported renders instead of
      read off the splat that caused it.
      Most of what lands here is a side effect of steps the run needs
      anyway — those dumps are written to the volume either way and this
      decides only whether they are packaged. The two COLMAP datasets are
      the exception: they exist for nothing else, so this switch skips them
      outright rather than paying for a dataset copy (and, for the
      pre-upscale one, an RMBG pass) nobody asked for.
      Size is why the switch is worth having at all: the intermediate splat
      is hundreds of MB against a few hundred KB for everything else in
      there. Turn it off for a run whose output you are only going to look
      at, on for one you may have to explain.

globals:
  # What has no control of its own, and therefore no `settings:` entry.
  #
  # Every path this workflow writes to disk hangs off this one global, and
  # `pipeline.cli run` repoints it at the run's own directory under
  # B2C_OUTPUT_DIR (i.e. the mounted volume) unless you pass
  # `--param output_root=...`. The literal below is only what you get from
  # a bare `WorkflowRunner` with no CLI: relative to the working directory,
  # which on a pod is the container's writable layer — small, and gone when
  # the pod is recycled.
  output_root: output/fast_helical_native

steps:
  # ================================================================ bootstrap
  # Build the dataset the shared tail expects as its input. Everything from
  # `denoise_pass1` on is that tail.

  # The input is the two-panel front/back sheet, not a photo of the subject.
  # Nothing downstream wants both panels, and the two halves go to opposite
  # places (steps/reference_sheet.py):
  #
  #   front -> scene.front_image        sam3d_body / generate_firstlast
  #   back  -> dataset.reference_image  wan22_vace_denoise's reference_image
  #
  # Writing the back half over dataset.reference_image is deliberate: with the
  # anchor injected, the front already reaches the diffusion pass as a real
  # photograph at the anchor frame, so the reference slot is spent on the one
  # view nothing else in the batch can supply. (cyber_6f's recorded
  # reference.png is the whole sheet — the older convention, from before
  # anchor injection. Don't take it as the target.)
  - id: split_sheet
    step: split_reference_sheet
    dispatch: in_process
    inputs:
      sheet: dataset.reference_image
    params:
      front_side: left
    outputs:
      front: scene.front_image
      back: dataset.reference_image

  - id: reconstruct_body
    step: sam3d_body
    dispatch: subprocess
    env: sam3dbody
    inputs:
      image: scene.front_image
    outputs:
      vertices: scene.vertices
      faces: scene.faces
      joints: scene.joints
      keypoints_3d: scene.keypoints_3d
      global_rots: scene.global_rots
      cam_t: scene.cam_t
      focal_length: scene.focal_length
      # The frame that focal is measured in. The face branch below cuts a
      # crop out of the same photograph and rebuilds this camera on the
      # crop's pixel grid; publishing the size is what lets it refuse a
      # frame that is a resized copy rather than the photograph itself.
      image_size: scene.image_size
      bbox: scene.bbox
      # The MHR parameters behind the mesh. fit_head_to_face below replays
      # the body model's forward with the head's share of these as the free
      # variables, and publishes the updated set, so the mesh and the
      # parameters describing it never disagree.
      pose_params: scene.pose_params

  # ------------------------------------------------ the head, re-fitted
  # SAM-3D-Body's head does not agree with the photograph's face. On
  # cyber2_6f the raw fit's head landmarks miss MediaPipe's by 10.5 px rms,
  # and the head is too long and narrow for the subject (face width/height
  # 0.82 against the photo's 1.20). The face splat below sits on the
  # photo's rays by construction, so whatever the mesh head does, the
  # splat looks where the photograph looks — and the outline the diffusion
  # pass conditions on had better agree with it.
  #
  # `head_angle_fix` used to run here (retired 2026-09-04). It nodded the
  # head back to a fixed 10 deg of forward lean, which on this subject turned
  # it 30 deg AWAY from the photograph (landmark residual 10.5 -> 20.7 px):
  # the outline head looked up while the face on it looked slightly down.
  #
  # The fit is dense and lives in the body model's own parameters: a
  # MediaPipe<->vertex correspondence is built by rendering THIS mesh's
  # head and landmarking the render (map_face_to_mesh, main env), then the
  # neck/head rotations, the head joint's scale and the head-only shape
  # components are optimised so those vertices project onto the photo's
  # landmarks (fit_head_to_face, sam3dbody env). 10.5 -> 2.4 px on
  # cyber2_6f, head pitched 7 deg down to where the photo looks, an intact
  # head from every angle — see steps/head_fit.py for why a vertex
  # deformation could not do this (it squashes the skull or pitches the
  # head 23 deg to hide the mid-face's length).
  #
  # detect_face is NOT gated on `face_splat` any more: the head fit needs
  # the landmarks whether or not the face splat is drawn. The face branch
  # below still is.

  # Where the face is. CPU, no pod, no GPU: the two model files live in
  # ~/.cache/body2colmap and the step is crop-first internally, which is
  # what makes it work on a full-body frame where the face is a few percent
  # of the pixels (see steps/face_landmarks.py's module docstring).
  - id: detect_face
    step: detect_face_landmarks
    dispatch: in_process
    inputs:
      image: scene.front_image
    outputs:
      face_landmarks: scene.face_landmarks

  # Which mesh vertex is each MediaPipe landmark. From the mesh alone: a
  # shaded render of its head through SAM-3D-Body's camera, landmarked,
  # each landmark snapped to the nearest visible vertex (446/468 at 0.8 px
  # on cyber2_6f). Main env — pyrender and MediaPipe, no torch.
  - id: map_face_to_mesh
    step: map_face_to_mesh
    dispatch: in_process
    inputs:
      mesh_output: scene
      image: scene.front_image
    outputs:
      face_correspondence: scene.face_correspondence

  # The fit itself, in the sam3dbody env because it needs the MHR body
  # model (the same checkpoint reconstruct_body loaded — no new download).
  # It builds the MHR head ALONE from that checkpoint, not the SAM-3D-Body
  # model around it: no DINOv3 backbone, ~25 MB of the 2.1 GB read, 0.7 GB
  # of VRAM instead of 3.5 (2026-09-07; it used to be most of this step's
  # 70 s on a pod). The optimiser itself is ~10 ms an iteration on a 4070
  # Ti and bound by launch overhead, not the GPU — `iterations` is the
  # knob if the remaining ~10 s matter.
  # Overwrites the geometry AND pose_params, so everything downstream —
  # the render, the face splat's depth alignment, any later replay — sees
  # one consistent head. `shape_regularisation` 1.0 keeps the head shape
  # within ~2 sigma of SAM-3D-Body's; 0.3 fits 0.3 px tighter on a subject
  # the model finds unusual and looks the same. `fit_shape: false` turns
  # and scales the head only.
  - id: fit_head_to_face
    step: fit_head_to_face
    dispatch: subprocess
    env: sam3dbody
    inputs:
      mesh_output: scene
      face_landmarks: scene.face_landmarks
      face_correspondence: scene.face_correspondence
      image: scene.front_image
    outputs:
      vertices: scene.vertices
      keypoints_3d: scene.keypoints_3d
      joints: scene.joints
      global_rots: scene.global_rots
      pose_params: scene.pose_params
      head_fit_stats: scene.head_fit_stats
      # The MHR model's skeleton and skinning — pure model data, published
      # from here because this is where the model is already loaded. It is
      # what lets build_body_rig_initial rig the body before any splat
      # exists; refit_body below republishes the same key from its own
      # (identical) read for the final training's rig.
      rig_binding: scene.rig_binding

  # -------------------------------------------------------- the face splat
  # What replaced the MediaPipe landmarks: a Gaussian splat of the
  # subject's actual head, built from a CROP of the same photograph by
  # `face_pointmap_splat` and composited onto the skeleton drawings below.
  # Landmark dots carry almost no identity and the canonical face model
  # carries none; a splat of the real face carries both identity and gaze,
  # which is the point when these frames condition a video model.
  #
  # Why a crop, given that at `padding` 3.5 it is no longer a close-up:
  # framing. It puts the head against the torso near the middle of
  # Sapiens2's field, at that network's own 768/1024 aspect, instead of
  # wherever it sat in a full-body frame of some other shape — and it
  # publishes the bookkeeping the splat is placed by. Tightening it does
  # the opposite of what it looks like it should; see crop_face below.
  #
  # Why it runs AFTER fit_head_to_face: that step rewrites scene.vertices
  # and scene.keypoints_3d, and this splat's depth is scaled onto the mesh's
  # front surface. Aligning to the pre-fit mesh and then rendering the
  # post-fit one would put the face at a different distance than the skull
  # it sits on. The fit moves the mesh, not the photograph, so the splat
  # still carries the head at the angle the camera saw it; what matters
  # here is only that the two agree about depth.
  #
  # The circular orbit, the anchor warp and the anchor injection are all
  # exactly as they were in the bootstrap before the face.
  #
  # None of these steps declare `keep_loaded`, so the seg head is read from
  # the HF cache twice (locate, then mask) rather than held in host RAM
  # through two 81-frame diffusion passes. Set `keep_loaded: true` on both
  # sapiens2_seg steps to trade the other way; the step implements
  # release_vram, so it will not squat on the card between them.

  # WHAT CHANGED (2026-08-30): the mask is the FACE, not the face and the
  # neck. Sapiens2's `parts: face` is Goliath class 3, `Face_Neck` — one
  # class covering both — so "just the face" cannot be selected by naming a
  # different class; it has to be intersected out geometrically. MediaPipe's
  # landmarks are that geometry. On cyber2_6f the hull keeps 74% of the
  # Face_Neck matte; what it drops is the neck, which is what smeared across
  # the shoulder at the edges of the composited band.
  #
  # This is landmarks for GEOMETRY ONLY. They are not wired into `render` —
  # see the note on render_initial_views' inputs. The landmark dots are not
  # coming back; the splat replaced them.


  # Where to CROP. The crop stays the Face_Neck box even though the mask
  # below no longer is, and every measurement since has pushed the same
  # way: TIGHTER IS FLATTER. Cutting the crop to the face as well was built
  # and measured, and it flattened the face — relief 224.5 -> 144.2 mm, the
  # nose going from 99.2 mm proud of the face's outer edge to 22.9 (see
  # FaceLandmarkMaskStep's docstring for the table). The crop's `padding`
  # went 0.35 -> 3.5 on 2026-09-02 for the far end of that same effect: at
  # 0.35 the crop is mostly face, which is out of anything a body model was
  # trained to read, and the face cap came back flat.
  #
  # `box` is the tight bounding box of the largest connected component of
  # the selected classes.
  - id: locate_face
    step: sapiens2_seg
    dispatch: in_process
    when: ${globals.face_splat}
    inputs:
      image: scene.front_image
    params:
      # Face_Neck (class 3) alone — masktest's measured default, and what
      # every number behind the cull angle was taken with. `head` adds
      # hair, glasses and lips, which is where the rest of the identity
      # lives; nobody has measured it, and hair is where the pointmap is
      # least reliable. Worth trying on a pod, not worth defaulting to.
      parts: face
    outputs:
      box: scene.face_box

  # Cut it out at native resolution and record where it came from. `padding`
  # 3.5 (the step's default) makes this a head-against-a-torso crop rather
  # than a close-up — see CropToBoxStep's module docstring. What survives of
  # the crop is framing, aspect and the bookkeeping:
  # `crop_info` is what lets face_pointmap_splat re-express SAM-3D-Body's
  # camera on the crop's pixel grid, so every Gaussian still lands on the
  # ray through the full-image pixel it came from.
  #
  # `image` is scene.front_image, the sheet's front half at the resolution
  # it was uploaded at — the same array reconstruct_body was fitted to and
  # locate_face found the box in. Nothing between them resizes it, and
  # nothing may: face_pointmap_splat checks crop_info's full_size against
  # scene.image_size and refuses a resized copy.
  - id: crop_face
    step: crop_to_box
    dispatch: in_process
    when: ${globals.face_splat}
    inputs:
      image: scene.front_image
      box: scene.face_box
    outputs:
      image: scene.face_image
      crop_info: scene.face_crop_info

  # Segmentation at crop resolution. Its output is a summed class
  # *probability*, which is what the splat step wants — it thresholds for
  # the support region and keeps the soft values at the silhouette as the
  # Gaussians' opacity. Still Face_Neck: `head` adds hair, glasses and lips,
  # which is where the rest of the identity lives, but nobody has measured
  # it and hair is where the pointmap is least reliable. The neck comes off
  # in the next step, which is the only place it can.
  - id: face_seg
    step: sapiens2_seg
    dispatch: in_process
    when: ${globals.face_splat}
    inputs:
      image: scene.face_image
    params:
      parts: face
    outputs:
      mask: scene.face_seg_matte

  # Face_Neck minus the neck. `crop_info` is what maps the landmarks, which
  # are in the FULL frame's normalized coordinates, onto the crop's pixel
  # grid — the same relation face_pointmap_splat's `_source_intrinsics`
  # inverts to carry the camera the other way.
  #
  # Both halves are load-bearing. The hull alone takes background with it
  # wherever the head is turned and its convex boundary cuts past the cheek;
  # the seg matte alone cannot tell a jaw from a throat. The intersection is
  # the face, and it keeps the seg's soft silhouette where the two
  # boundaries coincide — the hull's own edge is feathered rather than cut,
  # because a hard edge would hand pointmap_splat a rim of fully opaque
  # Gaussians and the face would read as a sticker.
  - id: face_mask
    step: face_landmark_mask
    dispatch: in_process
    when: ${globals.face_splat}
    inputs:
      face_landmarks: scene.face_landmarks
      mask: scene.face_seg_matte
      crop_info: scene.face_crop_info
    outputs:
      mask: scene.face_matte

  # Normals for the crop, from the same 1b head stage 2 uses on the
  # denoised batch. These carry the FACE's relief — the whole reason for
  # cropping — and the depth the splat is built on is integrated from them.
  - id: face_normals
    step: sapiens2_lite
    dispatch: in_process
    when: ${globals.face_splat}
    inputs:
      image: scene.face_image
    outputs:
      normal_map: scene.face_normals

  # The face splat itself: Sapiens2's pointmap head over the crop, depth
  # re-solved from the normals above in SAM-3D-Body's own camera, one
  # oriented Gaussian per masked pixel, scaled onto the mesh's front
  # surface. Both defaults that differ from a full-body splat's
  # (splat_scale 0.5, fill_max_frac 0.05) are declared by the step class,
  # so nothing is overridden here — see FacePointmapSplatStep's docstring.
  #
  # The two numbers to read out of a run before believing it:
  # `splat_stats.focal_ratio_sam3d_over_pointmap` (near 1 means the two
  # monocular estimates of this lens agree) and
  # `splat_stats.normal_agreement_deg.after_median`. A ratio far from 1
  # means the face is stretched along the view axis and will look
  # over-rotated as the orbit turns.
  - id: face_splat
    step: face_pointmap_splat
    dispatch: in_process
    when: ${globals.face_splat}
    inputs:
      image: scene.face_image
      mask: scene.face_matte
      normal_map: scene.face_normals
      crop_info: scene.face_crop_info
      mesh_output: scene
    params:
      filepath: ${globals.output_root}/face/face.ply
      debug_dir: ${globals.output_root}/debug/face_splat
    outputs:
      splat_path: scene.face_splat_path
      splat_stats: scene.face_splat_stats

  # render's mesh_output wants a dict with vertices/cam_t/faces/
  # keypoints_3d/focal_length (see render.py's module docstring on why
  # keypoints_3d specifically, not joints) — reconstruct_body's outputs
  # above already assembled exactly that dict at the "scene" namespace
  # (plus a few extra keys render.py ignores), so it's passed straight
  # through with no reshaping.
  #
  # override_cam_from_mesh: true is what makes this the *initial* render —
  # it anchors one frame exactly at the original SAM-3D-Body camera and
  # publishes the orbit_target/anchor_position/original_focal_length/
  # image_warp extras that reinject_anchor_initial and rerender_splat
  # both key off (see splat.py's override_cam_from_mesh path). Without it
  # this would be a normal auto-oriented render with no anchor to warp the
  # reference photo onto.
  - id: render_initial_views
    step: render
    dispatch: in_process
    inputs:
      mesh_output: scene
      # No `face_landmarks`: the face arrives as the splat overlay below
      # rather than as landmark dots drawn into the skeleton overlay.
      # render.py sets face_mode to None with no such input and skips the
      # overlay, which is what we want — dots under the splat would show
      # through its soft silhouette.
      #
      # The face splat itself, drawn on top of the drawing by the `+splat`
      # render mode. Read OPTIONALLY (`?`): the branch that builds it is
      # gated on the `face_splat` global, and with the branch off nothing
      # writes this path — render.py then logs a line and composites
      # nothing, rather than the workflow failing to resolve. The step needs
      # no anchor wired: `override_cam_from_mesh` below puts a camera
      # exactly where the photograph was taken from, which is what the view
      # angle is measured against, and it reads the splat's own bbox centre
      # (the same quantity face_splat publishes as
      # splat_stats.world_center) as the pivot.
      splat_path: scene.face_splat_path?
    params:
      pattern: circular
      n_frames: 81
      resolution: ${globals.resolution}
      # See the `framing` global: rerender_splat below reads the same value,
      # and the two renderers must frame the subject identically.
      framing: ${globals.framing}
      override_cam_from_mesh: true
      # Flat silhouette base + the usual skeleton overlay, with the face
      # splat composited last. The base layer's background is always
      # #7F7F7F (render.py forces it, `bg_color` below does not reach it),
      # and `outline_strength` sets how dark the fill is — left at its
      # default, which lands the fill on #6F6F6F, just off the ground.
      render_mode: outline+skeleton+splat
      # Tell the denoise which pixels are already real: 0.0 where the face
      # splat covers the frame, 1.0 everywhere else, in
      # wan22_vace_denoise's `control_masks` convention. ON here although
      # the step declares it OFF — the step's default has to stay off
      # because nothing downstream is *obliged* to consume the batch, but
      # in this workflow reinject_anchor_initial reads it, and the mask was
      # measured to earn its place: every reference run of the 2026-09-08
      # skeleton-leak sweep carries it (section 1a of
      # docs/vace-denoise-findings-2026-09-07.md). It was a per-run
      # `--param` for a week, and forgetting it costs a whole pod run —
      # the wrong way round for something that works.
      splat_inactive_mask: true
      # The skeleton overlay's drawing convention. `dwpose` is the step
      # default and what these frames want: the same convention Wan 2.2
      # VACE's own pose maps are drawn in, measured against
      # `vace/annotators/dwpose/util.py` (and the identical code in
      # MimicMotion and comfyui_controlnet_aux) — body limbs dimmed to 60%
      # with undimmed joint dots, sticks and dots both ~7 px at this
      # resolution, and hands a quarter as thick under a hue sweep with blue
      # keypoints.
      #
      # The BODY topology is DWPose's exactly: its 17 limbs, no more. So no
      # feet (DWPose detects them and draws none) and no MidHip — the torso
      # runs neck->RHip and neck->LHip directly, two limbs crossing the
      # chest, where BODY_25 drew a Y meeting at the pelvis. The palette is
      # indexed off that limb order too, which is what the older style got
      # one hue step out below the hips and across the whole head. Hands are
      # NOT dropped: MimicMotion draws them unconditionally and
      # controlnet_aux defaults them on, so they are well in distribution.
      #
      # Left unwritten here so the step's default governs;
      # `skeleton_style: openpose` restores the older look for a comparison,
      # and `joint_radius`/`bone_radius` follow whichever style is chosen
      # unless they are set explicitly.
      #
      # For the ABLATION — is the skeleton earning its place at all? — set
      # `render_mode: outline+splat` here. That is this exact frame with the
      # overlay and nothing else removed: same silhouette, same face
      # splat, same background, same masks.
      # The room the drawings stand in — OFF as of 2026-09-04, and off
      # ENTIRELY: an empty `background` makes build_background return before
      # it reads a single fade param (steps/backdrop.py), so this one line
      # takes the grid and the subject fade with it. What stood here was
      # `background: grid` with `background_base_color: [0.5, 0.5, 0.5]` and
      # the step's own fade defaults — smoothstep, margin 1, falloff 1,
      # fading to `plain`.
      #
      # Why it goes: the room (2026-09-01), the fade (09-04) and the fade's
      # margin (09-04) all landed in the three days before a run that came
      # back not looking right, and nothing on this pipeline has been
      # compared against a run without them. Off is the baseline that
      # comparison needs, and one line is a cheaper ablation than three.
      #
      # What it costs is the thing the backdrop was added for: over a blank
      # backdrop a video diffusion model reads an orbit as the SUBJECT
      # turning rather than the camera travelling — steps/backdrop.py's
      # docstring is the long version. If the denoise comes back with a
      # figure that spins in place, or a splat that will not converge
      # because the frames disagree about which way it faced, this is the
      # first line to put back. Putting it back is the two lines quoted
      # at the top of this note; their colours were measured (0.5 walls render a flat 128, seventeen
      # levels off the #6F6F6F silhouette fill, where grid's own blue-tinted
      # default landed within four) and the margin was too (1 keeps 33% of
      # the ruling in frame frontal / 66-72% three-quarter, against 22% / 44%
      # at 2). This file at `542eb79` has both arguments in full.
      #
      # NOTE that `rerender_splat` below followed on 2026-09-05: neither
      # render draws a room now, so the two denoise passes agree again. What
      # they do NOT agree with is their own prompt, whose 场景 slot still
      # describes the gridded room in both passes — see the note on that
      # string below, and steps/backdrop.py's docstring for the argument
      # that the room should come back rather than the prompt go.
      background: ""
      # Every frame whose view of the head is within this of the
      # photograph's takes the layer; past it the 2.5-D shell's open rim is
      # what would appear, so it is dropped entirely. body2colmap measured
      # that boundary (c65a7f7): a Face_Neck head splat reads cleanly to
      # about 30 degrees, the rim starts flaring by 45, and by 60 the shell
      # is mostly edge. 60 is the far end of that on purpose, and it is
      # passed explicitly rather than left to the step's default for that
      # reason: out there the alternative is a drawing with no face at all,
      # and these frames go through two denoise passes that can rewrite a
      # flared rim. The supporting views make the opposite trade — nothing
      # rewrites them — and get their own 30-degree cap render below.
      splat_max_angle_deg: 60.0
      # Mid grey, not the step's default white. This does NOT change the
      # rendered background — neither `outline+skeleton`'s flat #7F7F7F base
      # nor `render_depth` takes bg_color — it changes the ONE other thing
      # render.py spends this param on: it publishes it as
      # `image_warp["bg_color"]` (render.py's `if image_warp is not None`
      # block), which is where warp_reference_to_anchor below gets the
      # border colour it fills around the warped reference photo.
      #
      # 0.5 rather than a literal 127/255, because the recorded run shows
      # both roundings and 0.5 is what produces them: the renderer does
      # `int(bg*255)` = 127 and generate_firstlast does `round(bg*255)` =
      # 128. cyber2_6f/initial has mesh frames at 127 and an anchor.png at
      # 128 — the same 0.5 down two code paths, which is the evidence that
      # 0.5 is the value the reference pipeline used. It also matches the
      # #7F7F7F the outline base grounds on, so the anchor border and the
      # render backgrounds agree.
      #
      # White is the value that cannot be right: the anchor frame reaches
      # denoise_pass2 sitting among grey renders, and a white border is the
      # largest possible disagreement with them.
      bg_color: [0.5, 0.5, 0.5]
    outputs:
      images: dataset.images
      masks: dataset.masks
      # Populated, because `splat_inactive_mask` above is on — so the
      # optional read on reinject_anchor_initial below finds a batch here
      # rather than manufacturing its own. Turn that param off and this
      # goes back to None. See that step's note.
      inactive_masks: scene.inactive_masks
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      # The body mesh points_3d was sampled from, in the frame every camera
      # from here on is expressed in (refine_cameras moves cameras, not
      # points). Both trainings read it for the hollow loss.
      mesh: scene.mesh_world
      resolution: dataset.resolution
      focal_length_mm: dataset.extras.focal_length_mm
      orbit_target: dataset.extras.orbit_target
      forward_azimuth_deg: dataset.extras.forward_azimuth_deg
      anchor_position: dataset.extras.anchor_position
      anchor_frame_index: dataset.extras.anchor_frame_index
      original_focal_length: dataset.extras.original_focal_length
      framing_bounds: dataset.extras.framing_bounds
      initial_rotation: dataset.extras.initial_rotation
      image_warp: scene.image_warp

  # Put the real reference photo, warped to the anchor camera's framing,
  # onto the render at that frame — this is what makes cyber_6f/initial's
  # anchor frame byte-identical to anchor.png rather than a mesh render of
  # it (see pipeline/README.md's inject_anchor verification note).
  # scene.image_warp's keys (camera/original_focal_length/render_size/
  # bg_color) are render_initial_views' own image_warp output, unpacked —
  # see anchor_stub.py's GenerateFirstLastStep for why those specific
  # fields.
  - id: warp_reference_to_anchor
    step: generate_firstlast
    dispatch: in_process
    inputs:
      image: scene.front_image
      camera: scene.image_warp.camera
      original_focal_length: scene.image_warp.original_focal_length
      render_size: scene.image_warp.render_size
      bg_color: scene.image_warp.bg_color
    outputs:
      warped_image: dataset.anchor_image

  # The initial anchor injection — the pre-denoise one. This is what
  # cyber_6f/initial already has baked in: the warped photo overwrites
  # every frame sitting at the anchor camera, and the VACE mask there
  # becomes 0.0 ("a real photograph, keep it") against 1.0 for every
  # synthetic render. `reinject_anchor` in stage 3 does it again after the
  # helical re-render + mask_splat.
  - id: reinject_anchor_initial
    step: inject_anchor
    dispatch: in_process
    inputs:
      images: dataset.images
      cameras: dataset.cameras
      anchor_position: dataset.extras.anchor_position
      anchor_image: dataset.anchor_image
      # Filled by the render step's `splat_inactive_mask`, which is the
      # ONLY thing that fills it and which this workflow turns ON — so the
      # batch arriving here is per-PIXEL: 1.0 over the drawings, 0.0 over
      # the face splat, the one region of a skeleton+splat frame that is a
      # real photograph and not an annotation of one.
      #
      # Left empty — turn that param off — and this step manufactures the
      # batch itself instead: wan22_vace_denoise's per-FRAME VACE mask,
      # 1.0 "synthetic, denoise it" for the renders, 0.0 "a real photo,
      # keep it" at the injected anchor. See steps/anchor_stub.py.
      #
      # Either way inject_anchor passes a supplied batch through untouched
      # and only overwrites the anchor frame, so the two marks compose
      # rather than fight.
      #
      # Worth knowing what that changes: WITHOUT it, pass 1 is told the
      # whole frame is synthetic and free to repaint the face the splat
      # exists to carry. That has been true of every run to date.
      masks: scene.inactive_masks?
    outputs:
      images: dataset.images
      masks: dataset.masks

  # ------------------------------------------------- re-outline (experimental)
  # Six steps, every one gated on `re_outline`, that replace the silhouette
  # in the drawings above with one cut from a matte of the SUBJECT. With the
  # setting off none of them runs and pass 1 conditions on the render as it
  # stands; with it on, the last two steps rewrite dataset.images and
  # dataset.masks and pass 1 conditions on those instead.
  #
  # Why: the outline is the mesh's, and the mesh is a naked body model.
  # Wherever hair, a coat or a platform sole leaves that model the outline
  # tells the denoiser the subject stops short of where the photograph
  # says it goes (docs/vace-denoise-findings-2026-09-07.md measured the
  # scalp 7 px low and the feet 22 px high on cyber_6f). A denoised copy
  # of these very frames — the same control video, the same photograph at
  # the anchor, pass 1's own settings — has the subject where the model
  # paints it, hair and all, and rmbg cuts that out cleanly. At 480x832 the
  # pass costs a fraction of pass 1; what it produces is thrown away except
  # for its silhouette. The skeleton and face splat are re-drawn from the
  # same mesh and .ply as before, on the same cameras.
  #
  # The anchor is injected BEFORE this branch (reinject_anchor_initial,
  # above), so the extra pass sees the warped photograph at the anchor
  # frame with its 0.0 VACE mask exactly as pass 1 does, and rmbg of that
  # frame is the photograph's own matte. It is injected AGAIN at the end
  # (reinject_anchor_reoutlined) because render_reoutlined_views writes a
  # fresh render over the whole batch, anchor frame included.

  # 720x1280 -> 480x832, HERE and not in the denoise step. diffusers fits a
  # control video under the target AREA aspect-preserving and floors to
  # multiples of 16, so a 720x1280 batch asked for 480x832 would be
  # denoised at 464x832 with the (480x832-cropped) reference letterboxed
  # between white bars. Resized to exactly 480x832 first, diffusers has
  # nothing to fit. The resize is plain and 2.6% anisotropic; the mattes
  # go back through the same plain resize below, which cancels it.
  # dataset.masks here is the per-frame VACE flag batch inject_anchor
  # built (1.0 render / 0.0 anchor), which survives any resize exactly.
  - id: reoutline_downscale
    step: resize_batch
    dispatch: in_process
    when: ${globals.re_outline}
    inputs:
      images: dataset.images
      masks: dataset.masks
    params:
      width: 480
      height: 832
    outputs:
      images: scene.reoutline.images
      masks: scene.reoutline.masks

  # denoise_pass1's block, character for character, at 480x832. The 480
  # and 832 are literals on purpose: this pass runs at the low size
  # whatever the run's `resolution` is, that is the point of it. The
  # prompts are pinned by tests/test_workflows.py against every
  # wan22_vace_denoise step, this one included. `keep_loaded: true` puts it
  # on the same resident worker as the two passes below (the runner keys
  # workers on dispatch/env/keep_loaded), and width/height are not load
  # params, so the experts are loaded once for all three.
  - id: reoutline_denoise
    step: wan22_vace_denoise
    dispatch: subprocess
    env: wan22
    keep_loaded: true
    when: ${globals.re_outline}
    inputs:
      control_video: scene.reoutline.images
      control_masks: scene.reoutline.masks
      reference_image: dataset.reference_image
      subject_desc: dataset.prompt
    params:
      width: 480
      height: 832
      steps_high: 2
      steps_low: 4
      cfg: 1.0
      seed: ${globals.seed}
      sampler_high: uni_pc
      sampler_shift: 5
      strength: [1, 1, 0.5, 0.5, 0.5, 0.5]
      prompt: "人工光、柔光、低对比度、环绕运镜。时间静止，人物完全静止。身体\
        如雕塑般僵硬，胸口没有起伏，头部保持固定角度，面部肌肉完全不动，维持单\
        一的中性表情。双眼一眨不眨，眼睑保持张开且稳定，目光空洞而固定，锁定远\
        处墙面上的一个点，对镜头毫无察觉、毫无反应。人物站在一间空房间里：灰色\
        墙面上有均匀的网格线，深色地板，浅色天花板，墙面相交处有清晰的墙角。房\
        间本身固定不动，镜头以匀速、固定焦距围绕主体平滑移动，墙角依次从画面中\
        掠过。灯光属于房间本身，位置固定：主光始终来自人物自身的左前方，右侧是\
        柔和的补光。人物身上的明暗、阴影与高光始终停留在同一片皮肤和衣物上，每\
        一帧完全相同——左侧始终是受光面，右侧始终是柔和的暗面；镜头绕到人物右侧\
        时，看到的正是那一侧的暗面。房间里的阴影同样固定：墙面上的明暗、以及人\
        物投在地面上的影子，始终落在房间中的同一位置，不随镜头移动。 Time is \
        frozen and only the camera moves. The gaze stays anchored to that \
        point on the wall as the camera passes, so the eyes slide across the \
        frame, always aimed past the lens at the wall behind it. Eyelids stay \
        open and steady, the expression holds without a single \
        micro-movement, and the head keeps its exact angle throughout. The \
        frozen subject is $SUBJECT_DESC$, standing in an empty room: grey \
        walls ruled with an even grid, a dark floor and a lighter ceiling, \
        meeting at clear corners. The room is fixed in place and the camera \
        travels through it, so the walls and their corners sweep past the \
        frame while the room itself never turns. Soft, low-contrast studio \
        light: the key sits high on the subject's own left, a soft fill on \
        their right, both fixed to the room and holding still while the \
        camera arcs around. Every highlight and shadow stays welded to the \
        same patch of skin and cloth from the first frame to the last, so \
        their left remains the lit side and their right remains the \
        soft-shadowed side for the whole circle; as the camera arcs round to \
        their right it sees that shadowed side. The room's shadows are just \
        as fixed: the shading on the walls and the shadow the subject casts \
        on the floor stay in the same place in the room in every frame, and \
        do not swing round with the camera. Matte skin, matte cloth, \
        photorealistic, sharp focus, identical face, clothing and lighting in \
        every frame."
      negative_prompt: "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静\
        止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的\
        手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体\
        ，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走, \
        chewing, tattoos, 眼球运动，眨眼，眼动追踪，微表情，面部抽动，头部移\
        动, 小头, 小脸"
    outputs:
      images: scene.reoutline.denoised

  # The subject, cut out of the denoised 480p frames. `debug_dir` is what
  # puts this pass on disk at all — nothing else reads scene.reoutline.*
  # after the resize below — so the frames and their mattes land in the
  # result .zip's debug/ beside denoise_pass1_input/, which is the drawing
  # they replace the outline of.
  - id: reoutline_matte
    step: rmbg
    dispatch: in_process
    when: ${globals.re_outline}
    inputs:
      images: scene.reoutline.denoised
    params:
      debug_dir: ${globals.output_root}/debug/reoutline
    outputs:
      masks: scene.reoutline.mattes

  # Back onto the render's pixel grid. `render` refuses a matte of any other
  # size rather than resampling it, and this is the one place the size is
  # decided: the same plain resize as the downscale, inverted.
  - id: reoutline_upscale_mattes
    step: resize_batch
    dispatch: in_process
    when: ${globals.re_outline}
    inputs:
      masks: scene.reoutline.mattes
    params:
      width: ${globals.resolution.0}
      height: ${globals.resolution.1}
    outputs:
      masks: scene.outline_masks

  # render_initial_views again, with one input more. The params block is a
  # copy of that step's, and MUST stay one: the render builds its cameras
  # from the mesh and these params alone, so an identical block is what
  # puts matte i on the camera frame i was rendered from. It publishes only
  # the three things that change — the frames, their alpha and the inactive
  # masks — and leaves dataset.cameras and every extras.* key as the first
  # render wrote them (the same values; not re-published so nothing can
  # drift). tests/test_workflows.py checks the two blocks agree.
  - id: render_reoutlined_views
    step: render
    dispatch: in_process
    when: ${globals.re_outline}
    inputs:
      mesh_output: scene
      splat_path: scene.face_splat_path?
      outline_masks: scene.outline_masks
    params:
      pattern: circular
      n_frames: 81
      resolution: ${globals.resolution}
      # See the `framing` global: rerender_splat below reads the same value,
      # and the two renderers must frame the subject identically.
      framing: ${globals.framing}
      override_cam_from_mesh: true
      # Flat silhouette base + the usual skeleton overlay, with the face
      # splat composited last. The base layer's background is always
      # #7F7F7F (render.py forces it, `bg_color` below does not reach it),
      # and `outline_strength` sets how dark the fill is — left at its
      # default, which lands the fill on #6F6F6F, just off the ground.
      render_mode: outline+skeleton+splat
      # Tell the denoise which pixels are already real: 0.0 where the face
      # splat covers the frame, 1.0 everywhere else, in
      # wan22_vace_denoise's `control_masks` convention. ON here although
      # the step declares it OFF — the step's default has to stay off
      # because nothing downstream is *obliged* to consume the batch, but
      # in this workflow reinject_anchor_initial reads it, and the mask was
      # measured to earn its place: every reference run of the 2026-09-08
      # skeleton-leak sweep carries it (section 1a of
      # docs/vace-denoise-findings-2026-09-07.md). It was a per-run
      # `--param` for a week, and forgetting it costs a whole pod run —
      # the wrong way round for something that works.
      splat_inactive_mask: true
      # The skeleton overlay's drawing convention. `dwpose` is the step
      # default and what these frames want: the same convention Wan 2.2
      # VACE's own pose maps are drawn in, measured against
      # `vace/annotators/dwpose/util.py` (and the identical code in
      # MimicMotion and comfyui_controlnet_aux) — body limbs dimmed to 60%
