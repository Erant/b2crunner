# The from-a-sheet path: build the initial multi-view dataset from one
# front/back reference sheet, then run the shared from-a-sheet tail over it
# (see FROM denoise_pass1 ON, below).
#
# BOOTSTRAP (this file only) — split_sheet -> reconstruct_body ->
# detect_face -> map_face_to_mesh -> fit_head_to_face -> [locate_face ->
# crop_face -> face_seg -> face_mask -> face_normals -> face_splat] ->
# render_initial_views -> warp_reference_to_anchor -> reinject_anchor_initial.
# The bracketed six are gated on the `face_splat` global, as are the
# tail's face_splat_refined -> render_face_support_views ->
# face_support_views that follow refine_cameras. render_initial_views is not: it
# draws the face splat itself now (`render_mode: outline+skeleton+splat`)
# and reads the .ply optionally, so the branch being off leaves it with
# nothing to composite rather than nothing to resolve.
#
# WHAT CHANGED (2026-09-04): **the helical anchor re-injection actually
# runs.** The shared tail's `rerender_splat` now anchors its helix
# (`override_cam_from_mesh: ${globals.anchor_helix}`) and publishes
# `anchor_position` / `anchor_frame_index` for the path it built, so the
# stage-3 `reinject_anchor` has a frame to match. It had none: an
# unanchored helix passes no closer than 24x the match tolerance to the
# anchor, so the step silently returned the batch untouched and
# denoise_pass2 conditioned on 81 synthetic frames with no 0.0 anywhere in
# its VACE mask. The base does anchor it — ComfyUI-Body2COLMAP `17f9f1a`,
# and cyber_6f/helical records anchor_frame_index 37 at the origin to prove
# the recorded run used it. Publishing the anchor from the render is the
# other half: `refine_cameras` republishes it ~62 mm off the origin, which
# on its own misses by ~10x. `inject_anchor` also logs what it did or did
# not match (it said nothing at all before), the output form `name?:` was
# added for the two keys an unanchored render does not publish, and
# tests/test_workflows.py refuses an inject_anchor whose batch was
# re-rendered along an unanchored path.
#
# WHAT CHANGED (2026-09-02): the FACE CAP WINS (docs/face-priority.md).
# The shared tail
# gained `face_priority` (after face_support_views) and
# `face_priority_shells` (after stage1_support_band), both the new
# `face_priority_weights` step: the refined face splat's coverage is
# rendered from every training camera and every shell camera and turned
# into a per-pixel loss weight that fades those views out over the face
# (1 - strength = 0.1 at full coverage, within the cap's 30 degrees, fading
# to nothing 15 degrees beyond). The training views' weights reach brush as
# a `weights/` sidecar (train_splat and export_colmap_intermediate gained a
# `weights` input; brush itself learned the sidecar — Erant/brush
# docs/loss-weights.md — and honours it in the loss, the normal loss and
# the evidence pass); the shells' weights are folded into their masks, and
# merge_support_views reads `masks_deferring_to_face`. face_support_views'
# `min_path_angle_deg` went 5 -> 0: with the frames silenced over the face
# the on-path cap views are no longer redundant with them.
#
# WHAT CHANGED (2026-09-02, earlier): the face splat is REBUILT after the
# camera refinement, and its cap is rendered there. `refine_cameras` moves
# the anchor camera the face splat was unprojected through; from 2026-08-31
# the cap's cameras were carried across by that camera's own pose delta
# (`rebase_face_support_views`), and measured on run e593a8 that put the
# cap's face 50 mm INSIDE the head — the delta is mostly a slide along the
# anchor's own viewing ray, and a rigid carry moves the splat's depth with
# it while that depth came from the mesh, which never moved. Now
# `face_splat_refined` runs `face_pointmap_splat` a second time through the
# refined anchor camera (`cameras: dataset.cameras`), re-taking the depth
# from the mesh, and `render_face_support_views` + `face_support_views`
# moved out of the bootstrap to follow it; render_splat's cap aims along
# the live anchor camera rather than the recorded `anchor_position`. The
# rebase step, `refine_cameras`' `given_cameras` output and
# tests/test_rebase_cameras.py are gone.
#
# WHAT CHANGED (2026-08-31): the face cap was carried across the camera
# refinement by the anchor camera's pose delta (`rebase_cameras`) — the
# approach the paragraph above replaces.
#
# WHAT CHANGED (2026-08-31): the SHARED TAIL gained supporting
# views of its own, off the stage-1 denoised batch. Three new steps after
# normal_maps — `stage1_view_splats` (a Gaussian shell per Nth denoised
# frame, rendered from +/-10 degrees of elevation), `stage1_support_band`
# (the same select_support_views the face uses) and `merge_support_views`
# (which concatenates the face cap and the body views into the one triple
# brush reads, and runs ungated so scene.support_views.* has exactly one
# writer). The face branch's outputs moved to scene.face_support_views.*
# accordingly; its step id did not change.
#
# The reason is the circular orbit: all 81 training views share one great
# circle, so the fit has nothing to triangulate off the path and any novel
# elevation smears. The shells inject a monocular depth prior from off
# that path — no new appearance, since the source frames are the
# training's own. Three settings drive it (`stage1_support_views`,
# `stage1_support_every_n` = 10, `stage1_support_elevation_deg` = 10);
# validated against a captured dataset in
# docs/stage1-support-views-implementation.md, never yet run on a pod.
#
# WHAT CHANGED (2026-08-31): the face splat is composited by the mesh
# render itself instead of by a pair of extra steps. body2colmap dropped
# gsplat for the same brush-splat-render binary this project already
# shells out to (its 24fe424), which is what the detour below was waiting
# for: `render_face_views` + `composite_face` are gone, and
# `render_initial_views` takes a `splat_path` and a `+splat` render mode.
# The blend is `Renderer._composite_splat`'s now, and the 60-degree cull is
# passed explicitly so it does not silently inherit body2colmap's 45.
#
# WHAT CHANGED (2026-08-30, latest): two fixes, both measured on cyber2_6f.
#
#   * The face splat was built with its depth read along the wrong axis and
#     its relief scaled by the wrong ratio: a crop's pointmap is depth along
#     the CROP-centred camera, 12.6 deg off SAM-3D-Body's axis for a head at
#     the top of a portrait frame, and scaling it to the mesh's distance
#     multiplied the relief by f_sam/f_pointmap = 3.19 on top of the width.
#     The face came out 184 mm wide and 338 mm deep, nodded back 12.6 deg,
#     with a sheet of neck behind it. `pointmap_splat` now integrates in the
#     pointmap's own camera, rotates onto SAM-3D-Body's rays, and scales the
#     relief by the width ratio: 178 x 155 mm, looking where the photo does.
#     This was the "did not converge" that removed the whole line for an
#     afternoon (7086115, reverted).
#   * `fix_head_angle` is replaced by `map_face_to_mesh` + `fit_head_to_face`
#     — see the block below. The auto nod turned the mesh head 30 deg away
#     from the photograph; the fit turns it to the photograph.
#
# WHAT CHANGED (2026-08-29): the MediaPipe face is gone, and a Gaussian
# splat of the subject's actual face is composited onto the skeleton
# drawings in its place. `detect_face` is deleted and render_initial_views
# no longer takes a `face_landmarks` input. Landmark dots carry almost no
# identity and the canonical face model carries none; a splat of the real
# face carries both identity and gaze, which is what these frames are for.
#
# WHAT CHANGED (2026-08-30, earlier): the face splat is MASKED to the face,
# not to the face and the neck (`face_mask`, a MediaPipe hull intersected
# with Sapiens2's Face_Neck class — the neck can only be intersected out,
# not deselected), and `align_bin_px` dropped from 32 to 8. The CROP stays
# the Face_Neck box: cutting it to the face as well was measured to flatten
# the face, see the note on locate_face. `fix_head_angle` gained a `cam_t`
# ray-hold the same day; that step has since left this file (above).
#
# The circular orbit, override_cam_from_mesh, the anchor warp and the
# anchor injection remain exactly as they were, deliberately: this file
# exists to test the face in isolation, so a run that looks different from
# the last one differs because of the face and nothing else. A separate,
# larger change — the photo-to-splat SHELL, which replaces the whole
# bootstrap with a helical orbit, a body-wide Gaussian shell, a pose refit
# and a substituted band of frames — is parked in fast_helical_shell.yaml
# and selected by nothing.
#
# The compositing is body2colmap's own `skeleton+splat` render mode, as
# `outline+skeleton+splat` on render_initial_views. It used to be a pair of
# b2crunner steps, because that mode rasterised through gsplat and this
# project deliberately has none (see pyproject.toml — dropping it removed
# the last runtime CUDA toolchain); the library now rasterises through
# brush-splat-render too, so the detour is gone. See
# docs/revert-when-body2colmap-drops-gsplat.md for what came out.
# This is what the bootstrap hands the shared tail, ready-made: a dataset
# rendered with override_cam_from_mesh whose extras carry orbit_target /
# anchor_position / focal_length_mm / original_focal_length, with a warped
# reference photo injected at the anchor frame (VACE mask 0.0) among renders
# (VACE mask 1.0). cyber_6f/initial IS that dataset; here the workflow builds
# it from one image.
#
# FROM denoise_pass1 ON — this is the shared tail: fast_helical_shell.yaml
# carries an identical copy, step for step, id for id (there is no include
# mechanism). tests/test_workflows.py checks it has not drifted.
#
# STATUS: never executed end-to-end. render's rasterization and
# generate_firstlast's warp have never run on real hardware (their module
# docstrings); everything from denoise_pass1 on shares that status. Treat
# this as the thing to debug on a GPU pod, not a working recipe.
#
# Stage 6 produces the run's deliverables under output_root:
#
#   colmap/              cameras.txt + images.txt + points3D.txt, images/, normals/
#   ply/                 scene.ply — a second brush training, normal-supervised
#   colmap_preupscale/   debug: a COLMAP dataset from the pre-upscale frames
#
# plus two intermediates written on the way through:
#
#   face/face.ply        the photo-derived Gaussian head, composited onto
#                        every drawing within 60 degrees of the source view
#   stage1_shells/       one view_NNNNN.ply per stage-1 shell, kept so a bad
#                        batch of supporting views can be looked at
#
# export_colmap / export_ply switch the first two off; export_colmap_preupscale
# (with run_upscale on) opts into the third. The web UI's Outputs box drives
# all of them plus the "Upscale dataset" toggle.
#
# The input is not a photo of the subject: it is the two-panel sheet a
# diffusion model generates, subject facing front on the left and seen from
# behind on the right. split_sheet cuts it down the middle — the front half
# feeds the mesh and the anchor warp, the back half becomes
# dataset.reference_image, the one view wan22_vace_denoise conditions on.
# cyber_6f's recorded reference.png is the whole sheet — the older
# convention, from before anchor injection; not the target here.
#
# **Reading this file.** Three declaration blocks sit above `steps:`, and
# they all feed one flat namespace that `${globals.x}` resolves against:
#
#   settings:  the knobs a person sees, declared with the type, default,
#              help and choices the web UI draws them from. Nothing about
#              this workflow is hardcoded in pipeline/webui.py any more.
#   outputs:   the deliverables, each naming the switch its export steps
#              read through `when:` and the `dir:` it lands in.
#   globals:   what has no control at all — here just `output_root`.
#
# Everything else lives under the step that consumes it, as an override on
# the default that step's own class declares (pipeline/step.py's
# `Step.PARAMS`), and reaches the UI only behind the "Per-step settings"
# fold. `python -m pipeline.cli params fast_helical_native --all` prints the
# effective value of every one of them, defaults included.
name: fast_helical_native
description: >-
  From a front/back reference sheet: split it, reconstruct a body, render its
  own anchored views, then run the shared six-stage tail over that dataset —
  denoise, train+re-render a splat, mask, denoise again, upscale, export a
  COLMAP dataset and/or a normal-supervised .ply.

settings:
  # The knobs the Run tab draws, in this order, straight from these
  # declarations — same `type`/`default`/`help`/`choices`/`advanced`
  # vocabulary a step param uses (pipeline/step.py's `Param`), so one widget
  # code path draws both. Each lands in the same namespace `${globals.x}`
  # reads, so a setting reaches the steps that need it exactly the way it
  # always has: as a `${globals.<name>}` written at each step that consumes
  # it. A setting nothing reads is refused at load (`WorkflowSpec.validate`).

  - name: resolution
    label: Resolution
    type: list
    default: [720, 1280]
    choices: [[720, 1280], [600, 1040], [480, 832]]
    help: >-
      Frame size, width x height, and the value more than one step must agree
      on: the render size, wan22_vace_denoise's width/height, and
      render_splat's. `render` takes it whole and has no width/height override
      of its own, so that stage cannot drift; denoise and render_splat split
      it via .0/.1. Only sizes the denoise model was trained for are offered.
      (2026-08-25: this file inherited [512, 512] from an earlier draft.)

  - name: framing
    label: Framing
    default: full
    choices: [full, torso, bust, head]
    help: >-
      How much of the body fills the frame. Threaded through both renderers
      that see it — the mesh render (render_initial_views) and the splat
      re-render (rerender_splat) — because they have to agree: `render` frames
      the mesh at this preset, the splat is trained on cameras aimed for it,
      and rerender_splat rebuilds its helical orbit around the same preset.
      `full` is the whole body and what every prior run used; torso / bust /
      head crop progressively tighter. Only the mesh reconstruction's skeleton
      makes the tighter presets available — `render` falls back to `full` for
      any it cannot compute, and rerender_splat follows.


  - name: seed
    label: Seed
    type: int
    default: 0
    help: >-
      One seed for every stochastic stage: both wan22_vace_denoise passes and
      the SeedVR2 upscale. Those were three independent step params (0, 0 and
      42) before this became a setting. Change it to draw a different sample
      of the same pipeline.

  - name: run_upscale
    label: Upscale dataset
    type: bool
    default: true
    group: outputs
    help: >-
      Run the SeedVR2 upscale (720x1280 -> 1080x1920) before the export, which
      also rescales the dataset's camera intrinsics to match, in the same step
      (steps/seedvr2.py). Off is the shorter pipeline that used to be a
      separate workflow. Drawn beside the deliverables because it is a
      property of what you get back rather than of how the run is built.

  - name: face_splat
    label: Face splat
    type: bool
    default: true
    advanced: true
    help: >-
      Whether the face branch runs: a Gaussian splat of the subject's actual
      face, composited onto the skeleton drawings wherever the camera can see
      it (+-60 deg). It REPLACES the MediaPipe landmark overlay this file used
      to draw — `detect_face` is gone, not disabled — so turning this off
      leaves the skeleton frames with no face at all rather than falling back
      to landmarks. That gap is deliberate: a YAML input cannot be
      conditionally wired, so a `when:`-skipped detect_face would make
      render_initial_views raise on an unresolvable context path. Putting the
      landmarks back means pasting the detect_face block and one
      `face_landmarks:` input line back in; the step, its params on `render`,
      and its tests are all still there. Costs a third 1B Sapiens2 head
      (~6.5 GB, segmentation) on top of the normal head, plus the pointmap
      head the splat itself needs.

  - name: stage1_support_views
    label: Stage-1 supporting views
    type: bool
    default: true
    help: >-
      Whether the stage-1 body shells run: Sapiens2's pointmap head over every
      Nth denoised frame, a Gaussian shell built from each one, and two renders
      of that shell taken above and below the frame's own camera. They reach the
      FIRST brush training as supporting views — evidence it fits where their
      mask says to and ignores everywhere else — alongside the face cap. The
      point is the circular orbit's zero parallax: every training frame shares
      one great circle, so the fit has nothing to triangulate off the path and
      novel elevations smear into chalky streaks. Note what this is NOT: unlike
      the face cap it injects no new appearance, since the source frames are the
      training's own frames. It is a monocular DEPTH PRIOR, and it is the change
      in this file most able to make the deliverable worse rather than better —
      see docs/stage1-support-views-implementation.md for the A/B it was
      measured with. Costs one pointmap forward and one brush-splat-render
      launch per shell (~2 s and a few seconds each), and the views themselves
      cost the training roughly 5 minutes and 2.5x the splat count.

  - name: stage1_support_every_n
    label: Stage-1 shell spacing (every Nth frame)
    type: int
    default: 10
    minimum: 1
    help: >-
      Build a shell from one denoised frame in this many, phased so the anchor
      frame — the single real photograph in the batch — is always among them.
      This is the cost knob: at 10 an 81-frame orbit gives 8 shells and 16
      supporting views, at 5 it gives 16 and 32. The validation capture was
      clean at every sheeted view with 5 and looked nearly as good by eye at 10,
      while keeping 0.5 dB more on-path fit — which is why 10 is the default
      here and the comparison on the real helical deliverable is still open.

  - name: stage1_support_elevation_deg
    label: Stage-1 shell elevation offset
    type: float
    default: 10.0
    minimum: 0.0
    maximum: 89.0
    help: >-
      How far above and below each source camera the two renders are taken.
      Azimuth and radius are untouched, deliberately: a circular orbit's missing
      dimension is elevation, not azimuth. The offset is from the camera's OWN
      elevation, which on this bootstrap is the photographer's (+10-15 deg),
      not from the equator. The shells were measured to hold together to about
      +-30; bigger sees more of what the shell does not know, smaller risks
      being inside select_support_views' 5-degree band around the denoising
      path, where the views are dropped as competing with a denoised frame.

  - name: refine_cameras
    label: Refine camera poses (COLMAP)
    type: bool
    default: true
    help: >-
      Bundle-adjust the generated orbit against the frames themselves before
      each brush training, with the gauge restored afterwards so the splat keeps
      its scale. Worth +0.63 PSNR / +0.0045 SSIM on held-out views, measured over
      three seeds per condition against a baseline whose own seed spread is
      +-0.003 (docs/camera-pose-refinement.md). It runs twice — once on the
      denoised bootstrap batch, once on the re-rendered helical one — because
      both paths are generated rather than measured, and each run costs a
      COLMAP feature/match/triangulate/BA pass over the training frames. At 81
      frames, measured: 27 s of features and matching on the pod image's CUDA
      build (2.8 s + 24.3 s) against 209 s on a CPU one, plus a bundle
      adjustment that is CPU-bound either way. Off gives the poses exactly as
      the renderer wrote them, which is
      what every run before 2026-08-31 used. Note what it never sees: the
      supporting views, which are renders made FROM these poses and so have no
      independent evidence to offer about them.

outputs:
  # What stage 6 can produce, and the switch each one is. `name:` is the
  # workflow global the `when:` on its export steps reads, so the switch is
  # greppable from either end; `dir:` is where those steps land it under
  # output_root, which is how a finished run is packaged for download
  # without pipeline/webui.py holding a list of subdirectory names.
  #
  # The web UI's Outputs box is exactly this list. `--param export_ply=false`
  # does the same from the CLI. Turning one off skips its steps entirely —
  # which for export_ply means not starting a second 30,000-iteration brush
  # training you were going to throw away.

  - name: export_colmap
    label: COLMAP dataset
    dir: colmap
    default: true
    help: >-
      cameras.txt, images.txt and points3D.txt, plus images/ and normals/,
      built from the frames as they finally are.

  - name: export_ply
    label: Trained .ply (normal-supervised)
    dir: ply
    default: true
    help: >-
      A second brush training over that dataset, normal-supervised, exported
      as scene.ply. A full 30,000 iterations — roughly an hour of GPU.

  - name: export_colmap_intermediate
    label: Intermediate COLMAP dataset (debug)
    dir: colmap_intermediate
    default: false
    help: >-
      Debug: the dataset the FIRST brush training is handed — the denoised
      frames plus the mattes and normals computed for them, AND the supporting
      views with a pose each in images.txt (the face cap, the stage-1 shells),
      before that splat is re-rendered along the helical orbit and denoised a
      second time. Everything that training saw, for when the re-render comes
      out wrong — including a supporting view that landed somewhere other than
      where its content belongs.

  - name: export_colmap_preupscale
    label: Pre-upscale COLMAP dataset (debug)
    dir: colmap_preupscale
    default: false
    requires: run_upscale
    help: >-
      Debug: the same export built from the frames as they are BEFORE the
      upscale (stage 4b), to measure what SeedVR2 does to Gaussian-splatting
      quality. With the upscale off it would be the ordinary colmap/ under a
      second name, so `requires:` disables it there rather than exporting
      something else.

globals:
  # What has no control of its own, and therefore no `settings:` entry.
  #
  # Every path this workflow writes to disk hangs off this one global, and
  # `pipeline.cli run` repoints it at the run's own directory under
  # B2C_OUTPUT_DIR (i.e. the mounted volume) unless you pass
  # `--param output_root=...`. The literal below is only what you get from
  # a bare `WorkflowRunner` with no CLI: relative to the working directory,
  # which on a pod is the container's writable layer — small, and gone when
  # the pod is recycled.
  output_root: output/fast_helical_native

  # Whether the shared tail's helical re-render anchors itself on the
  # photograph's camera. Not a knob — a statement about what THIS file's
  # bootstrap hands the tail, which is why it is here and not in
  # `settings:`. render_initial_views runs in override mode, so the dataset
  # reaching the tail has its original camera at the world origin and
  # carries the `original_focal_length` marker that says so; the tail's
  # rerender_splat can therefore bend its helix to pass exactly through that
  # camera, which is the only thing that gives `reinject_anchor` a frame to
  # overwrite. Turning this off makes that re-injection a silent no-op — see
  # the long note at rerender_splat.
  #
  # fast_helical_shell.yaml declares the same global `false`, because its
  # bootstrap publishes no anchor at all. That disagreement is deliberate
  # and the mirror test in tests/test_workflows.py exempts this one name
  # alongside `output_root`.
  anchor_helix: true

steps:
  # ================================================================ bootstrap
  # Build the dataset the shared tail expects as its input. Everything from
  # `denoise_pass1` on is that shared tail — fast_helical_shell.yaml carries
  # a verbatim copy.

  # The input is the two-panel front/back sheet, not a photo of the subject.
  # Nothing downstream wants both panels, and the two halves go to opposite
  # places (steps/reference_sheet.py):
  #
  #   front -> scene.front_image        sam3d_body / generate_firstlast
  #   back  -> dataset.reference_image  wan22_vace_denoise's reference_image
  #
  # Writing the back half over dataset.reference_image is deliberate: with the
  # anchor injected, the front already reaches the diffusion pass as a real
  # photograph at the anchor frame, so the reference slot is spent on the one
  # view nothing else in the batch can supply. (cyber_6f's recorded
  # reference.png is the whole sheet — the older convention, from before
  # anchor injection. Don't take it as the target.)
  - id: split_sheet
    step: split_reference_sheet
    dispatch: in_process
    inputs:
      sheet: dataset.reference_image
    params:
      front_side: left
    outputs:
      front: scene.front_image
      back: dataset.reference_image

  - id: reconstruct_body
    step: sam3d_body
    dispatch: subprocess
    env: sam3dbody
    inputs:
      image: scene.front_image
    outputs:
      vertices: scene.vertices
      faces: scene.faces
      joints: scene.joints
      keypoints_3d: scene.keypoints_3d
      global_rots: scene.global_rots
      cam_t: scene.cam_t
      focal_length: scene.focal_length
      # The frame that focal is measured in. The face branch below cuts a
      # crop out of the same photograph and rebuilds this camera on the
      # crop's pixel grid; publishing the size is what lets it refuse a
      # frame that is a resized copy rather than the photograph itself.
      image_size: scene.image_size
      bbox: scene.bbox
      # The MHR parameters behind the mesh. fit_head_to_face below replays
      # the body model's forward with the head's share of these as the free
      # variables, and publishes the updated set, so the mesh and the
      # parameters describing it never disagree.
      pose_params: scene.pose_params

  # ------------------------------------------------ the head, re-fitted
  # SAM-3D-Body's head does not agree with the photograph's face. On
  # cyber2_6f the raw fit's head landmarks miss MediaPipe's by 10.5 px rms,
  # and the head is too long and narrow for the subject (face width/height
  # 0.82 against the photo's 1.20). The face splat below sits on the
  # photo's rays by construction, so whatever the mesh head does, the
  # splat looks where the photograph looks — and the outline the diffusion
  # pass conditions on had better agree with it.
  #
  # `head_angle_fix` used to run here. It nods the head back to a fixed
  # 10 deg of forward lean, which on this subject turned it 30 deg AWAY from
  # the photograph (landmark residual 10.5 -> 20.7 px): the outline head
  # looked up while the face on it looked slightly down. It is still
  # registered, still tested, and declared incompatible with the fit below
  # (INCOMPATIBLE_STEPS) — it deforms the vertices without updating the
  # parameters the fit replays.
  #
  # The fit is dense and lives in the body model's own parameters: a
  # MediaPipe<->vertex correspondence is built by rendering THIS mesh's
  # head and landmarking the render (map_face_to_mesh, main env), then the
  # neck/head rotations, the head joint's scale and the head-only shape
  # components are optimised so those vertices project onto the photo's
  # landmarks (fit_head_to_face, sam3dbody env). 10.5 -> 2.4 px on
  # cyber2_6f, head pitched 7 deg down to where the photo looks, an intact
  # head from every angle — see steps/head_fit.py for why a vertex
  # deformation could not do this (it squashes the skull or pitches the
  # head 23 deg to hide the mid-face's length).
  #
  # detect_face is NOT gated on `face_splat` any more: the head fit needs
  # the landmarks whether or not the face splat is drawn. The face branch
  # below still is.

  # Where the face is. CPU, no pod, no GPU: the two model files live in
  # ~/.cache/body2colmap and the step is crop-first internally, which is
  # what makes it work on a full-body frame where the face is a few percent
  # of the pixels (see steps/face_landmarks.py's module docstring).
  - id: detect_face
    step: detect_face_landmarks
    dispatch: in_process
    inputs:
      image: scene.front_image
    outputs:
      face_landmarks: scene.face_landmarks

  # Which mesh vertex is each MediaPipe landmark. From the mesh alone: a
  # shaded render of its head through SAM-3D-Body's camera, landmarked,
  # each landmark snapped to the nearest visible vertex (446/468 at 0.8 px
  # on cyber2_6f). Main env — pyrender and MediaPipe, no torch.
  - id: map_face_to_mesh
    step: map_face_to_mesh
    dispatch: in_process
    inputs:
      mesh_output: scene
      image: scene.front_image
    outputs:
      face_correspondence: scene.face_correspondence

  # The fit itself, in the sam3dbody env because it needs the MHR body
  # model (the same checkpoint reconstruct_body loaded — no new download).
  # Overwrites the geometry AND pose_params, so everything downstream —
  # the render, the face splat's depth alignment, any later replay — sees
  # one consistent head. `shape_regularisation` 1.0 keeps the head shape
  # within ~2 sigma of SAM-3D-Body's; 0.3 fits 0.3 px tighter on a subject
  # the model finds unusual and looks the same. `fit_shape: false` turns
  # and scales the head only.
  - id: fit_head_to_face
    step: fit_head_to_face
    dispatch: subprocess
    env: sam3dbody
    inputs:
      mesh_output: scene
      face_landmarks: scene.face_landmarks
      face_correspondence: scene.face_correspondence
      image: scene.front_image
    outputs:
      vertices: scene.vertices
      keypoints_3d: scene.keypoints_3d
      joints: scene.joints
      global_rots: scene.global_rots
      pose_params: scene.pose_params
      head_fit_stats: scene.head_fit_stats

  # -------------------------------------------------------- the face splat
  # What replaced the MediaPipe landmarks: a Gaussian splat of the
  # subject's actual head, built from a CROP of the same photograph by
  # `face_pointmap_splat` and composited onto the skeleton drawings below.
  # Landmark dots carry almost no identity and the canonical face model
  # carries none; a splat of the real face carries both identity and gaze,
  # which is the point when these frames condition a video model.
  #
  # Why a crop, given that at `padding` 3.5 it is no longer a close-up:
  # framing. It puts the head against the torso near the middle of
  # Sapiens2's field, at that network's own 768/1024 aspect, instead of
  # wherever it sat in a full-body frame of some other shape — and it
  # publishes the bookkeeping the splat is placed by. Tightening it does
  # the opposite of what it looks like it should; see crop_face below.
  #
  # Why it runs AFTER fit_head_to_face: that step rewrites scene.vertices
  # and scene.keypoints_3d, and this splat's depth is scaled onto the mesh's
  # front surface. Aligning to the pre-fit mesh and then rendering the
  # post-fit one would put the face at a different distance than the skull
  # it sits on. The fit moves the mesh, not the photograph, so the splat
  # still carries the head at the angle the camera saw it; what matters
  # here is only that the two agree about depth.
  #
  # The circular orbit, the anchor warp and the anchor injection are all
  # exactly as they were in the bootstrap before the face. The photo-to-
  # splat SHELL bootstrap, which changes all of those, is parked in
  # fast_helical_shell.yaml.
  #
  # None of these steps declare `keep_loaded`, so the seg head is read from
  # the HF cache twice (locate, then mask) rather than held in host RAM
  # through two 81-frame diffusion passes. Set `keep_loaded: true` on both
  # sapiens2_seg steps to trade the other way; the step implements
  # release_vram, so it will not squat on the card between them.

  # WHAT CHANGED (2026-08-30): the mask is the FACE, not the face and the
  # neck. Sapiens2's `parts: face` is Goliath class 3, `Face_Neck` — one
  # class covering both — so "just the face" cannot be selected by naming a
  # different class; it has to be intersected out geometrically. MediaPipe's
  # landmarks are that geometry. On cyber2_6f the hull keeps 74% of the
  # Face_Neck matte; what it drops is the neck, which is what smeared across
  # the shoulder at the edges of the composited band.
  #
  # This is landmarks for GEOMETRY ONLY. They are not wired into `render` —
  # see the note on render_initial_views' inputs. The landmark dots are not
  # coming back; the splat replaced them.


  # Where to CROP. The crop stays the Face_Neck box even though the mask
  # below no longer is, and every measurement since has pushed the same
  # way: TIGHTER IS FLATTER. Cutting the crop to the face as well was built
  # and measured, and it flattened the face — relief 224.5 -> 144.2 mm, the
  # nose going from 99.2 mm proud of the face's outer edge to 22.9 (see
  # FaceLandmarkMaskStep's docstring for the table). The crop's `padding`
  # went 0.35 -> 3.5 on 2026-09-02 for the far end of that same effect: at
  # 0.35 the crop is mostly face, which is out of anything a body model was
  # trained to read, and the face cap came back flat.
  #
  # `box` is the tight bounding box of the largest connected component of
  # the selected classes.
  - id: locate_face
    step: sapiens2_seg
    dispatch: in_process
    when: ${globals.face_splat}
    inputs:
      image: scene.front_image
    params:
      # Face_Neck (class 3) alone — masktest's measured default, and what
      # every number behind the cull angle was taken with. `head` adds
      # hair, glasses and lips, which is where the rest of the identity
      # lives; nobody has measured it, and hair is where the pointmap is
      # least reliable. Worth trying on a pod, not worth defaulting to.
      parts: face
    outputs:
      box: scene.face_box

  # Cut it out at native resolution and record where it came from. `padding`
  # 3.5 (the step's default) makes this a head-against-a-torso crop rather
  # than a close-up — see CropToBoxStep's module docstring. What survives of
  # the crop is framing, aspect and the bookkeeping:
  # `crop_info` is what lets face_pointmap_splat re-express SAM-3D-Body's
  # camera on the crop's pixel grid, so every Gaussian still lands on the
  # ray through the full-image pixel it came from.
  #
  # `image` is scene.front_image, the sheet's front half at the resolution
  # it was uploaded at — the same array reconstruct_body was fitted to and
  # locate_face found the box in. Nothing between them resizes it, and
  # nothing may: face_pointmap_splat checks crop_info's full_size against
  # scene.image_size and refuses a resized copy.
  - id: crop_face
    step: crop_to_box
    dispatch: in_process
    when: ${globals.face_splat}
    inputs:
      image: scene.front_image
      box: scene.face_box
    outputs:
      image: scene.face_image
      crop_info: scene.face_crop_info

  # Segmentation at crop resolution. Its output is a summed class
  # *probability*, which is what the splat step wants — it thresholds for
  # the support region and keeps the soft values at the silhouette as the
  # Gaussians' opacity. Still Face_Neck: `head` adds hair, glasses and lips,
  # which is where the rest of the identity lives, but nobody has measured
  # it and hair is where the pointmap is least reliable. The neck comes off
  # in the next step, which is the only place it can.
  - id: face_seg
    step: sapiens2_seg
    dispatch: in_process
    when: ${globals.face_splat}
    inputs:
      image: scene.face_image
    params:
      parts: face
    outputs:
      mask: scene.face_seg_matte

  # Face_Neck minus the neck. `crop_info` is what maps the landmarks, which
  # are in the FULL frame's normalized coordinates, onto the crop's pixel
  # grid — the same relation face_pointmap_splat's `_source_intrinsics`
  # inverts to carry the camera the other way.
  #
  # Both halves are load-bearing. The hull alone takes background with it
  # wherever the head is turned and its convex boundary cuts past the cheek;
  # the seg matte alone cannot tell a jaw from a throat. The intersection is
  # the face, and it keeps the seg's soft silhouette where the two
  # boundaries coincide — the hull's own edge is feathered rather than cut,
  # because a hard edge would hand pointmap_splat a rim of fully opaque
  # Gaussians and the face would read as a sticker.
  - id: face_mask
    step: face_landmark_mask
    dispatch: in_process
    when: ${globals.face_splat}
    inputs:
      face_landmarks: scene.face_landmarks
      mask: scene.face_seg_matte
      crop_info: scene.face_crop_info
    outputs:
      mask: scene.face_matte

  # Normals for the crop, from the same 1b head stage 2 uses on the
  # denoised batch. These carry the FACE's relief — the whole reason for
  # cropping — and the depth the splat is built on is integrated from them.
  - id: face_normals
    step: sapiens2_lite
    dispatch: in_process
    when: ${globals.face_splat}
    inputs:
      image: scene.face_image
    outputs:
      normal_map: scene.face_normals

  # The face splat itself: Sapiens2's pointmap head over the crop, depth
  # re-solved from the normals above in SAM-3D-Body's own camera, one
  # oriented Gaussian per masked pixel, scaled onto the mesh's front
  # surface. Both defaults that differ from a full-body splat's
  # (splat_scale 0.5, fill_max_frac 0.05) are declared by the step class,
  # so nothing is overridden here — see FacePointmapSplatStep's docstring.
  #
  # The two numbers to read out of a run before believing it:
  # `splat_stats.focal_ratio_sam3d_over_pointmap` (near 1 means the two
  # monocular estimates of this lens agree) and
  # `splat_stats.normal_agreement_deg.after_median`. A ratio far from 1
  # means the face is stretched along the view axis and will look
  # over-rotated as the orbit turns.
  - id: face_splat
    step: face_pointmap_splat
    dispatch: in_process
    when: ${globals.face_splat}
    inputs:
      image: scene.face_image
      mask: scene.face_matte
      normal_map: scene.face_normals
      crop_info: scene.face_crop_info
      mesh_output: scene
    params:
      filepath: ${globals.output_root}/face/face.ply
    outputs:
      splat_path: scene.face_splat_path
      splat_stats: scene.face_splat_stats

  # render's mesh_output wants a dict with vertices/cam_t/faces/
  # keypoints_3d/focal_length (see render.py's module docstring on why
  # keypoints_3d specifically, not joints) — reconstruct_body's outputs
  # above already assembled exactly that dict at the "scene" namespace
  # (plus a few extra keys render.py ignores), so it's passed straight
  # through with no reshaping.
  #
  # override_cam_from_mesh: true is what makes this the *initial* render —
  # it anchors one frame exactly at the original SAM-3D-Body camera and
  # publishes the orbit_target/anchor_position/original_focal_length/
  # image_warp extras that reinject_anchor_initial and rerender_splat
  # both key off (see splat.py's override_cam_from_mesh path). Without it
  # this would be a normal auto-oriented render with no anchor to warp the
  # reference photo onto.
  - id: render_initial_views
    step: render
    dispatch: in_process
    inputs:
      mesh_output: scene
      # No `face_landmarks`: the face arrives as the splat overlay below
      # rather than as landmark dots drawn into the skeleton overlay.
      # render.py sets face_mode to None with no such input and skips the
      # overlay, which is what we want — dots under the splat would show
      # through its soft silhouette.
      #
      # The face splat itself, drawn on top of the drawing by the `+splat`
      # render mode. Read OPTIONALLY (`?`): the branch that builds it is
      # gated on the `face_splat` global, and with the branch off nothing
      # writes this path — render.py then logs a line and composites
      # nothing, rather than the workflow failing to resolve. The step needs
      # no anchor wired: `override_cam_from_mesh` below puts a camera
      # exactly where the photograph was taken from, which is what the view
      # angle is measured against, and it reads the splat's own bbox centre
      # (the same quantity face_splat publishes as
      # splat_stats.world_center) as the pivot.
      splat_path: scene.face_splat_path?
    params:
      pattern: circular
      n_frames: 81
      resolution: ${globals.resolution}
      # See the `framing` global: rerender_splat below reads the same value,
      # and the two renderers must frame the subject identically.
      framing: ${globals.framing}
      override_cam_from_mesh: true
      # Flat silhouette base + the usual skeleton overlay, with the face
      # splat composited last. The base layer's background is always
      # #7F7F7F (render.py forces it, `bg_color` below does not reach it),
      # and `outline_strength` sets how dark the fill is — left at its
      # default, which lands the fill on #6F6F6F, just off the ground.
      render_mode: outline+skeleton+splat
      # The skeleton overlay's drawing convention. `dwpose` is the step
      # default and what these frames want: the same convention Wan 2.2
      # VACE's own pose maps are drawn in, measured against
      # `vace/annotators/dwpose/util.py` (and the identical code in
      # MimicMotion and comfyui_controlnet_aux) — body limbs dimmed to 60%
      # with undimmed joint dots, sticks and dots both ~7 px at this
      # resolution, and hands a quarter as thick under a hue sweep with blue
      # keypoints.
      #
      # The BODY topology is DWPose's exactly: its 17 limbs, no more. So no
      # feet (DWPose detects them and draws none) and no MidHip — the torso
      # runs neck->RHip and neck->LHip directly, two limbs crossing the
      # chest, where BODY_25 drew a Y meeting at the pelvis. The palette is
      # indexed off that limb order too, which is what the older style got
      # one hue step out below the hips and across the whole head. Hands are
      # NOT dropped: MimicMotion draws them unconditionally and
      # controlnet_aux defaults them on, so they are well in distribution.
      #
      # Left unwritten here so the step's default governs;
      # `skeleton_style: openpose` restores the older look for a comparison,
      # and `joint_radius`/`bone_radius` follow whichever style is chosen
      # unless they are set explicitly.
      #
      # For the ABLATION — is the skeleton earning its place at all? — set
      # `render_mode: outline+splat` here. That is this exact frame with the
      # overlay and nothing else removed: same silhouette, same room, same
      # face splat, same masks.
      # The room the drawings stand in. Behind the flat grey silhouette and
      # under the skeleton overlay, both — body2colmap's `render_composite`
      # draws it beneath the BASE layer, which is the only correct place: the
      # skeleton writes RGB without touching alpha, so a backdrop composited
      # after it would blend the skeleton away everywhere off the mesh.
      #
      # Written here rather than read from a pipeline setting, and the same
      # two lines have to be repeated on the render that feeds the SECOND
      # denoise pass (rerender_splat below): the two passes must not be
      # handed a subject that changed rooms between them. steps/backdrop.py
      # records why the setting went away.
      #
      # Walls at a neutral 0.5 — #7F7F7F, the grey the outline base grounds
      # on and the value bg_color already carries. grid's own default is
      # [0.42, 0.44, 0.48], which renders 107/112/122: blue-tinted, and
      # within four levels of the silhouette fill (#6F6F6F, 111), so the
      # drawing very nearly disappeared into the wall. 0.5 renders a flat
      # 128 (measured through build_background, not assumed: 0.5*255 rounds
      # up) — seventeen levels off the fill, and no tint to disagree with
      # the rest of the frame. The floor (~61) and ceiling (~153) keep
      # grid's defaults on purpose: their reading apart from the walls is
      # what resolves which way is up under an orbit.
      #
      # The ruling has its own param too — `background_line_color`, left
      # unset here, which leaves grid's [0.88, 0.89, 0.92] (224/226/234).
      # The rest of the room is reachable through `background_params` and
      # none of it is fixed: `floor_color` and `ceiling_color` for the two
      # caps, `n_per_face` and `line_width` for the ruling's spacing and
      # thickness.
      #
      # THE ROOM ALSO PULLS BACK AROUND THE SUBJECT, and only here. Left on
      # the step's defaults — `background_fade: smoothstep`, margin 1,
      # falloff 1 — because this is the render those defaults were chosen
      # for. The lines fade to the wall (`background_fade_target: plain`)
      # rather than to a flat patch or a blur, so what disappears next to the
      # drawing is the RULING, while the wall, its shading and the corners
      # stay where they were.
      #
      # It is here because of what these frames are: a bare-mesh outline. A
      # grid running up to that outline reads to the model as an occluding
      # edge, so it will not paint past it and hair and bulky clothing get
      # squashed back onto the silhouette of a naked body — which is the one
      # thing the drawing must not decide.
      #
      # The margin is 1 — the fitted hull, no inflation — and it started at
      # 2 on the argument that the mesh is naked and the subject should not
      # be. What settled it was counting the ruling left in frame on a real
      # body at exactly this framing: at 2 the room is gone from the whole
      # half of the frame around the figure (22% of the ruling on a frontal
      # view, 44% three-quarter) against 33% / 66-72% at 1. The backdrop is
      # here to carry the rotation cue and that was too much of it to spend
      # up front. If the denoise comes back with hair and clothing pinned to
      # the bare outline, this is the knob that answers it.
      #
      # Unlike the two lines above it, this one is NOT repeated on
      # rerender_splat, and deliberately — see the note there.
      background: grid
      background_base_color: [0.5, 0.5, 0.5]
      # Every frame whose view of the head is within this of the
      # photograph's takes the layer; past it the 2.5-D shell's open rim is
      # what would appear, so it is dropped entirely. body2colmap measured
      # that boundary (c65a7f7): a Face_Neck head splat reads cleanly to
      # about 30 degrees, the rim starts flaring by 45, and by 60 the shell
      # is mostly edge. 60 is the far end of that on purpose, and it is
      # passed explicitly rather than left to the step's default for that
      # reason: out there the alternative is a drawing with no face at all,
      # and these frames go through two denoise passes that can rewrite a
      # flared rim. The supporting views make the opposite trade — nothing
      # rewrites them — and get their own 30-degree cap render below.
      splat_max_angle_deg: 60.0
      # Mid grey, not the step's default white. This does NOT change the
      # rendered background — neither `outline+skeleton`'s flat #7F7F7F base
      # nor `render_depth` takes bg_color — it changes the ONE other thing
      # render.py spends this param on: it publishes it as
      # `image_warp["bg_color"]` (render.py's `if image_warp is not None`
      # block), which is where warp_reference_to_anchor below gets the
      # border colour it fills around the warped reference photo.
      #
      # 0.5 rather than a literal 127/255, because the recorded run shows
      # both roundings and 0.5 is what produces them: the renderer does
      # `int(bg*255)` = 127 and generate_firstlast does `round(bg*255)` =
      # 128. cyber2_6f/initial has mesh frames at 127 and an anchor.png at
      # 128 — the same 0.5 down two code paths, which is the evidence that
      # 0.5 is the value the reference pipeline used. It also matches the
      # #7F7F7F the outline base grounds on, so the anchor border and the
      # render backgrounds agree.
      #
      # White is the value that cannot be right: the anchor frame reaches
      # denoise_pass2 sitting among grey renders, and a white border is the
      # largest possible disagreement with them.
      bg_color: [0.5, 0.5, 0.5]
    outputs:
      images: dataset.images
      masks: dataset.masks
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      resolution: dataset.resolution
      focal_length_mm: dataset.extras.focal_length_mm
      orbit_target: dataset.extras.orbit_target
      forward_azimuth_deg: dataset.extras.forward_azimuth_deg
      anchor_position: dataset.extras.anchor_position
      anchor_frame_index: dataset.extras.anchor_frame_index
      original_focal_length: dataset.extras.original_focal_length
      framing_bounds: dataset.extras.framing_bounds
      initial_rotation: dataset.extras.initial_rotation
      image_warp: scene.image_warp

  # Put the real reference photo, warped to the anchor camera's framing,
  # onto the render at that frame — this is what makes cyber_6f/initial's
  # anchor frame byte-identical to anchor.png rather than a mesh render of
  # it (see pipeline/README.md's inject_anchor verification note).
  # scene.image_warp's keys (camera/original_focal_length/render_size/
  # bg_color) are render_initial_views' own image_warp output, unpacked —
  # see anchor_stub.py's GenerateFirstLastStep for why those specific
  # fields.
  - id: warp_reference_to_anchor
    step: generate_firstlast
    dispatch: in_process
    inputs:
      image: scene.front_image
      camera: scene.image_warp.camera
      original_focal_length: scene.image_warp.original_focal_length
      render_size: scene.image_warp.render_size
      bg_color: scene.image_warp.bg_color
    outputs:
      warped_image: dataset.anchor_image

  # The initial anchor injection — the pre-denoise one. This is what
  # cyber_6f/initial already has baked in: the warped photo overwrites
  # every frame sitting at the anchor camera, and the VACE mask there
  # becomes 0.0 ("a real photograph, keep it") against 1.0 for every
  # synthetic render. `reinject_anchor` in stage 3 does it again after the
  # helical re-render + mask_splat.
  - id: reinject_anchor_initial
    step: inject_anchor
    dispatch: in_process
    inputs:
      images: dataset.images
      cameras: dataset.cameras
      anchor_position: dataset.extras.anchor_position
      anchor_image: dataset.anchor_image
    # No `masks` input: the batch this writes is manufactured by the step,
    # and it is wan22_vace_denoise's per-frame VACE mask — 1.0 "synthetic,
    # denoise it" for the renders, 0.0 "a real photo, keep it" at the
    # injected anchor. See steps/anchor_stub.py.
    outputs:
      images: dataset.images
      masks: dataset.masks

  # ================================================================
  # From here down: this file's shared tail. fast_helical_shell.yaml carries
  # a verbatim copy. Keep the two in sync — tests/test_workflows.py checks
  # they have not drifted.
  # ================================================================

  # ---------------------------------------------------------------- stage 1
  # denoise.json: initial -> circular, strength 1.0.
  # dataset.masks here is the per-frame reference/denoise flag baked into
  # the loaded frames' alpha — NOT a foreground mask. See
  # steps/wan22_vace_denoise.py's docstring.
  #
  # No checkpoint params here on purpose: the step defaults to the
  # pre-quantized fp8 experts (silveroxides/Wan_2.2-fp8_scaled_hybrid) and
  # has no bf16 path left to fall back to. Override fp8_checkpoint_high /
  # fp8_checkpoint_low (both `advanced`) only to point at local files.
  - id: denoise_pass1
    step: wan22_vace_denoise
    dispatch: subprocess
    env: wan22
    # Hold the pipeline resident between the two passes: one worker process
    # serves both, so the ~47 GB of weights come off the network volume
    # once per run instead of twice. The worker calls the step's
    # release_vram() after every job, so brush (which trains on the GPU
    # between these two steps) still finds an empty card — the weights wait
    # in host RAM, not VRAM. Both passes must declare this; it is what
    # makes them share one worker.
    keep_loaded: true
    inputs:
      control_video: dataset.images
      control_masks: dataset.masks
      reference_image: dataset.reference_image
      subject_desc: dataset.prompt
    params:
      width: ${globals.resolution.0}
      height: ${globals.resolution.1}
      # From the ComfyUI graph (workflows/api/denoise.json): 6 steps, cfg
      # 1.0, seed 0. These happen to equal the step's own declared defaults;
      # spelled out anyway so the two passes read identically and every knob
      # a run tunes is visible in the step's params block.
      steps: 6
      cfg: 1.0
      seed: ${globals.seed}
      # How hard the control video pushes, one scale per denoise step, first
      # to last — the whole of it, since the per-expert `strength_low` and
      # the multiplier `strength_steps` folded into this list on 2026-09-04.
      # Full scale while the pose is being set, gone by the time the last
      # step paints, which is the lever for a control frame whose skeleton
      # otherwise survives into the output as ink rather than as pose. The
      # fade sits where it does because of where the experts split: with
      # this checkpoint's boundary_ratio (0.875) and the scheduler's
      # flow_shift (3.0) steps 1-2 are the high-noise expert's and steps 3-6
      # the low-noise one's, so the two 1.0s leave the structure pass
      # untouched and the taper is spent entirely on the four steps that
      # decide detail. The last entry is a true 0: VACE off, the frame
      # finished on the model's own prior.
      #
      # This is also where the two passes disagree: pass 1 denoises the
      # circular render from scratch at these scales, pass 2 runs the same
      # shape at 0.8 of it against the helical re-render.
      strength: [1, 1, 0.75, 0.5, 0.25, 0]
      # One knob sits beside it, left unset here so this pass keeps pushing
      # on every layer alike: `strength_layers` tapers each step's scale
      # across the eight VACE injection layers, shallow to deep.
      # steps/wan22_vace_denoise.py's docstring has the mechanism and run()
      # has the timestep arithmetic.
      # The negative is the live ComfyUI graph's string (denoise.json node
      # 7). The positive STARTED as node 188's and deliberately diverged on
      # 2026-08-31 — the graph is reference only now, nothing here runs it.
      # $SUBJECT_DESC$ is filled in from dataset.prompt.
      #
      # What diverged: the lighting. Node 188 said only "even soft studio
      # light", which fixes the light's quality and not its place, so the
      # model fell back on its prior for a person on a seamless backdrop
      # under a 360 deg fixed-elevation orbit — a product turntable, key
      # light welded to the lens. That is view-DEPENDENT shading: the
      # highlight slides across the face frame to frame, and a splat cannot
      # reconcile it (floaters, colour that swims under rotation). The
      # replacement puts the key at the SUBJECT's own left, which is
      # world-fixed because the subject is, and says the shading stays on
      # the same skin all the way round.
      #
      # Two things it deliberately does NOT do. It does not reach for the
      # Wan aesthetic-control lighting tags (侧光/逆光/顶光/边缘光): every
      # one of those is defined relative to the CAMERA, so on an orbit they
      # ask for exactly the turntable. Only the camera-invariant ones are
      # tagged (人工光、柔光、低对比度) plus 环绕运镜, the arc shot. And it
      # states the invariant affirmatively rather than negating it — the
      # words "turntable" and "rotate" appear nowhere, because a diffusion
      # positive prompt suppresses a named concept unreliably and sometimes
      # summons it, and cfg 1.0 means there is no negative channel to put
      # it in (the negative below is encoded and then ignored entirely).
      #
      # Double-quoted with `\`-escaped line breaks, NOT YAML's folded `>-`:
      # a folded scalar turns every line break into a space, which inside
      # the Chinese runs silently corrupts the string. A continuation line
      # must not START with a space either — YAML strips it as indentation
      # — so a break inside the English keeps its space at the line's end.
      # tests/test_workflows.py pins both, character for character, against
      # every wan22_vace_denoise step in every workflow. denoise_pass2
      # carries the same two strings — a step param cannot reference
      # another step's, so they are repeated.
      #
      # What diverged a second time (2026-09-01): the SCENE, to match the
      # `background` setting. The prompt used to say "on a plain seamless
      # backdrop", which contradicted control frames that now show a ruled
      # room — while 灯光属于房间本身 ("the light belongs to the room
      # itself") and 远处墙面上的一个点 ("a point on the distant wall")
      # already assumed the room the frames had not had. The backdrop is
      # what makes the lighting claim answerable: light fixed to a room only
      # means something if the frames show the room it is fixed to.
      #
      # It goes in the 场景 slot of Wan's own formula (主体 + 场景 + 运动 +
      # 美学控制 + 风格化, "对主体所处环境特征细节的描述，可通过形容词或短
      # 句列举"), which is the slot the backdrop phrase already occupied —
      # so the edit is a swap, not an addition: grey gridded walls, a dark
      # floor, a lighter ceiling, corners (steps/backdrop.py's `grid`
      # defaults, which is what the renderer actually draws). It carries
      # two claims past the description. The room is what moves past the
      # camera rather than turning with it — the same invariant the lighting
      # sentence states, now said about the thing the frames show. And the
      # room's own shading is fixed the way the subject's is: shadows land
      # in the same place in the ROOM every frame, which is what a splat can
      # reconcile and a shadow swinging with the lens cannot.
      #
      # It reaches for no new aesthetic-control tag: "room" is scene
      # vocabulary, and the lighting tags stay the three camera-invariant
      # ones for the reason above. UNVERIFIED on a pod — like the lighting
      # edit before it, this is a quality change a real run has to judge.
      prompt: "人工光、柔光、低对比度、环绕运镜。时间静止，人物完全静止。身体\
        如雕塑般僵硬，胸口没有起伏，头部保持固定角度，面部肌肉完全不动，维持单\
        一的中性表情。双眼一眨不眨，眼睑保持张开且稳定，目光空洞而固定，锁定远\
        处墙面上的一个点，对镜头毫无察觉、毫无反应。人物站在一间空房间里：灰色\
        墙面上有均匀的网格线，深色地板，浅色天花板，墙面相交处有清晰的墙角。房\
        间本身固定不动，镜头以匀速、固定焦距围绕主体平滑移动，墙角依次从画面中\
        掠过。灯光属于房间本身，位置固定：主光始终来自人物自身的左前方，右侧是\
        柔和的补光。人物身上的明暗、阴影与高光始终停留在同一片皮肤和衣物上，每\
        一帧完全相同——左侧始终是受光面，右侧始终是柔和的暗面；镜头绕到人物右侧\
        时，看到的正是那一侧的暗面。房间里的阴影同样固定：墙面上的明暗、以及人\
        物投在地面上的影子，始终落在房间中的同一位置，不随镜头移动。 Time is \
        frozen and only the camera moves. The gaze stays anchored to that \
        point on the wall as the camera passes, so the eyes slide across the \
        frame, always aimed past the lens at the wall behind it. Eyelids stay \
        open and steady, the expression holds without a single \
        micro-movement, and the head keeps its exact angle throughout. The \
        frozen subject is $SUBJECT_DESC$, standing in an empty room: grey \
        walls ruled with an even grid, a dark floor and a lighter ceiling, \
        meeting at clear corners. The room is fixed in place and the camera \
        travels through it, so the walls and their corners sweep past the \
        frame while the room itself never turns. Soft, low-contrast studio \
        light: the key sits high on the subject's own left, a soft fill on \
        their right, both fixed to the room and holding still while the \
        camera arcs around. Every highlight and shadow stays welded to the \
        same patch of skin and cloth from the first frame to the last, so \
        their left remains the lit side and their right remains the \
        soft-shadowed side for the whole circle; as the camera arcs round to \
        their right it sees that shadowed side. The room's shadows are just \
        as fixed: the shading on the walls and the shadow the subject casts \
        on the floor stay in the same place in the room in every frame, and \
        do not swing round with the camera. Matte skin, matte cloth, \
        photorealistic, sharp focus, identical face, clothing and lighting in \
        every frame."
      negative_prompt: "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静\
        止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的\
        手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体\
        ，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走, \
        chewing, tattoos, 眼球运动，眨眼，眼动追踪，微表情，面部抽动，头部移\
        动, 小头, 小脸"
    outputs:
      images: dataset.images

  # ---------------------------------------------------------------- stage 2
  # resplat_helical.json: train a splat on the denoised views, then
  # re-render it along a new, longer helical orbit.

  # The alpha brush trains these frames against. It is baked into the
  # frames themselves rather than into a masks/ sidecar, which is what
  # makes them TRANSPARENT views — "nothing is there outside the subject",
  # so they carve the silhouette. (brush resolves that per view now; see
  # steps/brush.py. No --alpha-mode is passed, and this layout is what the
  # forced `transparent` used to spell out.) Distinct from the denoise
  # control mask above, which this overwrites: past this point the
  # reference/denoise flag is no longer needed.
  - id: foreground_masks
    step: rmbg
    dispatch: in_process
    inputs:
      images: dataset.images
    outputs:
      masks: dataset.masks

  - id: normal_maps
    step: sapiens2_lite
    dispatch: in_process
    inputs:
      images: dataset.images
    outputs:
      normal_maps: scene.normal_maps

  # ------------------------------------------- refining the cameras (stage 2)
  # Bundle-adjust the orbit BEFORE anything reads it. The poses this dataset
  # holds were generated, not measured — an exactly ideal circle, camera
  # height std exactly 0 — and the frames have since been through a
  # diffusion pass that had its own opinion about where the subject was.
  # Refining against the frames themselves is worth +0.63 PSNR / +0.0045
  # SSIM on held-out views (docs/camera-pose-refinement.md; three seeds per
  # condition, baseline seed spread +-0.003).
  #
  # WHERE IT SITS is the whole of the wiring, and there are three consumers
  # below that all have to see the corrected poses:
  #
  #   stage1_view_splats   places a Gaussian shell per frame ON THAT FRAME'S
  #                        OWN CAMERA RAY and renders it from a camera
  #                        derived from that pose. A wrong pose there is not
  #                        a wrong pixel, it is a shell in the wrong place,
  #                        and the supporting views it publishes then argue
  #                        with the training frames rather than supporting
  #                        them. This is why the step is here rather than
  #                        anywhere later.
  #   train_splat          the stage-2 fit itself.
  #   export_colmap_intermediate  the debug dataset, which has to describe
  #                        what was trained on.
  #
  # WHAT IT IS REFINED AGAINST is denoise_pass1's frames and RMBG's mattes —
  # the training views, and only those. The supporting views are never in
  # this solve: the face cap and the stage-1 shells are RENDERS, produced
  # from the very poses being corrected, so they carry no independent
  # evidence about where a camera was and would only vote for the answer
  # already in hand. (They also do not exist yet at this point in the file,
  # which is the same fact from the other side.)
  #
  # Frozen intrinsics, foreground-only features, and a Sim(3) putting the
  # gauge back afterwards, all of which are the step's own defaults — see
  # its module docstring for the three traps that make each one
  # non-negotiable. The checks are assertions: a solve that fails one is
  # refused and the given poses are published unchanged, which is exactly
  # the pipeline's behaviour before this step existed.
  - id: refine_cameras
    step: refine_cameras
    dispatch: in_process
    when: ${globals.refine_cameras}
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      images: dataset.images
      # foreground_masks' RMBG mattes, above. Not the VACE control masks
      # this field carried before that step — those are per-frame all-1.0
      # flags, and masking a solve to "everything" is the unmasked variant
      # under a different name.
      masks: dataset.masks
      # Which frame is the photograph, so the step can republish where the
      # refinement put it. Falls back to frame 0, the circular anchor.
      anchor_frame_index: dataset.extras.anchor_frame_index?
    params: {}
    outputs:
      cameras: dataset.cameras
      stats: scene.camera_refinement
      # The dataset's record of the photograph's camera, kept in step with
      # the cameras it just rewrote. render_initial_views wrote the GIVEN
      # anchor's position here; leaving it would have the extras describe
      # a pose the camera list no longer holds. Its readers — render_splat's
      # cap axis (which prefers the live camera anyway) and inject_anchor's
      # position match — now see the same anchor the cameras do.
      #
      # It does not stay this file's last word on the anchor: rerender_splat
      # republishes both keys for the helix it builds, because a position
      # match has to be against the path the frames were rendered along, and
      # this refinement's ~62 mm move would miss it by ~10x the tolerance.
      # refine_cameras_final, after that, republishes nothing — it wires no
      # anchor_frame_index, and moving the helix's anchor off the pose its
      # own frames were rendered from is exactly the mistake above.
      anchor_position: dataset.extras.anchor_position

  # --------------------------- the face splat, rebuilt on the refined poses
  # The one thing above that was BUILT on the poses the step above just
  # moved. The face splat is unprojected from the reference photograph
  # through the ANCHOR camera — the origin, where render_initial_views'
  # override mode put that frame — with its depth taken from the mesh. The
  # refinement has since declared the photograph taken from somewhere
  # slightly else, so the same pixels now belong on slightly different
  # rays; the mesh has not moved, and neither has the face the denoised
  # frames agree on, which sits on the mesh. So the splat is built AGAIN
  # here, from the same crop, matte and normals, through the refined anchor
  # camera (`cameras: dataset.cameras` plus the anchor's index), with its
  # depth re-taken from the mesh through that camera. The bootstrap's copy
  # stays on disk beside it (`face_splat`'s filepath against this one's)
  # for the comparison; nothing reads it again — render_initial_views was
  # its only reader and is behind us.
  #
  # Why a rebuild and not a rigid carry, which is what stood here from
  # 2026-08-31 to 2026-09-02 (`rebase_face_support_views`, a `rebase_cameras`
  # step since deleted): measured on run e593a8, the carry put the cap's
  # face 50 mm behind the face in the frames and the shells — the same
  # pixel in the anchor view, a second face inside the head from the side,
  # a Janus in the helical render. The anchor's own pose delta was 23 mm
  # toward the subject, 58 mm up and 1.6 degrees of pitch: at the head the
  # vertical parts cancel and what is left is a slide along the anchor's
  # viewing ray, the one direction a single frame's reprojection cannot
  # constrain and so the one a bundle adjustment is freest to leave there.
  # A rigid carry moves the splat's DEPTH by that slide, but the depth was
  # never the camera's to move — it came from the mesh. Rebuilding through
  # the refined camera keeps the pixels on the refined rays and puts the
  # depth back on the mesh, which is where the 22 frames around the anchor
  # triangulate the face (1 cm ahead of the mesh front; the carried cap was
  # 5 cm behind it). See FacePointmapSplatStep's docstring.
  #
  # Gated with the FACE branch, like everything it feeds. With
  # `refine_cameras` off, dataset.cameras still holds the given poses and
  # the anchor is still the origin camera, so this is the bootstrap's splat
  # again — the same answer, arrived at by reading rather than by wiring.
  # In place on scene.face_splat_path / scene.face_splat_stats, so the two
  # cap steps below need no rewiring and there is one path carrying the
  # face splat rather than a refined one beside a stale one for a later
  # reader to pick the wrong half of.
  - id: face_splat_refined
    step: face_pointmap_splat
    dispatch: in_process
    when: ${globals.face_splat}
    inputs:
      image: scene.face_image
      mask: scene.face_matte
      normal_map: scene.face_normals
      crop_info: scene.face_crop_info
      mesh_output: scene
      cameras: dataset.cameras
      # The frame the photograph is — the one the refinement moved out from
      # under the bootstrap's splat. The step falls back to frame 0 without
      # it, which is where a circular path's anchor sits anyway.
      anchor_frame_index: dataset.extras.anchor_frame_index?
    params:
      filepath: ${globals.output_root}/face/face_refined.ply
    outputs:
      splat_path: scene.face_splat_path
      splat_stats: scene.face_splat_stats

  # The SECOND face render, and a different set of views for a different
  # consumer. render_initial_views (back in the bootstrap) rides the
  # dataset's own cameras because its frames have to be composited onto
  # those exact drawings, one for one.
  # These are for `brush` as supporting views (face_support_views below),
  # and views on the dataset's path are the ones worth least there: each
  # already has a denoised frame of its own carrying the photograph, so a
  # render of the same view supervises it with a resampled copy of what it
  # has. What supervision is FOR is the rest of the neighbourhood.
  #
  # It renders the REFINED splat, `face_splat_refined` above, and it sits
  # here rather than in the bootstrap (where it lived until 2026-09-02) for
  # that reason and one more: render_splat aims the cap along the anchor
  # camera's view of the splat, and it reads that camera LIVE from
  # dataset.cameras[anchor_frame_index] — which `refine_cameras` has by now
  # rewritten — rather than from the recorded `anchor_position` (which the
  # refinement republishes too, but the camera list is the truth). Both the
  # splat and the disc of views around it therefore describe the refined
  # anchor.
  #
  # So: a `cap` — a disc of 36 views spread evenly by area within 30
  # degrees of the photograph's own view of the splat, aimed at the SPLAT's
  # centre rather than the body's (`bounds_source: splat`, which also
  # dollies in so the head fills the frame at fill_ratio instead of sitting
  # in it as a smudge). 30 degrees is body2colmap's measurement of where a
  # Face_Neck shell still reads cleanly (c65a7f7); past it the 2.5-D shell
  # shows its own open rim, and nothing downstream rewrites a supporting
  # view the way two denoise passes rewrite a composited one.
  #
  # bg_color black for the same load-bearing reason as above: these are
  # un-premultiplied by select_support_views, and dividing by alpha only
  # recovers the straight colour if the render was premultiplied over
  # black.
  - id: render_face_support_views
    step: render_splat
    dispatch: in_process
    when: ${globals.face_splat}
    inputs:
      splat_path: scene.face_splat_path
      dataset: dataset
    params:
      pattern: cap
      n_frames: 36
      cap_radius_deg: 30.0
      bounds_source: splat
      fill_ratio: 0.8
      width: ${globals.resolution.0}
      height: ${globals.resolution.1}
      bg_color: [0.0, 0.0, 0.0]
      # NO backdrop, and this is the same sentence as the black above rather
      # than a second one: select_support_views divides the alpha back out of
      # these frames to recover a straight colour, which only works if what
      # lies behind the splat is a flat black. A room behind it would be
      # recovered as the face's own colour and then trained on.
      background: ""
    outputs:
      images: scene.face_support_render.images
      masks: scene.face_support_render.masks
      cameras: scene.face_support_render.cameras

  # The face splat's SECOND route into the training. render_initial_views
  # back in the bootstrap puts it on the drawings, where two diffusion
  # passes then have their way with it; this hands a render of it to
  # `brush` as supporting
  # views —
  # training evidence weighted by the splat's own coverage and ignored
  # everywhere else — so the deliverable is pulled back toward the face in
  # the photograph rather than the one the denoiser invented. See
  # steps/brush.py's support_* inputs for why that must be brush's MASKED
  # mode: outside a face matte lies the rest of the subject — neck, hair,
  # ears — not empty space, and a transparent view would ask the training to
  # carve it away. Tighter than it used to be, and so more so: since
  # 2026-08-30 that matte is the face alone, and the neck it no longer
  # covers is exactly the kind of real surface a transparent view would
  # delete.
  #
  # The face-only matte reaches here on its own, with nothing to wire: these
  # masks are render_splat's coverage of scene.face_splat_path, and that
  # splat has one Gaussian per masked pixel. Narrow the matte and the splat
  # narrows, so its renders and their alpha narrow with it.
  #
  # The OUTER edge of the useful band was drawn by the sampler that made
  # these views: a 30-degree cap, which is body2colmap's measurement of
  # where a Face_Neck shell still reads cleanly (c65a7f7). Drawing it there
  # rather than here is the point of rendering a second set — culling the
  # drawing batch afterwards keeps the views nearest the photograph, which
  # are the ones worth least, and spends renders to do it. Note this is a
  # TIGHTER angle than the 60 render_initial_views composites at, on
  # purpose: nothing rewrites a supporting view, while a composited frame
  # is an input to two denoise passes that can rewrite a flared rim.
  #
  # What is left for this step is the INNER edge: min_path_angle_deg, 5
  # degrees, measured to the nearest camera on the denoising path. A band
  # swept down the whole orbit, not a hole punched at the anchor.
  # render_initial_views lays that path out as `pattern: circular` — one
  # elevation, 360 degrees of azimuth, every frame of it denoised — so a
  # supporting view sitting on it competes with a denoised frame wherever
  # it sits; being 140 degrees round the orbit from the photograph does
  # not make a view out of distribution, being off the path does. (On a
  # circle this comes out as the elevation difference; on
  # fast_helical_shell.yaml's helix it follows the sweep, which is why the
  # measure is to the path and not to a latitude.) Of the cap's 36 views
  # against 81 ring cameras, that drops the 7 nearest the ring.
  #
  # Only the STAGE-2 training reads these (`train_splat`). The final one
  # does not, and its inputs say so: by then the dataset is the helical
  # re-render, denoised again and upscaled, while these renders are still
  # the circular bootstrap's — stale path, stale resolution. The `?` on
  # `train_splat`'s reads is an optional read (see pipeline/workflow.py),
  # so this file and the shell file can share one tail: with the face
  # branch off (`face_splat: false`), nothing writes that path and brush
  # trains exactly as before.
  - id: face_support_views
    step: select_support_views
    dispatch: in_process
    when: ${globals.face_splat}
    inputs:
      images: scene.face_support_render.images
      masks: scene.face_support_render.masks
      cameras: scene.face_support_render.cameras
      # The denoising path: the cameras the training's own frames were
      # rendered and denoised along. `min_path_angle_deg` drops the cap
      # samples that land within 5 degrees of it — the innermost ring of
      # the disc, whose views the denoised batch already covers.
      # The REFINED path — the one these views will be trained beside.
      path_cameras: dataset.cameras
      # The pivot that distance is measured about, and the same one
      # render_initial_views culls about (it reads the splat's own bbox
      # centre off the .ply, which is exactly this): a head sits well above
      # a full-body orbit target, so measuring about the target would call
      # a camera closer to the path than it is to the head's view of it.
      splat_center: scene.face_splat_stats.world_center
    params:
      # 0, not the step's default 5: the default drops the cap views within
      # 5 degrees of the denoising path because "those views have a
      # denoised frame of their own already". Since face_priority below,
      # that frame is silenced over the face (weight 0.1 at full coverage),
      # so a cap view sitting on the path is no longer a resampled copy of
      # something the training has — it is the only face evidence at that
      # angle. The views nearest the photograph are also the cap's most
      # trustworthy renders (least parallax from the one source), which is
      # a second reason not to be the step that throws them away.
      min_path_angle_deg: 0.0
    outputs:
      # `face_support_views`, not `support_views`: `merge_support_views` in
      # the shared tail is the single writer of scene.support_views.*, and
      # it takes this branch and the stage-1 body shells as its two inputs.
      images: scene.face_support_views.images
      masks: scene.face_support_views.masks
      cameras: scene.face_support_views.cameras

  # ------------------------------------------------------ the face cap wins
  # Three sources describe the face in train_splat and, until 2026-09-02,
  # brush heard them at the same volume: the face cap above (masked
  # supporting views carrying the photograph), the denoised frames
  # (transparent training views carrying the denoiser's face) and, when
  # stage1_support_views is on, the body shells (masked supporting views
  # whose appearance is the denoised frames'). Wherever two of them cover
  # the face the fit averages them, and the cap loses as often as it wins.
  #
  # This renders the refined face splat's coverage from every TRAINING
  # camera and turns it into a per-pixel loss weight — 1 - strength (0.1)
  # where the splat covers the frame, 1 everywhere else — that brush reads
  # as a `weights/` sidecar and multiplies into that view's loss on top of
  # its alpha mode. The denoised frames keep carving the silhouette (their
  # alpha is untouched) and keep every pixel outside the face; over the
  # face they whisper and the cap speaks. brush's evidence pass honours the
  # same map, so rerender_splat's confidence gate does not then read the
  # silenced disagreement as evidence against the face.
  #
  # Only within the cap: the attenuation is full inside cap_radius_deg (30,
  # the same radius the cap is rendered within — past it the 2.5-D shell
  # has nothing to say that could replace what is silenced) and fades to
  # nothing over fade_deg beyond. The angle is measured about the splat's
  # centre from the anchor camera, read LIVE from dataset.cameras like the
  # cap's own axis, because refine_cameras moved it.
  #
  # The stage-1 shells get the same treatment in face_priority_shells
  # below, folded into their masks rather than a sidecar, since a masked
  # view's mask already is its per-pixel weight. Only the STAGE-2 training
  # reads either: train_final_splat takes no supporting views, so there is
  # nothing there for the frames to yield to.
  - id: face_priority
    step: face_priority_weights
    dispatch: in_process
    when: ${globals.face_splat}
    inputs:
      cameras: dataset.cameras
      # The REFINED splat, rebuilt through the refined anchor camera by
      # face_splat_refined: the same .ply the cap above was rendered from.
      splat_path: scene.face_splat_path
      anchor_cameras: dataset.cameras
      anchor_frame_index: dataset.extras.anchor_frame_index?
      anchor_position: dataset.extras.anchor_position?
      splat_center: scene.face_splat_stats.world_center
    params: {}
    outputs:
      weights: scene.face_priority.weights

  # ------------------------------------- the stage-1 shells' supporting views
  # The face splat's lever, applied to the denoised body. Every Nth frame of
  # denoise_pass1's output gets a Gaussian shell built from Sapiens2's
  # pointmap head, placed in that frame's own orbit camera, and rendered from
  # two cameras: one `stage1_support_elevation_deg` above the frame's own
  # elevation and one below, at the same azimuth and radius. Those renders
  # join the face cap in the single support_* set train_splat reads.
  #
  # WHY, in one sentence: this orbit is circular, so all 81 training views
  # share one great circle and the fit has nothing to triangulate — without
  # off-path evidence a novel elevation smears into chalky zero-parallax
  # streaks (measured; see docs/stage1-support-views-implementation.md).
  #
  # WHAT KIND of evidence, because it is not the face's kind: the face cap
  # injects photographic identity two denoise passes destroyed, while these
  # inject Sapiens2's monocular DEPTH PRIOR — no new appearance at all, since
  # the source frames are the training's own frames.
  #
  # Everything the shells need is already in the context at this point: the
  # denoised frames (denoise_pass1), the RMBG mattes (foreground_masks), the
  # normals (normal_maps), the orbit's own cameras and pivot
  # (render_initial_views) and the mesh that is every shell's shared depth
  # ruler (reconstruct_body, re-posed by fit_head_to_face). That is why the
  # block sits here and not earlier.
  #
  # The step's own align_bin_px default is 16, not pointmap_splat's 32: the
  # shell-in-front-of-mesh bias was measured at -11.9 mm at bin 32 against
  # -4.4 mm at bin 16 (and an overshoot at 8). Nothing here overrides it.
  #
  # Only the STAGE-2 training reads what this produces. train_final_splat
  # takes no supporting views: by then the dataset is the helical re-render,
  # denoised a second time and upscaled, and these are the circular
  # bootstrap's renders at the pre-upscale resolution.
  - id: stage1_view_splats
    step: pointmap_elevation_views
    dispatch: in_process
    when: ${globals.stage1_support_views}
    inputs:
      images: dataset.images
      masks: dataset.masks
      normal_maps: scene.normal_maps
      cameras: dataset.cameras
      mesh_output: scene
      orbit_target: dataset.extras.orbit_target
      # Optional: the step phases its sampling so this frame — the one real
      # photograph in the batch — is always among the shells, and falls back
      # to frame 0, which is where a circular path's anchor is anyway.
      anchor_frame_index: dataset.extras.anchor_frame_index?
    params:
      every_n: ${globals.stage1_support_every_n}
      elevation_deg: ${globals.stage1_support_elevation_deg}
      # Kept after the run: one .ply per shell, which is the only way to
      # look at what the renders were made of when a batch comes out wrong.
      output_dir: ${globals.output_root}/stage1_shells
    outputs:
      images: scene.stage1_support_render.images
      masks: scene.stage1_support_render.masks
      cameras: scene.stage1_support_render.cameras
      stats: scene.stage1_support_stats

  # The same select_support_views the face branch uses, unchanged, for the
  # two things it does that these renders need: it un-premultiplies them back
  # to the straight alpha brush's masked mode expects, and it drops any view
  # sitting within 5 degrees of the denoising path, where a supporting view
  # would only compete with a denoised frame that already covers it.
  #
  # There is no outer edge to draw here — that is the cap radius in the face
  # branch, and these views have no cap: there are exactly two per shell and
  # both are at the elevation offset asked for. At +-20 the guard drops
  # nothing (measured: 32 of 32 kept); it only bites if the offset is lowered
  # toward the path, which is exactly when it should.
  #
  # The pivot is orbit_target rather than a splat centre. Unlike the face's
  # head-above-the-target case, a body shell and the orbit share a centre.
  - id: stage1_support_band
    step: select_support_views
    dispatch: in_process
    when: ${globals.stage1_support_views}
    inputs:
      images: scene.stage1_support_render.images
      masks: scene.stage1_support_render.masks
      cameras: scene.stage1_support_render.cameras
      path_cameras: dataset.cameras
      orbit_target: dataset.extras.orbit_target
    params: {}
    outputs:
      images: scene.body_support_views.images
      masks: scene.body_support_views.masks
      cameras: scene.body_support_views.cameras

  # The shells yield to the face cap too (see face_priority above). A shell
  # is a masked supporting view, so the weight goes INTO its mask — a
  # masked view's mask is its per-pixel loss weight already — and what
  # merge_support_views reads below is the folded mask, not the band's.
  #
  # Gated on the shells, not the face: with the face branch off there is no
  # splat to yield to, the optional `?` reads come back empty, and the
  # step passes the masks through unchanged — which is what lets this path
  # have one writer whenever the shells exist at all.
  - id: face_priority_shells
    step: face_priority_weights
    dispatch: in_process
    when: ${globals.stage1_support_views}
    inputs:
      cameras: scene.body_support_views.cameras
      masks: scene.body_support_views.masks
      splat_path: scene.face_splat_path?
      anchor_cameras: dataset.cameras
      anchor_frame_index: dataset.extras.anchor_frame_index?
      anchor_position: dataset.extras.anchor_position?
      splat_center: scene.face_splat_stats.world_center?
      # The pivot's fallback when the face branch is off and there is no
      # splat centre — unused then, since nothing is rendered, but the
      # step still resolves a pivot before it decides that.
      orbit_target: dataset.extras.orbit_target
    params: {}
    outputs:
      masks: scene.body_support_views.masks_deferring_to_face

  # brush takes ONE support_* triple and there are now two producers of one,
  # so this concatenates them. It runs UNGATED, which is the point: it is
  # always the writer of scene.support_views.*, so that path has exactly one
  # writer instead of two branches racing for it. With both branches off it
  # publishes three empty lists and brush trains exactly as it did before
  # either existed.
  - id: merge_support_views
    step: merge_support_views
    dispatch: in_process
    inputs:
      a_images: scene.face_support_views.images?
      a_masks: scene.face_support_views.masks?
      a_cameras: scene.face_support_views.cameras?
      b_images: scene.body_support_views.images?
      # The masks AFTER face_priority_shells folded the face weight in.
      b_masks: scene.body_support_views.masks_deferring_to_face?
      b_cameras: scene.body_support_views.cameras?
    params: {}
    outputs:
      images: scene.support_views.images
      masks: scene.support_views.masks
      cameras: scene.support_views.cameras

  # Debug deliverable: the COLMAP dataset of the frames `train_splat` below
  # is fitted to — the denoised frames, the RMBG mattes and the normal maps
  # that the FIRST brush training runs on. Gated by
  # export_colmap_intermediate, off by default.
  #
  # It IS everything that training is handed: the supporting views — the
  # face cap and the stage-1 shells' elevation pair — go in too, through
  # the same `support_*` inputs and the same `_SupportViews` writer
  # `train_splat` below uses, wired to the same context paths. So the two
  # steps export one model between them and this one is a faithful record
  # of it: `images.txt` carries a pose for every supporting view, and the
  # frames land in `images/` as RGB with their mattes in `masks/`, which
  # is the layout that means MASKED to brush.
  #
  # That matters because a supporting view is the one thing here whose
  # pose has no other witness. The training frames are checked against
  # each other by `refine_cameras`; a supporting view is a render made
  # from a pose nothing re-measures, and the face cap's splat is built out
  # of the one photograph, through the anchor camera the refinement moved
  # — `face_splat_refined` rebuilds it through the refined one, and this
  # export is where to check that the face landed on the head: triangulate
  # the face in the support_* views against the frames (2026-09-02's
  # diagnosis did exactly that, and found the carried cap 50 mm deep).
  #
  # One step, not the three stage 4b needs: the masks and normals it wants
  # are already sitting in the context, computed by the two steps above for
  # brush itself. Recomputing them would export something subtly different
  # from what was trained on, which would defeat the point — this is here to
  # answer "what did the first splat actually see?", which is the question
  # behind a bad helical re-render, and it is the only stage whose brush
  # input is otherwise thrown away.
  - id: export_colmap_intermediate
    step: colmap_export
    dispatch: in_process
    when: ${globals.export_colmap_intermediate}
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      normal_maps: scene.normal_maps
      # The same three paths train_splat reads, and optional (`?`) for the
      # same reason: merge_support_views runs ungated, so with both branches
      # off it publishes three empty lists and this exports what it always
      # did. No support_normal_maps — brush is given none either.
      support_images: scene.support_views.images?
      support_masks: scene.support_views.masks?
      support_cameras: scene.support_views.cameras?
      # The training views' loss weights (face_priority), as the weights/
      # sidecar brush reads — so this export trains at the same weighting
      # train_splat did. Optional for the same reason as the support_* reads.
      weights: scene.face_priority.weights?
    params:
      output_dir: ${globals.output_root}/colmap_intermediate
      layout: brush

  - id: train_splat
    step: brush
    dispatch: in_process
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      normal_maps: scene.normal_maps
      support_images: scene.support_views.images?
      support_masks: scene.support_views.masks?
      support_cameras: scene.support_views.cameras?
      # Per-pixel loss weights for the training views, from face_priority:
      # the denoised frames yield to the face cap over the face. Optional
      # (`?`) so the face branch being off leaves brush training on
      # byte-identical data to before. See steps/brush.py's `weights`.
      weights: scene.face_priority.weights?
    params:
      # The expensive knob: brush trains twice in this pipeline (here and
      # train_final_splat) at roughly an hour of GPU each. 30000 equals
      # steps/brush.py's own default; spelled out because it is the one
      # brush setting worth seeing at a glance, and the two trainings could
      # be given different counts here. Everything else brush takes —
      # sh_degree, max_splats, refine_every, the normal-loss group — sits at
      # that step's declared defaults.
      total_steps: 30000
      # Also steps/brush.py's default, and spelled out for the same reason:
      # the next-but-one step depends on it. It writes each Gaussian's
      # multi-view evidence into the exported .ply (ev_* properties), which
      # is what rerender_splat's `confidence` reads to gate the render
      # without a second pass over the dataset. Turn it off and that render
      # warns and falls back to plain alpha — i.e. silently back to the
      # behaviour mask_splat used to patch up.
      export_evidence: true
      # Without this brush exports into tempfile.gettempdir() (see
      # steps/brush.py) — the trained .ply then only survives because
      # Dataset.to_disk copies it at the very end. `output_dir` rather than
      # `export_dir` because this is an intermediate: it lands under
      # <output_root>/brush/training_<ms>/, which cannot collide with the
      # second training below.
      output_dir: ${globals.output_root}
    outputs:
      splat_path: dataset.splat_path

  - id: load_trained_splat
    step: load_splat
    dispatch: in_process
    inputs:
      splat_path: dataset.splat_path
    outputs:
      splat_scene: scene.splat

  # ANCHORED, when the bootstrap handed this tail an anchored dataset
  # (`${globals.anchor_helix}` — true in fast_helical_native, false in
  # fast_helical_shell, whose bootstrap publishes no anchor at all).
  #
  # This block used to read "the ComfyUI node leaves override_cam_from_mesh
  # off here", and to lean on `inject_anchor` below re-applying the anchor
  # by matching on position afterwards. Both halves were wrong, and together
  # they made the stage-3 re-injection a SILENT NO-OP:
  #
  #   * The base does anchor it. ComfyUI-Body2COLMAP `17f9f1a` ("Anchor
  #     splat and helical paths to the original camera") added the option to
  #     the splat renderer precisely so a helix could pass exactly through
  #     the SAM-3D-Body camera, and the recorded run proves it was used:
  #     cyber_6f/helical (and /splatted, /masked_splatted) carries
  #     anchor_frame_index 37 with that camera at [0, 0, 0] — a key only the
  #     anchored branch republishes. The checked-in resplat_helical.json
  #     omits the widget because it was hand-edited three minutes after that
  #     commit and never regenerated; it is the stale artefact, not the run.
  #
  #   * Matching on position cannot re-apply an anchor to a path that was
  #     never bent to touch it. Measured on the recorded dataset with this
  #     file's own params, the nearest unanchored helical camera is 0.1408
  #     from the anchor against a tolerance of 0.00593 — 24x — so
  #     inject_anchor matched zero frames and denoise_pass2 ran with no real
  #     photograph in its batch and no 0.0 in its VACE mask. Anchored, the
  #     same solve lands a camera at 0.0000 from it.
  #
  # `anchor_position` / `anchor_frame_index` are published from HERE (see
  # outputs), overwriting what refine_cameras left in the extras. That
  # matters as much as the flag: refine republishes the anchor at the pose
  # the bundle adjustment moved it to (~62 mm off the origin on run e593a8),
  # while this path — like steps/render.py's override mode — puts its anchor
  # camera at the world origin, which is where the photograph was taken from
  # and where warp_reference_to_anchor warped it for. Matching the refined
  # position against this path misses by ~10x the tolerance. The extras must
  # describe the path the frames were actually rendered along.
  #
  # Otherwise unchanged: a fresh, longer helix at the dataset's inherited
  # focal length. `fill_ratio` and `bounds_source` are steps/splat.py's
  # declared defaults and the anchored path consults neither — it takes its
  # target and radius from the source render's own orbit_target and framed
  # focal length, which is what keeps this render's anchor frame identical
  # to the mesh render's.
  #
  # `framing: ${globals.framing}` keeps this render in step with
  # render_initial_views, which frames the mesh at that same preset — the
  # splat re-render has to match it or the two disagree about how tight the
  # body fills the frame. fast_helical_shell.yaml carries the identical
  # param for the same reason; test_workflows.py's mirror check expects the
  # two to agree.
  - id: rerender_splat
    step: render_splat
    dispatch: in_process
    inputs:
      splat_scene: scene.splat
      dataset: dataset
    params:
      width: ${globals.resolution.0}
      height: ${globals.resolution.1}
      framing: ${globals.framing}
      pattern: helical
      n_frames: 81
      n_loops: 2
      amplitude_deg: 30.0
      # See the block above. The bootstrap decides this, not the operator:
      # anchoring needs a dataset whose original camera is at the world
      # origin, and extras['original_focal_length'] — written only by an
      # override-mode render — is the marker for that.
      override_cam_from_mesh: ${globals.anchor_helix}
      # 30/90, not the 45/45 the solver defaults to — the values
      # resplat_helical.json's Body2COLMAP_HelicalPath node carries.
      lead_in_deg: 30.0
      lead_out_deg: 90.0
      # Gate the render on the evidence train_splat wrote into the .ply,
      # which is what makes mask_splat's thresholding stage unnecessary
      # below. The alpha that comes back is the gate, not accumulated
      # opacity, and the RGB is composited over `cull_color` — so these
      # frames are a subject cut out of 0.5 grey with a soft edge, not out
      # of black with a hard one. `bg_color` is ignored in this mode and is
      # therefore not set here. See docs/spatial-reinforcement.md.
      confidence: true
      cull_color: [0.5, 0.5, 0.5]
      # The same room render_initial_views put the drawings in — the same two
      # values, written out again because there is no setting sharing them
      # any more — so the second denoise pass is not handed a subject that
      # has just been teleported out of one. brush-splat-render draws one
      # flat colour and knows nothing of environments, so steps/backdrop.py
      # un-composites `cull_color` back out and re-composites over the
      # backdrop; exact wherever the gate culled, which is everywhere the
      # backdrop is actually visible.
      #
      # THE FADE IS NOT REPEATED, and this is the one place the two rooms are
      # allowed to differ. `render_splat` does not declare the fade params at
      # all, so there is nothing to turn off here. Two reasons, and both hold:
      # the shell is an ellipsoid fitted to MESH VERTICES and a .ply has none;
      # and the fade's whole job was to stop the room pinning hair and
      # clothing to a bare-mesh outline, which is spent by now — this render's
      # silhouette comes off a splat fitted to the DENOISED subject, so it is
      # already the right shape and a clear zone would only cost rotation cue.
      background: grid
      background_base_color: [0.5, 0.5, 0.5]
    outputs:
      images: dataset.images
      masks: dataset.masks
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      # Where THIS path put the anchor, replacing what refine_cameras left
      # in the extras — see the block above. render_splat writes both keys
      # only when it anchored the path; with `anchor_helix` off it writes
      # neither and the extras keep the bootstrap's, which is what the shell
      # file wants (nothing there injects an anchor anyway).
      anchor_position?: dataset.extras.anchor_position
      anchor_frame_index?: dataset.extras.anchor_frame_index

  # ---------------------------------------------------------------- stage 3
  # This used to be the stage that dropped the splat's low-confidence
  # fringes: threshold the render's alpha at 239/255, dilate by 2,
  # composite over black, bilateral-filter (`mask_splat.json`'s subgraph,
  # at `fast helical.yaml`'s 6/2). rerender_splat's `confidence` above
  # decides the same thing better — once, in 3-D, from what the training
  # views actually constrained rather than from accumulated alpha per pixel
  # per frame — so running the old cut on top of it is now WRONG rather
  # than merely redundant: it would re-composite the grey frames over black
  # and smear the gate's soft edge.
  #
  # The step stays, in passthrough, because its other half is still needed:
  # replacing the per-pixel splat alpha in dataset.masks with the per-frame
  # all-1.0 VACE batch that denoise_pass2 reads and reinject_anchor writes
  # its 0.0 into. Ordering is unchanged and still load-bearing (see below).
  # To A/B against the recorded ComfyUI run, set `mode: threshold` and turn
  # rerender_splat's `confidence` off — 6/2 is that step's own default.
  - id: mask_splat_fringes
    step: mask_splat
    dispatch: in_process
    inputs:
      dataset: dataset
    params:
      mode: passthrough
    outputs:
      dataset: dataset

  # Put the warped reference photo back onto whichever new frames landed on
  # the original camera. Matches by position, so it survives the reorbit —
  # but only because rerender_splat above ANCHORED its helix and published
  # where it put the anchor. A position match cannot re-apply an anchor to a
  # path that never passes through it; with the re-render unanchored (as
  # this file had it until 2026-09-04) the nearest camera is ~24x the
  # tolerance away, this step matches nothing, and denoise_pass2 runs with
  # no real photograph in its batch. It now says so in the log either way.
  #
  # AFTER mask_splat, not before it — the ordering is load-bearing and was
  # wrong. Before mask_splat this step sits where dataset.masks is carrying
  # rerender_splat's per-pixel splat alpha, and it would overwrite exactly
  # the input mask_splat exists to threshold. Here it only ever sees VACE
  # masks: mask_splat has already consumed the alpha and emitted all-1.0.
  #
  # This reproduces cyber2_6f/masked_splatted frame for frame: 80 frames
  # masked and filtered at alpha 255, and frame_00038_ the anchor.png
  # verbatim — not composited over black, not bilateral-filtered — at
  # alpha 0.
  - id: reinject_anchor
    step: inject_anchor
    dispatch: in_process
    inputs:
      images: dataset.images
      cameras: dataset.cameras
      anchor_position: dataset.extras.anchor_position
      anchor_image: dataset.anchor_image
      # mask_splat's all-1.0 batch, passed through with 0.0 written at the
      # anchor frame. Manufacturing it here instead would give the same
      # values today; wiring it keeps the step from silently destroying a
      # mask that matters if anything is ever inserted above it.
      masks: dataset.masks
    outputs:
      images: dataset.images
      masks: dataset.masks

  # ---------------------------------------------------------------- stage 4
  # denoise.json again, strength 0.8 — clean up the re-render.
  - id: denoise_pass2
    step: wan22_vace_denoise
    dispatch: subprocess
    env: wan22
    # See denoise_pass1: both passes must declare keep_loaded for the two of
    # them to share one resident worker.
    keep_loaded: true
    inputs:
      control_video: dataset.images
      control_masks: dataset.masks
      reference_image: dataset.reference_image
      subject_desc: dataset.prompt
    params:
      width: ${globals.resolution.0}
      height: ${globals.resolution.1}
      # Same as denoise_pass1 — see the note there. Only `strength` differs.
      #
      # UNREVIEWED against the confidence render above (2026-08-30): these
      # frames are now a subject cut out of 0.5 GREY rather than black, and
      # the negative prompt still asks against 整体发灰 ("an overall grey
      # cast"). Neither prompt mentions a black background, so nothing here
      # is knowably wrong — but this is the pair to look at first if
      # denoise_pass2's output changed character with the gate. Left alone
      # deliberately: a prompt edit is a quality decision for a real run to
      # make, not a side effect of the render change. (With `background` on,
      # the grey is behind the room anyway — rerender_splat above draws the
      # same backdrop, so these frames match what the prompt now describes.)
      steps: 6
      cfg: 1.0
      seed: ${globals.seed}
      # Pass 1's fade, every entry scaled by this pass's 0.8: 0.8 down
      # through 0.6, 0.4 and 0.2 to a true 0 on the last step.
      strength: [0.8, 0.8, 0.6, 0.4, 0.2, 0]
      prompt: "人工光、柔光、低对比度、环绕运镜。时间静止，人物完全静止。身体\
        如雕塑般僵硬，胸口没有起伏，头部保持固定角度，面部肌肉完全不动，维持单\
        一的中性表情。双眼一眨不眨，眼睑保持张开且稳定，目光空洞而固定，锁定远\
        处墙面上的一个点，对镜头毫无察觉、毫无反应。人物站在一间空房间里：灰色\
        墙面上有均匀的网格线，深色地板，浅色天花板，墙面相交处有清晰的墙角。房\
        间本身固定不动，镜头以匀速、固定焦距围绕主体平滑移动，墙角依次从画面中\
        掠过。灯光属于房间本身，位置固定：主光始终来自人物自身的左前方，右侧是\
        柔和的补光。人物身上的明暗、阴影与高光始终停留在同一片皮肤和衣物上，每\
        一帧完全相同——左侧始终是受光面，右侧始终是柔和的暗面；镜头绕到人物右侧\
        时，看到的正是那一侧的暗面。房间里的阴影同样固定：墙面上的明暗、以及人\
        物投在地面上的影子，始终落在房间中的同一位置，不随镜头移动。 Time is \
        frozen and only the camera moves. The gaze stays anchored to that \
        point on the wall as the camera passes, so the eyes slide across the \
        frame, always aimed past the lens at the wall behind it. Eyelids stay \
        open and steady, the expression holds without a single \
        micro-movement, and the head keeps its exact angle throughout. The \
        frozen subject is $SUBJECT_DESC$, standing in an empty room: grey \
        walls ruled with an even grid, a dark floor and a lighter ceiling, \
        meeting at clear corners. The room is fixed in place and the camera \
        travels through it, so the walls and their corners sweep past the \
        frame while the room itself never turns. Soft, low-contrast studio \
        light: the key sits high on the subject's own left, a soft fill on \
        their right, both fixed to the room and holding still while the \
        camera arcs around. Every highlight and shadow stays welded to the \
        same patch of skin and cloth from the first frame to the last, so \
        their left remains the lit side and their right remains the \
        soft-shadowed side for the whole circle; as the camera arcs round to \
        their right it sees that shadowed side. The room's shadows are just \
        as fixed: the shading on the walls and the shadow the subject casts \
        on the floor stay in the same place in the room in every frame, and \
        do not swing round with the camera. Matte skin, matte cloth, \
        photorealistic, sharp focus, identical face, clothing and lighting in \
        every frame."
      negative_prompt: "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静\
        止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的\
        手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体\
        ，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走, \
        chewing, tattoos, 眼球运动，眨眼，眼动追踪，微表情，面部抽动，头部移\
        动, 小头, 小脸"
    outputs:
      images: dataset.images

  # --------------------------------------------------------------- stage 4b
  # Debug deliverable: a COLMAP dataset from the pre-upscale frames, for
  # comparing splat quality with and without SeedVR2. Gated by
  # export_colmap_preupscale, which the web UI only sets when run_upscale is
  # also on (with the upscale off, stage 6 already exports these same
  # frames). rmbg + normals are recomputed here rather than reused from
  # stage 6: those run after the upscale, on 1080x1920 frames.
  - id: export_masks_preupscale
    step: rmbg
    dispatch: in_process
    when: ${globals.export_colmap_preupscale}
    inputs:
      images: dataset.images
    outputs:
      masks: dataset.masks

  - id: export_normals_preupscale
    step: sapiens2_lite
    dispatch: in_process
    when: ${globals.export_colmap_preupscale}
    inputs:
      images: dataset.images
    params:
      batch_size: 4
    outputs:
      normal_maps: scene.preupscale_normal_maps

  - id: export_colmap_preupscale
    step: colmap_export
    dispatch: in_process
    when: ${globals.export_colmap_preupscale}
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      normal_maps: scene.preupscale_normal_maps
    params:
      output_dir: ${globals.output_root}/colmap_preupscale
      layout: brush

  # ---------------------------------------------------------------- stage 5
  # upscale.json — skipped entirely when run_upscale is false.
  #
  # seedvr2 resamples the frames and, in the same step, rescales the
  # dataset's camera intrinsics to match: it runs in its own venv, so the
  # IPC boundary in only carries plain arrays, not Camera objects, and
  # without the rescale the dataset would come out of this step holding
  # 1080x1920 images described by 720x1280 intrinsics — both stage-6
  # consumers would then believe the wrong focal length. cameras.txt would
  # claim a 720x1280 PINHOLE camera, and brush would fit a splat at half
  # the focal length the images were rendered with. The recorded ComfyUI-
  # era export has exactly this mismatch (cyber_6f/colmap: 720x1280
  # intrinsics, 1080x1920 frames), so this is an inherited bug, not a new
  # one — and a prime suspect for output that looks *almost* right. See
  # steps/seedvr2.py.
  - id: upscale
    step: seedvr2
    dispatch: subprocess
    env: seedvr2
    when: ${globals.run_upscale}
    inputs:
      images: dataset.images
      cameras: dataset.cameras
    params:
      # SeedVR2's `resolution` is the target output *shortest edge*, not a
      # multiplier — asking for less than the input's shortest edge
      # downscales. See steps/seedvr2.py.
      #
      # 1080, not the 1440 this was: the frames feed a Gaussian splat, and a
      # splat does not resolve detail the way a video does — past roughly
      # the native render size the extra pixels mostly buy training time and
      # VRAM. 720x1280 in, 1080x1920 out, which is also what the recorded
      # ComfyUI-era upscale produced (cyber_6f/upscaled).
      resolution: 1080
      # steps/seedvr2.py defaults this to 5; 1 is this workflow's own
      # choice — raise it once a real VRAM budget for the upscale is known.
      batch_size: 1
      vae_encode_tiled: true
      vae_decode_tiled: true
      # Was 42, its own number, while both denoise passes were 0. One
      # `seed` setting now feeds all three, so a run is one sample rather
      # than three unrelated ones.
      seed: ${globals.seed}
    outputs:
      images: dataset.images
      cameras: dataset.cameras
      resolution: dataset.resolution

  # ---------------------------------------------------------------- stage 6
  # colmap.json: background-remove, re-estimate normals against the frames
  # as they finally are, then emit whichever deliverables were selected.
  - id: export_masks
    step: rmbg
    dispatch: in_process
    inputs:
      images: dataset.images
    outputs:
      masks: dataset.masks

  # NOT the stage-2 normal maps (scene.normal_maps): those describe the
  # pre-re-render frames, which rerender_splat replaced wholesale with a
  # different, longer orbit — a different count, different poses, and after
  # the upscale a different resolution. Both deliverables below want
  # normals for *these* frames, so they are estimated again here.
  - id: export_normals
    step: sapiens2_lite
    dispatch: in_process
    inputs:
      images: dataset.images
    params:
      # Smaller than the step's default of 8: at the upscaled resolution
      # these are 1080x1920 float32 maps, and the returned list alone is
      # ~2 GB of host RAM.
      batch_size: 4
    outputs:
      normal_maps: scene.export_normal_maps

  # ------------------------------------------- refining the cameras (stage 6)
  # The same refinement again, and it is needed again for the same reason:
  # rerender_splat replaced the dataset wholesale with a NEW generated path
  # — a longer helical orbit, 81 fresh poses solved from a pattern rather
  # than measured — so the corrections made back in stage 2 do not describe
  # these cameras at all. The frames have also been through a second
  # diffusion pass and an upscale since, which is more of the disagreement
  # this exists to absorb, not less.
  #
  # Placed here, after export_masks and export_normals, so both stage-6
  # consumers below read the same corrected poses: the COLMAP dataset a run
  # hands back and the deliverable .ply trained from it. It reads
  # export_masks' mattes, which is why it cannot sit any earlier than this —
  # dataset.masks between mask_splat_fringes and here is the all-1.0 VACE
  # batch, and a solve masked to "everything" is the unmasked variant under
  # a different name.
  #
  # It does NOT cover export_colmap_preupscale (stage 4b), which is the one
  # deliverable that necessarily sees the given poses. That export exists to
  # measure what SeedVR2 does to splat quality by comparison with colmap/,
  # and refining it would have to be its own solve against its own frames —
  # a second three-minute run for a debug artefact that is off by default.
  # Worth knowing when comparing the two, which is why it is written down
  # rather than left to be discovered.
  #
  # Same defaults as the stage-2 instance. `train_final_splat` is gated on
  # export_ply and this is not: export_colmap wants the corrected poses too,
  # and the two switches are independent.
  - id: refine_cameras_final
    step: refine_cameras
    dispatch: in_process
    when: ${globals.refine_cameras}
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      images: dataset.images
      masks: dataset.masks
    params: {}
    outputs:
      cameras: dataset.cameras
      stats: scene.camera_refinement_final

  # Deliverable 1: a COLMAP dataset. `layout: brush` puts the frames in
  # images/ and the normals in normals/ beside the three .txt files —
  # what brush itself reads, and what somebody handed this directory
  # expects, rather than the flat frames-beside-the-txt layout the ComfyUI
  # colmap.json stage wrote.
  - id: export_colmap
    step: colmap_export
    dispatch: in_process
    when: ${globals.export_colmap}
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      normal_maps: scene.export_normal_maps
    params:
      output_dir: ${globals.output_root}/colmap
      layout: brush

  # Deliverable 2: a trained splat, normal-supervised. This is a second
  # full brush training — the stage-2 one exists to drive the helical
  # re-render and predates the second denoise pass and the upscale, so it
  # is not the splat anyone wants to keep. `export_dir` puts this one at a
  # predictable path instead of brush/training_<ms>/, which is the whole
  # reason the final splat can be `ply/scene.ply`.
  - id: train_final_splat
    step: brush
    dispatch: in_process
    when: ${globals.export_ply}
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      normal_maps: scene.export_normal_maps
      # NO support_* here, deliberately. The face splat's renders were
      # taken along the CIRCULAR bootstrap orbit and belong to the training
      # that ran on it; by this point the dataset is the helical re-render,
      # denoised a second time and upscaled, and those renders are stale in
      # both senses — wrong path, and a resolution and a diffusion pass
      # behind the frames beside them. Wiring `scene.support_views.*` in
      # here would not fail, which is exactly why it is called out: the
      # path is still populated from stage 1.
    params:
      # See train_splat's note. Same count; a run tuning the deliverable
      # splat alone changes it here.
      total_steps: 30000
      export_dir: ${globals.output_root}/ply
      export_name: scene.ply
    outputs:
      # Overwrites the stage-2 intermediate, so Dataset.to_disk's splat.ply
      # and the CLI's closing "splat:" line both name the final one.
      splat_path: dataset.splat_path
