# Target shape for the native port of workflows/pipeline/fast helical.yaml.
# rmbg, wan22_vace_denoise, sapiens2_lite, and sam3d_body (pipeline/steps/)
# are all verified on real hardware (L40S pod) — wan22_vace_denoise against
# cyber_6f's initial/ dataset at full 81-frame batch size (see that
# module's docstring for why frame count matters), rmbg and sapiens2_lite
# against its output frames (both single-image and batched paths), and
# sam3d_body against cyber_6f's anchor.png. brush and render_splat are now
# verified on real GPU hardware too (a local RTX 4070 Ti — see
# docs/docker-build-notes.md); render's rasterization itself is still
# UNTESTED (its own module docstring), separate from the EGL capability
# check that ran fine.
#
# render / generate_firstlast / inject_anchor are wired in below (2026-08-
# 23) — previously this workflow computed sam3d_body's mesh reconstruction
# into scene.* and then discarded it, jumping straight to `denoise` reading
# dataset.images/cameras that nothing had ever populated. That's also what
# every prior verification run sidestepped: everything tested so far used
# cyber_6f/initial, a pre-existing recorded multi-view dataset, not a
# dataset this workflow built itself from one photo.
#
# What "wired in" does NOT yet mean: a way to invoke this from a bare
# image. pipeline/dataset.py's Dataset dataclass requires images/cameras/
# points_3d/resolution up front (no defaults), and pipeline/cli.py only
# loads a complete on-disk dataset via --dataset — there's no bootstrap
# path that constructs a Dataset from just a reference photo yet. Until
# that exists, running this workflow from scratch means seeding a Context
# by hand (or extending cli.py) with a Dataset stub carrying only
# reference_image, empty images/cameras/points_3d, before calling
# WorkflowRunner.run directly — this file's step graph is now correct and
# complete, but the CLI entrypoint for "just one photo" is a separate,
# still-open piece of work.
#
# pattern/n_frames for render_initial_views below are inferred, not
# recovered from any source graph: even upstream ComfyUI-Body2COLMAP never
# scripted this stage as an API JSON (checked workflows/api/ and
# workflows/pipeline/fast helical.yaml directly — the pipeline runner
# there also starts from a pre-existing "initial" directory; producing it
# was apparently always a manual/interactive ComfyUI step). circular/81
# frames matches cyber_6f/initial/metadata.json's own recorded shape
# (81 cameras, anchor_frame_index=0, which is what render.py's circular
# path always produces in override_cam_from_mesh mode) closely enough to
# use as the default, but treat it as a best-effort match, not a verified
# recipe — there is no ground truth to diff against here the way brush's
# branch pin had `--help` to check against.
# STATUS (2026-08-25): this is the next piece of work, not a working
# recipe. It is the only workflow that starts from an image rather than a
# dataset — the web UI's front/back sheet input is refused against any
# other — and `Dataset.from_reference_image` (added since the header above
# was written) now closes the bootstrap gap that paragraph describes, so
# `pipeline.cli run fast_helical_native --reference-image sheet.png` at
# least has an entry point.
#
# What that image is was settled on 2026-08-25: the two-panel front/back
# sheet a diffusion model generates, split down the middle by the first
# step below. The front half feeds the mesh and the anchor warp; the back
# half becomes dataset.reference_image and is all VACE conditions on. See
# steps/reference_sheet.py — and note that cyber_6f's recorded
# reference.png (the whole sheet) is the older convention, not the target
# for this path.
#
# It PREDATES the deliverable conventions the two fast_helical files use
# and does not follow them yet:
#
#   * it ends at `train_splat` + a `save_dataset` checkpoint, with no
#     COLMAP export and no `ply/` — so it declares neither `export_colmap`
#     nor `export_ply`, and the UI's Outputs checkboxes hide for it;
#   * it is a single forward pass — it stops where fast_helical's second
#     half (re-render, mask, denoise again) begins.
#
# The plan is to get the helical flow right first and then bring this one
# up to it. Until then, treat the numbers in here as inherited rather than
# chosen wherever a comment does not say otherwise.
name: fast_helical_native
description: >-
  From-a-sheet single forward pass: split the front/back reference sheet,
  reconstruct a body, render its own views, denoise, train a splat.
  Predates the export conventions the fast_helical files use — see the
  STATUS note in the file.
#
# **Reading this file.** `globals:` holds only what more than one step has to
# agree on; everything else lives under the step that consumes it, as an
# override on the default that step's own class declares (pipeline/step.py's
# `Step.PARAMS`). The brush settings that used to sit up here as
# `brush_sh_degree` and friends are gone rather than moved: steps/brush.py's
# declared defaults ARE those values (they came from nodes/brush_node.py the
# same way), so the one training below only has to say what is specific to
# it. `python -m pipeline.cli params fast_helical_native` prints the
# effective value of every param, defaults included.
globals:
  # [720, 1280], the same portrait frame the helical files render and
  # denoise at (2026-08-25; this file inherited [512, 512] from an earlier
  # draft). It sets both the render size and wan22_vace_denoise's
  # width/height, so the two cannot drift apart here.
  resolution: [720, 1280]
  diffusion_steps: 6
  cfg: 1.0
  seed: 0
  # The one brush setting kept flow-wide, matching the fast_helical files:
  # it is the expensive one, at roughly an hour of GPU.
  brush_total_steps: 30000
  # Every path this workflow writes to disk hangs off this one global, and
  # `pipeline.cli run` repoints it at the run's own directory under
  # B2C_OUTPUT_DIR (i.e. the mounted volume) unless you pass
  # `--param output_root=...`. The literal below is only what you get from
  # a bare `WorkflowRunner` with no CLI: relative to the working directory,
  # which on a pod is the container's writable layer — small, and gone when
  # the pod is recycled.
  output_root: output/fast_helical_native
  # Exact strings from the live ComfyUI graph (workflows/api/denoise.json,
  # nodes 6/7/188) — $SUBJECT_DESC$ gets filled in from dataset.prompt.
  #
  # Double-quoted with escaped line breaks rather than YAML's `>-`, and that
  # matters: a folded scalar turns every line break into a space, which
  # inside the Chinese runs silently inserts spaces that are not in the
  # graph's string. `\` at end of line drops the break and the next line's
  # indent instead, so what loads is the prompt character for character.
  # tests/test_workflows.py pins both against the strings below.
  denoise_prompt: "时间静止，人物完全静止。身体如雕塑般僵硬，胸口没有起伏，头部保持固定\
    角度，面部肌肉完全不动，维持单一的中性表情。双眼一眨不眨，眼睑保持张\
    开且稳定，目光空洞而固定，锁定远处墙面上的一个点，对镜头毫无察觉、毫\
    无反应。镜头以匀速、固定焦距围绕主体平滑移动。 Time is frozen and only \
    the camera moves. The gaze stays anchored to that point on the wall \
    as the camera passes, so the eyes slide across the frame, always aimed \
    past the lens at the wall behind it. Eyelids stay open and steady, the \
    expression holds without a single micro-movement, and the head keeps \
    its exact angle throughout. The frozen subject is $SUBJECT_DESC$, lit \
    by even soft studio light against a plain seamless backdrop, photorealistic, \
    sharp focus, identical face and clothing in every frame."
  denoise_negative_prompt: "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静\
    止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的\
    手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体\
    ，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走, \
    chewing, tattoos, 眼球运动，眨眼，眼动追踪，微表情，面部抽动，头部移\
    动, 小头, 小脸"

steps:
  # The input is not a photo of the subject: it is the two-panel sheet a
  # diffusion model generates, the subject facing front on the left and
  # seen from behind on the right. Nothing downstream wants both panels,
  # and the two halves go to opposite places (steps/reference_sheet.py):
  #
  #   front -> scene.front_image        rmbg / sam3d_body / generate_firstlast
  #   back  -> dataset.reference_image  wan22_vace_denoise's reference_image
  #
  # Writing the back half over dataset.reference_image is deliberate, and
  # it is what makes `save_dataset`'s reference.png the back view: with the
  # anchor injected, the front already reaches the diffusion pass as a real
  # photograph at the anchor frame, so the reference slot is spent on the
  # one view nothing else in the batch can supply. (cyber_6f's recorded
  # reference.png is the whole sheet — the older convention, from before
  # anchor injection. Don't take it as the target.)
  - id: split_sheet
    step: split_reference_sheet
    dispatch: in_process
    inputs:
      sheet: dataset.reference_image
    params:
      front_side: left
    outputs:
      front: scene.front_image
      back: dataset.reference_image

  # rmbg's foreground/background mask is for the Gaussian-splat stage
  # (brush's --alpha-mode, not yet a step in this workflow) — NOT for
  # wan22_vace_denoise's control_masks below, which needs a different thing
  # entirely: a per-frame reference-vs-needs-denoising flag (see that
  # module's docstring, verified against cyber_6f's initial/ alpha
  # channel). That flag already comes baked into dataset.masks from
  # Dataset.from_disk() (the alpha channel of the loaded frames) — so rmbg
  # writes to its own scene.* path here rather than overwriting it.
  - id: remove_background
    step: rmbg
    dispatch: in_process
    inputs:
      image: scene.front_image
    outputs:
      mask: scene.foreground_mask

  - id: reconstruct_body
    step: sam3d_body
    dispatch: subprocess
    env: sam3dbody
    inputs:
      image: scene.front_image
    outputs:
      vertices: scene.vertices
      faces: scene.faces
      joints: scene.joints
      keypoints_3d: scene.keypoints_3d
      global_rots: scene.global_rots
      cam_t: scene.cam_t
      focal_length: scene.focal_length
      bbox: scene.bbox

  # render's mesh_output wants a dict with vertices/cam_t/faces/
  # keypoints_3d/focal_length (see render.py's module docstring on why
  # keypoints_3d specifically, not joints) — reconstruct_body's outputs
  # above already assembled exactly that dict at the "scene" namespace
  # (plus a few extra keys render.py ignores), so it's passed straight
  # through with no reshaping.
  #
  # override_cam_from_mesh: true is what makes this the *initial* render —
  # it anchors one frame exactly at the original SAM-3D-Body camera and
  # publishes the orbit_target/anchor_position/original_focal_length/
  # image_warp extras that reinject_anchor_initial and the eventual
  # render_splat re-render both key off (see splat.py's
  # override_cam_from_mesh path). Without it this would be a normal
  # auto-oriented render with no anchor to warp the reference photo onto.
  - id: render_initial_views
    step: render
    dispatch: in_process
    inputs:
      mesh_output: scene
    params:
      pattern: circular
      n_frames: 81
      width: ${globals.resolution.0}
      height: ${globals.resolution.1}
      override_cam_from_mesh: true
      # Mid grey, not the step's default white. This does NOT change the
      # rendered background — `depth+skeleton`'s base layer is render_depth,
      # which takes no bg_color — it changes the ONE other thing render.py
      # spends this param on: it publishes it as `image_warp["bg_color"]`
      # (render.py's `if image_warp is not None` block), which is where
      # warp_reference_to_anchor below gets the border colour it fills
      # around the warped reference photo.
      #
      # 0.5 rather than a literal 127/255, because the recorded run shows
      # both roundings and 0.5 is what produces them: the renderer does
      # `int(bg*255)` = 127 and generate_firstlast does `round(bg*255)` =
      # 128. cyber2_6f/initial has mesh frames at 127 and an anchor.png at
      # 128 — the same 0.5 down two code paths, which is the evidence that
      # 0.5 is the value the reference pipeline used.
      #
      # White is the value that cannot be right: the anchor frame reaches
      # denoise_pass2 sitting among grey renders, and a white border is the
      # largest possible disagreement with them.
      bg_color: [0.5, 0.5, 0.5]
    outputs:
      images: dataset.images
      masks: dataset.masks
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      resolution: dataset.resolution
      focal_length_mm: dataset.extras.focal_length_mm
      orbit_target: dataset.extras.orbit_target
      forward_azimuth_deg: dataset.extras.forward_azimuth_deg
      anchor_position: dataset.extras.anchor_position
      anchor_frame_index: dataset.extras.anchor_frame_index
      original_focal_length: dataset.extras.original_focal_length
      framing_bounds: dataset.extras.framing_bounds
      initial_rotation: dataset.extras.initial_rotation
      image_warp: scene.image_warp

  # Put the real reference photo, warped to the anchor camera's framing,
  # onto the render at that frame — this is what makes cyber_6f/initial's
  # anchor frame byte-identical to anchor.png rather than a mesh render of
  # it (see pipeline/README.md's inject_anchor verification note).
  # scene.image_warp's keys (camera/original_focal_length/render_size/
  # bg_color) are render_initial_views' own image_warp output, unpacked —
  # see anchor_stub.py's GenerateFirstLastStep for why those specific
  # fields.
  - id: warp_reference_to_anchor
    step: generate_firstlast
    dispatch: in_process
    inputs:
      image: scene.front_image
      camera: scene.image_warp.camera
      original_focal_length: scene.image_warp.original_focal_length
      render_size: scene.image_warp.render_size
      bg_color: scene.image_warp.bg_color
    outputs:
      warped_image: dataset.anchor_image

  - id: reinject_anchor_initial
    step: inject_anchor
    dispatch: in_process
    inputs:
      images: dataset.images
      cameras: dataset.cameras
      anchor_position: dataset.extras.anchor_position
      anchor_image: dataset.anchor_image
    # No `masks` input: the batch this writes is manufactured by the step,
    # and it is wan22_vace_denoise's per-frame VACE mask — 1.0 "synthetic,
    # denoise it" for the renders, 0.0 "a real photo, keep it" at the
    # injected anchor. See steps/anchor_stub.py.
    outputs:
      images: dataset.images
      masks: dataset.masks

  # Weights: the step's fp8 defaults (see steps/wan22_vace_denoise.py) —
  # nothing to configure here, and no bf16 path to fall back to.
  - id: denoise
    step: wan22_vace_denoise
    dispatch: subprocess
    env: wan22
    inputs:
      control_video: dataset.images
      control_masks: dataset.masks
      reference_image: dataset.reference_image
      subject_desc: dataset.prompt
    params:
      width: ${globals.resolution.0}
      height: ${globals.resolution.1}
      steps: ${globals.diffusion_steps}
      cfg: ${globals.cfg}
      seed: ${globals.seed}
      strength: 1.0
      prompt: ${globals.denoise_prompt}
      negative_prompt: ${globals.denoise_negative_prompt}
    outputs:
      images: dataset.images

  # Per-frame masks for the *denoised* batch — distinct from
  # remove_background above (which masks the raw reference photo for a
  # generate_firstlast pass that isn't wired in yet). Overwrites
  # dataset.masks; the per-frame reference/denoise flag that field held for
  # the denoise step above is no longer needed past this point.
  - id: mask_denoised_frames
    step: rmbg
    dispatch: in_process
    inputs:
      images: dataset.images
    outputs:
      masks: dataset.masks

  - id: normal_maps
    step: sapiens2_lite
    dispatch: in_process
    inputs:
      images: dataset.images
    outputs:
      normal_maps: scene.normal_maps

  # in_process, not docker: targeting RunPod, where a pod IS a single
  # container with no nested Docker daemon to run a separate brush image
  # in (confirmed on a real pod: no /var/run/docker.sock, no `docker`
  # binary) — so brush has to live in the same image as everything else,
  # per docker/Dockerfile. Its OS-level Vulkan/graphics requirement is
  # unresolved as of this writing: confirmed a default RunPod pod's
  # NVIDIA_DRIVER_CAPABILITIES only exposes compute,utility (vulkaninfo
  # fails with ERROR_INCOMPATIBLE_DRIVER even though the driver's .so files
  # are present), and setting the capability in docker/Dockerfile's own
  # image is necessary but not yet confirmed sufficient for a RunPod pod
  # specifically — see that file's comment and docs/docker.md.
  - id: train_splat
    step: brush
    dispatch: in_process
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      normal_maps: scene.normal_maps
    params:
      total_steps: ${globals.brush_total_steps}
      # Without this brush exports into tempfile.gettempdir() (see
      # steps/brush.py) — the trained .ply then only survives because
      # Dataset.to_disk copies it at the very end.
      output_dir: ${globals.output_root}
    outputs:
      splat_path: dataset.splat_path

  - id: checkpoint
    step: save_dataset
    dispatch: in_process
    inputs:
      dataset: dataset
    params:
      directory: ${globals.output_root}/checkpoint
