# Minimal workflow exercising the runner end-to-end with only in-process,
# dependency-free steps (no torch/model deps needed) — a smoke test for the
# dispatcher/context plumbing itself, independent of any model port.
#
# Run with:
#   python -m pipeline.cli run pipeline/workflows/roundtrip_example.yaml \
#       --dataset path/to/existing/b2c_dataset --envs pipeline/envs/envs.yaml
name: roundtrip_example
description: Load a dataset, checkpoint it back to disk under a new name.
params:
  # Every path this workflow writes to disk hangs off this one param, and
  # `pipeline.cli run` repoints it at the run's own directory under
  # B2C_OUTPUT_DIR (i.e. the mounted volume) unless you pass
  # `--param output_root=...`. The literal below is only what you get from
  # a bare `WorkflowRunner` with no CLI: relative to the working directory,
  # which on a pod is the container's writable layer — small, and gone when
  # the pod is recycled.
  output_root: output/roundtrip

steps:
  - id: checkpoint
    step: save_dataset
    dispatch: in_process
    inputs:
      dataset: dataset
    params:
      directory: ${params.output_root}/checkpoint
