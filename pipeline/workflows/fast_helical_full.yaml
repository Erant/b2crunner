# Native port of ComfyUI-Body2COLMAP's `workflows/pipeline/fast helical.yaml`.
#
# That file is six ComfyUI stages, each a separate API graph reading and
# writing a stage directory on disk:
#
#   denoise.json          initial -> circular          (strength 1.0)
#   resplat_helical.json  circular -> splatted
#   mask_splat.json       splatted -> masked_splatted  (filter 6, dilation 2)
#   denoise.json          masked_splatted -> helical   (strength 0.8)
#   upscale.json          helical -> upscaled
#   colmap.json           upscaled -> colmap
#
# `run_upscale: false` takes the upscale stage out — five stages instead of
# six. It used to be a separate file (fast_helical.yaml); it is now one
# `when:` toggle on this file so the two paths cannot drift.
# fast_helical_native.yaml copies this file's steps from `denoise_pass1` on
# (there is no include mechanism); tests/test_workflows.py checks they have
# not drifted.
#
# Here it is one in-memory run: the stage directories become Context state,
# and nothing touches disk except the explicit checkpoint steps below (which
# are optional — delete them and the whole pipeline stays in memory).
#
# STATUS: never executed end-to-end. Every step it references is registered
# and its params are checked against that step's own declaration, and the
# file itself is checked by tests/test_workflows.py (it loads, validates
# against the registry, and its templates expand). But the GPU steps in it —
# wan22_vace_denoise, sapiens2_lite, seedvr2, brush, render_splat — have
# never run in this sequence, and brush + render_splat have never run at
# all. Treat this as the thing to debug first on a GPU pod, not as a
# working recipe.
#
# Stage 6 produces the run's deliverables, under output_root:
#
#   colmap/              cameras.txt + images.txt + points3D.txt, images/, normals/
#   ply/                 scene.ply — a second brush training, normal-supervised
#   colmap_preupscale/   debug: a COLMAP dataset from the pre-upscale frames
#
# The first two are switched off with export_colmap / export_ply; the third
# is opt-in via export_colmap_preupscale (and needs run_upscale on). The web
# UI's Outputs box drives all of them plus the "Upscale dataset" toggle.
#
# Expects a dataset rendered with override_cam_from_mesh (its extras carry
# orbit_target / anchor_position / focal_length_mm / original_focal_length),
# i.e. what `render` produces and what cyber_6f/initial is.
#
# **Reading this file.** `globals:` holds only what more than one step has to
# agree on — `resolution`, plus the deliverable switches (export_colmap /
# export_ply / export_colmap_preupscale), the `run_upscale` toggle, and
# `output_root` (see below). Everything else lives under the step that
# consumes it, as an override on the default that step's own class declares
# (pipeline/step.py's `Step.PARAMS`). So a param that is absent below is not
# unset — it is at its declared default, and `python -m pipeline.cli params
# fast_helical_full --all` prints the effective value of every one of them.
name: fast_helical_full
description: >-
  Full six-stage fast-helical pipeline: denoise, train+re-render a splat,
  mask, denoise again, upscale, then export a COLMAP dataset and/or a
  normal-supervised trained .ply.

globals:
  # The only value more than one step must agree on: the render size is also
  # wan22_vace_denoise's width/height, and the two must not drift apart.
  # diffusion_steps / cfg / seed / the brush iteration count / the denoise
  # prompts all used to sit here too; they are parameters of the one or two
  # steps that read them, and now live under those steps.
  resolution: [720, 1280]

  # Which deliverables stage 6 produces. Both default on; the web UI drives
  # them from its Outputs checkboxes, and `--param export_ply=false` does
  # the same from the CLI. Turning one off skips its steps entirely (see
  # `when:` in pipeline/workflow.py) — which for export_ply means not
  # starting a second 30,000-iteration brush training you were going to
  # throw away. These are workflow-level toggles, not step params — no step
  # declares them — so they stay here.
  export_colmap: true
  export_ply: true

  # Whether the SeedVR2 upscale (stage 5) runs. On by default: the shipped
  # pipeline upscales 720x1280 -> 1080x1920 before the stage-6 export.
  # `run_upscale: false` skips both the `upscale` step and `rescale_cameras`
  # (which exists only to repair the intrinsics the upscale invalidates) —
  # the five-stage pipeline that used to be a separate file, fast_helical.yaml,
  # folded back in as one `when:` toggle so the two paths cannot drift. The
  # web UI drives it from the "Upscale dataset" checkbox;
  # `--param run_upscale=false` does the same from the CLI. To answer "is it
  # the upscaler?", run this file twice over one dataset with the toggle
  # each way.
  run_upscale: true

  # Debug: also export the COLMAP dataset that the FIRST brush training is
  # handed — the denoised frames plus the mattes and normals computed for
  # it, before that splat is re-rendered along the helical orbit and
  # denoised a second time. Off by default. Lands in
  # <output_root>/colmap_intermediate/. The web UI drives it from the
  # Outputs box; `--param export_colmap_intermediate=true` does the same
  # from the CLI.
  export_colmap_intermediate: false

  # Debug: also export a COLMAP dataset built from the frames as they are
  # BEFORE the upscale (stage 4's output, stage 4b below), to measure what
  # SeedVR2 does to Gaussian-splatting quality. Only meaningful with
  # run_upscale: true — with the upscale off the pre- and post-upscale
  # frames are identical, so the web UI folds this back into export_colmap
  # and the stage-4b steps stay skipped. Off by default. Lands in
  # <output_root>/colmap_preupscale/.
  export_colmap_preupscale: false

  # Every path this workflow writes to disk hangs off this one global, and
  # `pipeline.cli run` repoints it at the run's own directory under
  # B2C_OUTPUT_DIR (i.e. the mounted volume) unless you pass
  # `--param output_root=...`. The literal below is only what you get from
  # a bare `WorkflowRunner` with no CLI: relative to the working directory,
  # which on a pod is the container's writable layer — small, and gone when
  # the pod is recycled. Templated into a dozen step params, so it stays a
  # global too.
  output_root: output/fast_helical

steps:
  # ---------------------------------------------------------------- stage 1
  # denoise.json: initial -> circular, strength 1.0.
  # dataset.masks here is the per-frame reference/denoise flag baked into
  # the loaded frames' alpha — NOT a foreground mask. See
  # steps/wan22_vace_denoise.py's docstring.
  #
  # No checkpoint params here on purpose: the step defaults to the
  # pre-quantized fp8 experts (silveroxides/Wan_2.2-fp8_scaled_hybrid) and
  # has no bf16 path left to fall back to. Override fp8_checkpoint_high /
  # fp8_checkpoint_low (both `advanced`) only to point at local files.
  - id: denoise_pass1
    step: wan22_vace_denoise
    dispatch: subprocess
    env: wan22
    # Hold the pipeline resident between the two passes: one worker process
    # serves both, so the ~47 GB of weights come off the network volume
    # once per run instead of twice. The worker calls the step's
    # release_vram() after every job, so brush (which trains on the GPU
    # between these two steps) still finds an empty card — the weights wait
    # in host RAM, not VRAM. Both passes must declare this; it is what
    # makes them share one worker.
    keep_loaded: true
    inputs:
      control_video: dataset.images
      control_masks: dataset.masks
      reference_image: dataset.reference_image
      subject_desc: dataset.prompt
    params:
      width: ${globals.resolution.0}
      height: ${globals.resolution.1}
      # From the ComfyUI graph (workflows/api/denoise.json): 6 steps, cfg
      # 1.0, seed 0. These happen to equal the step's own declared defaults;
      # spelled out anyway so the two passes read identically and every knob
      # a run tunes is visible in the step's params block.
      steps: 6
      cfg: 1.0
      seed: 0
      # The one value the two passes disagree on: pass 1 denoises the
      # circular render from scratch, pass 2 (strength 0.8) cleans up the
      # helical re-render.
      strength: 1.0
      # Exact strings from the live ComfyUI graph (denoise.json nodes
      # 6/7/188); $SUBJECT_DESC$ is filled in from dataset.prompt. Double-
      # quoted with `\`-escaped line breaks, NOT YAML's folded `>-`: a
      # folded scalar turns every line break into a space, which inside the
      # Chinese runs silently corrupts the string. tests/test_workflows.py
      # pins both, character for character, against every wan22_vace_denoise
      # step in every workflow. denoise_pass2 carries the same two strings —
      # a step param cannot reference another step's, so they are repeated.
      prompt: "时间静止，人物完全静止。身体如雕塑般僵硬，胸口没有起伏，头部保持固定\
        角度，面部肌肉完全不动，维持单一的中性表情。双眼一眨不眨，眼睑保持张\
        开且稳定，目光空洞而固定，锁定远处墙面上的一个点，对镜头毫无察觉、毫\
        无反应。镜头以匀速、固定焦距围绕主体平滑移动。 Time is frozen and only \
        the camera moves. The gaze stays anchored to that point on the wall \
        as the camera passes, so the eyes slide across the frame, always aimed \
        past the lens at the wall behind it. Eyelids stay open and steady, the \
        expression holds without a single micro-movement, and the head keeps \
        its exact angle throughout. The frozen subject is $SUBJECT_DESC$, lit \
        by even soft studio light against a plain seamless backdrop, photorealistic, \
        sharp focus, identical face and clothing in every frame."
      negative_prompt: "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静\
        止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的\
        手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体\
        ，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走, \
        chewing, tattoos, 眼球运动，眨眼，眼动追踪，微表情，面部抽动，头部移\
        动, 小头, 小脸"
    outputs:
      images: dataset.images

  # ---------------------------------------------------------------- stage 2
  # resplat_helical.json: train a splat on the denoised views, then
  # re-render it along a new, longer helical orbit.

  # The alpha brush trains these frames against. It is baked into the
  # frames themselves rather than into a masks/ sidecar, which is what
  # makes them TRANSPARENT views — "nothing is there outside the subject",
  # so they carve the silhouette. (brush resolves that per view now; see
  # steps/brush.py. No --alpha-mode is passed, and this layout is what the
  # forced `transparent` used to spell out.) Distinct from the denoise
  # control mask above, which this overwrites: past this point the
  # reference/denoise flag is no longer needed.
  - id: foreground_masks
    step: rmbg
    dispatch: in_process
    inputs:
      images: dataset.images
    outputs:
      masks: dataset.masks

  - id: normal_maps
    step: sapiens2_lite
    dispatch: in_process
    inputs:
      images: dataset.images
    outputs:
      normal_maps: scene.normal_maps

  # Debug deliverable: the COLMAP dataset exactly as `train_splat` below is
  # handed it — the denoised frames, the RMBG mattes and the normal maps
  # that the FIRST brush training runs on. Gated by
  # export_colmap_intermediate, off by default.
  #
  # One step, not the three stage 4b needs: the masks and normals it wants
  # are already sitting in the context, computed by the two steps above for
  # brush itself. Recomputing them would export something subtly different
  # from what was trained on, which would defeat the point — this is here to
  # answer "what did the first splat actually see?", which is the question
  # behind a bad helical re-render, and it is the only stage whose brush
  # input is otherwise thrown away.
  - id: export_colmap_intermediate
    step: colmap_export
    dispatch: in_process
    when: ${globals.export_colmap_intermediate}
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      normal_maps: scene.normal_maps
    params:
      output_dir: ${globals.output_root}/colmap_intermediate
      layout: brush

  - id: train_splat
    step: brush
    dispatch: in_process
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      normal_maps: scene.normal_maps
    params:
      # The expensive knob: brush trains twice in this pipeline (here and
      # train_final_splat) at roughly an hour of GPU each. 30000 equals
      # steps/brush.py's own default; spelled out because it is the one
      # brush setting worth seeing at a glance, and the two trainings could
      # be given different counts here. Everything else brush takes —
      # sh_degree, max_splats, refine_every, the normal-loss group — sits at
      # that step's declared defaults.
      total_steps: 30000
      # Also steps/brush.py's default, and spelled out for the same reason:
      # the next-but-one step depends on it. It writes each Gaussian's
      # multi-view evidence into the exported .ply (ev_* properties), which
      # is what rerender_splat's `confidence` reads to gate the render
      # without a second pass over the dataset. Turn it off and that render
      # warns and falls back to plain alpha — i.e. silently back to the
      # behaviour mask_splat used to patch up.
      export_evidence: true
      # Without this brush exports into tempfile.gettempdir() (see
      # steps/brush.py) — the trained .ply then only survives because
      # Dataset.to_disk copies it at the very end. `output_dir` rather than
      # `export_dir` because this is an intermediate: it lands under
      # <output_root>/brush/training_<ms>/, which cannot collide with the
      # second training below.
      output_dir: ${globals.output_root}
    outputs:
      splat_path: dataset.splat_path

  - id: load_trained_splat
    step: load_splat
    dispatch: in_process
    inputs:
      splat_path: dataset.splat_path
    outputs:
      splat_scene: scene.splat

  # The ComfyUI node leaves override_cam_from_mesh off here: this is a
  # fresh, longer orbit framed from the splat's own bounds (fill_ratio 0.8,
  # focal length inherited from the dataset), not an anchored one. The
  # anchor is re-applied by inject_anchor below, matching on position. Both
  # of those are steps/splat.py's declared defaults, so this block only has
  # to say what the helical path itself is.
  - id: rerender_splat
    step: render_splat
    dispatch: in_process
    inputs:
      splat_scene: scene.splat
      dataset: dataset
    params:
      width: ${globals.resolution.0}
      height: ${globals.resolution.1}
      pattern: helical
      n_frames: 81
      n_loops: 2
      amplitude_deg: 30.0
      # 30/90, not the 45/45 the solver defaults to — the values
      # resplat_helical.json's Body2COLMAP_HelicalPath node carries.
      lead_in_deg: 30.0
      lead_out_deg: 90.0
      # Gate the render on the evidence train_splat wrote into the .ply,
      # which is what makes mask_splat's thresholding stage unnecessary
      # below. The alpha that comes back is the gate, not accumulated
      # opacity, and the RGB is composited over `cull_color` — so these
      # frames are a subject cut out of 0.5 grey with a soft edge, not out
      # of black with a hard one. `bg_color` is ignored in this mode and is
      # therefore not set here. See docs/spatial-reinforcement.md.
      confidence: true
      cull_color: [0.5, 0.5, 0.5]
    outputs:
      images: dataset.images
      masks: dataset.masks
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d

  # ---------------------------------------------------------------- stage 3
  # This used to be the stage that dropped the splat's low-confidence
  # fringes: threshold the render's alpha at 239/255, dilate by 2,
  # composite over black, bilateral-filter (`mask_splat.json`'s subgraph,
  # at `fast helical.yaml`'s 6/2). rerender_splat's `confidence` above
  # decides the same thing better — once, in 3-D, from what the training
  # views actually constrained rather than from accumulated alpha per pixel
  # per frame — so running the old cut on top of it is now WRONG rather
  # than merely redundant: it would re-composite the grey frames over black
  # and smear the gate's soft edge.
  #
  # The step stays, in passthrough, because its other half is still needed:
  # replacing the per-pixel splat alpha in dataset.masks with the per-frame
  # all-1.0 VACE batch that denoise_pass2 reads and reinject_anchor writes
  # its 0.0 into. Ordering is unchanged and still load-bearing (see below).
  # To A/B against the recorded ComfyUI run, set `mode: threshold` and turn
  # rerender_splat's `confidence` off — 6/2 is that step's own default.
  - id: mask_splat_fringes
    step: mask_splat
    dispatch: in_process
    inputs:
      dataset: dataset
    params:
      mode: passthrough
    outputs:
      dataset: dataset

  # Put the warped reference photo back onto whichever new frames landed on
  # the original camera. Matches by position, so it survives the reorbit.
  #
  # AFTER mask_splat, not before it — the ordering is load-bearing and was
  # wrong. Before mask_splat this step sits where dataset.masks is carrying
  # rerender_splat's per-pixel splat alpha, and it would overwrite exactly
  # the input mask_splat exists to threshold. Here it only ever sees VACE
  # masks: mask_splat has already consumed the alpha and emitted all-1.0.
  #
  # This reproduces cyber2_6f/masked_splatted frame for frame: 80 frames
  # masked and filtered at alpha 255, and frame_00038_ the anchor.png
  # verbatim — not composited over black, not bilateral-filtered — at
  # alpha 0.
  - id: reinject_anchor
    step: inject_anchor
    dispatch: in_process
    inputs:
      images: dataset.images
      cameras: dataset.cameras
      anchor_position: dataset.extras.anchor_position
      anchor_image: dataset.anchor_image
      # mask_splat's all-1.0 batch, passed through with 0.0 written at the
      # anchor frame. Manufacturing it here instead would give the same
      # values today; wiring it keeps the step from silently destroying a
      # mask that matters if anything is ever inserted above it.
      masks: dataset.masks
    outputs:
      images: dataset.images
      masks: dataset.masks

  # ---------------------------------------------------------------- stage 4
  # denoise.json again, strength 0.8 — clean up the re-render.
  - id: denoise_pass2
    step: wan22_vace_denoise
    dispatch: subprocess
    env: wan22
    # See denoise_pass1: both passes must declare keep_loaded for the two of
    # them to share one resident worker.
    keep_loaded: true
    inputs:
      control_video: dataset.images
      control_masks: dataset.masks
      reference_image: dataset.reference_image
      subject_desc: dataset.prompt
    params:
      width: ${globals.resolution.0}
      height: ${globals.resolution.1}
      # Same as denoise_pass1 — see the note there. Only `strength` differs.
      #
      # UNREVIEWED against the confidence render above (2026-08-30): these
      # frames are now a subject cut out of 0.5 GREY rather than black, and
      # the negative prompt still asks against 整体发灰 ("an overall grey
      # cast"). Neither prompt mentions a black background, so nothing here
      # is knowably wrong — but this is the pair to look at first if
      # denoise_pass2's output changed character with the gate. Left alone
      # deliberately: a prompt edit is a quality decision for a real run to
      # make, not a side effect of the render change.
      steps: 6
      cfg: 1.0
      seed: 0
      strength: 0.8
      prompt: "时间静止，人物完全静止。身体如雕塑般僵硬，胸口没有起伏，头部保持固定\
        角度，面部肌肉完全不动，维持单一的中性表情。双眼一眨不眨，眼睑保持张\
        开且稳定，目光空洞而固定，锁定远处墙面上的一个点，对镜头毫无察觉、毫\
        无反应。镜头以匀速、固定焦距围绕主体平滑移动。 Time is frozen and only \
        the camera moves. The gaze stays anchored to that point on the wall \
        as the camera passes, so the eyes slide across the frame, always aimed \
        past the lens at the wall behind it. Eyelids stay open and steady, the \
        expression holds without a single micro-movement, and the head keeps \
        its exact angle throughout. The frozen subject is $SUBJECT_DESC$, lit \
        by even soft studio light against a plain seamless backdrop, photorealistic, \
        sharp focus, identical face and clothing in every frame."
      negative_prompt: "色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静\
        止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的\
        手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体\
        ，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走, \
        chewing, tattoos, 眼球运动，眨眼，眼动追踪，微表情，面部抽动，头部移\
        动, 小头, 小脸"
    outputs:
      images: dataset.images

  # --------------------------------------------------------------- stage 4b
  # Debug deliverable: a COLMAP dataset from the pre-upscale frames, for
  # comparing splat quality with and without SeedVR2. Gated by
  # export_colmap_preupscale, which the web UI only sets when run_upscale is
  # also on (with the upscale off, stage 6 already exports these same
  # frames). rmbg + normals are recomputed here rather than reused from
  # stage 6: those run after the upscale, on 1080x1920 frames.
  - id: export_masks_preupscale
    step: rmbg
    dispatch: in_process
    when: ${globals.export_colmap_preupscale}
    inputs:
      images: dataset.images
    outputs:
      masks: dataset.masks

  - id: export_normals_preupscale
    step: sapiens2_lite
    dispatch: in_process
    when: ${globals.export_colmap_preupscale}
    inputs:
      images: dataset.images
    params:
      batch_size: 4
    outputs:
      normal_maps: scene.preupscale_normal_maps

  - id: export_colmap_preupscale
    step: colmap_export
    dispatch: in_process
    when: ${globals.export_colmap_preupscale}
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      normal_maps: scene.preupscale_normal_maps
    params:
      output_dir: ${globals.output_root}/colmap_preupscale
      layout: brush

  # ---------------------------------------------------------------- stage 5
  # upscale.json — skipped entirely when run_upscale is false.
  - id: upscale
    step: seedvr2
    dispatch: subprocess
    env: seedvr2
    when: ${globals.run_upscale}
    inputs:
      images: dataset.images
    params:
      # SeedVR2's `resolution` is the target output *shortest edge*, not a
      # multiplier — asking for less than the input's shortest edge
      # downscales. See steps/seedvr2.py.
      #
      # 1080, not the 1440 this was: the frames feed a Gaussian splat, and a
      # splat does not resolve detail the way a video does — past roughly
      # the native render size the extra pixels mostly buy training time and
      # VRAM. 720x1280 in, 1080x1920 out, which is also what the recorded
      # ComfyUI-era upscale produced (cyber_6f/upscaled).
      resolution: 1080
      # steps/seedvr2.py defaults this to 5; 1 is this workflow's own
      # choice — raise it once a real VRAM budget for the upscale is known.
      batch_size: 1
      vae_encode_tiled: true
      vae_decode_tiled: true
    outputs:
      images: dataset.images

  # seedvr2 resamples the frames and cannot return cameras — it runs in its
  # own venv, and that IPC boundary carries plain arrays, not Camera
  # objects. So without this step the dataset now holds 1080x1920 images
  # described by 720x1280 intrinsics, and both stage-6 consumers believe
  # the wrong focal length: cameras.txt would claim a 720x1280 PINHOLE
  # camera, and brush would fit a splat at half the focal length the images
  # were rendered with. The recorded ComfyUI-era export has exactly this
  # mismatch (cyber_6f/colmap: 720x1280 intrinsics, 1080x1920 frames), so
  # this is an inherited bug, not a new one — and a prime suspect for
  # output that looks *almost* right.
  #
  # Skipped with `run_upscale: false` (it is a no-op on a dataset whose
  # frames already match its cameras) — same `when:` as `upscale`, so the
  # two are always on or off together.
  - id: rescale_cameras
    step: fit_cameras_to_images
    dispatch: in_process
    when: ${globals.run_upscale}
    inputs:
      dataset: dataset
    outputs:
      dataset: dataset

  # ---------------------------------------------------------------- stage 6
  # colmap.json: background-remove, re-estimate normals against the frames
  # as they finally are, then emit whichever deliverables were selected.
  - id: export_masks
    step: rmbg
    dispatch: in_process
    inputs:
      images: dataset.images
    outputs:
      masks: dataset.masks

  # NOT the stage-2 normal maps (scene.normal_maps): those describe the
  # pre-re-render frames, which rerender_splat replaced wholesale with a
  # different, longer orbit — a different count, different poses, and after
  # the upscale a different resolution. Both deliverables below want
  # normals for *these* frames, so they are estimated again here.
  - id: export_normals
    step: sapiens2_lite
    dispatch: in_process
    inputs:
      images: dataset.images
    params:
      # Smaller than the step's default of 8: at the upscaled resolution
      # these are 1080x1920 float32 maps, and the returned list alone is
      # ~2 GB of host RAM.
      batch_size: 4
    outputs:
      normal_maps: scene.export_normal_maps

  # Deliverable 1: a COLMAP dataset. `layout: brush` puts the frames in
  # images/ and the normals in normals/ beside the three .txt files —
  # what brush itself reads, and what somebody handed this directory
  # expects, rather than the flat frames-beside-the-txt layout the ComfyUI
  # colmap.json stage wrote.
  - id: export_colmap
    step: colmap_export
    dispatch: in_process
    when: ${globals.export_colmap}
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      normal_maps: scene.export_normal_maps
    params:
      output_dir: ${globals.output_root}/colmap
      layout: brush

  # Deliverable 2: a trained splat, normal-supervised. This is a second
  # full brush training — the stage-2 one exists to drive the helical
  # re-render and predates the second denoise pass and the upscale, so it
  # is not the splat anyone wants to keep. `export_dir` puts this one at a
  # predictable path instead of brush/training_<ms>/, which is the whole
  # reason the final splat can be `ply/scene.ply`.
  - id: train_final_splat
    step: brush
    dispatch: in_process
    when: ${globals.export_ply}
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      normal_maps: scene.export_normal_maps
    params:
      # See train_splat's note. Same count; a run tuning the deliverable
      # splat alone changes it here.
      total_steps: 30000
      export_dir: ${globals.output_root}/ply
      export_name: scene.ply
    outputs:
      # Overwrites the stage-2 intermediate, so Dataset.to_disk's splat.ply
      # and the CLI's closing "splat:" line both name the final one.
      splat_path: dataset.splat_path
