# Native port of ComfyUI-Body2COLMAP's `workflows/pipeline/fast helical.yaml`.
#
# That file is six ComfyUI stages, each a separate API graph reading and
# writing a stage directory on disk:
#
#   denoise.json          initial -> circular          (strength 1.0)
#   resplat_helical.json  circular -> splatted
#   mask_splat.json       splatted -> masked_splatted  (filter 6, dilation 2)
#   denoise.json          masked_splatted -> helical   (strength 0.8)
#   upscale.json          helical -> upscaled
#   colmap.json           upscaled -> colmap
#
# Here it is one in-memory run: the stage directories become Context state,
# and nothing touches disk except the explicit checkpoint steps below (which
# are optional — delete them and the whole pipeline stays in memory).
#
# NOT the same file as fast_helical_native.yaml, which is a single forward
# pass (rmbg -> sam3d_body -> denoise -> brush) that stops where this one's
# second half begins. This is the full loop.
#
# STATUS: never executed end-to-end. Every step it references is registered
# and its param names match the step's own docstring, and the file itself is
# checked by tests/test_workflows.py (it loads, resolves against the
# registry, and its templates expand). But the GPU steps in it —
# wan22_vace_denoise, sapiens2_lite, seedvr2, brush, render_splat — have
# never run in this sequence, and brush + render_splat have never run at
# all. Treat this as the thing to debug first on a GPU pod, not as a
# working recipe.
#
# Expects a dataset rendered with override_cam_from_mesh (its extras carry
# orbit_target / anchor_position / focal_length_mm / original_focal_length),
# i.e. what `render` produces and what cyber_6f/initial is.
name: fast_helical_full
description: >-
  Full six-stage fast-helical pipeline: denoise, train+re-render a splat,
  mask, denoise again, upscale, export COLMAP.

params:
  resolution: [720, 1280]
  diffusion_steps: 6
  cfg: 1.0
  seed: 0

  # Stage 2 helical re-render. Values from resplat_helical.json's
  # Body2COLMAP_HelicalPath node — note lead_in/lead_out are 30/90, not the
  # 45/45 the solver defaults to.
  resplat_frames: 81
  resplat_loops: 2
  resplat_amplitude_deg: 30.0
  resplat_lead_in_deg: 30.0
  resplat_lead_out_deg: 90.0

  # Stage 3, from `fast helical.yaml`'s own step config.
  mask_filter_size: 6
  mask_dilation: 2

  # Brush defaults, matching nodes/brush_node.py and resplat_helical.json.
  brush_path: brush
  brush_total_steps: 30000
  brush_sh_degree: 3
  brush_max_resolution: 1920
  brush_max_splats: 10000000
  brush_refine_every: 200
  brush_normal_loss_strength: 0.05
  brush_normal_loss_step_start: 5000

  # SeedVR2's `resolution` is the target output *shortest edge*, not a
  # multiplier — asking for less than the input's shortest edge downscales.
  # See steps/seedvr2.py.
  upscale_resolution: 1440

  splat_path: output/fast_helical/splat.ply
  colmap_dir: output/fast_helical/colmap

  # Exact strings from the live ComfyUI graph (workflows/api/denoise.json,
  # nodes 6/7/188) — $SUBJECT_DESC$ is filled in from dataset.prompt.
  denoise_prompt: >-
    The subject is $SUBJECT_DESC$. An unmoving wax statue of the subject
    undergoes a 360 degree rotation. The subject is unmoving and unblinking,
    their expression frozen as the camera continues to rotate around them.
    Their eyes fixed in place. The camera rotates at a constant speed,
    smoothly completing an orbit around the subject. The subject remains
    consistent throughout the rotation. 人物正面朝向，表情中性，目光固定，眼睛保持静止，
    无眨眼，面部完全静止，如雕像般静止，画面无时间变化
  denoise_negative_prompt: >-
    色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，
    低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，
    毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走,
    chewing, tattoos, 眼球运动，眨眼，眼动追踪，微表情，面部抽动，头部移动, 小头, 小脸

steps:
  # ---------------------------------------------------------------- stage 1
  # denoise.json: initial -> circular, strength 1.0.
  # dataset.masks here is the per-frame reference/denoise flag baked into
  # the loaded frames' alpha — NOT a foreground mask. See
  # steps/wan22_vace_denoise.py's docstring.
  - id: denoise_pass1
    step: wan22_vace_denoise
    dispatch: subprocess
    env: wan22
    inputs:
      control_video: dataset.images
      control_masks: dataset.masks
      reference_image: dataset.reference_image
      subject_desc: dataset.prompt
    params:
      width: ${params.resolution.0}
      height: ${params.resolution.1}
      steps: ${params.diffusion_steps}
      cfg: ${params.cfg}
      seed: ${params.seed}
      strength: 1.0
      prompt: ${params.denoise_prompt}
      negative_prompt: ${params.denoise_negative_prompt}
    outputs:
      images: dataset.images

  # ---------------------------------------------------------------- stage 2
  # resplat_helical.json: train a splat on the denoised views, then
  # re-render it along a new, longer helical orbit.

  # Foreground alpha for brush's --alpha-mode transparent. Distinct from
  # the denoise control mask above, which this overwrites: past this point
  # the reference/denoise flag is no longer needed.
  - id: foreground_masks
    step: rmbg
    dispatch: in_process
    inputs:
      images: dataset.images
    outputs:
      masks: dataset.masks

  - id: normal_maps
    step: sapiens2_lite
    dispatch: in_process
    inputs:
      images: dataset.images
    outputs:
      normal_maps: scene.normal_maps

  - id: train_splat
    step: brush
    dispatch: in_process
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
      normal_maps: scene.normal_maps
    params:
      brush_path: ${params.brush_path}
      total_steps: ${params.brush_total_steps}
      sh_degree: ${params.brush_sh_degree}
      max_resolution: ${params.brush_max_resolution}
      max_splats: ${params.brush_max_splats}
      refine_every: ${params.brush_refine_every}
      alpha_mode: transparent
      normal_loss_strength: ${params.brush_normal_loss_strength}
      normal_loss_step_start: ${params.brush_normal_loss_step_start}
    outputs:
      splat_path: dataset.splat_path

  - id: load_trained_splat
    step: load_splat
    dispatch: in_process
    inputs:
      splat_path: dataset.splat_path
    outputs:
      splat_scene: scene.splat

  # The ComfyUI node leaves override_cam_from_mesh off here: this is a
  # fresh, longer orbit framed from the splat's own bounds (fill_ratio 0.8,
  # focal length inherited from the dataset), not an anchored one. The
  # anchor is re-applied by inject_anchor below, matching on position.
  - id: rerender_splat
    step: render_splat
    dispatch: in_process
    inputs:
      splat_scene: scene.splat
      dataset: dataset
    params:
      width: ${params.resolution.0}
      height: ${params.resolution.1}
      pattern: helical
      n_frames: ${params.resplat_frames}
      n_loops: ${params.resplat_loops}
      amplitude_deg: ${params.resplat_amplitude_deg}
      lead_in_deg: ${params.resplat_lead_in_deg}
      lead_out_deg: ${params.resplat_lead_out_deg}
      framing: full
      fill_ratio: 0.8
      focal_length_mm: 0
      override_pointcloud: false
      device: cuda
    outputs:
      images: dataset.images
      masks: dataset.masks
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d

  # Put the warped reference photo back onto whichever new frames landed on
  # the original camera. Matches by position, so it survives the reorbit.
  - id: reinject_anchor
    step: inject_anchor
    dispatch: in_process
    inputs:
      images: dataset.images
      cameras: dataset.cameras
      anchor_position: dataset.extras.anchor_position
      anchor_image: dataset.anchor_image
    params:
      tolerance_pct: 0.1
    outputs:
      images: dataset.images
      masks: dataset.masks

  # ---------------------------------------------------------------- stage 3
  # mask_splat.json: drop the splat's low-confidence fringes.
  - id: mask_splat_fringes
    step: mask_splat
    dispatch: in_process
    inputs:
      dataset: dataset
    params:
      filter_size: ${params.mask_filter_size}
      dilation: ${params.mask_dilation}
    outputs:
      dataset: dataset

  # ---------------------------------------------------------------- stage 4
  # denoise.json again, strength 0.8 — clean up the re-render.
  - id: denoise_pass2
    step: wan22_vace_denoise
    dispatch: subprocess
    env: wan22
    inputs:
      control_video: dataset.images
      control_masks: dataset.masks
      reference_image: dataset.reference_image
      subject_desc: dataset.prompt
    params:
      width: ${params.resolution.0}
      height: ${params.resolution.1}
      steps: ${params.diffusion_steps}
      cfg: ${params.cfg}
      seed: ${params.seed}
      strength: 0.8
      prompt: ${params.denoise_prompt}
      negative_prompt: ${params.denoise_negative_prompt}
    outputs:
      images: dataset.images

  # ---------------------------------------------------------------- stage 5
  # upscale.json
  - id: upscale
    step: seedvr2
    dispatch: subprocess
    env: seedvr2
    inputs:
      images: dataset.images
    params:
      resolution: ${params.upscale_resolution}
      vae_encode_tiled: true
      vae_decode_tiled: true
    outputs:
      images: dataset.images

  # ---------------------------------------------------------------- stage 6
  # colmap.json: background-remove, then export a COLMAP directory.
  - id: export_masks
    step: rmbg
    dispatch: in_process
    inputs:
      images: dataset.images
    outputs:
      masks: dataset.masks

  - id: export_colmap
    step: colmap_export
    dispatch: in_process
    inputs:
      cameras: dataset.cameras
      image_names: dataset.image_names
      points_3d: dataset.points_3d
      images: dataset.images
      masks: dataset.masks
    params:
      output_dir: ${params.colmap_dir}
