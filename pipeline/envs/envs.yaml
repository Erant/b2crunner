# Per-machine registry of isolated environments a workflow can dispatch into.
# Keyed by the name a StepSpec's `env:` field references. python_bin paths
# below are the venv layout each envs/<name>/requirements.txt comment
# documents — they don't exist until that venv is actually built on a given
# machine, so this file has to be re-pointed (or these entries commented
# back out) per host until then.

envs:
  wan22:
    kind: subprocess
    python_bin: pipeline/envs/wan22/venv/bin/python
    # The fp8 SageAttention kernel's V copy (~400 MB) runs a 12 GB card out
    # under low_vram without it — see _select_sage_backend. Here, not
    # image-wide: seedvr2 setdefaults its own allocator (cudaMallocAsync),
    # which a global PYTORCH_CUDA_ALLOC_CONF would silently replace.
    env:
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  sam3dbody:
    kind: subprocess
    python_bin: pipeline/envs/sam3dbody/venv/bin/python
  seedvr2:
    kind: subprocess
    python_bin: pipeline/envs/seedvr2/venv/bin/python
  # No `brush` or `brush-splat-render` entries: targeting RunPod, where a
  # pod is a single container with no nested Docker daemon (see
  # docker/Dockerfile's comment) — both run `dispatch: in_process` (brush
  # via the brush step, brush-splat-render via render_splat), needing no
  # env config here at all.
