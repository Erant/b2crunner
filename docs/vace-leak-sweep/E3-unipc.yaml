# E3 — sampler alone
#
# The other half of 9e315f. uni_pc is the step's own default and the
# reference ComfyUI graph's sampler; A switched the high-noise expert to
# euler. It changes only how two high-sigma steps are integrated, and the
# two solvers agree closely there, so this is the lower-probability arm of
# the 2x2 — but it is the arm that makes E2 interpretable rather than
# merely suggestive.
#
# Base A = run 31a008 (2026-09-08): leak 1.74, yoke 14.54, flow 0.986, IoU
# 0.8525. Every line below reproduces A except the ones marked CHANGED, so
# this run's numbers minus A's are the effect of that change and nothing
# else. denoise_pass2 is deliberately NOT touched: the leak is measured on
# colmap_intermediate, which is pass 1's output, so mirroring a pass-1
# knob onto pass 2 would move the archive's other frames without moving
# the number being read.

settings:
  # export_debug is the whole measurement: debug/colmap_intermediate is
  # pass 1's frames, which the leak metric reads, and
  # debug/denoise_pass1_input is the control side of the same comparison.
  # It defaults on; it is spelled out because a run without it is wasted.
  # The other two only match what the 2026-09-08 reference runs exported,
  # so the archives stay comparable.
  export_colmap: true
  export_debug: true
  export_ply: true

step_params:
  denoise_pass1:
    # CHANGED from A's euler — back to the step default, the reference
    # graph's sampler, on the high-noise expert's two steps.
    sampler_high: uni_pc
    sampler_shift: 2.5
    strength: [1, 1, 0.5, 0.5, 0.5, 0.5]
  denoise_pass2:
    sampler_high: euler
    sampler_shift: 2.5
    strength: [0.8, 0.8, 0.8, 0.8, 0.8, 0.8]
