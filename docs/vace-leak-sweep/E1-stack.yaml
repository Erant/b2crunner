# E1 — do the two proven levers add?
#
# Step 2 halved (worth 70% of the leak and 83% of the yoke on its own, run
# b52659) stacked on A's low-noise taper (worth 90% of the leak, and the
# best view agreement measured). The candidate new default: if these are
# even roughly additive this lands under leak 1 with the yoke under 10,
# and the sweep is over.
#
# Base A = run 31a008 (2026-09-08): leak 1.74, yoke 14.54, flow 0.986, IoU
# 0.8525. Every line below reproduces A except the ones marked CHANGED, so
# this run's numbers minus A's are the effect of that change and nothing
# else. denoise_pass2 is deliberately NOT touched: the leak is measured on
# colmap_intermediate, which is pass 1's output, so mirroring a pass-1
# knob onto pass 2 would move the archive's other frames without moving
# the number being read.

settings:
  # export_colmap_intermediate defaults FALSE and is the one output the
  # leak metric reads (pass 1's frames). export_debug carries
  # debug/denoise_pass1_input, the control side of the same measurement.
  # The other three only match what the 2026-09-08 reference runs
  # exported, so the archives stay comparable.
  export_colmap: true
  export_colmap_intermediate: true
  export_colmap_preupscale: true
  export_debug: true
  export_ply: true

step_params:
  denoise_pass1:
    sampler_high: euler
    sampler_shift: 2.5
    # CHANGED from A's [1, 1, 0.5, 0.5, 0.5, 0.5]: step 2 — the LAST
    # HIGH-NOISE step, where 1a measured the leak to be committed — comes
    # down to 0.5 alongside the four low-noise steps A already tapered.
    strength: [1, 0.5, 0.5, 0.5, 0.5, 0.5]
  denoise_pass2:
    sampler_high: euler
    sampler_shift: 2.5
    strength: [0.8, 0.8, 0.8, 0.8, 0.8, 0.8]
