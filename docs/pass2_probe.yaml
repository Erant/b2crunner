name: pass2_probe
description: 'helical''s denoise_pass2 alone, on a saved dataset (the format of debug/denoise_pass1_input):
  the pass-2 input A/B without the rest of the pipeline'
settings:
- name: resolution
  label: Resolution
  type: list
  default:
  - 720
  - 1280
  choices:
  - - 720
    - 1280
  - - 600
    - 1040
  - - 480
    - 832
  help: 'Frame size, width x height, and the value more than one step must agree on: the render size,
    wan22_vace_denoise''s width/height, and render_splat''s. `render` takes it whole and has no width/height
    override of its own, so that stage cannot drift; denoise and render_splat split it via .0/.1. Only
    sizes the denoise model was trained for are offered. (2026-08-25: this file inherited [512, 512] from
    an earlier draft.)'
- name: seed
  label: Seed
  type: int
  default: 0
  help: 'One seed for every stochastic stage: both wan22_vace_denoise passes and the SeedVR2 upscale.
    Those were three independent step params (0, 0 and 42) before this became a setting. Change it to
    draw a different sample of the same pipeline.'
outputs: []
globals:
  output_root: output/pass2_probe
steps:
- id: denoise_pass2
  step: wan22_vace_denoise
  dispatch: subprocess
  env: wan22
  keep_loaded: true
  inputs:
    control_video: dataset.images
    control_masks: dataset.masks
    reference_image: dataset.reference_image
    subject_desc: dataset.prompt
  params:
    width: ${globals.resolution.0}
    height: ${globals.resolution.1}
    steps_high: 2
    steps_low: 4
    cfg: 1.0
    seed: ${globals.seed}
    sampler_high: euler
    sampler_shift: 2.5
    strength:
    - 0.8
    - 0.8
    - 0.8
    - 0.8
    - 0.8
    - 0.8
    prompt: '人工光、柔光、低对比度、环绕运镜。时间静止，人物完全静止。身体如雕塑般僵硬，胸口没有起伏，头部保持固定角度，面部肌肉完全不动，维持单一的中性表情。双眼一眨不眨，眼睑保持张开且稳定，目光空洞而固定，锁定远处墙面上的一个点，对镜头毫无察觉、毫无反应。人物站在一间空房间里：灰色墙面上有均匀的网格线，深色地板，浅色天花板，墙面相交处有清晰的墙角。房间本身固定不动，镜头以匀速、固定焦距围绕主体平滑移动，墙角依次从画面中掠过。灯光属于房间本身，位置固定：主光始终来自人物自身的左前方，右侧是柔和的补光。人物身上的明暗、阴影与高光始终停留在同一片皮肤和衣物上，每一帧完全相同——左侧始终是受光面，右侧始终是柔和的暗面；镜头绕到人物右侧时，看到的正是那一侧的暗面。房间里的阴影同样固定：墙面上的明暗、以及人物投在地面上的影子，始终落在房间中的同一位置，不随镜头移动。
      Time is frozen and only the camera moves. The gaze stays anchored to that point on the wall as the
      camera passes, so the eyes slide across the frame, always aimed past the lens at the wall behind
      it. Eyelids stay open and steady, the expression holds without a single micro-movement, and the
      head keeps its exact angle throughout. The frozen subject is $SUBJECT_DESC$, standing in an empty
      room: grey walls ruled with an even grid, a dark floor and a lighter ceiling, meeting at clear corners.
      The room is fixed in place and the camera travels through it, so the walls and their corners sweep
      past the frame while the room itself never turns. Soft, low-contrast studio light: the key sits
      high on the subject''s own left, a soft fill on their right, both fixed to the room and holding
      still while the camera arcs around. Every highlight and shadow stays welded to the same patch of
      skin and cloth from the first frame to the last, so their left remains the lit side and their right
      remains the soft-shadowed side for the whole circle; as the camera arcs round to their right it
      sees that shadowed side. The room''s shadows are just as fixed: the shading on the walls and the
      shadow the subject casts on the floor stay in the same place in the room in every frame, and do
      not swing round with the camera. Matte skin, matte cloth, photorealistic, sharp focus, identical
      face, clothing and lighting in every frame.'
    negative_prompt: 色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走,
      chewing, tattoos, 眼球运动，眨眼，眼动追踪，微表情，面部抽动，头部移动, 小头, 小脸
  outputs:
    images: dataset.images
- id: save_pass2
  step: save_dataset
  dispatch: in_process
  inputs:
    dataset: dataset
  params:
    directory: ${globals.output_root}/pass2
  outputs:
    directory_path: scene.saved_pass2
