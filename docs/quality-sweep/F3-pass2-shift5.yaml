# F3 — pass 2 at shift 5: the leak sweep's strongest lever, on pass 2
#
# Shift 5 on pass 1 erased ink that no strength taper could (E2/E4),
# because a bigger shift leaves the low-noise steps real noise to remove,
# so they repaint at fine scale instead of preserving what is there. On
# pass 2 the same mechanism cuts both ways: more repainting is more of the
# model's texture and less of the blurry render's — sharper frames — and
# less of the one thing that keeps 81 frames agreeing. Pass 2 has never
# been run at any shift but 2.5 (A family) and 8 (B family, confounded by
# pass 1). F3/F4 with E4 make the curve.
#
# Base = E4 (run 02ff74, 2026-09-08): pass 1 at `sampler_high: uni_pc`,
# `sampler_shift: 5`, `strength: [1, 1, .5, .5, .5, .5]` — the clean pass 1
# the leak sweep recommended — and pass 2 at euler / shift 2.5 / flat 0.8,
# the pass 2 every A-family run carried. E4 measured: leak -0.53, IoU 0.8468,
# flow 1.189, final splat head s1 29.5 / PSNR 25.75, pass-2 output head s1
# 34.8 against 36.0 in its control (kept pixels). Every line below reproduces E4
# except the ones marked CHANGED, so this run's numbers minus E4's are the
# effect of that change and nothing else.
#
# All six leave pass 1 untouched, so their pass-1 frames, their
# intermediate splat and therefore their pass-2 CONTROL should be E4's,
# frame for frame (same seed, same weights) — which is what makes a pass-2
# delta readable, and is itself a determinism check worth reading.

settings:
  # export_debug carries the measurement: debug/intermediate_splat.ply is
  # what scripts/final_splat_quality.py re-renders as the pass-2 control,
  # colmap_preupscale/ is pass 2's own output, debug/alignment/ the flow.
  # A run without it is wasted. The other two match every reference run.
  export_colmap: true
  export_debug: true
  export_ply: true

step_params:
  denoise_pass1:
    sampler_high: uni_pc
    sampler_shift: 5
    strength: [1, 1, 0.5, 0.5, 0.5, 0.5]
  denoise_pass2:
    sampler_high: euler
    # CHANGED from E4's 2.5.
    sampler_shift: 5
    strength: [0.8, 0.8, 0.8, 0.8, 0.8, 0.8]
